<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Volleyball Overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<!--
  🏐 The volleyball broadcast overlay — an OBS / vMix browser source at
  1920 × 1080 with a transparent background.

  Everything on it comes from the match's saved event ledger, pushed over
  the /volleyball socket namespace (never from cricket, never made up): the
  live score bar (or the corner bug) with set history, serve, set / match
  point, time-outs and substitutions, and the standalone graphics the panel
  takes to air — match intro, coin toss, starting six, set start, rotation,
  time-out, player card, set result, match result, match statistics,
  points table.

  WHAT IS ON AIR is the server's call (volleyball-graphics.js): one graphic
  at a time, with its times on the server's clock. This page only draws it,
  through one controller with explicit states:
      IDLE → OVERLAY_ENTERING → OVERLAY_VISIBLE → OVERLAY_EXITING → IDLE
      IDLE → GRAPHIC_ENTERING → GRAPHIC_VISIBLE → GRAPHIC_EXITING → IDLE
      IDLE → OVERLAY_RETURNING → OVERLAY_VISIBLE   (after a graphic)
  A standalone graphic never sits on top of the score bar: the bar leaves,
  the graphic comes in, and when it goes the bar comes back — once — with
  the score as it is now. An entrance that is overtaken (a new graphic, a
  dismiss) plays back from where it is; nothing jumps, nothing flashes.

  Built for vMix's and OBS's browsers: a fixed 1920 × 1080 canvas scaled to
  the source, a transparent page, colours worked out here (no color-mix),
  no flex gap, no :has(), Web Animations on transform / opacity / clip only.

  ?match=<id>  [&key=<overlay key>  — private tournaments]
  [&layout=bar | compact | graphics]  [&side=court]  [&names=short|full]  [&debug=1]
  [&preview=1  — the graphics studio's preview: shows what its page asks, never what is on air]
-->
<style>
:root{--acc:#ffd60a;--accInk:#111;--base:#0a1136;--baseHi:#18214f;--baseLo:#050920;--dimBg:rgba(10,17,54,.78);
  --font:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --ca:#c81e3c;--cb:#e08a00;--ea:#5f0e1d;--eb:#6b4200;--ia:#fff;--ib:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:800}

/* ---------- shared pieces ---------- */
.plate{position:relative;flex:none;width:var(--ps,96px);height:var(--ps,96px);border-radius:16%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(160deg,#ffffff,#e6eaf3);box-shadow:0 14px 30px -14px rgba(0,0,0,.65)}
.plate img{display:block;max-width:80%;max-height:80%;object-fit:contain}
.plate.dk{background:linear-gradient(160deg,var(--baseHi),var(--baseLo));box-shadow:0 14px 30px -14px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.14)}
/* no crest uploaded: a white badge with the team's initials in its colour (never a made-up crest) */
.plate.mono{background:linear-gradient(160deg,#ffffff,#e6eaf3);box-shadow:0 14px 30px -14px rgba(0,0,0,.65),inset 0 -6px 0 var(--c,#24306b)}
.plate>.mono{flex:none!important;width:auto!important;margin:0!important;padding:0!important;font-weight:800!important;font-size:calc(var(--ps,96px)*.34)!important;letter-spacing:.02em!important;color:var(--mark,#24306b)!important;line-height:1!important;text-align:center!important;white-space:nowrap!important}
.kick{display:block;font-weight:700;font-size:24px;letter-spacing:6px;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.kick:before{content:'';display:inline-block;width:34px;height:4px;margin:0 14px 6px 0;background:var(--acc);vertical-align:middle}
.ball{display:block;width:100%;height:100%}

/* ============ the score bar (bar layout) ============ */
#stage{position:absolute;left:0;bottom:58px;width:1920px;display:flex;flex-direction:column;align-items:center}
#stage.off,#stage.off *,#corner.off,#corner.off *{visibility:hidden!important}
#wrap{position:relative}
#bar{position:relative;display:flex;align-items:stretch;height:96px}
#slab{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,var(--baseHi),var(--base) 58%,var(--baseLo));box-shadow:0 24px 46px -18px rgba(0,0,0,.75)}
#slab:after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.16)}
#line{position:absolute;left:0;right:0;top:-4px;height:4px;background:linear-gradient(90deg,var(--ca),var(--acc) 50%,var(--cb))}
#under{position:absolute;left:0;right:0;bottom:-6px;height:6px;display:flex}
#under i{flex:1}#under i:first-child{background:var(--ca)}#under i:last-child{background:var(--cb)}
.side{position:relative;display:flex;align-items:stretch}
.bp{position:relative;width:96px;height:96px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.bp.dk{background:linear-gradient(160deg,var(--baseHi),var(--baseLo))}
.bp img{display:block;max-width:78%;max-height:78%;object-fit:contain}
.bp .mono{font-weight:800;font-size:34px;color:var(--mark,#24306b);line-height:1}
.bp.mono{background:linear-gradient(160deg,#ffffff,#e6eaf3);box-shadow:inset 0 -6px 0 var(--c)}
.bnm{position:relative;display:flex;align-items:center;justify-content:center;width:300px;overflow:hidden}
.side.L .bnm{padding:0 54px 0 28px}.side.R .bnm{padding:0 28px 0 54px}
.side.L .bnm{background:linear-gradient(90deg,var(--ea),var(--ca));color:var(--ia)}
.side.R .bnm{background:linear-gradient(270deg,var(--eb),var(--cb));color:var(--ib)}
.bnm:after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.bnm span{position:relative;display:block;font-weight:800;font-size:44px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;line-height:1}
.bst{position:relative;width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bst:before{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
.side.L .bst{--c:var(--ca)}.side.R .bst{--c:var(--cb)}
.bst .roll{font-size:54px;font-weight:800}
.bst small{font-size:15px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.62);margin-top:3px}
.bsv{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;opacity:0;z-index:3;filter:drop-shadow(0 0 10px rgba(255,214,10,.55))}
.side.L .bsv{right:96px}.side.R .bsv{left:96px}
.bpts{position:relative;width:132px;display:flex;align-items:center;justify-content:center;font-size:82px;font-weight:800;line-height:1}
.bsep{width:2px;margin:18px 0;background:rgba(255,255,255,.16)}
.roll{display:inline-grid;padding:6px 0;clip-path:polygon(-40px 0,calc(100% + 40px) 0,calc(100% + 40px) 100%,-40px 100%)}
.roll>.n{grid-area:1/1;text-align:center;will-change:transform,opacity}
.hit{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0;pointer-events:none}
#hA{background:linear-gradient(0deg,var(--ca),rgba(0,0,0,0) 90%)}#hB{background:linear-gradient(0deg,var(--cb),rgba(0,0,0,0) 90%)}
#rail{position:absolute;left:50%;bottom:100%;margin-bottom:4px;transform:translateX(-50%);display:flex;align-items:center;height:36px;padding:0 24px;white-space:nowrap;
  background:var(--base);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 100%,0 100%)}
#setname{font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
#hist{display:flex;align-items:center}
#hist:empty{display:none}
#hist span{margin-left:12px;padding:1px 10px;font-size:21px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.66);background:rgba(255,255,255,.08);border-radius:3px}
#hist b{color:#fff}#hist i{font-style:normal;opacity:.5;margin:0 2px}
.ptag{position:absolute;bottom:100%;margin-bottom:14px;max-width:420px;height:42px;display:flex;align-items:center;padding:0 18px 0 14px;white-space:nowrap;overflow:hidden;
  background:linear-gradient(180deg,var(--baseHi),var(--base));border-left:6px solid var(--c);font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;visibility:hidden}
.ptag.show{visibility:visible}
.ptag b{color:var(--acc);margin-right:12px;font-weight:800}
#tagL{left:96px;--c:var(--ca)}#tagR{right:96px;--c:var(--cb)}
#pill{margin-top:16px;min-width:340px;max-width:1300px;height:48px;padding:0 40px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;
  font-size:28px;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,var(--base),var(--baseHi),var(--base));
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 100%,0 100%);visibility:hidden}
#pill.show{visibility:visible}
#pill b{color:var(--acc);margin-left:14px}
#pill.sp{background:linear-gradient(90deg,#b45309,#f59e0b,#b45309);color:#1a1000}
#pill.mp{background:linear-gradient(90deg,#9f1239,#e11d48,#9f1239)}
#pill.win{background:linear-gradient(90deg,#065f46,#10b981,#065f46)}
#pill.tt{background:linear-gradient(90deg,#1e3a8a,#3b82f6,#1e3a8a)}
#pill.card{background:linear-gradient(90deg,#a16207,#eab308,#a16207);color:#1a1000}
#pill.red{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}
#pill.sp b,#pill.card b{color:#1a1000}
#pill.sp,#pill.mp{animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{filter:brightness(1.3)}}

/* ============ the compact corner bug ============ */
#corner{position:absolute;left:48px;top:44px;width:620px;display:none;filter:drop-shadow(0 16px 26px rgba(0,0,0,.45))}
body.L-compact #corner{display:block}
.crow{position:relative;display:flex;align-items:stretch;height:60px;margin-bottom:2px;background:linear-gradient(180deg,var(--baseHi),var(--base))}
.crow .cc{width:9px;flex:none;background:var(--c)}
.crow .cl{width:60px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.crow .cl.dk{background:linear-gradient(160deg,var(--baseHi),var(--baseLo))}
.crow .cl.mono{background:#fff;box-shadow:inset 0 -4px 0 var(--c)}
.crow .cl img{max-width:46px;max-height:46px;object-fit:contain}
.crow .cl b{font-size:20px;color:var(--mark,#24306b)}
.crow .cn{flex:1;min-width:0;padding:0 16px;display:flex;align-items:center;font-size:32px;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.crow .csv{width:22px;height:22px;flex:none;align-self:center;margin-right:12px;opacity:0}
.crow .ch{display:flex;align-items:center;margin-right:8px}
.crow .ch i{width:34px;text-align:center;font-style:normal;font-size:22px;font-weight:700;color:rgba(255,255,255,.5)}
.crow .ch i.w{color:#fff}
.crow .cs{width:52px;flex:none;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:var(--c);color:var(--ink)}
.crow .cp{width:84px;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;background:rgba(0,0,0,.25)}
#cfoot{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--base);font-size:20px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
#cfoot b{color:var(--acc);letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:12px}

/* ============ standalone graphics ============ */
#bd{position:absolute;left:0;top:0;width:1920px;height:1080px;visibility:hidden;pointer-events:none}
#bd.show{visibility:visible}
#bd .dim{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--dimBg)}
#bd .gl{position:absolute;left:0;top:0;width:100%;height:100%}
#bd .gl.a{background:radial-gradient(ellipse 60% 75% at 0% 55%,var(--ga,rgba(0,0,0,0)),rgba(0,0,0,0) 70%)}
#bd .gl.b{background:radial-gradient(ellipse 60% 75% at 100% 55%,var(--gb,rgba(0,0,0,0)),rgba(0,0,0,0) 70%)}
#bd .tx{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.5;background:repeating-linear-gradient(118deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 2px,rgba(255,255,255,0) 2px,rgba(255,255,255,0) 16px)}
#bd .vg{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%)}
body.bd-clear #bd{display:none}
#gfx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene.toss,.scene.setstart,.scene.res,.scene.pcard,.scene.table,.scene.rotation,.scene.timeout{display:flex;align-items:center;justify-content:center}
.panel{background:linear-gradient(180deg,var(--baseHi),var(--base) 62%,var(--baseLo));box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
.cr{display:grid;grid-template-columns:80px 1fr 300px 1fr 80px;align-items:center;height:50px;column-gap:16px}
.cr .v{text-align:center;font-size:34px;font-weight:800}
.cr .v.w{color:var(--acc)}
.cr .lb{text-align:center;font-size:21px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.72);white-space:nowrap}
.cr .bar{height:12px;background:rgba(255,255,255,.09);display:flex;overflow:hidden;border-radius:6px}
.cr .bar.l{justify-content:flex-end}
.cr .bar i{display:block;height:100%;background:var(--c);border-radius:6px;transform-origin:0 50%}
.cr .bar.l i{transform-origin:100% 50%}

/* intro */
.intro .ihead{position:absolute;left:0;top:40px;width:1920px;height:170px;display:flex;align-items:center;justify-content:center}
.intro .ihead .plate{margin-right:26px}
.intro .iht{width:1180px;text-align:center}
.intro .iht b{display:block;font-size:56px;font-weight:800;letter-spacing:2px;text-transform:uppercase;line-height:1.04}
.intro .iht small{display:block;margin-top:10px;font-size:26px;font-weight:700;letter-spacing:7px;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.intro .iteams{position:absolute;left:110px;top:248px;width:1700px;height:560px}
.intro .iteam{position:absolute;top:0;width:790px;height:560px}
.intro .iteam.L{left:0}.intro .iteam.R{right:0}
.intro .ifield{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(140deg,var(--hi) 0%,var(--c) 42%,var(--deep) 100%);box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.intro .iteam.L .ifield{clip-path:polygon(0 0,100% 0,calc(100% - 90px) 100%,0 100%)}
.intro .iteam.R .ifield{clip-path:polygon(90px 0,100% 0,100% 100%,0 100%)}
.intro .ifield:after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%,rgba(0,0,0,.18))}
.intro .iwm{position:absolute;top:50%;width:520px;height:520px;margin-top:-260px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.09}
.intro .iteam.L .iwm{left:-90px}.intro .iteam.R .iwm{right:-90px}
.intro .ibody{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);padding:0 110px}
.intro .iteam.L .ibody{padding-right:150px}.intro .iteam.R .ibody{padding-left:150px}
.intro .ibody .plate{margin-bottom:34px}
.intro .inbox{display:flex;align-items:center;width:100%}
.intro .iname{display:block;width:100%;text-align:center;font-size:76px;font-weight:800;text-transform:uppercase;letter-spacing:1px;line-height:1.02;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.intro .isub{display:block;margin-top:12px;font-size:24px;font-weight:700;letter-spacing:6px;text-transform:uppercase;opacity:.86;white-space:nowrap}
.intro .ivs{position:absolute;left:50%;top:50%;width:176px;height:176px;margin:-88px 0 0 -88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,var(--baseHi),var(--baseLo));box-shadow:0 0 0 6px var(--acc),0 30px 60px -10px rgba(0,0,0,.7)}
.intro .ivs b{font-size:78px;font-weight:800;letter-spacing:2px;color:var(--acc);line-height:1}
.intro .ifoot{position:absolute;left:0;top:862px;width:1920px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;letter-spacing:4px;text-transform:uppercase;white-space:nowrap}
.intro .ifoot span{padding:10px 26px;background:rgba(5,9,32,.6)}
.intro .ifoot i{width:10px;height:10px;margin:0 16px;border-radius:50%;background:var(--acc)}
.intro .iln{position:absolute;left:110px;width:1700px;height:3px;background:linear-gradient(90deg,rgba(0,0,0,0),var(--acc) 20%,var(--acc) 80%,rgba(0,0,0,0))}
.intro .iln.t{top:224px}.intro .iln.b{top:832px}

/* starting six */
.lineup .lhead{position:absolute;left:114px;top:60px;width:1692px;height:150px;display:flex;align-items:center}
.lineup .lhead .plate{margin-right:30px}
.lineup .lht{flex:1;min-width:0}
.lineup .lht b{display:block;font-size:76px;font-weight:800;text-transform:uppercase;letter-spacing:1px;line-height:1;white-space:nowrap}
.lineup .lht .kick{margin-bottom:12px}
.lineup .lop{display:flex;align-items:center;font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.75);white-space:nowrap}
.lineup .lop .plate{margin:0 0 0 16px}
.lineup .lnet{position:absolute;left:114px;top:224px;width:1692px;height:24px;display:flex;align-items:center}
.lineup .lnet i{flex:1;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0,rgba(255,255,255,.75) 10px,rgba(255,255,255,0) 10px,rgba(255,255,255,0) 16px)}
.lineup .lnet span{margin:0 18px;font-size:20px;font-weight:800;letter-spacing:6px;color:rgba(255,255,255,.85)}
.lineup .lgrid{position:absolute;left:114px;top:262px;width:1692px;display:grid;grid-template-columns:540px 540px 540px;grid-auto-rows:300px;grid-gap:30px 36px;gap:30px 36px}
.pc{position:relative;display:flex;overflow:hidden;background:linear-gradient(180deg,var(--baseHi),var(--base) 70%,var(--baseLo));box-shadow:0 30px 60px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
.pc:after{content:'';position:absolute;left:0;bottom:0;width:100%;height:5px;background:var(--c)}
.pcp{position:relative;width:212px;flex:none;overflow:hidden;background:linear-gradient(160deg,var(--hi),var(--c) 50%,var(--deep))}
.pcp:before{content:'';position:absolute;left:0;top:0;width:100%;height:100%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0,rgba(255,255,255,.07) 2px,rgba(255,255,255,0) 2px,rgba(255,255,255,0) 12px)}
.pcp img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pcp.has:after{content:'';position:absolute;left:0;bottom:0;width:100%;height:40%;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
.pbig{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:160px;font-weight:800;line-height:1;color:var(--ink);opacity:.92;letter-spacing:-2px}
.pci{position:relative;flex:1;min-width:0;padding:26px 26px 30px 28px;display:flex;flex-direction:column;justify-content:flex-end}
.ppos{position:absolute;right:20px;top:20px;width:66px;height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);font-size:30px;font-weight:800;line-height:1}
.ppos small{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.6);margin-bottom:2px}
.pno{position:absolute;left:28px;top:22px;font-size:58px;font-weight:800;color:var(--acc);line-height:1}
.pfn{display:block;font-size:26px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8);white-space:nowrap;line-height:1.1}
.psn{display:block;font-size:54px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;line-height:1.04}
.prole{display:block;margin-top:10px;font-size:19px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.pbd{position:absolute;right:100px;top:24px;display:flex}

          <div class="bst" id="sa"><b class="roll num"><span class="n">0</span></b><small>SETS</small></div></div>
        <div class="bpts num" id="pa"><i class="hit" id="hA"></i><span class="roll"><span class="n">0</span></span></div>
        <i class="bsep"></i>
        <div class="bpts num" id="pb"><i class="hit" id="hB"></i><span class="roll"><span class="n">0</span></span></div>
        <div class="side R" id="sideR"><div class="bst" id="sb"><b class="roll num"><span class="n">0</span></b><small>SETS</small></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/volleyball-common.js"></script>
<script src="/volleyball-graphics.js"></script>
<script>
(function () {
  'use strict';
  var GX = window.VolleyballGraphics;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = VB.esc;
  const qs = new URLSearchParams(location.search);
  const urlLayout = ['compact', 'graphics', 'bar'].indexOf(qs.get('layout')) >= 0 ? qs.get('layout') : null;
  const O = {
    matchId: qs.get('match'), key: qs.get('key') || undefined, preview: qs.get('preview') === '1',
    follow: qs.get('side') === 'court', urlNames: ['short', 'full'].indexOf(qs.get('names')) >= 0 ? qs.get('names') : null, debug: qs.has('debug'),
    socket: null, match: null, tournament: null, summary: null, seq: 0, timeline: [], offset: 0, photos: {},
    style: GX.normalizeStyle(null), layout: urlLayout || 'bar',
    air: GX.idle(), airSeq: -1,               // what is on air (the server's word)
    stats: null, statsSeq: -1, statsAt: 0, standings: null, standingsAt: 0,
    flash: null, prev: {}, sides: ['A', 'B'], failed: {}, broken: {}, tone: {}
  };
  const serverNow = () => Date.now() + O.offset;

  /* ---------- the operator's note: only when something is wrong for a while ---------- */
  let problemTimer = null;
  function problem(text, later) {
    clearTimeout(problemTimer);
    const show = () => { $('#diag').textContent = '🏐 Volleyball overlay: ' + text; $('#diag').classList.add('show'); };
    if (later && !O.debug) problemTimer = setTimeout(show, 8000); else show();
  }
  function clearProblem() {
    clearTimeout(problemTimer);
    if (O.debug && O.match) { $('#diag').textContent = '🏐 Connected · ' + teamOf('A').name + ' v ' + teamOf('B').name + ' · seq ' + O.seq + ' · ' + C.state; $('#diag').classList.add('show'); }
    else $('#diag').classList.remove('show');
  }

  /* ---------- colours: every tone a graphic needs, from one team colour ---------- */
  function rgbOf(hex) {
    const h = String(hex || '').replace('#', '');
    const n = /^[0-9a-f]{6}$/i.test(h) ? parseInt(h, 16) : 0x24306b;

  }
  const mix = (c, d, k) => c.map((v, i) => Math.round(v + (d[i] - v) * k));
  const rgb = (c) => 'rgb(' + c.join(',') + ')';
  const rgba = (c, a) => 'rgba(' + c.join(',') + ',' + a + ')';
  const lumOf = (c) => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  function tones(hex, text) {
    let c = rgbOf(hex);
    if (lumOf(c) > 0.88) c = mix(c, [0, 0, 0], 0.08);          // a near-white kit still reads as a colour
    const ink = text && /^#[0-9a-f]{6}$/i.test(text) && Math.abs(lumOf(rgbOf(text)) - lumOf(c)) > 0.35 ? text : (lumOf(c) > 0.6 ? '#111111' : '#ffffff');
    const hi = mix(c, [255, 255, 255], 0.2), deep = mix(c, [0, 0, 0], 0.52);
    // dark ink on a light colour: the gradient stays light so the name reads all the way
    // the initials on a white badge: the colour itself, or its deep shade when it is too light to read
    return { c: rgb(c), hi: rgb(hi), deep: rgb(deep), edge: rgb(lumOf(c) > 0.6 ? hi : deep), mark: rgb(lumOf(c) > 0.62 ? deep : c), ink, raw: c };
  }
  const teamVars = (t) => `--c:${t.tone.c};--hi:${t.tone.hi};--deep:${t.tone.deep};--ink:${t.tone.ink};--mark:${t.tone.mark}`;

  /* ---------- the broadcast look (the tournament's, or the studio's preview of it) ---------- */
  function applyStyle(st) {
    O.style = GX.normalizeStyle(st);
    const s = O.style, r = document.documentElement.style;
    const base = rgbOf(s.base), acc = rgbOf(s.accent);
    r.setProperty('--base', rgb(base));
    r.setProperty('--baseHi', rgb(mix(base, [255, 255, 255], 0.1)));
    r.setProperty('--baseLo', rgb(mix(base, [0, 0, 0], 0.45)));
    r.setProperty('--acc', rgb(acc));
    r.setProperty('--accInk', lumOf(acc) > 0.55 ? '#111111' : '#ffffff');
    r.setProperty('--dimBg', s.backdrop === 'solid' ? 'linear-gradient(180deg,' + rgb(mix(base, [255, 255, 255], 0.06)) + ',' + rgb(mix(base, [0, 0, 0], 0.4)) + ')' : rgba(mix(base, [0, 0, 0], 0.35), s.dim));
    document.body.classList.toggle('bd-clear', s.backdrop === 'clear');
    const f = GX.FONTS[s.font] || GX.FONTS.barlow;
    if (s.font !== 'barlow' && !document.getElementById('font-' + s.font)) {
      const l = document.createElement('link');
      l.id = 'font-' + s.font; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + f.css + '&display=swap';
      document.head.appendChild(l);
    }
    r.setProperty('--font', `"${f.family}","Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif`);
    const layout = urlLayout || s.layout;
    if (layout !== O.layout) {
      document.body.classList.remove('L-' + O.layout);
      O.layout = layout;
    }
    document.body.classList.add('L-' + O.layout);
    O.barNamesKey = '';
    paint();
    setTimeout(refitAll, 80);
    request();
  }
  const speed = () => O.style.speed || 1;
  const namesMode = () => O.urlNames || O.style.names;

  /* ---------- data in ---------- */
  async function start() {
    if (!O.matchId) return problem('no match in the link — copy it from the volleyball dashboard');
    loadInfo();
    O.socket = await VB.connect();
    O.socket.on('connect', join);
    O.socket.on('disconnect', () => problem('reconnecting to the server…', true));
    O.socket.on('vb:update', onUpdate);
    O.socket.on('vb:match', (d) => { if (d.matchId === O.matchId && d.match) { O.match = Object.assign(O.match || {}, d.match); O.barNamesKey = ''; paint(); refreshScene(); loadInfoSoon(); } });
    O.socket.on('vb:graphic', (d) => { if (d.matchId === O.matchId && !O.preview) setAir(d.graphic); });
    O.socket.on('vb:style', (d) => { if (O.match && d.tournamentId === O.match.tournamentId && !O.preview) applyStyle(d.style); });
    setInterval(tick, 250);
  }
  // Tournament name, logo and format, the players' portraits (the socket carries the match only).
  let infoTimer = null;
  function loadInfoSoon() { clearTimeout(infoTimer); infoTimer = setTimeout(loadInfo, 400); }
  async function loadInfo() {
    try {
      const r = await fetch(`/api/volleyball/matches/${encodeURIComponent(O.matchId)}${O.key ? '?key=' + encodeURIComponent(O.key) : ''}`, { cache: 'no-store' });
      const j = await r.json();
      if (j && j.success) {
        O.tournament = j.tournament; O.photos = j.photos || {};
        if (j.tournament && j.tournament.broadcast && !O.styled && !O.preview) applyStyle(j.tournament.broadcast);
        refreshScene();
      }
    } catch (e) { /* the graphics show without it */ }
  }
  let joinRetry = null;
  async function join() {
    clearTimeout(joinRetry);
    const r = await VB.ack(O.socket, 'vb:join', { matchId: O.matchId, key: O.key, timeline: true }, 15000);
    if (!r.ok) {
      problem(r.error === 'not-found' ? 'match not found — check the link (a private match needs its key)' : 'could not load the match — retrying', r.error !== 'not-found');
      joinRetry = setTimeout(join, r.error === 'not-found' ? 30000 : 4000);
      return;
    }
    if (r.now) O.offset = r.now - Date.now();
    O.match = r.match; O.summary = r.summary; O.seq = r.seq; O.timeline = r.timeline || [];
    if (r.photos) O.photos = r.photos;

    if (!O.preview && r.style) { O.styled = true; applyStyle(r.style); }
    clearProblem();
    paint();
    document.body.classList.add('ready');   // the match is loaded (tools wait for this)
    request();
  }
  function onUpdate(d) {
    if (!d || d.matchId !== O.matchId || !O.match) return;
    if (d.seq <= O.seq) return;
    const gap = d.seq !== O.seq + 1;
    O.seq = d.seq; O.summary = d.summary; O.match.status = d.status;
    if (d.full || gap || !d.entry) { paint(); return resync(); }
    d.entry._recv = Date.now();
    O.timeline.push(d.entry);
    onLiveEntry(d.entry);
    paint();
    refreshScene();
    if (O.debug) clearProblem();
  }
  let syncing = null;
  function resync() {
    if (syncing) { syncing.again = true; return; }
    syncing = { again: false };
    VB.ack(O.socket, 'vb:sync', { matchId: O.matchId, key: O.key }, 15000).then((r) => {
      const again = syncing.again; syncing = null;
      if (r && r.ok) { O.match = r.match; O.summary = r.summary; O.seq = r.seq; O.timeline = r.timeline || []; paint(); refreshScene(); if (!O.preview) setAir(r.graphic, true); }
      if (again) resync();
    });
  }
  // the server's word on what is on air: the newest state wins, an older or repeated one changes nothing
  let expiryTimer = null;
  function setAir(g, fromJoin, quiet) {
    if (!g || typeof g.seq !== 'number') return;
    if (g.serverNow) O.offset = g.serverNow - Date.now();
    if (g.seq < O.airSeq || (g.seq === O.airSeq && !fromJoin)) return;
    O.airSeq = g.seq;
    O.air = g;
    if (fromJoin && g.scene) O.joined = g.id;   // what was already on air when this page (re)joined

    if (!quiet) request();
  }

  /* ---------- helpers ---------- */
  const other = (t) => (t === 'A' ? 'B' : 'A');
  function teamOf(side) {
    const t = (O.match && O.match['team' + side]) || null;
    const c = (t && t.colors) || {};
    const color = /^#[0-9a-f]{6}$/i.test(c.primary || '') ? c.primary : (side === 'A' ? '#c81e3c' : '#e08a00');
    const name = (t && t.name) || (O.match && O.match.source && O.match.source[side] && O.match.source[side].label) || 'To be decided';
    return { side, name, short: (t && t.shortName) || VB.initials(name), color, tone: tones(color, c.text), logo: t && t.logo ? t.logo : '', city: (t && t.city) || '' };
  }
  function player(side, id) {
    const sq = (O.match && O.match.squads && O.match.squads[side]) || [];
    for (let i = 0; i < sq.length; i++) if (sq[i].playerId === id) return sq[i];
    return null;
  }
  function sideOfPlayer(id) { return player('A', id) ? 'A' : player('B', id) ? 'B' : null; }
  const live = (e) => e && !e.voided && !e.invalid;
  function splitName(n) {
    const w = String(n || '').trim().split(/\s+/).filter(Boolean);
    return w.length > 1 ? { first: w.slice(0, -1).join(' '), last: w[w.length - 1] } : { first: '', last: w[0] || '' };
  }
  const surname = (n) => splitName(n).last;
  // "Venkatasubramanian Raghunathan" → "V. Raghunathan"
  function abbrName(n) { const w = String(n || '').trim().split(/\s+/); return w.length > 1 ? w[0][0] + '. ' + w[w.length - 1] : w[0] || ''; }
  const photoOf = (pid) => { const u = O.photos && O.photos[pid]; return u && !O.broken[u] ? u : ''; };
  function tournamentLogo() {
    const t = O.tournament;
    return t && t.logo ? `${t.logo}&match=${encodeURIComponent(O.matchId)}${O.key ? '&key=' + encodeURIComponent(O.key) : ''}` : '';
  }
  const darkPlate = (url) => O.style.plates === 'dark' || (O.style.plates === 'auto' && O.tone[url] === 'dark');
  // a logo on its plate — with none (or one that will not load) the team's
  // initials on its own colour; never a made-up crest
  function plate(t, size, cls) {
    const url = t.logo && !O.broken[t.logo] ? t.logo : '';
    if (!url) return `<span class="plate mono ${cls || ''}" style="--ps:${size}px;${teamVars(t)}"><b class="mono">${esc(t.short)}</b></span>`;
    return `<span class="plate ${darkPlate(url) ? 'dk' : ''} ${cls || ''}" style="--ps:${size}px;${teamVars(t)}"><img src="${esc(url)}" alt=""></span>`;
  }
  function urlPlate(url, size) { return url && !O.broken[url] ? `<span class="plate ${darkPlate(url) ? 'dk' : ''}" style="--ps:${size}px"><img src="${esc(url)}" alt=""></span>` : ''; }
  const ROLE = (p) => (p && p.libero ? 'Libero' : (p && VB.ROLES[p.role]) || '');
  function ballSvg() {
    return '<svg class="ball" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#fbf6e6"/><g fill="none" stroke-linecap="round" stroke-width="7"><path d="M6 22C20 18 36 24 42 60" stroke="#1d5fd6"/><path d="M60 24C44 26 28 18 20 4" stroke="#f5c518"/><path d="M12 54C18 40 32 32 60 40" stroke="#1d5fd6"/></g><circle cx="32" cy="32" r="29" fill="none" stroke="#0a1136" stroke-opacity=".35" stroke-width="2"/></svg>';
  }
  function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
  function fmt(v) { return Math.round(v * 10) / 10; }
  const mins = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min'; };
  const plural = (name, verb) => (/s$/i.test(name) ? verb : verb + 's');

  /* ---------- names always fit: shrink, then the short form — never an ellipsis ---------- */
  // The text is measured off-screen at the box's own font (a box's width is
  // fractional and scrollWidth is not). Two-line names (the intro) shrink
  // until they fit two lines.
  const meter = document.createElement('span');
  meter.setAttribute('aria-hidden', 'true');
  meter.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;white-space:nowrap';
  function textWidth(el, text, px) {
    if (!meter.isConnected) document.body.appendChild(meter);
    const cs = getComputedStyle(el);
    ['fontFamily', 'fontWeight', 'fontStyle', 'fontStretch', 'fontVariant', 'letterSpacing', 'textTransform'].forEach((k) => { meter.style[k] = cs[k]; });
    meter.style.fontSize = px + 'px';
    meter.textContent = text;
    return meter.getBoundingClientRect().width;
  }
  function fitOne(el) {
    if (!el || !el.isConnected) return;
    const max = Number(el.dataset.fit) || 30, min = Number(el.dataset.min) || Math.round(max * 0.6);
    if (el.dataset.full == null) el.dataset.full = el.textContent;
    const box = el.clientWidth;
    if (!box) return;
    const fits = (text, px) => textWidth(el, text, px) <= box - 3;
    let text = el.dataset.full, px = max;
    while (!fits(text, px) && px > min) px -= 2;
    if (!fits(text, px) && el.dataset.alt) { text = el.dataset.alt; px = max; while (!fits(text, px) && px > min) px -= 2; }
    el.textContent = text;
    el.style.fontSize = px + 'px';
  }
  function fitTwo(el) {
    if (!el || !el.isConnected) return;
    const max = Number(el.dataset.fit2) || 70, min = Number(el.dataset.min) || 36, lines = Number(el.dataset.lines) || 2;
    if (el.dataset.full == null) el.dataset.full = el.textContent;
    const box = el.clientWidth;
    if (!box) return;
    let words = el.dataset.full.split(/\s+/);
    const ok = (px) => {
      el.style.fontSize = px + 'px';
      const lh = parseFloat(getComputedStyle(el).lineHeight) || px * 1.05;
      // the box's own height (scrollHeight also counts the glyphs' overhang)
      return el.offsetHeight <= Math.ceil(lh * lines) + 1 && words.every((w) => textWidth(el, w, px) <= box - 3);
    };
    el.textContent = el.dataset.full;
    let px = max;
    while (!ok(px) && px > min) px -= 2;
    if (!ok(px) && el.dataset.alt) { el.textContent = el.dataset.alt; words = [el.dataset.alt]; px = max; while (!ok(px) && px > min) px -= 2; }
  }
  function fitAll(root) {
    if (!root) return;
    $$('[data-orig]', root).forEach((el) => { el.dataset.full = el.dataset.orig; });   // a refit starts from the real name
    $$('[data-fit]', root).forEach(fitOne);
    $$('[data-fit2]', root).forEach(fitTwo);
    // names that stand side by side take one size — the smaller of the two
    const groups = {};
    $$('[data-group]', root).forEach((el) => { (groups[el.dataset.group] = groups[el.dataset.group] || []).push(el); });
    Object.keys(groups).forEach((k) => {
      const els = groups[k];
      // single-line names side by side: if one needs its short form, both take theirs
      if (els.some((el) => el.dataset.fit && el.dataset.alt && el.textContent === el.dataset.alt && el.dataset.alt !== el.dataset.full)) {
        els.forEach((el) => { if (el.dataset.fit && el.dataset.alt && el.textContent !== el.dataset.alt) { el.dataset.orig = el.dataset.orig || el.dataset.full; el.dataset.full = el.dataset.alt; fitOne(el); } });
      }
      const px = Math.min.apply(null, els.map((el) => parseFloat(el.style.fontSize) || parseFloat(getComputedStyle(el).fontSize) || 40));
      els.forEach((el) => { el.style.fontSize = px + 'px'; });

      const held = els.filter((el) => el.parentNode && el.parentNode.hasAttribute && el.parentNode.hasAttribute('data-hold'));
      if (held.length) { const h = Math.max.apply(null, held.map((el) => el.offsetHeight)); held.forEach((el) => { el.parentNode.style.height = h + 'px'; }); }
    });
  }
  function refitAll() { fitAll($('#gfx')); fitAll($('#corner')); O.barNamesKey = ''; paintBarNames(); }
  if (document.fonts) {
    document.fonts.ready.then(refitAll);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refitAll);
  }
  const fitAttrs = (max, min, alt) => `data-fit="${max}" data-min="${min}"${alt ? ` data-alt="${esc(alt)}"` : ''}`;
  const fit2Attrs = (max, min, alt) => `data-fit2="${max}" data-min="${min}" data-lines="2"${alt ? ` data-alt="${esc(alt)}"` : ''}`;

  /* ---------- pictures: loaded and decoded before anything moves ---------- */
  const loading = {};
  function preload(url) {
    if (!url) return Promise.resolve(false);
    if (loading[url]) return loading[url];
    loading[url] = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        // the plate under a logo: deep base for a light crest on a clear
        // background (it would vanish on white), white for everything else
        try {
          const c = document.createElement('canvas'); c.width = c.height = 24;
          const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
          const d = x.getImageData(0, 0, 24, 24).data;
          let n = 0, clear = 0, lum = 0;
          for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 40) { clear++; continue; } n++; lum += (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255; }
          O.tone[url] = n && clear / 576 > 0.08 && lum / n > 0.72 ? 'dark' : 'light';
        } catch (e) { O.tone[url] = 'light'; }
        const done = () => resolve(true);
        if (img.decode) img.decode().then(done, done); else done();
      };
      img.onerror = () => { O.broken[url] = true; resolve(false); };
      img.src = url;
    });
    return loading[url];
  }
  const within = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(r, ms))]);

  /* ---------- motion: one easing family, transform / opacity / clip only ---------- */
  const EASE = { out: 'cubic-bezier(.16,1,.3,1)', in: 'cubic-bezier(.7,0,.84,0)', io: 'cubic-bezier(.65,0,.35,1)', back: 'cubic-bezier(.34,1.45,.64,1)' };
  // one animation, scaled by the tournament's motion speed. 'backwards' fill:
  // it holds its first frame while it waits, then leaves the element as its CSS has it
  function A(el, kf, dur, delay, ease, fill) {
    if (!el) return null;
    const k = speed();
    return el.animate(kf, { duration: Math.max(1, dur * k), delay: (delay || 0) * k, easing: ease || EASE.out, fill: fill || 'backwards' });
  }
  const X = (el, kf, dur, delay, ease) => A(el, kf, dur, delay, ease || EASE.in, 'forwards');
  const clean = (list) => list.filter(Boolean);
  // resolves when every animation of the list has finished (or been cancelled)
  function settled(list) {
    return new Promise((resolve) => {
      const running = list.filter((a) => a && a.playState !== 'finished' && a.playState !== 'idle');
      let left = running.length;
      if (!left) return resolve();
      const fin = () => { if (--left === 0) resolve(); };
      running.forEach((a) => { a.onfinish = fin; a.oncancel = fin; });
    });
  }
  const fadeUp = (px) => [{ opacity: 0, transform: `translateY(${px}px)` }, { opacity: 1, transform: 'none' }];
  const fadeIn = [{ opacity: 0 }, { opacity: 1 }];

  /* ============================================================
     THE CONTROLLER — one state, one transition at a time
     ============================================================ */
  const C = { state: 'IDLE', scene: null, entering: null, interrupt: null, afterGraphic: false, barLayout: null, history: [],
    counts: { overlayIn: 0, overlayOut: 0, returns: 0, graphicIn: 0, graphicOut: 0, interrupted: 0, settled: 0 } };
  function setState(s) {
    if (C.state === s) return;
    C.state = s;
    C.history.push({ s, at: Date.now(), scene: C.scene ? C.scene.g.scene : (C.entering ? C.entering.scene : null) });
    if (C.history.length > 300) C.history.shift();
    if (O.debug) clearProblem();
    postPreview();
  }
  // what should be on screen now
  function target() {

    const t = teamOf(side), opp = teamOf(other(side)), pos = lineupOf(side, set);
    if (!pos) return { error: `${t.name}: no starting six saved for set ${set} yet` };
    const sq = (O.match.squads && O.match.squads[side]) || [];
    const libs = sq.filter((p) => p.libero && pos.indexOf(p.playerId) < 0);
    const fs = firstServeOf(set);
    const card = (idx, k) => {
      const p = player(side, pos[idx]);
      const ph = p ? photoOf(p.playerId) : '';
      const nm = splitName(p ? p.name : '');
      return `<div class="pc" style="${teamVars(t)}" data-k="${k}"><div class="pcp ${ph ? 'has' : ''}">${ph ? `<img src="${esc(ph)}" alt="">` : `<b class="pbig num">${esc(p && p.number ? p.number : '–')}</b>`}</div>
        <div class="pci"><span class="ppos"><small>POS</small>${VB.POS[idx]}</span>${ph && p.number ? `<b class="pno num">${esc(p.number)}</b>` : ''}

          ${ROLE(p) ? `<span class="prole">${esc(ROLE(p))}</span>` : ''}</div></div>`;
    };
    // front row IV III II at the net, back row V VI I — as the team stands
    const order = [3, 2, 1, 4, 5, 0];
    return { team: side, html: `<div class="lhead" style="${teamVars(t)}">${plate(t, 138)}<div class="lht"><span class="kick">Starting six · Set ${set}</span><b ${fitAttrs(76, 44, t.short)}>${esc(t.name)}</b></div>
        <div class="lop">vs ${esc(opp.short)}${plate(opp, 64)}</div></div>
      <div class="lnet"><i></i><span>NET</span><i></i></div>
      <div class="lgrid">${order.map(card).join('')}</div>
      <div class="lfoot" style="${teamVars(t)}">${libs.map((p) => `<div class="lib"><em>LIBERO</em><b class="num">${esc(p.number)}</b><span>${esc(p.name)}</span></div>`).join('')}
        ${fs ? `<div class="lsv">${ballSvg()}${esc(teamOf(fs).name)} ${plural(teamOf(fs).name, 'serve')} first</div>` : ''}</div>` };
  }
  SC.lineup = {

    enter(el) { return lineupIn(el, 0); },
    exit(el) { return lineupOut(el, 0); },
    visible(sc) { SC.lineup.update(sc); },
    update(sc) {
      sc.timers.forEach(clearTimeout); sc.timers = [];
      const g = sc.g;
      if (g.data && g.data.team) return;
      const second = O.sides[1];

  };
  function lineupIn(el, d0) {
    const cards = qa(el, '.pc');

    return clean([
      A(q(el, '.lhead .plate'), [{ opacity: 0, transform: 'scale(.6) rotate(-8deg)' }, { opacity: 1, transform: 'none' }], 700, d0, EASE.back),
      A(q(el, '.lht'), [{ opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-24px)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', transform: 'none' }], 700, d0 + 120),
      A(q(el, '.lop'), fadeIn, 500, d0 + 380),
      A(q(el, '.lnet'), [{ opacity: 0, transform: 'scaleX(.2)' }, { opacity: 1, transform: 'none' }], 640, d0 + 300, EASE.io)
    ].concat(readOrder.map((slot, i) => A(cards[slot], [{ opacity: 0, transform: 'translateY(46px) scale(.96)', clipPath: 'inset(100% 0 0 0)' }, { opacity: 1, transform: 'none', clipPath: 'inset(0% 0 0 0)' }], 620, d0 + 480 + i * 95)))
      .concat(qa(el, '.pcp img').map((im, i) => A(im, [{ transform: 'scale(1.12)' }, { transform: 'none' }], 1100, d0 + 480 + i * 60)))
      .concat([A(q(el, '.lfoot'), fadeUp(20), 520, d0 + 1220)]));
  }
  function lineupOut(el, d0) {
    const cards = qa(el, '.pc');
    return clean([X(q(el, '.lfoot'), [{ opacity: 1 }, { opacity: 0 }], 220, d0)]
      .concat(cards.map((c, i) => X(c, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-30px) scale(.97)' }], 360, d0 + 40 + i * 35)))
      .concat([X(q(el, '.lnet'), [{ opacity: 1 }, { opacity: 0 }], 260, d0 + 160), X(q(el, '.lhead'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-30px)' }], 360, d0 + 200)]));
  }
  // team one hands the screen to team two — inside the same graphic
  async function swapLineup(sc, side) {
    if (!sc.alive || sc.team === side || sc.busy) return;
    const b = lineupHtml(side, lineupSet(sc.g.data || {}));
    if (!b || b.error) return;
    sc.busy = true;
    const out = lineupOut(sc.el, 0);
    sc.anims = out;
    await settled(out);
    if (!sc.alive) return;
    sc.el.innerHTML = b.html; sc.team = side; sc.key = 'lineup:' + hashStr(b.html);
    out.forEach((a) => a.cancel());
    fitAll(sc.el);
    const inn = lineupIn(sc.el, 0);
    sc.anims = inn;
    await settled(inn);
    if (!sc.alive) return;
    inn.forEach((a) => a.cancel());
    sc.anims = []; sc.busy = false;
  }

  /* ----- coin toss ----- */
  function tossOf(d) {
    const s = O.summary;
    const set = d.set || (s.decidingToss && (s.nextDeciding || s.deciding || s.status === 'completed') ? s.bestOf : 1);
    return { set, toss: set === 1 ? s.toss : (set === s.bestOf ? s.decidingToss : null) };
  }
  SC.toss = {
    cls: 'toss',
    build(d) {
      const x = tossOf(d), toss = x.toss;
      if (!toss) return { error: x.set === 1 ? 'No toss recorded yet' : 'The deciding-set toss is not recorded yet' };
      const w = teamOf(toss.winner), l = teamOf(other(toss.winner)), fs = teamOf(toss.firstServe);
      const dec = toss.choice === 'serve' ? ['Elected', 'to serve'] : toss.choice === 'receive' ? ['Elected', 'to receive'] : ['Chose', 'the court side'];
      const Ls = toss.leftSide || 'A', TL = teamOf(Ls), TR = teamOf(other(Ls));

        <div class="twin"><b ${fitAttrs(84, 48, w.short)}>${esc(w.name)}</b><span>won the toss</span></div>
        <div class="tdec"><small>${esc(dec[0])}</small><b>${esc(dec[1])}</b></div>
        <div class="ttiles"><div class="tt"><small>First serve</small><div class="tv">${plate(fs, 52)}<b ${fitAttrs(38, 26, fs.short)}>${esc(fs.name)}</b></div></div>
          <div class="tt"><small>Starting sides · scorer's view</small><div class="mini"><span style="${teamVars(TL)}">${esc(TL.short)}</span><i></i><span style="${teamVars(TR)}">${esc(TR.short)}</span></div></div></div></div>` };
    },
    // the panel → the coin spins and lands on the winner → the winner → the decision → the details
    enter(el) {
      return clean([
        A(q(el, '.tbox'), [{ opacity: 0, transform: 'translateY(40px) scale(.96)' }, { opacity: 1, transform: 'none' }], 640, 0),
        A(q(el, '.kick'), fadeUp(-12), 480, 200),
        A(q(el, '.coin'), [{ transform: 'translateY(-90px) rotateY(-1440deg) scale(.7)' }, { transform: 'translateY(0) rotateY(-180deg) scale(1.08)', offset: 0.75 }, { transform: 'none' }], 1150, 260, EASE.io),
        A(q(el, '.twin'), [{ opacity: 0, clipPath: 'inset(0 0 100% 0)', transform: 'translateY(24px)' }, { opacity: 1, clipPath: 'inset(0 0 0% 0)', transform: 'none' }], 620, 1000),
        A(q(el, '.tdec'), [{ opacity: 0, clipPath: 'inset(0 50% 0 50%)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0%)' }], 560, 1260),
        A(q(el, '.ttiles'), fadeUp(24), 560, 1380)
      ]);
    }
  };

  /* ----- set start ----- */
  SC.setStart = {
    cls: 'setstart',
    build() {
      const s = O.summary, m = O.match, ru = m.rules || {};
      if (s.status === 'completed' || s.status === 'abandoned') return { error: 'The match is over' };
      const set = s.status === 'in_set' ? s.set : (s.nextSet || 1);
      const deciding = s.status === 'in_set' ? s.deciding : s.nextDeciding;
      const target = deciding ? ru.decidingSetPoints : ru.setPoints;
      const fs = s.status === 'in_set' ? (info(set) && info(set).firstServe) || s.serving : firstServeOf(set);
      const ls = s.status === 'in_set' ? s.leftSide : leftSideOf(set);
      const [Ls, Rs] = O.sides, A_ = teamOf(Ls), B_ = teamOf(Rs);
      return { html: `<div class="ssbox panel"><span class="kick">${s.status === 'in_set' ? 'Now' : 'Coming up'}</span>
        <b class="ssn">Set <em>${set}</em></b><span class="ssd">${esc([deciding ? 'Deciding set' : '', target ? 'To ' + target : ''].filter(Boolean).join(' · '))}</span>
        <div class="ssrow"><div class="tm L">${plate(A_, 104)}<b class="nm" data-group="ss" ${fit2Attrs(40, 28, A_.short)}>${esc(A_.name)}</b></div>
          <div class="sss num">${s.setsWon[Ls]}<i>SETS</i>${s.setsWon[Rs]}</div>
          <div class="tm R">${plate(B_, 104)}<b class="nm" data-group="ss" ${fit2Attrs(40, 28, B_.short)}>${esc(B_.name)}</b></div></div>
        ${fs ? `<div class="ssv">${ballSvg()}<span ${fitAttrs(28, 20, teamOf(fs).short + ' to serve' + (ls ? ' · ' + teamOf(ls).short + ' on the left' : ''))}>${esc(teamOf(fs).name)} to serve${ls ? ' · ' + esc(teamOf(ls).short) + ' on the left' : ''}</span></div>` : ''}
        ${setsChips(0, false)}</div>` };
    },
    enter(el) {
      return clean([
        A(q(el, '.ssbox'), [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], 600, 0),
        A(q(el, '.kick'), fadeUp(-10), 420, 160),
        A(q(el, '.ssn'), [{ opacity: 0, transform: 'scale(1.3)', clipPath: 'inset(0 0 100% 0)' }, { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0% 0)' }], 700, 240),
        A(q(el, '.ssd'), fadeIn, 420, 640),
        A(q(el, '.ssrow'), fadeUp(22), 560, 760),

  /* ----- results: set, match, statistics ----- */
  function resultHead(scA, scB, winner, size) {
    const [Ls, Rs] = O.sides, L = teamOf(Ls), R = teamOf(Rs);
    return `<div class="rhead"><div class="rt L" style="${teamVars(L)}">${plate(L, size || 120)}<b class="nm" data-group="rh" ${fit2Attrs(44, 30, L.short)}>${esc(L.name)}</b></div>
      <div class="rsc num"><b class="${winner === Ls ? 'w' : ''}">${scA}</b><i>–</i><b class="${winner === Rs ? 'w' : ''}">${scB}</b></div>
      <div class="rt R" style="${teamVars(R)}">${plate(R, size || 120)}<b class="nm" data-group="rh" ${fit2Attrs(44, 30, R.short)}>${esc(R.name)}</b></div></div>`;
  }
  function compareRows(rows) {
    const [Ls, Rs] = O.sides, L = teamOf(Ls), R = teamOf(Rs);
    return `<div class="cmp">${rows.map(([lbl, a, b, txt]) => {

    }).join('')}</div>`;
  }
  function catRows(T, Ls, Rs, total) {
    const c = (side, k) => T[side].byCategory[k];
    const rows = [['Attack points', c(Ls, 'attack'), c(Rs, 'attack')], ['Block points', c(Ls, 'block'), c(Rs, 'block')], ['Serve points', c(Ls, 'serve'), c(Rs, 'serve')], ['Opponent errors', c(Ls, 'opponentError'), c(Rs, 'opponentError')]];
    if (total) rows.push(['Total points', T[Ls].points, T[Rs].points]);

  function setsChips(highlight, withTotal) {

    return `<div class="rsets">${withTotal ? `<span class="tot num"><small>SETS</small>${s.setsWon[Ls]}–${s.setsWon[Rs]}</span>` : ''}${list.map((x) => `<span class="num ${x.set === highlight ? 'cur' : ''}"><small>S${x.set}</small>${x.winner === Ls ? `<em>${x[Ls]}</em>` : x[Ls]}–${x.winner === Rs ? `<em>${x[Rs]}</em>` : x[Rs]}</span>`).join('')}</div>`;
  }
  // the panel → the two teams → the score → the result → the figures, row by row
  const resEnter = (el) => clean([

    A(q(el, '.kick'), fadeUp(-10), 440, 180),
    A(q(el, '.rt.L'), [{ opacity: 0, transform: 'translateX(-60px)' }, { opacity: 1, transform: 'none' }], 640, 300),
    A(q(el, '.rt.R'), [{ opacity: 0, transform: 'translateX(60px)' }, { opacity: 1, transform: 'none' }], 640, 300),
    A(q(el, '.rsc'), [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], 620, 520, EASE.back),
    A(q(el, '.wban'), [{ opacity: 0, clipPath: 'inset(0 50% 0 50%)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0%)' }], 560, 820),
    A(q(el, '.rsets'), fadeUp(16), 480, 820),
    A(q(el, '.fsets'), fadeUp(16), 520, 900)
  ].concat(qa(el, '.cr').map((r, i) => A(r, [{ opacity: 0, transform: 'translateX(-24px)' }, { opacity: 1, transform: 'none' }], 480, 960 + i * 70)))
    .concat(qa(el, '.cr .bar i').map((b, i) => A(b, [{ transform: 'scaleX(0)' }, { transform: 'none' }], 760, 1040 + Math.floor(i / 2) * 70)))
    .concat(qa(el, '.top, .mp').map((r, i) => A(r, fadeUp(16), 460, 1180 + i * 50)))
    .concat([A(q(el, '.meta'), fadeIn, 420, 1400)]));
  SC.setSummary = {
    cls: 'res setres',
    build(d) {
      const s = O.summary, [Ls, Rs] = O.sides;
      const done = s.sets.filter((x) => x.status === 'completed');
      const set = d.set ? s.sets.filter((x) => x.set === Number(d.set))[0] : done[done.length - 1];
      if (!set || set.status !== 'completed') return { error: 'No set has finished yet' };
      const bs = O.stats && O.stats.bySet ? O.stats.bySet.filter((x) => x.set === set.set)[0] : null;
      const i = info(set.set);
      const dur = i && i.startedAt && i.endedAt && i.endedAt > i.startedAt ? mins(i.endedAt - i.startedAt) : '';
      const winner = teamOf(set.winner);
      return { html: `<div class="rbox panel"><span class="kick">End of set ${set.set}${set.deciding ? ' · Deciding set' : ''}</span>${resultHead(set[Ls], set[Rs], set.winner)}
        <div class="wban" style="${teamVars(winner)}">${esc(winner.name)} ${plural(winner.name, 'take')} set ${set.set}</div>
        ${setsChips(set.set, true)}${bs ? compareRows(catRows(bs, Ls, Rs, false).concat([['Break points', bs[Ls].breakPoints || 0, bs[Rs].breakPoints || 0]])) : ''}
        ${dur ? `<div class="meta">Set duration ${esc(dur)}</div>` : ''}</div>` };

    enter: resEnter

  function topScorers(side, n) {

  }
  function personDot(p, side) {

  }
  function matchSpan() {
    const si = (O.summary && O.summary.setInfo) || [];
    const a = si.length && si[0].startedAt, b = si.length && si[si.length - 1].endedAt;
    return a && b && b > a ? mins(b - a) : '';
  }
  SC.final = {
    cls: 'res final',
    build() {
      const s = O.summary, [Ls, Rs] = O.sides;
      if (!s.sets.length) return { error: 'The match has not started yet' };
      const over = s.status === 'completed', ab = s.status === 'abandoned';
      const head = over ? (s.forfeit ? 'Final · by forfeit' : 'Final result') : ab ? 'Match abandoned' : 'Match score';
      const w = over && s.winner ? teamOf(s.winner) : null;

      const row = (side) => { const t = teamOf(side); return `<tr style="${teamVars(t)}"><td class="t"><div class="tn"><i></i><b ${fitAttrs(30, 20, t.short)}>${esc(t.name)}</b></div></td>${sets.map((x) => `<td class="num ${x.winner === side ? 'w' : ''}">${x[side]}</td>`).join('')}<td class="tot num ${s.winner === side ? 'w' : ''}">${s.setsWon[side]}</td></tr>`; };
      const tops = O.stats ? [Ls, Rs].map((side) => { const p = topScorers(side, 1)[0]; return p ? `<div class="top">${personDot(p, side)}<div><small>Top scorer · ${esc(teamOf(side).short)}</small><span ${fitAttrs(30, 20, '#' + p.number + ' ' + abbrName(p.name))}>#${esc(p.number)} ${esc(p.name)}</span></div><b class="num">${fmt(p.points)}</b></div>` : '<div></div>'; }).join('') : '';
      const span = matchSpan();
      const nameW = Math.max(360, 760 - sets.length * 80);
      return { html: `<div class="rbox panel"><span class="kick">${esc(head)}</span>${resultHead(s.setsWon[Ls], s.setsWon[Rs], s.winner, 130)}
        ${w ? `<div class="wban" style="${teamVars(w)}">${esc(w.name)} ${plural(w.name, 'win')} ${s.setsWon[w.side]}–${s.setsWon[other(w.side)]}</div>` : ''}
        <table class="fsets"><colgroup><col style="width:${nameW}px">${sets.map(() => '<col>').join('')}<col style="width:130px"></colgroup>
          <thead><tr><th class="t">Team</th>${sets.map((x) => (x.status === 'completed' ? `<th>Set ${x.set}</th>` : `<th class="lv">Set ${x.set} · live</th>`)).join('')}<th>Sets</th></tr></thead><tbody>${row(Ls)}${row(Rs)}</tbody></table>
        ${tops ? `<div class="tops">${tops}</div>` : ''}${span && over ? `<div class="meta">Match duration ${esc(span)}</div>` : ''}</div>` };
    },
    enter: resEnter
  };
  SC.scorecard = {
    cls: 'res mstats',
    build() {
      const s = O.summary, [Ls, Rs] = O.sides;
      if (!s.sets.length) return { error: 'The match has not started yet' };
      if (!O.stats) return { error: 'The statistics could not be loaded' };
      const T = O.stats.teams;
      const eff = (side) => (T[side].attack.efficiency == null ? '–' : Math.round(T[side].attack.efficiency * 100) + '%');
      const rows = catRows(T, Ls, Rs, true).concat([['Attack efficiency', T[Ls].attack.efficiency || 0, T[Rs].attack.efficiency || 0, [eff(Ls), eff(Rs)]], ['Errors made', T[Ls].errorsCommitted || 0, T[Rs].errorsCommitted || 0]]);
      const col = (side) => { const list = topScorers(side, 3); return `<div class="mcol"><small class="h">Top scorers · ${esc(teamOf(side).short)}</small>${list.map((p) => `<div class="mp"><em class="num">${esc(p.number)}</em><span ${fitAttrs(26, 18, abbrName(p.name))}>${esc(p.name)}</span><b class="num">${fmt(p.points)}</b><small>${p.attack.kills} K · ${fmt(p.block.points)} B · ${p.serve.aces} A</small></div>`).join('') || '<div class="mp"><span>No points credited to a player yet</span></div>'}</div>`; };
      return { html: `<div class="rbox panel"><span class="kick">${s.status === 'completed' ? 'Match statistics · final' : 'Match statistics'}</span>${resultHead(s.setsWon[Ls], s.setsWon[Rs], s.winner, 96)}
        ${compareRows(rows)}<div class="mcols">${col(Ls)}${col(Rs)}</div></div>` };
    },
    enter: resEnter
  };

  /* ----- player card ----- */
  SC.playerStat = {
    cls: 'pcard',
    build(d) {
      const side = sideOfPlayer(d.playerId);
      if (!side) return { error: 'That player is in neither squad' };
      const p = player(side, d.playerId), t = teamOf(side);
      const st = O.stats && O.stats.players ? O.stats.players[d.playerId] : null;
      const ph = photoOf(p.playerId), nm = splitName(p.name);
      const eff = st && st.attack.attempts ? Math.round(st.attack.efficiency * 100) + '%' : '–';
      const tiles = st ? [[fmt(st.points), 'Points'], [st.attack.kills, 'Kills'], [fmt(st.block.points), 'Blocks'], [st.serve.aces, 'Aces'], [p.libero ? st.digs : eff, p.libero ? 'Digs' : 'Attack eff.']] : [];
      return { html: `<div class="pbox panel" style="${teamVars(t)}"><div class="pph">${ph ? `<img src="${esc(ph)}" alt="">` : `<b class="pbig num">${esc(p.number || '')}</b>`}</div>

  /* ----- time-out ----- */

  /* ============================================================
     THE LIVE OVERLAY — the score bar and the corner bug
     ============================================================ */
  // number roll: the old figure leaves, the new one arrives
  function roll(el, v, anim) {
    v = String(v);
    const all = Array.prototype.slice.call(el.children), cur = all[all.length - 1];
    if (cur && cur.textContent === v) return false;
    all.slice(0, -1).forEach((x) => x.remove());
    const n = document.createElement('span'); n.className = 'n'; n.textContent = v;
    if (!cur || !anim) { el.innerHTML = ''; el.appendChild(n); return true; }
    el.appendChild(n);
    const d = +v > +cur.textContent ? 1 : -1;
    n.animate([{ transform: `translateY(${60 * d}%) scale(.8)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 700, easing: EASE.out });
    const outA = cur.animate([{ transform: 'none', opacity: 1 }, { transform: `translateY(${-60 * d}%) scale(.8)`, opacity: 0 }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
    outA.onfinish = () => cur.remove();
    return true;
  }
  function swapText(el, text, anim) {
    if (el.textContent === text && !el._to) return;
    if (!anim) { el._to = null; el.textContent = text; return; }
    el._to = text;
    if (el._busy) return;
    el._busy = true;
    const a = el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(6px)' }], { duration: 160, fill: 'forwards' });
    a.onfinish = () => { el.textContent = el._to; el._to = null; el._busy = false; a.cancel(); el.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: EASE.out }); };
  }
  function hit(i) {
    $('#h' + 'AB'[i]).animate([{ opacity: 0 }, { opacity: 0.7, offset: 0.25 }, { opacity: 0 }], { duration: 1100, easing: 'ease-out' });
    $('#p' + 'ab'[i] + ' .roll').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)', offset: 0.3 }, { transform: 'scale(1)' }], { duration: 700, easing: EASE.out });
  }
  function setPop(el) { el.querySelector('.roll').animate([{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 900, easing: EASE.out }); }
  function barLogo(el, t) {
    const url = t.logo && !O.broken[t.logo] ? t.logo : '';
    const dark = url && darkPlate(url);
    const k = url + '|' + (dark ? 'd' : 'l') + '|' + t.short + '|' + t.tone.c;
    if (el.dataset.k === k) return;
    el.dataset.k = k;
    el.className = 'bp' + (url ? (dark ? ' dk' : '') : ' mono');

    el.innerHTML = url ? `<img src="${esc(url)}" alt="">` : `<b class="mono">${esc(t.short)}</b>`;
    if (url && O.tone[url] === undefined) preload(url).then(() => { el.dataset.k = ''; paint(); });
  }
  // Both names at one size, both boxes one width: the score sits dead centre.
  function paintBarNames() {
    if (!O.match || O.layout !== 'bar') return;
    const [A_, B_] = O.sides.map(teamOf);
    const mode = namesMode();
    const els = [$('#na span'), $('#nb span')];
    let texts = mode === 'short' ? [A_.short, B_.short] : [A_.name, B_.name];
    const key = texts.join('|') + '|' + mode + '|' + O.style.font;
    if (O.barNamesKey === key) return;
    O.barNamesKey = key;
    const widest = (tx, px) => Math.max(textWidth(els[0], tx[0], px), textWidth(els[1], tx[1], px));
    let px = 44;
    while (widest(texts, px) > 380 && px > (mode === 'full' ? 26 : 34)) px -= 2;
    if (widest(texts, px) > 380 && mode !== 'full') { texts = [A_.short, B_.short]; px = 44; }
    while (widest(texts, px) > 380 && px > 24) px -= 2;
    const box = Math.max(250, Math.min(460, Math.ceil(widest(texts, px)) + 88));
    [$('#na'), $('#nb')].forEach((el, i) => { el.style.width = box + 'px'; els[i].style.fontSize = px + 'px'; swapText(els[i], texts[i], C.state === 'OVERLAY_VISIBLE'); });
  }
  function paint(force) {
    if (!O.match || !O.summary) return;
    const s = O.summary;
    const Ls = O.follow && s.leftSide === 'B' ? 'B' : 'A', Rs = other(Ls);
    const flipped = O.sides[0] !== Ls;
    O.sides = [Ls, Rs];
    if (flipped) O.barNamesKey = '';
    const A_ = teamOf(Ls), B_ = teamOf(Rs);
    const anim = C.state === 'OVERLAY_VISIBLE' && !force && !flipped;
    const r = document.documentElement.style;
    r.setProperty('--ca', A_.tone.c); r.setProperty('--cb', B_.tone.c); r.setProperty('--ea', A_.tone.edge); r.setProperty('--eb', B_.tone.edge);
    r.setProperty('--ia', A_.tone.ink); r.setProperty('--ib', B_.tone.ink);
    const over = s.status === 'completed' || s.status === 'abandoned';
    const sets = [s.setsWon[Ls], s.setsWon[Rs]], pts = [s.points[Ls], s.points[Rs]];
    const servingIdx = s.serving ? O.sides.indexOf(s.serving) : -1;
    const done = (s.sets || []).filter((x) => x.status === 'completed' && (over || x.set !== s.set || s.status === 'set_break'));
    if (O.layout === 'bar') {
      barLogo($('#ia'), A_); barLogo($('#ib'), B_);
      paintBarNames();
      [['#sa', 0], ['#sb', 1]].forEach(([id, i]) => {
        const k = 'set' + O.sides[i];

        O.prev[k] = sets[i];
      });
      [['#pa', 0], ['#pb', 1]].forEach(([id, i]) => {
        const k = 'pt' + O.sides[i] + ':' + s.set;

        O.prev[k] = pts[i];
      });
      ['#svA', '#svB'].forEach((id, i) => {
        const el = $(id);

        const on = servingIdx === i && !over;

      swapText($('#setname'), label, anim);
      const hist = O.style.setHistory ? done.map((x) => `<span class="num">${x.winner === Ls ? `<b>${x[Ls]}</b>` : x[Ls]}<i>–</i>${x.winner === Rs ? `<b>${x[Rs]}</b>` : x[Rs]}</span>`).join('') : '';
      if ($('#hist').innerHTML !== hist) $('#hist').innerHTML = hist;
    }
    paintCorner(A_, B_, sets, pts, servingIdx, over, done, anim);
    paintPill();
  }
  function paintCorner(A_, B_, sets, pts, servingIdx, over, done, anim) {
    if (O.layout !== 'compact') return;
    const room = Math.max(6, 12 - done.length * 2);
    const short = namesMode() === 'short' || (namesMode() !== 'full' && (A_.name.length > room || B_.name.length > room));
    [A_, B_].forEach((t, i) => {
      const row = $('#cr' + i);
      row.setAttribute('style', teamVars(t));
      const cl = row.querySelector('.cl');
      const url = t.logo && !O.broken[t.logo] ? t.logo : '', dark = url && darkPlate(url);
      const k = url + '|' + dark + '|' + t.short + '|' + t.tone.c;
      if (cl.dataset.k !== k) { cl.dataset.k = k; cl.className = 'cl' + (url ? (dark ? ' dk' : '') : ' mono'); cl.innerHTML = url ? `<img src="${esc(url)}" alt="">` : `<b>${esc(t.short)}</b>`; if (url && O.tone[url] === undefined) preload(url).then(() => { cl.dataset.k = ''; paint(); }); }
      const cn = row.querySelector('.cn'), want = short ? t.short : t.name;
      if (cn.dataset.full !== want) { cn.dataset.full = want; cn.dataset.fit = '32'; cn.dataset.min = '22'; cn.dataset.alt = t.short; cn.textContent = want; fitOne(cn); }
      const sv = row.querySelector('.csv');

      const ch = done.map((x) => `<i class="num ${x.winner === t.side ? 'w' : ''}">${x[t.side]}</i>`).join('');
      if (row.querySelector('.ch').innerHTML !== ch) row.querySelector('.ch').innerHTML = ch;
      roll(row.querySelector('.cs .roll'), sets[i], anim);
      roll(row.querySelector('.cp .roll'), pts[i], anim);
    });
    const s = O.summary;
    $('#cset').textContent = over ? 'Final' : 'Set ' + Math.max(1, s.set) + (s.deciding ? ' · Decider' : '');
  }

  /* ---------- the status pill, point tags ---------- */
  function flash(text, who, kind, ms) { O.flash = { text, who: who || '', k: kind || '', until: Date.now() + ms }; }
  const shownName = (t) => (namesMode() === 'short' || (namesMode() !== 'full' && t.name.length > 16) ? t.short : t.name);
  const TAG = { ATTACK_KILL: 'Kill', BLOCK: 'Block', ACE: 'Ace', RECEPTION_ERROR: 'Ace' };
  function onLiveEntry(e) {
    // play moved on: whatever was said about the last moment gives way
    if (live(e) && (e.type === 'RALLY' || e.type === 'SET_START')) O.flash = null;
    const eff = e.effects || [];
    const has = (t) => eff.filter((x) => x.type === t)[0];
    const T = (side) => shownName(teamOf(side));
    if (has('MATCH_WON')) O.flash = null;
    else if (has('SET_WON')) flash('Set ' + has('SET_WON').set, T(has('SET_WON').team), 'win', 9000);
    else if (has('CHANGE_COURTS')) flash('Change of courts', '', 'tt', 9000);
    else if (has('TECHNICAL_TIMEOUT')) flash('Technical time-out', '', 'tt', 4000);
    else if (e.type === 'SET_START' && live(e)) { const ss = has('SET_START'); flash('Set ' + (ss ? ss.set : O.summary.set), ss && ss.firstServe ? T(ss.firstServe) + ' to serve' : '', 'tt', 6000); }
    else if (e.type === 'SUBSTITUTION' && live(e)) {
      const p = (e.pairs || [])[0] || {};
      const pin = player(e.team, p.in), pout = player(e.team, p.out);
      flash('Substitution · ' + T(e.team), `▲ #${pin ? pin.number : '?'} ${surname(pin && pin.name)}  ▼ #${pout ? pout.number : '?'} ${surname(pout && pout.name)}`, 'tt', 7000);
    } else if (e.type === 'SANCTION' && live(e)) {
      const p = e.playerId ? player(e.team, e.playerId) : null;
      const lbl = { WARNING: 'Yellow card', PENALTY: 'Red card', EXPULSION: 'Expulsion', DISQUALIFICATION: 'Disqualification', DELAY_WARNING: 'Delay warning', DELAY_PENALTY: 'Delay penalty' }[e.kind] || 'Sanction';
      flash(lbl, p ? `#${p.number} ${surname(p.name)} · ${T(e.team)}` : T(e.team), e.kind === 'WARNING' || e.kind === 'DELAY_WARNING' ? 'card' : 'red', 7000);
    } else if (e.type === 'REPLAY' && live(e)) flash('Replay the rally', '', 'tt', 4000);
    if (e.type === 'RALLY' && live(e)) pointTag(e);
  }
  // who won the point, and how — only a named player's kill, block or ace
  let tagTimer = null;
  function pointTag(e) {
    if (!O.style.pointTags || O.layout !== 'bar' || C.state !== 'OVERLAY_VISIBLE') return;
    const lbl = TAG[e.outcome];
    const ps = e.players || {};
    const id = e.outcome === 'ATTACK_KILL' ? ps.attacker : e.outcome === 'BLOCK' ? (ps.blockers || [])[0] : (e.rallyServer && e.rallyServer.team === e.team ? e.rallyServer.playerId : null);
    const p = lbl && id ? player(e.team, id) : null;
    if (!p) return;
    const i = O.sides.indexOf(e.team);
    const el = $(i === 0 ? '#tagL' : '#tagR'), oth = $(i === 0 ? '#tagR' : '#tagL');
    hideTags(false, oth);
    el.innerHTML = `<b>${esc(lbl)}</b>#${esc(p.number)} ${esc(abbrName(p.name))}`;
    el.classList.add('show');
    el.animate([{ opacity: 0, transform: 'translateY(18px)', clipPath: 'inset(100% 0 0 0)' }, { opacity: 1, transform: 'none', clipPath: 'inset(0% 0 0 0)' }], { duration: 520, easing: EASE.out });
    clearTimeout(tagTimer);
    tagTimer = setTimeout(() => hideTags(false), 4200);
  }
  function hideTags(now, only) {
    (only ? [only] : [$('#tagL'), $('#tagR')]).forEach((el) => {
      if (!el.classList.contains('show')) return;
      if (now) { el.classList.remove('show'); return; }
      const a = el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(10px)' }], { duration: 260, easing: EASE.in, fill: 'forwards' });
      a.onfinish = () => { el.classList.remove('show'); a.cancel(); };
    });
  }
  function pillState() {
    const s = O.summary;
    if (!s) return null;
    if (s.status === 'completed' && s.winner) {
      const w = s.winner;
      return { t: shownName(teamOf(w)) + (s.forfeit ? ' win by forfeit' : ' win'), who: `${s.setsWon[w]}–${s.setsWon[other(w)]}`, k: 'win' };
    }
    if (s.status === 'abandoned') return { t: 'Match abandoned', k: 'red' };
    if (O.flash && O.flash.until > Date.now()) return { t: O.flash.text, who: O.flash.who, k: O.flash.k };
    O.flash = null;
    const to = s.status === 'in_set' ? GX.runningTimeout(O.timeline, O.match && O.match.rules, serverNow()) : null;
    if (to) { const left = Math.max(0, Math.ceil((to.endsAt - serverNow()) / 1000)); return { t: to.technical ? 'Technical time-out' : 'Time-out · ' + shownName(teamOf(to.team)), who: Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'), k: 'tt' }; }
    if (s.matchPoint) return { t: 'Match point', who: shownName(teamOf(s.matchPoint)), k: 'mp' };
    if (s.setPoint) return { t: 'Set point', who: shownName(teamOf(s.setPoint)), k: 'sp' };
    if (s.status === 'set_break' && s.sets.length) {
      const last = s.sets[s.sets.length - 1];
      return { t: 'Set ' + last.set + ' · ' + shownName(teamOf(last.winner)), who: last[last.winner] + '–' + last[other(last.winner)], k: 'win' };
    }
    return null;
  }
  let lastPill = null;
  function paintPill(force) {
    const st = pillState(), pill = $('#pill'), cst = $('#cstat');
    const html = st ? esc(st.t) + (st.who ? `<b>${esc(st.who)}</b>` : '') : null;
    if (cst) cst.textContent = st ? st.t + (st.who ? ' ' + st.who : '') : '';
    if (html === lastPill && !force) return;
    const visible = C.state === 'OVERLAY_VISIBLE';
    const was = pill.classList.contains('show');
    if (st) {
      const sameKind = lastPill && lastPill.split('<b>')[0] === html.split('<b>')[0];
      pill.className = 'show ' + (st.k || '');
      if (!visible || !was) {
        pill.innerHTML = html;
        if (visible && html !== lastPill) pill.animate([{ opacity: 0, transform: 'translateY(-18px)', letterSpacing: '14px' }, { opacity: 1, transform: 'none', letterSpacing: '3px' }], { duration: 700, easing: EASE.out });
      } else if (sameKind) pill.innerHTML = html;                       // a running count-down changes in place
      else if (html !== lastPill) swapHtml(pill, html);
    } else if (was) {
      if (visible) { const a = pill.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-12px)' }], { duration: 260, easing: EASE.in, fill: 'forwards' }); a.onfinish = () => { if (!pillState()) pill.className = ''; a.cancel(); }; }
      else pill.className = '';
    }
    lastPill = html;
  }
  function swapHtml(el, html) {
    const a = el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(6px)' }], { duration: 160, fill: 'forwards' });
    a.onfinish = () => { el.innerHTML = html; a.cancel(); el.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: EASE.out }); };
  }
  function tick() {
    if (!O.summary) return;
    paintPill();
    const sc = C.scene;
    if (sc && sc.def.tick && sc.alive) sc.def.tick(sc);
    // a timed graphic whose time is up goes even if the server's word is late
    if (O.air && O.air.scene && O.air.expiresAt != null && serverNow() >= O.air.expiresAt && C.state === 'GRAPHIC_VISIBLE') request();
  }

  /* ---------- the studio's preview: what its page asks, never what is on air ---------- */
  let pseq = 0;
  function postPreview(extra) {
    if (!O.preview || window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ type: 'vb-preview-state', state: C.state, scene: C.scene ? C.scene.g.scene : null, failed: O.air && O.air.id && O.failed[O.air.id] ? O.failed[O.air.id] : null, ready: !!O.summary }, extra || {}), location.origin); } catch (e) { /* not framed */ }
  }
  if (O.preview) {
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'vb-preview') return;
      const d = e.data, now = serverNow();
      if (d.style) applyStyle(d.style);
      if (d.cmd === 'show') {
        const id = 'p' + (++pseq);
        const enter = GX.SCENES[d.scene] ? GX.SCENES[d.scene].enterMs : 1500;
        O.air = { seq: pseq, id, scene: d.scene, data: GX.cleanData(d.scene, d.data), startedAt: now, readyAt: now + Math.round((GX.BAR_OUT_MS + enter) * speed()), durationSec: null, expiresAt: null, swapAt: null, speed: speed(), clean: false };
        request();
      } else if (d.cmd === 'next' && O.air && O.air.scene === 'lineup' && O.air.swapAt == null) { O.air = Object.assign({}, O.air, { swapAt: Math.max(now, O.air.readyAt) }); request(); }
      else if (d.cmd === 'live') { O.air = GX.idle(); request(); }
      else if (d.cmd === 'clean') { O.air = Object.assign(GX.idle(), { clean: true }); request(); }
      else if (d.cmd === 'restyle' && C.scene && C.state === 'GRAPHIC_VISIBLE') { const sc = C.scene; const b = buildScene(sc.g); if (b && !b.error) { sc.el.innerHTML = b.html; sc.key = b.key; fitAll(sc.el); if (sc.def.visible) sc.def.visible(sc, true); } }
      else if (d.cmd === 'ping') postPreview();
    });
  }

  /* ---------- fit 1920 × 1080 into whatever size the source is ---------- */
  function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $('#fit').style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
  addEventListener('resize', fit); fit();
  applyStyle(null);
  // test hook: the browser checks read what is on air and how it got there
  window.__vbOverlay = {
    O, C,
    get state() { return C.state; },
    get onAir() { return C.scene ? C.scene.g : null; },
    get counts() { return C.counts; }
  };
  start();
})();
</script></body></html>
