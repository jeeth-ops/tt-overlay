<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Overlay — Broadcast Bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/socket.io/socket.io.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ============================================================
       DESIGN TOKENS — every visible property of the score bar lives
       here as a CSS variable. Colours/team text are overwritten live
       from socket data (state.theme / teamA / teamB — same fields the
       panel's Theme + Team Setup cards already edit); everything else
       (sizes, weights, radii, spacing, shadow, icon) is a plain value
       you can tune right here in one place without touching any
       layout rule below.
       ============================================================ */
    --teamA-color:#0c0d11;      /* CSK-style dark panel */
    --teamA-color-2:#26282f;
    --teamB-color:#0b1a4a;      /* MI-style blue panel */
    --teamB-color-2:#1948c9;
    --panel-bg:#0d0f14;         /* score / bowler / ball-ticker panel */
    --panel-bg-2:#1b1e26;
    --bat-color:var(--teamA-color-2);   /* set live: current batting team's colour, bleeds through score+batsmen */
    --bowl-color:var(--teamB-color-2);  /* set live: current bowling team's colour, bleeds through bowler segment */
    --logo-size:44px;
    --batsmen-bg:#0d0f14;       /* batsmen panel fades dark -> gold */
    --batsmen-bg-2:#8a6100;
    --gold:#f2ba12;             /* score pill / target wedge */
    --gold-2:#c98a00;
    --badge-bg:#111318;         /* "P" powerplay tag */
    --badge-text:#f2ba12;
    --white:#f5f7fb;
    --dim:#aab0c0;
    --red:#e6394f;
    --green:#3ddc84;
    --divider:#3a3d46;
    --progress-color:#f2ba12;   /* boundary-ball ticker colour */

    /* Structural tokens */
    --bar-height:112px;
    --bar-radius:26px;
    --team-tag-width:160px;
    --skew:22px;                 /* diagonal-cut steepness between segments */
    --bar-shadow:0 6px 22px rgba(0,0,0,.45);
    --border-width:2px;

    /* Typography */
    --font-family:'Barlow Condensed','Oswald',Arial,sans-serif;
    --team-name-size:46px;
    --team-name-weight:800;
    --rr-size:16px;
    --score-size:48px;
    --score-weight:800;
    --overs-size:32px;
    --overs-weight:700;
    --pp-badge-size:30px;
    --batter-name-size:25px;
    --batter-score-size:25px;
    --batter-weight:600;
    --target-label-size:15px;
    --target-value-size:42px;
    --bowler-name-size:27px;
    --bowler-figs-size:25px;
    --pip-size:27px;
    --pip-font-size:13px;
    --pip-gap:6px;
    --ticker-max-width:300px;

    /* Icons */
    --strike-icon-color: var(--gold);
    --bowler-icon-color:#c7cbd6;
    --bowler-icon-border: rgba(255,255,255,.4);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden; }
  body{
    font-family:var(--font-family);
    color:var(--white);
    width:100vw; height:100vh;
  }
  .hidden{ display:none !important; }

  /* ============================================================
     MAIN BOTTOM SCORE BAR — redesigned to match the CSK-vs-MI
     broadcast reference: rounded pill bar, angular interlocking
     segments [CSK][SCORE][BATSMEN][TARGET wedge][BOWLER][BALLS][MI].
     Every text-bearing element below is filled live from socket
     data in renderScorebar(); nothing shown is baked into the HTML.
     ============================================================ */
  #scorebar-viewport{
    position:fixed; left:0; right:0; bottom:0;
    height:var(--bar-height);
    overflow:hidden;
    pointer-events:none;
  }
  #scorebar{
    position:absolute; left:0; bottom:0;
    width:max-content;
    height:var(--bar-height); display:flex; align-items:stretch;
    box-shadow:var(--bar-shadow);
    border-radius:var(--bar-radius); overflow:hidden;
    transform-origin:left bottom;
    transform:scale(var(--fit-scale, 1));
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:auto;
  }
  #scorebar.off{ opacity:0; transform:scale(var(--fit-scale, 1)) translateY(30px); pointer-events:none; }

  .seg{ display:flex; align-items:center; position:relative; height:100%; }

  /* ============================================================
     BALL-EVENT OVERLAY — sits INSIDE #scorebar as its last child,
     so #scorebar's own overflow:hidden + border-radius automatically
     clips it to the exact pill/skewed shape of the live bar. It
     covers the bar completely while it animates, then fades itself
     away to reveal the live-updating bar underneath — nothing is
     ever shown floating elsewhere on screen.
     ============================================================ */
  #event-overlay{
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    background:radial-gradient(120% 140% at 50% 50%, rgba(20,22,30,.96), rgba(6,7,10,.98));
    opacity:0; pointer-events:none; overflow:hidden;
  }
  #event-overlay.show{ opacity:1; pointer-events:auto; }
  #event-overlay .ev-flash{
    position:absolute; inset:0; opacity:0; mix-blend-mode:screen;
  }
  #event-overlay .ev-inner{
    position:relative; text-align:center; z-index:2;
    max-width:90%; padding:0 12px;
  }
  #event-overlay .kind{
    font-size:38px; font-weight:800; letter-spacing:2px; line-height:1;
    color:var(--progress-color); font-style:italic; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
    -webkit-text-stroke:.5px rgba(0,0,0,.25);
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.55), 0 0 26px rgba(242,186,18,.35);
  }
  #event-overlay .text{
    font-size:14px; font-weight:600; margin-top:5px; color:var(--white);
    letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  #event-overlay .sub{ font-size:11px; color:var(--dim); margin-top:1px; letter-spacing:.3px; }
  #event-overlay .ev-badge{
    display:inline-block; margin-top:9px; padding:4px 15px; border-radius:20px;
    font-size:12px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.28); color:var(--white);
    opacity:0; transform:translateY(6px) scale(.9);
  }
  #event-overlay.show .ev-badge.on{ animation:evBadgeIn .4s cubic-bezier(.16,1,.3,1) .3s both; }
  #event-overlay.kind-wicket .ev-badge{ border-color:rgba(230,57,79,.55); color:var(--red); }
  #event-overlay.kind-noball .ev-badge{ border-color:rgba(230,57,79,.4); }
  @keyframes evBadgeIn{ 0%{ opacity:0; transform:translateY(6px) scale(.9); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
  #event-overlay .ev-sweep{
    position:absolute; top:0; bottom:0; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform:translateX(-160%) skewX(-18deg); opacity:0; z-index:1;
  }
  #event-overlay .ev-crack{ position:absolute; inset:0; opacity:0; z-index:1; }
  .ev-particle{
    position:absolute; left:50%; top:50%; width:7px; height:7px; border-radius:2px;
    background:var(--gold); opacity:0; z-index:1;
    transform:translate(-50%,-50%);
  }

  /* ---- FOUR: quick lateral dash + sweeping light streak ---- */
  #event-overlay.kind-four.show .ev-inner{ animation:evFourIn .55s cubic-bezier(.16,1,.3,1) both; }
  #event-overlay.kind-four.show .ev-sweep{ animation:evSweep .9s cubic-bezier(.4,0,.2,1) .12s both; }
  @keyframes evFourIn{
    0%{ transform:translateX(-70px) scale(.75); opacity:0; filter:blur(8px); }
    55%{ transform:translateX(8px) scale(1.08); opacity:1; filter:blur(0); }
    75%{ transform:translateX(-3px) scale(.99); }
    100%{ transform:translateX(0) scale(1); }
  }
  @keyframes evSweep{
    0%{ transform:translateX(-160%) skewX(-18deg); opacity:0; }
    15%{ opacity:.9; }
    60%{ opacity:.5; }
    100%{ transform:translateX(220%) skewX(-18deg); opacity:0; }
  }

  /* ---- SIX: big spring pop + radiating gold particles ---- */
  #event-overlay.kind-six.show .ev-inner{ animation:evSixPop .7s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes evSixPop{
    0%{ transform:scale(.25) rotate(-10deg); opacity:0; filter:blur(12px); }
    45%{ transform:scale(1.28) rotate(5deg); opacity:1; filter:blur(0); }
    68%{ transform:scale(.94) rotate(-2deg); }
    85%{ transform:scale(1.04) rotate(1deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .ev-particle.fly{ animation:evBurst .85s cubic-bezier(.16,1,.3,1) both; }
  @keyframes evBurst{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(.4) rotate(0deg); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--px), var(--py)) scale(1.1) rotate(var(--pr)); opacity:0; }
  }

  /* ---- WICKET: hard drop + red flash + crack lines + shake ---- */
  #event-overlay.kind-wicket.show .ev-inner{ animation:evWicketDrop .6s cubic-bezier(.36,.07,.19,.97) both; }
  #event-overlay.kind-wicket .kind{ color:var(--red); }
  #event-overlay.kind-wicket.show .ev-flash{ background:var(--red); animation:evFlash .5s ease-out both; }
  #event-overlay.kind-wicket.show .ev-crack{ animation:evCrackIn .5s ease-out .05s both; }
  #event-overlay.kind-wicket.show.shake{ animation:evShake .45s ease-in-out .08s both; }
  @keyframes evWicketDrop{
    0%{ transform:translateY(-50px) scale(.8); opacity:0; }
    55%{ transform:translateY(6px) scale(1.06); opacity:1; }
    75%{ transform:translateY(-4px) scale(.97); }
    100%{ transform:translateY(0) scale(1); }
  }
  @keyframes evFlash{ 0%{ opacity:.55; } 100%{ opacity:0; } }
  @keyframes evCrackIn{ 0%{ opacity:0; transform:scale(.9); } 30%{ opacity:.9; } 100%{ opacity:0; transform:scale(1.02); } }
  @keyframes evShake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); }
  }

  /* ---- WIDE / NO BALL: slide-down with drawn dashed underline ---- */
  #event-overlay.kind-wide.show .ev-inner,
  #event-overlay.kind-noball.show .ev-inner{ animation:evTopIn .5s cubic-bezier(.16,1,.3,1) both; }
  #event-overlay.kind-wide .kind, #event-overlay.kind-noball .kind{ font-size:30px; color:var(--white); }
  #event-overlay.kind-noball .kind{ color:var(--red); }
  #event-overlay .ev-underline{
    height:3px; width:0; margin:6px auto 0; border-radius:2px;
    background:linear-gradient(90deg, var(--gold), var(--gold-2));
  }
  #event-overlay.kind-wide.show .ev-underline,
  #event-overlay.kind-noball.show .ev-underline{ animation:evLine .5s cubic-bezier(.4,0,.2,1) .18s both; }
  @keyframes evTopIn{
    0%{ transform:translateY(-26px); opacity:0; filter:blur(6px); }
    100%{ transform:translateY(0); opacity:1; filter:blur(0); }
  }
  @keyframes evLine{ 0%{ width:0; opacity:.4; } 100%{ width:120px; opacity:1; } }

  /* ---- Exit: same for every kind — soft collapse back into the bar ---- */
  #event-overlay.hide .ev-inner{ animation:evOut .4s cubic-bezier(.4,0,1,1) both; }
  #event-overlay.hide{ transition:opacity .4s ease .05s; opacity:0; }
  @keyframes evOut{
    0%{ transform:scale(1); opacity:1; filter:blur(0); }
    100%{ transform:scale(.85) translateY(-6px); opacity:0; filter:blur(4px); }
  }

  /* Team tag blocks — flush on the outer edge (rounded by the bar's own
     overflow:hidden clip), skewed on the inner edge */
  .team-tag{
    min-width:var(--team-tag-width); width:auto; flex:0 0 auto; justify-content:center;
    padding:0 26px; gap:10px;
  }
  #team-tag-a{
    background:linear-gradient(155deg,var(--teamA-color-2),var(--teamA-color) 60%);
    clip-path:polygon(0 0,100% 0,calc(100% - var(--skew)) 100%,0 100%);
  }
  #team-tag-b{
    background:linear-gradient(205deg,var(--teamB-color-2),var(--teamB-color) 65%);
    clip-path:polygon(var(--skew) 0,100% 0,100% 100%,0 100%);
  }
  .team-tag .logo{
    width:var(--logo-size); height:var(--logo-size); flex:none; object-fit:contain;
    border-radius:50%; background:rgba(255,255,255,.08); box-shadow:0 0 0 2px rgba(255,255,255,.25);
  }
  .team-tag .short{
    font-size:clamp(24px, var(--team-name-size), var(--team-name-size)); font-weight:var(--team-name-weight);
    letter-spacing:.5px; text-transform:uppercase; line-height:1; color:var(--white);
    white-space:nowrap; max-width:340px; overflow:visible;
  }
  /* When a team name is long, JS adds .long to shrink it so the full name still fits on one line */
  .team-tag .short.long{ font-size:calc(var(--team-name-size) * .55); letter-spacing:.2px; }
  .team-tag .short.longer{ font-size:calc(var(--team-name-size) * .4); letter-spacing:0; }

  /* SCORE segment — score pill + powerplay tag + overs on top row,
     CRR/RRR line underneath. One continuous dark panel. */
  #score-block{
    flex:none;
    background:
      linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.15) 55%),
      linear-gradient(90deg,var(--bat-color) 0%,var(--panel-bg-2) 40%,var(--panel-bg) 85%);
    margin-left:calc(var(--skew) * -1);
    clip-path:polygon(var(--skew) 0,100% 0,calc(100% - var(--skew)) 100%,0 100%);
    flex-direction:column; align-items:flex-start; justify-content:center; gap:10px;
    min-width:320px; padding:0 28px 0 40px;
  }
  .score-top{ display:flex; align-items:center; gap:10px; }
  .score-pill{
    background:linear-gradient(180deg,var(--gold),var(--gold-2));
    border-radius:8px; padding:2px 14px; line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .score-pill #disp-runs{ font-size:var(--score-size); font-weight:var(--score-weight); color:#181300; white-space:nowrap; font-style:italic; }
  .pp-badge{
    min-width:var(--pp-badge-size); height:var(--pp-badge-size); padding:0 6px; border-radius:6px; background:var(--badge-bg);
    color:var(--badge-text); font-size:16px; font-weight:800; display:flex; align-items:center;
    justify-content:center; flex:none; margin-left:-4px; box-shadow:0 0 0 2px var(--gold);
  }
  .overs{ font-size:var(--overs-size); font-weight:var(--overs-weight); color:var(--white); white-space:nowrap; font-style:italic; }
  .overs small{ color:var(--dim); font-weight:500; font-size:.55em; font-style:normal; margin-left:8px; }
  .score-bottom{ display:flex; align-items:center; gap:8px; font-size:var(--rr-size); color:var(--white); font-weight:500; white-space:nowrap; }
  .score-bottom .sep{ color:var(--divider); }
  .score-bottom b{ font-weight:700; }

  /* BATSMEN segment — two perfectly aligned rows, panel fades toward gold */
  #batsmen-block{
    flex:none;
    background:linear-gradient(90deg,var(--bat-color) 0%,var(--batsmen-bg) 30%,var(--batsmen-bg) 60%,var(--batsmen-bg-2));
    margin-left:calc(var(--skew) * -1);
    clip-path:polygon(var(--skew) 0,100% 0,calc(100% - var(--skew)) 100%,0 100%);
    min-width:340px; padding:0 34px 0 30px;
  }
  .batters{ display:flex; flex-direction:column; justify-content:center; gap:10px; width:100%; }
  .batters .brow{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:14px; white-space:nowrap; font-size:var(--batter-name-size); font-weight:var(--batter-weight); }
  .batters .bname-wrap{ display:flex; align-items:center; gap:8px; }
  .batters .strike-icon{ width:16px; height:16px; flex:none; opacity:0; color:var(--strike-icon-color); }
  .batters .brow.on .strike-icon{ opacity:1; }
  .batters .brow.on .bname{ color:var(--white); }
  .batters .brow:not(.on) .bname{ color:var(--dim); font-weight:500; }
  .batters .bscore{ color:var(--white); font-weight:600; font-size:var(--batter-score-size); text-align:right; }
  .batters .brow:not(.on) .bscore{ color:var(--dim); }

  /* TARGET segment — angular gold wedge, label row 1, value row 2 */
  #target-block{
    flex:none; min-width:170px; background:linear-gradient(180deg,var(--gold),var(--gold-2));
    margin-left:calc(var(--skew) * -1);
    clip-path:polygon(calc(var(--skew) + 8px) 0,100% 0,calc(100% - var(--skew) - 8px) 100%,0 100%);
    flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:0 34px; overflow:hidden;
  }
  #target-block .t-label{ font-size:var(--target-label-size); font-weight:700; letter-spacing:1px; font-style:italic; color:#1a1200; opacity:.82; white-space:nowrap; }
  #target-block .t-value{ font-size:var(--target-value-size); font-weight:800; font-style:italic; color:#151000; white-space:nowrap; line-height:1; }

  /* BOWLER segment — name+icon at top, figures line below it, and the
     ball-by-ball pips for this over directly underneath that — all inside
     one card, matching the reference (name -> figures -> balls, stacked). */
  #bowler-block{
    flex:1 1 auto;
    background:
      linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.15) 55%),
      linear-gradient(90deg,var(--panel-bg) 0%,var(--panel-bg-2) 35%,var(--bowl-color) 100%);
    margin-left:calc(var(--skew) * -1);
    clip-path:polygon(calc(var(--skew) + 8px) 0,100% 0,100% 100%,0 100%);
    min-width:360px; padding:6px 26px 6px 30px;
    flex-direction:column; align-items:flex-end; justify-content:center; gap:5px;
  }
  .bowler-name{ display:flex; align-items:center; gap:9px; font-size:calc(var(--bowler-name-size) + 3px); font-weight:700; color:var(--white); white-space:nowrap; }
  .bowler-name .ball-ico{
    width:18px; height:18px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 35% 30%,#c94b3d,#7a1f14 75%);
    border:1px solid rgba(255,255,255,.5); position:relative;
  }
  .bowler-name .ball-ico::after{
    content:''; position:absolute; left:50%; top:8%; bottom:8%; width:0;
    border-left:1px dashed rgba(255,255,255,.6); transform:translateX(-50%) rotate(8deg);
  }
  /* Compact figures line under the name — "W-R (Ov)" then a muted econ tag,
     all on one row, matching the reference layout (not boxed columns). */
  .bowler-figs-line{ display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .bowler-figs-line .bf-wr{ font-size:var(--bowler-figs-size); font-weight:800; color:var(--white); }
  .bowler-figs-line .bf-ov{ font-size:calc(var(--bowler-figs-size) - 6px); font-weight:500; color:var(--dim); }
  .bowler-figs-line .bf-econ{ font-size:calc(var(--bowler-figs-size) - 8px); font-weight:600; color:var(--dim); padding-left:10px; border-left:1px solid rgba(255,255,255,.18); }
  .bowler-figs-line .bf-econ b{ color:var(--white); font-weight:700; }

  /* Ball-by-ball ticker — now sits inside the bowler card, directly under
     the figures line. Pips pack tightly (not stretched edge-to-edge) and
     stay right-aligned to match the figures line above them; a normal
     6-ball over always renders at the base pip size, and only overs that
     run past 6 balls (wides/no-balls) shrink — just enough to keep every
     pip inside --ticker-max-width so nothing gets clipped. */
  .ticker{
    display:flex; align-items:center; justify-content:flex-end;
    gap:var(--pip-gap-live, var(--pip-gap)); max-width:var(--ticker-max-width);
  }
  .pip{
    width:var(--pip-size-live, var(--pip-size)); height:var(--pip-size-live, var(--pip-size)); border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:var(--pip-font-size-live, var(--pip-font-size)); font-weight:800; flex:none; background:#eef0f4; color:#111318;
    border:1.5px solid rgba(255,255,255,.85); transition:width .2s ease, height .2s ease, font-size .2s ease, gap .2s ease;
  }
  .pip.empty{ background:rgba(255,255,255,.94); border:2px solid rgba(255,255,255,.85); }
  .pip.boundary{ background:var(--gold); color:#1a1200; border-color:rgba(255,255,255,.85); }
  .pip.wicket{ background:#12141a; color:var(--white); border-color:rgba(255,255,255,.85); }
  .pip.extra{ background:#f4f5f8; color:#111318; font-size:calc(var(--pip-font-size-live, var(--pip-font-size)) - 3px); }
  .pip.dot{ background:#f4f5f8; color:#111318; }


  /* ============================================================
     SECONDARY FEATURE CARDS — one-for-one with the panel's other
     broadcast graphics: milestones ticker, player/bowler/team stat,
     innings/match summary, points table, player/team history.
     Kept visually consistent with the score bar (same gold/dark
     palette) but positioned away from it so nothing overlaps.
     ============================================================ */
  .glass-card{
    position:fixed; background:linear-gradient(180deg,rgba(10,12,20,.94),rgba(10,12,20,.88));
    border:1px solid rgba(255,255,255,.09); border-radius:10px; padding:14px 18px;
    box-shadow:0 10px 26px rgba(0,0,0,.5); backdrop-filter:blur(6px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .glass-card.off{ opacity:0; transform:translateY(-14px); pointer-events:none; }
  .glass-card h3{ margin:0 0 8px; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--progress-color); font-weight:700; }
  .glass-card .sub{ font-size:11px; color:var(--dim); margin-top:2px; }

  /* Player / Bowler / Team stat cards — left slide-in */
  .stat-card{ top:24px; left:24px; width:230px; }
  .stat-card .name{ font-size:20px; font-weight:700; }
  .stat-card .team{ font-size:12px; color:var(--dim); margin-bottom:6px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:8px; }
  .stat-grid .k{ font-size:10px; text-transform:uppercase; color:var(--dim); letter-spacing:.4px; }
  .stat-grid .v{ font-size:16px; font-weight:700; }

  /* Points table */
  #points-card{ top:24px; right:24px; width:300px; }
  #points-card table{ width:100%; border-collapse:collapse; font-size:12px; }
  #points-card th{ text-align:left; color:var(--dim); font-weight:600; font-size:10px; text-transform:uppercase; padding:3px 4px; }
  #points-card td{ padding:4px 4px; border-top:1px solid rgba(255,255,255,.07); font-weight:600; }
  #points-card td:first-child{ text-align:left; }
  #points-card td, #points-card th{ text-align:center; }
  #points-card td:first-child, #points-card th:first-child{ text-align:left; }

  /* Innings / Match summary */
  #summary-card{ top:24px; left:50%; transform:translate(-50%,0); width:420px; }
  #summary-card.off{ transform:translate(-50%,-14px); }
  #summary-card .headline{ font-size:20px; font-weight:800; color:var(--progress-color); }
  #summary-card table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  #summary-card td, #summary-card th{ padding:3px 4px; border-top:1px solid rgba(255,255,255,.07); }
  #summary-card th{ color:var(--dim); font-size:10px; text-transform:uppercase; text-align:left; }

  /* History cards */
  #player-history-card{ bottom:110px; left:24px; width:260px; }
  #team-history-card{ bottom:110px; right:24px; width:260px; }
  .hist-row{ display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-top:1px solid rgba(255,255,255,.06); }
</style>
</head>
<body>

  <!-- MAIN SCORE BAR — 7 segments, left to right:
       [CSK team tag] [Score+overs+CRR/RRR] [Batsmen] [Target wedge]
       [Bowler] [Ball-by-ball ticker] [MI team tag]
       #scorebar-viewport is the fixed, viewport-width clipping box.
       #scorebar itself is sized purely by its own content (width:max-content)
       so its true natural width is never in doubt — the auto-fit script
       measures that and scales #scorebar down to match whenever it's wider
       than the viewport, instead of letting the last segment run off. -->
  <div id="scorebar-viewport">
  <div id="scorebar" class="off">
    <div class="seg team-tag" id="team-tag-a">
      <img class="logo hidden" id="tagA-logo" alt="">
      <div class="short" id="tagA-short">MI</div>
    </div>

    <div class="seg" id="score-block">
      <div class="score-top">
        <span class="score-pill"><span class="runs" id="disp-runs">0-0</span></span>
        <span class="pp-badge hidden" id="pp-badge">P</span>
        <span class="overs" id="disp-overs"><span id="overs-main">0.0</span><small id="disp-balls-left"></small></span>
      </div>
      <div class="score-bottom">
        <span>CRR: <b id="crr-val">0.00</b></span>
        <span class="sep">|</span>
        <span>RRR: <b id="rrr-val">0.00</b></span>
      </div>
    </div>

    <div class="seg" id="batsmen-block">
      <div class="batters">
        <div class="brow on" id="row-striker">
          <span class="bname-wrap">
            <svg class="strike-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="bname" id="striker-name">—</span>
          </span>
          <span class="bscore" id="striker-score">0(0)</span>
        </div>
        <div class="brow" id="row-nonstriker">
          <span class="bname-wrap">
            <svg class="strike-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="bname" id="nonstriker-name">—</span>
          </span>
          <span class="bscore" id="nonstriker-score">0(0)</span>
        </div>
      </div>
    </div>

    <div class="seg" id="target-block">
      <span class="t-label" id="target-label">TARGET</span>
      <span class="t-value" id="target-value">—</span>
    </div>

    <div class="seg" id="bowler-block">
      <span class="bowler-name"><span class="ball-ico"></span><span id="bowler-name">—</span></span>
      <div class="bowler-figs-line">
        <span class="bf-wr" id="bowler-wr">0-0</span>
        <span class="bf-ov" id="bowler-ov">(0.0)</span>
        <span class="bf-econ">ECON <b id="bowler-econ">0.00</b></span>
      </div>
      <div class="ticker" id="ticker"></div>
    </div>

    <div class="seg team-tag" id="team-tag-b">
      <div class="short" id="tagB-short">RCB</div>
      <img class="logo hidden" id="tagB-logo" alt="">
    </div>

    <!-- BALL-EVENT OVERLAY (four / six / wicket / wide / no-ball) —
         lives inside #scorebar so it's clipped to the bar's own
         rounded/skewed shape and never appears floating on screen.
         It fully covers the bar while it animates, then fades out
         to reveal the live score underneath. -->
    <div id="event-overlay">
      <div class="ev-flash"></div>
      <div class="ev-crack"></div>
      <div class="ev-sweep"></div>
      <div class="ev-inner">
        <div class="kind" id="event-kind">FOUR!</div>
        <div class="text" id="event-text"></div>
        <div class="sub" id="event-sub"></div>
        <div class="ev-underline"></div>
        <div class="ev-badge" id="event-badge"></div>
      </div>
    </div>
  </div>
  </div>

  <!-- PLAYER STAT CARD -->
  <div class="glass-card stat-card off" id="player-stat-card">
    <h3 id="ps-scope">Player Stats</h3>
    <div class="name" id="ps-name">—</div>
    <div class="team" id="ps-team">—</div>
    <div class="stat-grid" id="ps-grid"></div>
  </div>

  <!-- BOWLER STAT CARD -->
  <div class="glass-card stat-card off" id="bowler-stat-card" style="left:auto; right:24px; top:24px;">
    <h3 id="bs-scope">Bowler Stats</h3>
    <div class="name" id="bs-name">—</div>
    <div class="team" id="bs-team">—</div>
    <div class="stat-grid" id="bs-grid"></div>
  </div>

  <!-- TEAM STAT CARD -->
  <div class="glass-card stat-card off" id="team-stat-card" style="top:auto; bottom:110px; left:50%; transform:translate(-50%,0);">
    <h3>Team Stats</h3>
    <div class="name" id="ts-name">—</div>
    <div class="stat-grid" id="ts-grid"></div>
  </div>

  <!-- POINTS TABLE -->
  <div class="glass-card off" id="points-card">
    <h3 id="pt-title">Points Table</h3>
    <table>
      <thead><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th><th>NRR</th></tr></thead>
      <tbody id="pt-body"></tbody>
    </table>
    <div class="sub" id="pt-updated"></div>
  </div>

  <!-- INNINGS / MATCH SUMMARY -->
  <div class="glass-card off" id="summary-card">
    <h3 id="sum-kicker">Innings Summary</h3>
    <div class="headline" id="sum-headline">—</div>
    <table>
      <thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr></thead>
      <tbody id="sum-batting"></tbody>
    </table>
    <table>
      <thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr></thead>
      <tbody id="sum-bowling"></tbody>
    </table>
  </div>

  <!-- PLAYER / TEAM HISTORY -->
  <div class="glass-card off" id="player-history-card">
    <h3>Player History</h3>
    <div class="name" id="ph-name">—</div>
    <div id="ph-rows"></div>
  </div>
  <div class="glass-card off" id="team-history-card">
    <h3>Team History</h3>
    <div class="name" id="th-name">—</div>
    <div id="th-rows"></div>
  </div>

<script>
/* ============================================================
   CONNECTION — same room-based socket.io pattern as the other
   Scorvix overlays: ?room=<matchId>, joins the same room the
   cricket-panel.html controller is broadcasting into.
   ============================================================ */
const params = new URLSearchParams(location.search);
const room = params.get('room') || 'default';
const socket = io({ query: { room } });
socket.on('connect', () => socket.emit('joinRoom', room));

/* ============================================================
   HELPERS
   ============================================================ */
function fmtOvers(overs, balls){ return `${overs}.${balls}`; }
function esc(s){ return (s == null ? '' : String(s)); }

// Fills a team tag's logo (if provided) and full team name, shrinking the
// font in steps so long names still fit on one line instead of clipping.
function setTeamTag(prefix, team){
  const logo = document.getElementById(`${prefix}-logo`);
  const nameEl = document.getElementById(`${prefix}-short`);
  if(team && team.logo){
    logo.src = team.logo;
    logo.classList.remove('hidden');
  } else {
    logo.classList.add('hidden');
    logo.removeAttribute('src');
  }
  const name = (team && (team.name || team.short)) || '—';
  nameEl.textContent = name;
  nameEl.classList.remove('long', 'longer');
  if(name.length > 14) nameEl.classList.add('longer');
  else if(name.length > 7) nameEl.classList.add('long');
}

function isPowerplay(state){
  const format = state.format;
  const overs = state.score.overs;
  if(format === 'T10') return overs < 2;
  if(format === 'ODI') return overs < 10;
  if(format === 'T20') return overs < 6;
  // Custom format: first 20% of the innings, min 1 over.
  const total = state.oversPerInnings || 20;
  return overs < Math.max(1, Math.round(total * 0.2));
}

function pipClass(b){
  if(b === 'W') return 'pip wicket';
  if(b === '4' || b === '6') return 'pip boundary';
  if(b === '0') return 'pip dot';
  if(/wd|nb|b|lb/i.test(b)) return 'pip extra';
  return 'pip';
}

/* ============================================================
   MAIN SCORE BAR RENDER — driven entirely by the same `state`
   object cricket-panel.html broadcasts as 'liveCricketScore'.
   ============================================================ */
function renderScorebar(state){
  const bar = document.getElementById('scorebar');
  if(!state.visible){ bar.classList.add('off'); return; }
  bar.classList.remove('off');

  // Theme colours — same fields the panel's Theme + Team cards edit.
  document.documentElement.style.setProperty('--teamA-color', state.teamA.color || '#0c0d11');
  document.documentElement.style.setProperty('--teamB-color', state.teamB.color || '#0b1a4a');
  document.documentElement.style.setProperty('--gold', state.theme.badgeColor || '#f2ba12');
  document.documentElement.style.setProperty('--progress-color', state.theme.progressColor || '#f2ba12');
  document.documentElement.style.setProperty('--panel-bg', state.theme.bottomBarColor || '#0d0f14');

  // Full team name (falls back to short code), auto-shrunk so long names
  // never get clipped instead of always showing just the 2-3 letter code.
  setTeamTag('tagA', state.teamA);
  setTeamTag('tagB', state.teamB);

  // Batting / bowling team colour bleed — defaults to Team A batting until
  // the panel sends state.battingTeam ('A' | 'B').
  const battingIsB = state.battingTeam === 'B';
  const batColor = battingIsB ? (state.teamB.color || '#0b1a4a') : (state.teamA.color || '#0c0d11');
  const bowlColor = battingIsB ? (state.teamA.color || '#0c0d11') : (state.teamB.color || '#0b1a4a');
  document.documentElement.style.setProperty('--bat-color', batColor);
  document.documentElement.style.setProperty('--bowl-color', bowlColor);

  const crr = (() => {
    const balls = state.score.overs * 6 + state.score.balls;
    return balls > 0 ? ((state.score.runs / balls) * 6).toFixed(2) : '0.00';
  })();
  let rrr = '0.00';
  if(state.target){
    const ballsBowled = state.score.overs * 6 + state.score.balls;
    const totalBalls = (state.oversPerInnings || 20) * 6;
    const ballsLeft = Math.max(totalBalls - ballsBowled, 0);
    const runsNeeded = state.target - state.score.runs;
    rrr = ballsLeft > 0 ? Math.max(runsNeeded, 0) / (ballsLeft / 6) : 0;
    rrr = rrr.toFixed(2);
  }
  document.getElementById('crr-val').textContent = crr;
  document.getElementById('rrr-val').textContent = rrr;

  document.getElementById('disp-runs').textContent = `${state.score.runs}-${state.score.wickets}`;
  document.getElementById('overs-main').textContent = fmtOvers(state.score.overs, state.score.balls);
  document.getElementById('disp-balls-left').textContent = `(${state.oversPerInnings || 20})`;

  document.getElementById('pp-badge').classList.toggle('hidden', !isPowerplay(state));

  document.getElementById('striker-name').textContent = state.striker.name || 'Batter 1';
  document.getElementById('striker-score').textContent = `${state.striker.runs}(${state.striker.balls})`;
  document.getElementById('nonstriker-name').textContent = state.nonStriker.name || 'Batter 2';
  document.getElementById('nonstriker-score').textContent = `${state.nonStriker.runs}(${state.nonStriker.balls})`;

  // Second innings shows the chase TARGET; first innings shows the match's
  // live CURRENT RUN RATE in that same wedge instead of tournament/venue text.
  const targetBlock = document.getElementById('target-block');
  targetBlock.style.display = 'flex';
  if(state.target){
    document.getElementById('target-label').textContent = 'TARGET';
    document.getElementById('target-value').textContent = state.target;
  } else {
    document.getElementById('target-label').textContent = 'CURRENT RUN RATE';
    document.getElementById('target-value').textContent = crr;
  }

  document.getElementById('bowler-name').textContent = state.bowler.name || '—';
  document.getElementById('bowler-wr').textContent = `${state.bowler.wickets}-${state.bowler.runs}`;
  document.getElementById('bowler-ov').textContent = `(${fmtOvers(state.bowler.overs, state.bowler.balls)})`;
  const bBallsBowled = (state.bowler.overs || 0) * 6 + (state.bowler.balls || 0);
  document.getElementById('bowler-econ').textContent =
    bBallsBowled > 0 ? ((state.bowler.runs / bBallsBowled) * 6).toFixed(2) : '0.00';

  renderTicker(state.thisOver || []);
  fitScorebar();
}

// Ball-by-ball ticker — shows every ball bowled this over. A normal over is
// padded with empty slots up to 6 and renders at the base pip size (never
// shrunk, never stretched). If extras push the over past 6 balls, the pips
// shrink by exactly the amount needed to keep the whole row inside
// --ticker-max-width, based on their real rendered width — so nothing ever
// gets cut off, however many balls are bowled this over.
function renderTicker(thisOver){
  const ticker = document.getElementById('ticker');
  ticker.innerHTML = '';
  const minSlots = 6;
  const padded = thisOver.length >= minSlots
    ? thisOver
    : thisOver.concat(Array(minSlots - thisOver.length).fill(null));

  const rootStyle = getComputedStyle(document.documentElement);
  const basePip = parseFloat(rootStyle.getPropertyValue('--pip-size')) || 24;
  const baseFont = parseFloat(rootStyle.getPropertyValue('--pip-font-size')) || 12;
  const baseGap = parseFloat(rootStyle.getPropertyValue('--pip-gap')) || 6;
  const maxWidth = parseFloat(rootStyle.getPropertyValue('--ticker-max-width')) || 300;

  const count = padded.length;
  const naturalWidth = count * basePip + Math.max(count - 1, 0) * baseGap;
  // no hard floor on the shrink — an over with a lot of extras should keep
  // getting smaller rather than ever spilling past the card and getting cut
  const scale = count > minSlots ? Math.min(1, Math.max(maxWidth / naturalWidth, 0.28)) : 1;

  if(scale < 1){
    document.documentElement.style.setProperty('--pip-size-live', `${(basePip * scale).toFixed(1)}px`);
    document.documentElement.style.setProperty('--pip-font-size-live', `${(baseFont * scale).toFixed(1)}px`);
    document.documentElement.style.setProperty('--pip-gap-live', `${(baseGap * scale).toFixed(1)}px`);
  } else {
    document.documentElement.style.removeProperty('--pip-size-live');
    document.documentElement.style.removeProperty('--pip-font-size-live');
    document.documentElement.style.removeProperty('--pip-gap-live');
  }

  padded.forEach(b => {
    const pip = document.createElement('div');
    if(b == null){ pip.className = 'pip empty'; }
    else { pip.className = pipClass(b); pip.textContent = b; }
    ticker.appendChild(pip);
  });
}

socket.on('liveCricketScore', renderScorebar);

// ============================================================
// AUTO-FIT — the bar's segments (team names, batsmen, bowler figures)
// are all width:auto/nowrap so nothing ever silently truncates. #scorebar
// itself is sized purely by its own content (width:max-content, absolutely
// positioned — not stretched to 100vw), so its real natural width is
// unambiguous. Whenever that natural width is wider than the viewport
// (small OBS canvas, a long team/bowler name, extra balls in the ticker...)
// the whole bar is scaled down uniformly from the left edge instead of
// letting the right-most segment (team B's tag) spill off-screen.
// ============================================================
function fitScorebar(){
  const bar = document.getElementById('scorebar');
  const viewport = document.getElementById('scorebar-viewport');
  if(!bar || !viewport) return;
  // reading offsetWidth forces layout, so this always reflects the latest
  // DOM/text content — no waiting a frame needed, and transform never
  // affects offsetWidth (it's a paint-only property), so no reset required
  const natural = bar.offsetWidth;
  const available = viewport.clientWidth || window.innerWidth;
  const scale = natural > available ? Math.max(available / natural, 0.5) : 1;
  document.documentElement.style.setProperty('--fit-scale', scale.toFixed(4));
}
let fitResizeRAF = null;
function scheduleFit(){
  if(fitResizeRAF) cancelAnimationFrame(fitResizeRAF);
  fitResizeRAF = requestAnimationFrame(fitScorebar);
}
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', fitScorebar);
document.addEventListener('DOMContentLoaded', fitScorebar);

/* ============================================================
   BALL-EVENT OVERLAY — mirrors panel's fireEvent() payload:
   { kind, text, sub, durationMs }. kind is matched (case/space/
   punctuation-insensitive) to one of five creative animations —
   four / six / wicket / wide / noball — each with its own motion,
   color and (for six/wicket) extra flourish. The overlay lives
   inside #scorebar and is clipped to its exact shape, so it always
   reads as "the scoreboard reacting" rather than a floating popup.
   When the animation ends it fades itself out, revealing the
   normal live-updating scorebar underneath.
   ============================================================ */
let eventTimer = null;
let eventHideTimer = null;
let lastEventInfo = null; // { kindKey, label, ts } — used to detect a rapid second event (e.g. "no ball" + "four") and merge them into one combo overlay instead of letting two animations collide

const EVENT_KIND_MAP = {
  four: 'four', '4': 'four',
  six: 'six', '6': 'six',
  wicket: 'wicket', out: 'wicket', w: 'wicket',
  wide: 'wide', wd: 'wide',
  noball: 'noball', nb: 'noball', 'no-ball': 'noball', 'no ball': 'noball'
};
const EVENT_DEFAULT_LABEL = {
  four: 'FOUR!', six: 'SIX!', wicket: 'OUT!', wide: 'WIDE', noball: 'NO BALL'
};
// Higher priority kind becomes the big headline when two events land close
// together (e.g. a no-ball that's also hit for four); the lower one becomes
// the small badge underneath instead of a second, overlapping animation.
const EVENT_PRIORITY = { wicket: 4, six: 3, four: 2, wide: 1, noball: 1 };
const COMBO_WINDOW_MS = 900;

function clearEventParticles(overlay){
  overlay.querySelectorAll('.ev-particle').forEach(p => p.remove());
}

function spawnSixBurst(overlay){
  const count = 14;
  for(let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'ev-particle fly';
    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.3 - 0.15);
    const dist = 60 + Math.random() * 55;
    p.style.setProperty('--px', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--py', `${Math.sin(angle) * dist}px`);
    p.style.setProperty('--pr', `${(Math.random() * 240 - 120)}deg`);
    p.style.animationDelay = `${0.08 + Math.random() * 0.08}s`;
    if(i % 3 === 0) p.style.background = 'var(--white)';
    else if(i % 3 === 1) p.style.background = 'var(--green)';
    overlay.appendChild(p);
  }
}

socket.on('cricketEvent', (evt) => {
  const overlay = document.getElementById('event-overlay');
  const now = Date.now();
  const kindKey = EVENT_KIND_MAP[String(evt.kind || '').trim().toLowerCase()] || 'four';
  const label = evt.kind ? (EVENT_DEFAULT_LABEL[kindKey] || esc(evt.kind)) : EVENT_DEFAULT_LABEL[kindKey];

  // Detect a rapid follow-up event (same or different kind) fired while the
  // previous one is still showing — merge into a single combo overlay
  // rather than restarting a second animation on top of the first.
  const isCombo = overlay.classList.contains('show')
    && lastEventInfo
    && (now - lastEventInfo.ts) < COMBO_WINDOW_MS
    && lastEventInfo.kindKey !== kindKey;

  let primaryKind = kindKey, primaryLabel = label, badgeLabel = '';
  if(isCombo){
    const prevWins = (EVENT_PRIORITY[lastEventInfo.kindKey] || 0) >= (EVENT_PRIORITY[kindKey] || 0);
    primaryKind = prevWins ? lastEventInfo.kindKey : kindKey;
    primaryLabel = prevWins ? lastEventInfo.label : label;
    badgeLabel = prevWins ? label : lastEventInfo.label;
  }

  clearTimeout(eventTimer);
  clearTimeout(eventHideTimer);
  clearEventParticles(overlay);

  // reset to a clean, un-animated state so the animation classes below
  // always restart cleanly, whether it's a fresh event or a combo
  overlay.className = '';
  document.getElementById('event-kind').textContent = primaryLabel;
  document.getElementById('event-text').textContent = esc(evt.text || '');
  document.getElementById('event-sub').textContent = esc(evt.sub || '');
  const badgeEl = document.getElementById('event-badge');
  badgeEl.textContent = badgeLabel;
  badgeEl.classList.toggle('on', !!badgeLabel);

  void overlay.offsetWidth; // force reflow so the animation classes below restart cleanly

  overlay.classList.add('kind-' + primaryKind, 'show');
  if(primaryKind === 'six') spawnSixBurst(overlay);
  if(primaryKind === 'wicket') overlay.classList.add('shake');

  lastEventInfo = { kindKey, label, ts: now };

  const duration = evt.durationMs || 2200;
  eventTimer = setTimeout(() => {
    overlay.classList.add('hide');
    eventHideTimer = setTimeout(() => {
      overlay.classList.remove('show', 'hide', 'kind-' + primaryKind, 'shake');
      clearEventParticles(overlay);
      badgeEl.classList.remove('on');
      badgeEl.textContent = '';
      lastEventInfo = null;
    }, 450);
  }, duration);
});

/* ============================================================
   PLAYER / BOWLER / TEAM STAT CARDS
   ============================================================ */
function renderStatGrid(el, pairs){
  el.innerHTML = pairs.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`.replace('<div class="k">', '<div class="k">')).join('');
  // build as two-column grid: label row then value row per pair, in order
  el.innerHTML = '';
  pairs.forEach(([k, v]) => {
    const kEl = document.createElement('div'); kEl.className = 'k'; kEl.textContent = k;
    const vEl = document.createElement('div'); vEl.className = 'v'; vEl.textContent = v;
    el.appendChild(kEl); el.appendChild(vEl);
  });
}

socket.on('cricketPlayerStat', (data) => {
  document.getElementById('player-stat-card').classList.remove('off');
  document.getElementById('ps-scope').textContent = data.scope === 'tournament' ? 'Tournament Stats' : 'This Match';
  document.getElementById('ps-name').textContent = data.playerName || '—';
  document.getElementById('ps-team').textContent = data.teamName || '';
  if(data.scope === 'tournament'){
    renderStatGrid(document.getElementById('ps-grid'), [
      ['Matches', data.matches], ['Runs', data.runs], ['Average', data.average], ['SR', data.sr],
      ['HS', data.highScore], ['4s', data.fours], ['6s', data.sixes], ['50s/100s', `${data.fifties}/${data.hundreds}`]
    ]);
  } else {
    renderStatGrid(document.getElementById('ps-grid'), [
      ['Runs', data.runs], ['Balls', data.balls], ['SR', data.sr], ['4s', data.fours], ['6s', data.sixes]
    ]);
  }
});
socket.on('cricketHidePlayerStat', () => document.getElementById('player-stat-card').classList.add('off'));

socket.on('cricketBowlerStat', (data) => {
  document.getElementById('bowler-stat-card').classList.remove('off');
  document.getElementById('bs-scope').textContent = data.scope === 'tournament' ? 'Tournament Stats' : 'This Match';
  document.getElementById('bs-name').textContent = data.playerName || '—';
  document.getElementById('bs-team').textContent = data.teamName || '';
  if(data.scope === 'tournament'){
    renderStatGrid(document.getElementById('bs-grid'), [
      ['Matches', data.matches], ['Overs', data.overs], ['Wickets', data.wickets], ['Runs', data.runs],
      ['Econ', data.economy], ['Avg', data.average], ['Best', data.best], ['Maidens', data.maidens]
    ]);
  } else {
    renderStatGrid(document.getElementById('bs-grid'), [
      ['Overs', data.overs], ['Maidens', data.maidens], ['Runs', data.runs], ['Wickets', data.wickets], ['Econ', data.economy]
    ]);
  }
});
socket.on('cricketHideBowlerStat', () => document.getElementById('bowler-stat-card').classList.add('off'));

socket.on('cricketTeamStat', (data) => {
  document.getElementById('team-stat-card').classList.remove('off');
  document.getElementById('ts-name').textContent = data.teamName || '—';
  renderStatGrid(document.getElementById('ts-grid'), [
    ['Matches', data.matches], ['Won', data.won], ['Lost', data.lost], ['Tied', data.tied],
    ['Win %', data.winPct], ['Highest', data.highest], ['Avg Score', data.avgScore]
  ]);
});
socket.on('cricketHideTeamStat', () => document.getElementById('team-stat-card').classList.add('off'));

/* ============================================================
   POINTS TABLE
   ============================================================ */
socket.on('cricketPointsTable', (data) => {
  document.getElementById('points-card').classList.remove('off');
  document.getElementById('pt-title').textContent = data.tournamentName ? `${data.tournamentName} — Points Table` : 'Points Table';
  document.getElementById('pt-updated').textContent = data.updatedLine || '';
  const body = document.getElementById('pt-body');
  body.innerHTML = '';
  (data.standings || []).forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(row.name)}</td><td>${row.played}</td><td>${row.won}</td><td>${row.lost}</td><td>${row.points}</td><td>${row.nrr == null ? '—' : row.nrr.toFixed(2)}</td>`;
    body.appendChild(tr);
  });
});
socket.on('cricketHidePointsTable', () => document.getElementById('points-card').classList.add('off'));

/* ============================================================
   INNINGS / MATCH SUMMARY
   ============================================================ */
socket.on('cricketInningsSummary', (data) => {
  const card = document.getElementById('summary-card');
  card.classList.remove('off');
  document.getElementById('sum-kicker').textContent = 'Innings Summary';
  document.getElementById('sum-headline').textContent = `${data.battingTeamShort || data.battingTeamName}: ${data.total} (${data.overs} ov)`;
  const battingBody = document.getElementById('sum-batting');
  battingBody.innerHTML = '';
  (data.batsmen || []).forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(b.name)}${b.howOut !== 'not out' ? '' : ' *'}</td><td>${b.runs}</td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td>`;
    battingBody.appendChild(tr);
  });
  const bowlingBody = document.getElementById('sum-bowling');
  bowlingBody.innerHTML = '';
  (data.bowlers || []).forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(b.name)}</td><td>${b.overs}</td><td>${b.runs}</td><td>${b.wickets}</td>`;
    bowlingBody.appendChild(tr);
  });
  clearTimeout(window.__sumTimer);
  window.__sumTimer = setTimeout(() => card.classList.add('off'), 12000);
});
socket.on('cricketHideInningsSummary', () => document.getElementById('summary-card').classList.add('off'));

socket.on('cricketMatchSummary', (data) => {
  const card = document.getElementById('summary-card');
  card.classList.remove('off');
  document.getElementById('sum-kicker').textContent = 'Match Summary';
  document.getElementById('sum-headline').textContent = data.winnerText || data.resultText || 'MATCH SUMMARY';
  const battingBody = document.getElementById('sum-batting');
  battingBody.innerHTML = '';
  (data.topBatsmenA || data.topBatsmen || []).forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(b.name)}</td><td>${b.runs}</td><td>${b.balls}</td><td></td><td></td>`;
    battingBody.appendChild(tr);
  });
  const bowlingBody = document.getElementById('sum-bowling');
  bowlingBody.innerHTML = '';
  (data.topBowlersA || data.topBowlers || []).forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(b.name)}</td><td>${b.overs}</td><td></td><td>${b.figures}</td>`;
    bowlingBody.appendChild(tr);
  });
});
socket.on('cricketHideMatchSummary', () => document.getElementById('summary-card').classList.add('off'));

/* ============================================================
   PLAYER / TEAM HISTORY CARDS
   ============================================================ */
socket.on('cricketPlayerHistory', (data) => {
  document.getElementById('player-history-card').classList.remove('off');
  document.getElementById('ph-name').textContent = data.playerName || data.name || '—';
  const rows = document.getElementById('ph-rows');
  rows.innerHTML = '';
  (data.matches || data.rows || []).slice(0, 6).forEach(m => {
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `<span>${esc(m.opponent || m.vs || m.label || '')}</span><span>${esc(m.summary || m.score || '')}</span>`;
    rows.appendChild(row);
  });
});
socket.on('cricketHidePlayerHistory', () => document.getElementById('player-history-card').classList.add('off'));

socket.on('cricketTeamHistory', (data) => {
  document.getElementById('team-history-card').classList.remove('off');
  document.getElementById('th-name').textContent = data.teamName || data.name || '—';
  const rows = document.getElementById('th-rows');
  rows.innerHTML = '';
  (data.matches || data.rows || []).slice(0, 6).forEach(m => {
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `<span>${esc(m.opponent || m.vs || m.label || '')}</span><span>${esc(m.result || m.summary || '')}</span>`;
    rows.appendChild(row);
  });
});
socket.on('cricketHideTeamHistory', () => document.getElementById('team-history-card').classList.add('off'));
</script>
</body>
</html>
