<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro League - Match Controller</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #9333ea;
            --danger: #dc2626;
            --success: #16a34a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
            animation: pageEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controller-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38bdf8, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Card / Section Layout */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid System for Responsiveness */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Input Controls */
        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Action Buttons Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        button {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary { background: var(--primary); color: #000; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-accent { background: var(--accent); }
        .btn-accent:hover { background: #7e22ce; }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #15803d; }

        /* Score Control Rows */
        .score-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.4);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .score-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-val {
            font-size: 18px;
            font-weight: 900;
            min-width: 30px;
            text-align: center;
        }

        /* Status & State buttons wrapper */
        .states-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .states-container button {
            flex: 1;
            min-width: 110px;
        }
    </style>
</head>
<body>

    <div class="controller-wrapper">
        <header>
            <h1>Match Control Panel</h1>
            <p>Manage live stream overlays cleanly across desktop, tablet & mobile</p>
        </header>

        <!-- General Settings & Tournament Info -->
        <div class="card">
            <div class="card-title">⚙️ General & Tournament Info</div>
            <div class="input-group">
                <label>Tournament Title / Header Banner Text</label>
                <input type="text" id="tourneyTitle" value="TABLE TENNIS SUPER LEAGUE MAHARASHTRA 2025">
            </div>
        </div>

        <!-- Players Setup -->
        <div class="card">
            <div class="card-title">👥 Player Details & Images</div>
            <div class="grid-2">
                <div>
                    <div class="input-group">
                        <label>Player 1 Name</label>
                        <input type="text" id="p1Name" value="PLAYER A">
                    </div>
                    <div class="input-group">
                        <label>Player 1 Image URL</label>
                        <input type="text" id="img1" placeholder="http://.../img1.png">
                    </div>
                </div>
                <div>
                    <div class="input-group">
                        <label>Player 2 Name</label>
                        <input type="text" id="p2Name" value="PLAYER B">
                    </div>
                    <div class="input-group">
                        <label>Player 2 Image URL</label>
                        <input type="text" id="img2" placeholder="http://.../img2.png">
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Score & Server Management -->
        <div class="card">
            <div class="card-title">🏓 Live Scoring & Service</div>
            
            <!-- Player 1 Score Row -->
            <div class="score-control-row">
                <div>
                    <span id="label-p1" style="font-weight: 700;">PLAYER A</span>
                </div>
                <div class="score-controls-group">
                    <span style="font-size: 11px; color: var(--text-muted);">SETS:</span>
                    <input type="number" id="p1Sets" value="0" style="width: 55px; text-align: center;">
                    <span style="font-size: 11px; color: var(--text-muted); margin-left: 5px;">SCORE:</span>
                    <button onclick="adjustScore('p1', -1)" class="btn-danger">-</button>
                    <span class="score-val" id="disp-p1-score">0</span>
                    <button onclick="adjustScore('p1', 1)" class="btn-success">+</button>
                </div>
            </div>

            <!-- Player 2 Score Row -->
            <div class="score-control-row">
                <div>
                    <span id="label-p2" style="font-weight: 700;">PLAYER B</span>
                </div>
                <div class="score-controls-group">
                    <span style="font-size: 11px; color: var(--text-muted);">SETS:</span>
                    <input type="number" id="p2Sets" value="0" style="width: 55px; text-align: center;">
                    <span style="font-size: 11px; color: var(--text-muted); margin-left: 5px;">SCORE:</span>
                    <button onclick="adjustScore('p2', -1)" class="btn-danger">-</button>
                    <span class="score-val" id="disp-p2-score">0</span>
                    <button onclick="adjustScore('p2', 1)" class="btn-success">+</button>
                </div>
            </div>

            <div style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div style="font-size: 13px; font-weight: 600;">Current Server:</div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="setServer(1)" id="btn-server1" class="btn-primary">Serve: Player 1</button>
                    <button onclick="setServer(2)" class="btn">Serve: Player 2</button>
                </div>
            </div>
        </div>

        <!-- Overlay State Toggles -->
        <div class="card">
            <div class="card-title">📺 Overlay Visibility States</div>
            <div class="states-container">
                <button onclick="setState('header-in')" class="btn-accent">Header Banner</button>
                <button onclick="setState('intro-in')" class="btn-accent">Match Intro</button>
                <button onclick="setState('score-in')" class="btn-primary">Show Scoreboard</button>
                <button onclick="setState('table-in')" class="btn-accent">Points Table</button>
                <button onclick="setState('winner-in')" class="btn-danger">Winner Banner</button>
                <button onclick="setState('hidden')" style="background: #334155;">Hide All</button>
            </div>
            <div class="input-group" style="margin-top: 15px;">
                <label>Winner Banner Custom Text</label>
                <input type="text" id="winnerBoxText" value="PLAYER A WON THE MATCH">
            </div>
        </div>

        <!-- Standings Data Management -->
        <div class="card">
            <div class="card-title">📊 Points Table Standings (JSON Data)</div>
            <div class="input-group">
                <label>Standings Array Data</label>
                <input type="text" id="standingsData" value='[{"team":"Phantom Stars","ties":5,"tiesWon":3,"gamesPlayed":15,"matchesWon":10,"gamesWon":35,"points":12},{"team":"Mumbai Mozartt","ties":5,"tiesWon":2,"gamesPlayed":15,"matchesWon":8,"gamesWon":30,"points":9}]'>
            </div>
            <button onclick="sendData()" class="btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Push Live Updates to Stream</button>
        </div>
    </div>

    <script>
        const socket = io();

        // Live syncing input field values to local display variables
        let currentState = 'score-in';
        let currentServer = 1;

        function adjustScore(player, amount) {
            let scoreBox = document.getElementById(player === 'p1' ? 'disp-p1-score' : 'disp-p2-score');
            let val = parseInt(scoreBox.innerText) + amount;
            if(val < 0) val = 0;
            scoreBox.innerText = val;
            sendData();
        }

        function setServer(srv) {
            currentServer = srv;
            document.getElementById('btn-server1').innerText = srv === 1 ? 'Serve: Player 1 (Active)' : 'Serve: Player 1';
            sendData();
        }

        function setState(st) {
            currentState = st;
            sendData();
        }

        // Collect all inputs and emit via socket.io
        function sendData() {
            let standingsParsed = [];
            try {
                standingsParsed = JSON.parse(document.getElementById('standingsData').value);
            } catch(e) {
                standingsParsed = [];
            }

            let data = {
                tourneyTitle: document.getElementById('tourneyTitle').value,
                p1Name: document.getElementById('p1Name').value,
                p2Name: document.getElementById('p2Name').value,
                p1Sets: parseInt(document.getElementById('p1Sets').value) || 0,
                p2Sets: parseInt(document.getElementById('p2Sets').value) || 0,
                p1Score: parseInt(document.getElementById('disp-p1-score').innerText) || 0,
                p2Score: parseInt(document.getElementById('disp-p2-score').innerText) || 0,
                img1: document.getElementById('img1').value,
                img2: document.getElementById('img2').value,
                server: currentServer,
                state: currentState,
                winner: document.getElementById('winnerBoxText').value,
                standings: standingsParsed
            };

            socket.emit('updateScore', data);
        }

        // Auto-update event listeners on inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                // Real-time update sync
                document.getElementById('label-p1').innerText = document.getElementById('p1Name').value || 'PLAYER A';
                document.getElementById('label-p2').innerText = document.getElementById('p2Name').value || 'PLAYER B';
                sendData();
            });
        });
    </script>
</body>
</html>
