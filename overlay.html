<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro League 16:9 Broadcast Overlay - Scorvix</title>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: transparent; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            width: 1920px; height: 1080px; overflow: hidden; 
        }

        /* 🌟 Match Point / Game Point Top Pop-up Banner 🌟 */
        .alert-banner {
            position: fixed;
            top: -90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f59e0b, #dc2626);
            color: #ffffff;
            padding: 14px 45px;
            border-radius: 0 0 16px 16px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.6);
            border: 3px solid #fef08a;
            border-top: none;
            z-index: 10000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .alert-banner.show {
            top: 0;
        }

        /* Wrapper to position elements for 16:9 OBS/vMix canvas */
        .overlay-canvas {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 1. Tournament Header */
        .tournament-header {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(90deg, rgba(15,23,42,0.95), rgba(30,41,59,0.95));
            color: #38bdf8;
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
            z-index: 100;
            text-transform: uppercase;
        }
        .tournament-header.active { transform: translateX(-50%) translateY(0); }

        /* 2. Live Scoreboard */
        .scoreboard-container {
            position: absolute;
            bottom: 45px;
            left: 60px;
            display: flex;
            align-items: center;
            background: #0f172a;
            border-radius: 12px;
            border: 2px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            overflow: hidden;
            transform: translateY(200px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 100;
        }
        .scoreboard-container.active { transform: translateY(0); opacity: 1; }

        .team-box {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: #1e293b;
            min-width: 280px;
            justify-content: space-between;
        }
        .team-box.team-b { background: #0f172a; }
        
        .team-info { display: flex; align-items: center; gap: 12px; }
        .team-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 4px; background: #0b0f19; padding: 2px; border: 1px solid #475569; }
        .team-name { font-size: 18px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; }

        .sets-badge {
            background: #0b0f19; color: #38bdf8; font-size: 16px; font-weight: bold;
            padding: 4px 10px; border-radius: 6px; border: 1px solid #334155;
        }

        .score-box {
            background: #0284c7; color: #ffffff; font-size: 32px; font-weight: 900;
            width: 75px; height: 65px; display: flex; justify-content: center; align-items: center;
            border-left: 2px solid #334155; border-right: 2px solid #334155;
        }
        .team-b-score { background: #0d9488 !important; }

        .server-dot {
            width: 12px; height: 12px; background: #facc15; border-radius: 50%;
            box-shadow: 0 0 10px #facc15; display: none; margin-right: 8px;
        }
        .serving .server-dot { display: inline-block; }

        /* 3. Set-wise Score Grid */
        .sets-grid-container {
            position: absolute;
            bottom: 135px;
            left: 60px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0);
            transform-origin: bottom left;
            transition: transform 0.4s ease;
            z-index: 99;
        }
        .sets-grid-container.active { transform: scale(1); }
        .set-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; font-weight: bold; color: #94a3b8; }
        .set-box { background: #1e293b; padding: 4px 10px; border-radius: 4px; color: #fff; min-width: 35px; text-align: center; border: 1px solid #475569; }

        /* 4. Winner Banner */
        .winner-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 4px solid #facc15;
            padding: 30px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
        }
        .winner-banner.active { transform: translate(-50%, -50%) scale(1); }
        .winner-title { font-size: 16px; color: #38bdf8; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .winner-name { font-size: 36px; color: #facc15; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }

        /* 5. Points Table Leaderboard */
        .table-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            width: 850px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transition: transform 0.4s ease;
            z-index: 200;
        }
        .table-container.active { transform: translate(-50%, -50%) scale(1); }
        .table-title { font-size: 18px; font-weight: 900; color: #38bdf8; margin-bottom: 15px; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
        th { background: #1e293b; color: #94a3b8; padding: 10px; font-weight: bold; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; color: #fff; }
        tr:nth-child(even) { background: rgba(30, 41, 59, 0.3); }
    </style>
</head>
<body>

    <!-- Game Point / Match Point Pop-up Banner -->
    <div id="alert-banner" class="alert-banner">
        <span id="alert-text">MATCH POINT</span>
    </div>

    <div class="overlay-canvas">
        
        <!-- Tournament Header -->
        <div class="tournament-header" id="ui-tourney-title">TABLE TENNIS SUPER LEAGUE MAHARASHTRA 2025</div>

        <!-- Set-wise Score Grid Popup -->
        <div class="sets-grid-container" id="ui-sets-grid">
            <div class="set-row"><span id="grid-t1-label">TEAM A</span> <div id="grid-p1-sets-list" style="display:flex; gap:5px;"></div></div>
            <div class="set-row"><span id="grid-t2-label">TEAM B</span> <div id="grid-p2-sets-list" style="display:flex; gap:5px;"></div></div>
        </div>

        <!-- Live Scoreboard -->
        <div class="scoreboard-container" id="ui-scoreboard">
            <!-- Team A -->
            <div class="team-box" id="box-p1">
                <div class="team-info">
                    <div class="server-dot"></div>
                    <img id="ui-img1" class="team-logo" style="display: none;">
                    <div class="team-name" id="ui-p1">PHANTOM STARS</div>
                </div>
                <div class="sets-badge" id="ui-p1-sets">0</div>
            </div>
            <div class="score-box" id="ui-score1">0</div>

            <!-- Team B -->
            <div class="score-box team-b-score" id="ui-score2">0</div>
            <div class="team-box team-b" id="box-p2">
                <div class="sets-badge" id="ui-p2-sets">0</div>
                <div class="team-info">
                    <div class="team-name" id="ui-p2">MUMBAI MOZARTT</div>
                    <img id="ui-img2" class="team-logo" style="display: none;">
                    <div class="server-dot" style="margin-left: 8px; margin-right: 0;"></div>
                </div>
            </div>
        </div>

        <!-- Winner Announcement Banner -->
        <div class="winner-banner" id="ui-winner-banner">
            <div class="winner-title">Match Result</div>
            <div class="winner-name" id="ui-winner-text">PHANTOM STARS WON THE MATCH</div>
        </div>

        <!-- Points Table Leaderboard -->
        <div class="table-container" id="ui-table">
            <div class="table-title">Points Table Leaderboard</div>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team Name</th>
                        <th>Played</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>

    </div>

<script>
    // Firebase Config (for syncing standalone overlay if opened directly)
    const firebaseConfig = {
        apiKey: "AIzaSyAYc_bEB9C4RhhLhPBEJsJRFRUppcR45yo",
        authDomain: "scorvix-faf0e.firebaseapp.com",
        projectId: "scorvix-faf0e",
        storageBucket: "scorvix-faf0e.firebasestorage.app",
        messagingSenderId: "725629580596",
        appId: "1:725629580596:web:7737847e7194650f276161",
        measurementId: "G-4EXH0QXHF7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const socket = io();

    let lastAlertKey = "";
    let alertTimeout = null;

    function showAlert(text) {
        const banner = document.getElementById('alert-banner');
        const alertText = document.getElementById('alert-text');
        alertText.innerText = text;
        
        banner.classList.add('show');
        
        if (alertTimeout) clearTimeout(alertTimeout);
        alertTimeout = setTimeout(() => {
            banner.classList.remove('show');
        }, 4000); // 4 Seconds stay duration
    }

    function checkAndTriggerPoints(data) {
        let p1s = data.p1Score;
        let p2s = data.p2Score;
        let p1Sets = data.p1Sets;
        let p2Sets = data.p2Sets;
        let targetSets = (data.matchFormat === 'bestOf7') ? 4 : 3;

        let p1HasGamePoint = (p1s >= 10 && p1s > p2s);
        let p2HasGamePoint = (p2s >= 10 && p2s > p1s);

        let p1IsMatchPoint = p1HasGamePoint && (p1Sets === targetSets - 1);
        let p2IsMatchPoint = p2HasGamePoint && (p2Sets === targetSets - 1);

        let currentKey = `${p1s}-${p2s}-${p1Sets}-${p2Sets}`;

        // Trigger only when game point / match point status changes
        if (currentKey !== lastAlertKey) {
            if (p1IsMatchPoint) {
                showAlert(`🔥 MATCH POINT: ${data.p1Name} 🔥`);
                lastAlertKey = currentKey;
            } else if (p2IsMatchPoint) {
                showAlert(`🔥 MATCH POINT: ${data.p2Name} 🔥`);
                lastAlertKey = currentKey;
            } else if (p1HasGamePoint) {
                showAlert(`⚠️ GAME POINT: ${data.p1Name} ⚠️`);
                lastAlertKey = currentKey;
            } else if (p2HasGamePoint) {
                showAlert(`⚠️ GAME POINT: ${data.p2Name} ⚠️`);
                lastAlertKey = currentKey;
            } else {
                lastAlertKey = currentKey;
            }
        }
    }

    function updateOverlay(data) {
        // Update Texts & Scores
        document.getElementById('ui-tourney-title').innerText = data.tourneyTitle || "";
        document.getElementById('ui-p1').innerText = data.p1Name || "";
        document.getElementById('ui-p2').innerText = data.p2Name || "";
        document.getElementById('ui-score1').innerText = data.p1Score;
        document.getElementById('ui-score2').innerText = data.p2Score;
        document.getElementById('ui-p1-sets').innerText = data.p1Sets;
        document.getElementById('ui-p2-sets').innerText = data.p2Sets;
        document.getElementById('ui-winner-text').innerText = data.winner;

        // Check and trigger automatic Game/Match point alert
        checkAndTriggerPoints(data);

        // Logos
        const img1 = document.getElementById('ui-img1');
        if(data.img1) { img1.src = data.img1; img1.style.display = 'block'; } else { img1.style.display = 'none'; }
        
        const img2 = document.getElementById('ui-img2');
        if(data.img2) { img2.src = data.img2; img2.style.display = 'block'; } else { img2.style.display = 'none'; }

        // Server Indicator
        const boxP1 = document.getElementById('box-p1');
        const boxP2 = document.getElementById('box-p2');
        if(data.server === 1) {
            boxP1.classList.add('serving');
            boxP2.classList.remove('serving');
        } else {
            boxP1.classList.remove('serving');
            boxP2.classList.add('serving');
        }

        // Sets History Grid
        document.getElementById('grid-t1-label').innerText = data.p1Name;
        document.getElementById('grid-t2-label').innerText = data.p2Name;
        
        let p1SetsListHtml = '';
        let p2SetsListHtml = '';
        if(data.setsHistory && data.setsHistory.length > 0) {
            data.setsHistory.forEach(set => {
                p1SetsListHtml += `<div class="set-box">${set.p1}</div>`;
                p2SetsListHtml += `<div class="set-box">${set.p2}</div>`;
            });
        }
        document.getElementById('grid-p1-sets-list').innerHTML = p1SetsListHtml;
        document.getElementById('grid-p2-sets-list').innerHTML = p2SetsListHtml;

        // Standings Table
        if(data.standings) {
            let tbody = '';
            data.standings.forEach((row, index) => {
                tbody += `<tr><td>${index + 1}</td><td style="text-align:left; font-weight:bold;">${row.team}</td><td>${row.ties}</td><td style="color:#facc15; font-weight:bold;">${row.points}</td></tr>`;
            });
            document.getElementById('table-body').innerHTML = tbody;
        }

        // Graphic States Switcher
        document.getElementById('ui-tourney-title').className = "tournament-header " + (data.state === 'header-in' ? 'active' : '');
        document.getElementById('ui-scoreboard').className = "scoreboard-container " + (data.state === 'score-in' ? 'active' : '');
        document.getElementById('ui-sets-grid').className = "sets-grid-container " + (data.state === 'sets-grid-in' ? 'active' : '');
        document.getElementById('ui-winner-banner').className = "winner-banner " + (data.state === 'winner-in' ? 'active' : '');
        document.getElementById('ui-table').className = "table-container " + (data.state === 'table-in' ? 'active' : '');
    }

    // Socket Listener
    socket.on('updateScore', (data) => {
        updateOverlay(data);
    });

    // Initial load from Firebase
    db.collection("scorvix").doc("matchState").get().then(doc => {
        if (doc.exists) {
            updateOverlay(doc.data());
        }
    });
</script>
</body>
</html>
