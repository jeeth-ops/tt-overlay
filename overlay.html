<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro League Broadcast Overlays</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: transparent; overflow: hidden; 
            width: 1920px; height: 1080px; 
        }

        /* Keyframes for Score Pulse Animation */
        @keyframes pulseScore {
            0% { transform: scale(1); background: #9333ea; }
            50% { transform: scale(1.15); background: #38bdf8; color: #000; }
            100% { transform: scale(1); background: #9333ea; }
        }
        .score-bump {
            animation: pulseScore 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- 1. TOURNAMENT HEADER BANNER (Glassmorphism & Smooth Slide) --- */
        #header-banner {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translate(-50%, -60px) scale(0.95);
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.95), rgba(153, 27, 27, 0.95));
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 12px 45px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #header-banner.active { 
            transform: translate(-50%, 0) scale(1); 
            opacity: 1; 
        }

        /* --- 2. LIVE SCOREBOARD (Smooth Slide + Glow) --- */
        #score-container {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            flex-direction: column;
            width: 440px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            font-weight: bold;
            border-left: 6px solid #38bdf8;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transform: translateY(120px) scale(0.95);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #score-container.active { 
            transform: translateY(0) scale(1); 
            opacity: 1; 
        }

        .tt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 2px solid rgba(31, 41, 55, 0.8);
            height: 52px;
            transition: background 0.3s ease;
        }
        .tt-row:last-child { border-bottom: none; }
        .player-info {
            display: flex; align-items: center; gap: 12px; padding-left: 15px;
            font-size: 16px; letter-spacing: 1px; text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px;
        }
        .player-img { width: 30px; height: 22px; object-fit: cover; border-radius: 3px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .server-indicator { font-size: 14px; color: #eab308; margin-left: 5px; display: none; text-shadow: 0 0 10px #eab308; }
        .active-server .server-indicator { display: inline-block; animation: blinkServer 1s infinite alternate; }
        
        @keyframes blinkServer {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        .scores-group { display: flex; height: 100%; }
        .set-score-box { width: 48px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: rgba(17, 24, 39, 0.9); color: #9ca3af; border-left: 1px solid rgba(31, 41, 55, 0.8); }
        .main-score-box { width: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; background: #9333ea; color: #ffffff; transition: transform 0.2s ease; }

        /* --- 3. DYNAMIC INTRO SCREEN (Cinematic Zoom & Fade) --- */
        #intro-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.96);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        #intro-container.active { opacity: 1; pointer-events: auto; }
        
        .intro-title-badge {
            background: #dc2626; color: #fff; padding: 10px 35px; font-size: 22px; font-weight: 900;
            letter-spacing: 3px; border-radius: 6px; margin-bottom: 40px; text-transform: uppercase;
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.6);
            transform: translateY(-40px); opacity: 0;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
        }
        .intro-matchup-box {
            display: flex; align-items: center; gap: 40px;
            transform: scale(0.85); opacity: 0;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }
        #intro-container.active .intro-title-badge,
        #intro-container.active .intro-matchup-box { 
            transform: translateY(0) scale(1); 
            opacity: 1; 
        }
        
        .intro-team {
            font-size: 50px; font-weight: 900; color: #ffffff; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 15px 30px rgba(0,0,0,0.9);
            background: rgba(30, 41, 59, 0.8); padding: 30px 60px; border-radius: 16px; 
            border: 2px solid rgba(51, 65, 85, 0.8); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 550px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .intro-vs {
            font-size: 40px; font-weight: 900; color: #facc15; font-style: italic; 
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
        }

        /* --- 4. WINNER BANNER (Pop-up Animation) --- */
        #winner-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
            border: 2px solid #38bdf8;
            color: #ffffff;
            padding: 35px 70px;
            font-size: 34px; font-weight: 900; letter-spacing: 2px;
            border-radius: 16px; box-shadow: 0 35px 70px rgba(0,0,0,0.9);
            text-align: center; text-transform: uppercase; opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #winner-banner.active { 
            transform: translate(-50%, -50%) scale(1); 
            opacity: 1; 
        }

        /* --- 5. POINTS TABLE LEADERBOARD (Smooth Slide Down) --- */
        #points-table-container {
            position: absolute;
            top: 140px; left: 50%;
            transform: translate(-50%, -60px) scale(0.95);
            width: 1000px; background: rgba(15, 23, 42, 0.96); 
            backdrop-filter: blur(15px); border-radius: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 2px solid rgba(51, 65, 85, 0.8);
            overflow: hidden; opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        #points-table-container.active { 
            transform: translate(-50%, 0) scale(1); 
            opacity: 1; 
        }
        .pt-header {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            display: grid; grid-template-columns: 50px 1fr 70px 90px 120px 110px 110px 90px;
            padding: 14px 15px; font-weight: 900; font-size: 13px; color: #38bdf8;
            border-bottom: 2px solid rgba(51, 65, 85, 0.8); text-align: center;
        }
        .pt-row {
            display: grid; grid-template-columns: 50px 1fr 70px 90px 120px 110px 110px 90px;
            padding: 12px 15px; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(30, 41, 59, 0.6);
            align-items: center; text-align: center; background: rgba(15, 23, 42, 0.9);
            transition: background 0.2s ease;
        }
        .pt-row:nth-child(even) { background: rgba(30, 41, 59, 0.4); }
        .pt-row div:nth-child(2) { text-align: left; }
    </style>
</head>
<body>

    <!-- 1. Tournament Header Banner -->
    <div id="header-banner">TABLE TENNIS SUPER LEAGUE MAHARASHTRA 2025</div>

    <!-- 2. Dynamic Match Intro Screen -->
    <div id="intro-container">
        <div class="intro-title-badge" id="intro-tourney-title">TABLE TENNIS SUPER LEAGUE</div>
        <div class="intro-matchup-box">
            <div class="intro-team" id="intro-p1">PHANTOM STARS</div>
            <div class="intro-vs">VS</div>
            <div class="intro-team" id="intro-p2">MUMBAI MOZARTT</div>
        </div>
    </div>

    <!-- 3. Live Scoreboard -->
    <div id="score-container">
        <div class="tt-row" id="row-p1">
            <div class="player-info">
                <img id="o-img1" class="player-img" src="">
                <span id="o-p1-name">PLAYER A</span>
                <span class="server-indicator">◀</span>
            </div>
            <div class="scores-group">
                <div class="set-score-box" id="o-p1-sets">0</div>
                <div class="main-score-box" id="o-p1-score">0</div>
            </div>
        </div>
        <div class="tt-row" id="row-p2">
            <div class="player-info">
                <img id="o-img2" class="player-img" src="">
                <span id="o-p2-name">PLAYER B</span>
                <span class="server-indicator">◀</span>
            </div>
            <div class="scores-group">
                <div class="set-score-box" id="o-p2-sets">0</div>
                <div class="main-score-box" id="o-p2-score">0</div>
            </div>
        </div>
    </div>

    <!-- 4. Winner Banner -->
    <div id="winner-banner">PLAYER A WON THE MATCH</div>

    <!-- 5. Points Table Overlay -->
    <div id="points-table-container">
        <div class="pt-header">
            <div>#</div>
            <div>POINTS TABLE</div>
            <div>TIES</div>
            <div>TIES WON</div>
            <div>GAMES PLAYED</div>
            <div>MATCHES WON</div>
            <div>GAMES WON</div>
            <div>POINTS</div>
        </div>
        <div id="pt-body"></div>
    </div>

    <script>
        const socket = io();
        let prevP1Score = -1;
        let prevP2Score = -1;

        socket.on('liveScore', (data) => {
            // Update texts dynamically
            document.getElementById('header-banner').innerText = data.tourneyTitle;
            document.getElementById('intro-tourney-title').innerText = data.tourneyTitle;
            
            document.getElementById('o-p1-name').innerText = data.p1Name;
            document.getElementById('o-p2-name').innerText = data.p2Name;
            document.getElementById('intro-p1').innerText = data.p1Name;
            document.getElementById('intro-p2').innerText = data.p2Name;

            // Score pulse animation check
            let p1ScoreBox = document.getElementById('o-p1-score');
            let p2ScoreBox = document.getElementById('o-p2-score');

            if (prevP1Score !== -1 && prevP1Score !== data.p1Score) {
                p1ScoreBox.classList.add('score-bump');
                setTimeout(() => p1ScoreBox.classList.remove('score-bump'), 400);
            }
            if (prevP2Score !== -1 && prevP2Score !== data.p2Score) {
                p2ScoreBox.classList.add('score-bump');
                setTimeout(() => p2ScoreBox.classList.remove('score-bump'), 400);
            }

            prevP1Score = data.p1Score;
            prevP2Score = data.p2Score;

            p1ScoreBox.innerText = data.p1Score;
            p2ScoreBox.innerText = data.p2Score;
            document.getElementById('o-p1-sets').innerText = data.p1Sets;
            document.getElementById('o-p2-sets').innerText = data.p2Sets;

            let img1 = document.getElementById('o-img1');
            if(data.img1) { img1.src = data.img1; img1.style.display = 'block'; } else { img1.style.display = 'none'; }
            let img2 = document.getElementById('o-img2');
            if(data.img2) { img2.src = data.img2; img2.style.display = 'block'; } else { img2.style.display = 'none'; }

            if (data.server === 1) {
                document.getElementById('row-p1').classList.add('active-server');
                document.getElementById('row-p2').classList.remove('active-server');
            } else {
                document.getElementById('row-p2').classList.add('active-server');
                document.getElementById('row-p1').classList.remove('active-server');
            }

            // Render Points Table dynamically
            data.standings.sort((a, b) => b.points - a.points);
            let ptHTML = "";
            data.standings.forEach((item, index) => {
                ptHTML += `<div class="pt-row">
                    <div>${index + 1}</div>
                    <div>${item.team}</div>
                    <div>${item.ties}</div>
                    <div>${item.tiesWon}</div>
                    <div>${item.gamesPlayed}</div>
                    <div>${item.matchesWon}</div>
                    <div>${item.gamesWon}</div>
                    <div>${item.points}</div>
                </div>`;
            });
            document.getElementById('pt-body').innerHTML = ptHTML;

            // Visibility States Handling with Smooth Transitions
            document.getElementById('header-banner').className = data.state === 'header-in' ? 'active' : '';
            document.getElementById('intro-container').className = data.state === 'intro-in' ? 'active' : '';
            document.getElementById('score-container').className = data.state === 'score-in' ? 'active' : '';
            document.getElementById('winner-banner').className = data.state === 'winner-in' ? 'active' : '';
            document.getElementById('points-table-container').className = data.state === 'table-in' ? 'active' : '';
            
            document.getElementById('winner-banner').innerText = data.winner;
        });
    </script>
</body>
</html>
