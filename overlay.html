<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Overlay</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: transparent; margin: 0; }
        .scoreboard {
            position: absolute; bottom: 30px; left: 50px;
            display: flex; background: rgba(0, 0, 0, 0.85);
            color: white; border-radius: 8px; overflow: hidden;
            border: 2px solid #444; font-size: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .player-row { display: flex; align-items: center; padding: 12px 20px; }
        .player-row:first-child { border-bottom: 2px solid #444; }
        .name { width: 150px; font-weight: bold; }
        .sets { background: #333; padding: 5px 15px; margin: 0 15px; border-radius: 4px; font-weight: bold; color: #ffcc00; }
        .score { font-size: 32px; font-weight: bold; width: 50px; text-align: center; color: #00ffcc; }

        /* Winner Announcement Banner */
        #winnerBanner {
            display: none; position: fixed; top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white; padding: 25px 50px; font-size: 45px; font-weight: bold;
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            z-index: 9999; text-align: center; border: 3px solid #fff;
            animation: popUp 0.5s ease-in-out;
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div>
            <div class="player-row">
                <span class="name" id="p1Name">Player 1</span>
                <span class="sets" id="p1Sets">0</span>
                <span class="score" id="p1Score">0</span>
            </div>
            <div class="player-row">
                <span class="name" id="p2Name">Player 2</span>
                <span class="sets" id="p2Sets">0</span>
                <span class="score" id="p2Score">0</span>
            </div>
        </div>
    </div>

    <!-- Automatic Winner Overlay Banner -->
    <div id="winnerBanner">
        <span id="winnerText">Player 1 Wins!</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('updateState', (state) => {
            document.getElementById('p1Name').innerText = state.p1Name;
            document.getElementById('p2Name').innerText = state.p2Name;
            document.getElementById('p1Score').innerText = state.p1Score;
            document.getElementById('p2Score').innerText = state.p2Score;
            document.getElementById('p1Sets').innerText = state.p1Sets;
            document.getElementById('p2Sets').innerText = state.p2Sets;

            // Winner Logic (Best of 5 requires 3 sets, Best of 7 requires 4 sets)
            let targetSets = (state.matchFormat === 'bestOf7') ? 4 : 3;
            const banner = document.getElementById('winnerBanner');
            const winnerText = document.getElementById('winnerText');

            if (state.p1Sets >= targetSets) {
                winnerText.innerText = `${state.p1Name} Wins the Match!`;
                banner.style.display = 'block';
            } else if (state.p2Sets >= targetSets) {
                winnerText.innerText = `${state.p2Name} Wins the Match!`;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
