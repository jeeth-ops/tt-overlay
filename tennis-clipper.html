<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Clipper · AllSportsLive</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="stylesheet" href="/tennis-ui.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<!--
  🎬 THE TENNIS CLIPPER PAGE — open on the PC that records (next to vMix)
  while the match is scored somewhere else (a phone, another laptop): every
  point scored anywhere is clipped here, from this PC's vMix recording, by
  this PC's Tennis Clipper. Points arrive over the /tennis socket.
  ?match=<id>
-->
</head>
<body>
<header class="topbar">
  <a class="brand" href="/tennis"><span class="asl"></span><span class="bt"><b>Tennis <em>Clipper</em></b><small>by All Sports Live</small></span></a>
  <div class="grow small muted ellipsis" id="title"></div>
  <button class="theme-btn" data-theme-btn aria-label="Theme"></button>
</header>
<main class="wrap" style="max-width:980px;padding-bottom:60px"><div class="card" style="margin-top:18px" id="clp"><div class="skel" style="height:140px"></div></div></main>
<script src="/socket.io/socket.io.js"></script>
<script src="/tennis-common.js"></script>
<script src="/tennis-engine.js"></script>
<script src="/tennis-stats.js"></script>
<script src="/tennis-clipper.js"></script>
<script>
(function () {
  'use strict';
  const { $, esc, toast } = TN;
  const matchId = new URLSearchParams(location.search).get('match');
  const S = { match: null, tournament: null, L: null, CL: null };
  if (!matchId) { $('#clp').innerHTML = '<div class="empty"><b>No match chosen</b>Open it from the panel’s Clips tab.</div>'; return; }
  const setupOf = (m) => { const side = (s) => { const x = m.sides && m.sides[s]; return { name: x ? x.name : s, players: x ? x.players.map((p) => ({ playerId: p.playerId, name: p.name, short: p.short, country: p.country })) : [] }; }; return { format: m.format, rules: m.rules, sides: { A: side('A'), B: side('B') } }; };
  (async () => {
    const user = await TN.authReady;
    if (!user) { $('#clp').innerHTML = '<div class="empty"><b>Sign in to clip this match</b><button class="btn primary" id="si" style="margin-top:10px">Sign in with Google</button></div>'; $('#si').onclick = () => TN.signIn().then(() => location.reload()); return; }
    TN.syncClock();
    const socket = await TN.connect();
    const paint = () => { if (S.CL) TNClipper.paint(S.CL, $('#clp'), { matchId, onPlay: (e) => TNClipper.play(S.CL, e) }); };
    socket.on('connect', async () => {
      const r = await TN.ack(socket, 'tn:join', { matchId, events: true });
      if (!r.ok || !r.match.canManage) { $('#clp').innerHTML = '<div class="empty"><b>Not available</b>This account cannot clip this match.</div>'; return; }
      S.match = r.match; S.tournament = r.tournament;
      S.L = new window.TennisEngine.Ledger(setupOf(S.match), r.events || []);
      $('#title').textContent = (S.match.sides.A ? S.match.sides.A.name : 'A') + ' v ' + (S.match.sides.B ? S.match.sides.B.name : 'B');
      if (!S.CL) S.CL = TNClipper.create({ matchId, role: 'clipper', socket, toast, label: 'vMix PC (Clipper page)', getMatch: () => S.match, getTournament: () => S.tournament, getTimeline: () => (S.L ? S.L.timeline : []), getSetup: () => (S.L ? S.L.setup : null), onChange: paint });
      paint();
    });
    socket.on('tn:update', (u) => {
      if (u.matchId !== matchId || !S.L) return;
      if (u.event && u.event.type === 'POINT' && S.CL) S.CL.remotePoint(u.event, u.entry);
      if (u.seq === S.L.seq + 1 && !u.full && u.event) { const c = S.L.check(Object.assign({}, u.event, { seq: undefined })); if (c.ok) { S.L.commit(c.pending); if (S.CL) S.CL.reconcile(); paint(); return; } }
      TN.ack(socket, 'tn:sync', { matchId }).then((r) => { if (r.ok) { S.L = new window.TennisEngine.Ledger(setupOf(S.match), r.events || []); if (S.CL) S.CL.reconcile(); paint(); } });
    });
  })();
})();
</script>
</body>
</html>
