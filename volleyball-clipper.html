<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Clipper · AllSportsLive</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="stylesheet" href="/volleyball-ui.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<!--
  🎬 THE VOLLEYBALL CLIPPER PAGE — for the PC that records (vMix + the
  Volleyball Clipper, VolleyballClipper.exe — volleyball's own program,
  never the Cricket Clipper) when the match is scored on ANOTHER device (a
  phone or a tablet). When the scoring panel runs on the vMix PC itself,
  its own 🎬 Clipper button does all of this and this page is not needed.

  Same Clipper as the panel (volleyball-clipper.js): ▶ Start Clipper, the
  readiness checks, the recent clips. Every point scored on the other
  device reaches this page over the match feed, stamped on the server's
  clock; it is converted to this PC's clock (measured offset below) and
  handed to the Volleyball Clipper, which cuts it from the vMix recording.
-->
<style>
  .topbar .title { font-weight: 700; font-size: 15px; min-width: 0; }
  .topbar .title small { display: block; font-weight: 500; color: var(--mute); font-size: 12px; }
  main { padding: 16px 0 60px; }
  .clipcard { max-width: 1040px; margin: 0 auto; }
  .note { margin-top: 12px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/volleyball"><span class="ball">🎬</span><span>Volleyball Clipper</span></a>
  <div class="title grow ellipsis" id="title"><small>Loading…</small></div>
  <span class="row small" id="chips"></span>
</header>
<main class="wrap" id="main"><div class="skel" style="height:280px"></div></main>

<script src="/socket.io/socket.io.js"></script>
<script src="/volleyball-common.js"></script>
<script src="/volleyball-engine.js"></script>
<script src="/volleyball-clipper.js"></script>
<script>
(function () {
  'use strict';
  const { $, esc, toast, api } = VB;
  const E = window.VolleyballEngine;
  const qs = new URLSearchParams(location.search);
  const C = { matchId: qs.get('match'), match: null, tournament: null, socket: null, connected: false, L: null, CL: null };
  if (!C.matchId) { $('#main').innerHTML = '<div class="card empty" style="max-width:520px;margin:30px auto"><b>No match chosen</b>Open the Clipper from a match in the <a href="/volleyball">volleyball dashboard</a>.</div>'; return; }

  async function boot() {
    const user = await VB.authReady;
    if (!user) return gate('Sign in to clip', 'The Clipper works for the account that runs the tournament.', true);
    await VB.syncClock();
    C.socket = await VB.connect();
    C.socket.on('connect', onConnect);
    C.socket.on('disconnect', () => { C.connected = false; renderChips(); });
    C.socket.on('vb:update', onUpdate);
    C.socket.on('vb:match', (d) => { if (d.matchId === C.matchId && d.match && C.match) { C.match = Object.assign(C.match, d.match, { clipToken: C.match.clipToken, overlayKey: C.match.overlayKey, canManage: C.match.canManage }); renderTitle(); } });
    // the press is converted with this offset — kept fresh through a long match
    setInterval(() => { if (document.visibilityState === 'visible') VB.syncClock().then(paint); }, 5 * 60000);
  }
  function gate(title, text, signIn) {
    $('#main').innerHTML = `<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><div style="font-size:40px">🎬</div><h2 style="margin:6px 0">${esc(title)}</h2><p class="muted">${esc(text)}</p>
      ${signIn ? '<button class="btn primary" style="margin-top:14px" id="gsi">Sign in with Google</button>' : '<a class="btn" style="margin-top:14px" href="/volleyball">Volleyball dashboard</a>'}</div>`;
    if ($('#gsi')) $('#gsi').onclick = () => VB.signIn().then(() => location.reload());
  }
  const setupOf = (m) => {
    const side = (s) => ({ teamId: m['team' + s] && m['team' + s].teamId, name: m['team' + s] ? m['team' + s].name : 'Team ' + s, shortName: m['team' + s] && m['team' + s].shortName, players: (m.squads && m.squads[s]) || [] });
    return { teams: { A: side('A'), B: side('B') }, rules: m.rules };
  };
  async function onConnect() {
    C.connected = true;
    const r = await VB.ack(C.socket, 'vb:join', { matchId: C.matchId, events: true, timeline: true }, 15000);
    if (!r.ok) return gate('Match not found', 'It may have been deleted, or this account cannot open it.');
    if (!r.match.canManage) return gate('Not your match', 'Only the account that runs this tournament can clip it.');
    C.match = r.match;
    C.L = new E.Ledger(setupOf(C.match), r.events || []);
    if (!C.CL) {
      $('#main').innerHTML = `<div class="card clipcard"><div id="clp"></div><p class="tiny muted note" id="clock"></p></div>`;
      loadTournament();
      C.CL = VBClipper.create({
        matchId: C.matchId, role: 'clipper', socket: C.socket, toast, label: 'Clipper page · ' + deviceName(),
        getMatch: () => C.match, getTournament: () => C.tournament, getTimeline: () => (C.L ? C.L.timeline : []),
        playerOf: (t, id) => (C.L ? C.L.setup.teams[t].byId[id] || null : null),
        onChange: paint
      });
    } else C.CL.refresh();
    renderTitle(); renderChips(); paint();
  }
  function deviceName() { const ua = navigator.userAgent; return /Windows/.test(ua) ? 'Windows PC' : /Mac OS X/.test(ua) ? 'Mac' : 'this PC'; }
  async function loadTournament() {
    const r = await api('GET', `/api/volleyball/tournaments/${C.match.tournamentId}`);
    if (r.ok) { C.tournament = r.json.tournament; renderTitle(); }
  }
  // A point scored on the other device: to the helper at once (with the
  // press on this PC's clock); the match itself is then brought up to date.
  function onUpdate(u) {
    if (!u || u.matchId !== C.matchId || !C.L) return;
    if (u.event && u.event.type === 'RALLY' && C.CL) C.CL.remotePoint(u.event, u.entry);
    resync();
  }
  let syncTimer = null;
  function resync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      if (!C.socket || !C.connected) return;
      const r = await VB.ack(C.socket, 'vb:sync', { matchId: C.matchId });
      if (r.ok) { C.match = Object.assign(C.match, r.match); C.L = new E.Ledger(setupOf(C.match), r.events || []); if (C.CL) C.CL.reconcile(); paint(); }
    }, 120);
  }
  const teamOf = (t) => (C.match && C.match['team' + t]) || { name: 'Team ' + t };
  const short = (name) => { const w = String(name || '').trim().split(/\s+/); return w.length > 1 ? w[0][0] + '. ' + w[w.length - 1] : (name || ''); };
  let raf = 0;
  function paint() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const el = $('#clp');
      if (!el || !C.CL) return;
      VBClipper.paint(C.CL, el, { teamOf, short, canAssign: false, onPlay: (eventId) => VBClipper.play(C.CL, eventId, teamOf) });
      renderChips();
      const o = VB.clock.offset, rtt = VB.clock.rtt;
      $('#clock').textContent = (rtt == null ? 'The server clock is not measured yet.' : `Points scored on another device are converted to this PC’s clock: it is ${Math.abs(o) < 50 ? 'in step with' : (Math.abs(o) / 1000).toFixed(2) + ' s ' + (o > 0 ? 'behind' : 'ahead of')} the server (measured to ±${Math.round(rtt / 2)} ms).`)
        + ' Assign who earned each point in the scoring panel — the clip follows it.';
    });
  }
  function renderTitle() {
    const m = C.match; if (!m) return;
    $('#title').innerHTML = `${esc(m.teamA ? m.teamA.name : 'TBD')} v ${esc(m.teamB ? m.teamB.name : 'TBD')}<small>${esc([C.tournament && C.tournament.name, m.matchNo ? 'Match ' + m.matchNo : '', 'Clips every point from this PC’s vMix recording'].filter(Boolean).join(' · '))}</small>`;
    document.title = `${m.teamA ? m.teamA.shortName : ''} v ${m.teamB ? m.teamB.shortName : ''} · Volleyball Clipper`;
  }
  function renderChips() {
    const conn = C.connected ? '<span class="chip"><span class="dot ok"></span>Live</span>' : '<span class="chip"><span class="dot bad"></span>Offline</span>';
    $('#chips').innerHTML = (C.CL ? VBClipper.chip(C.CL) : '') + conn;
    const c = $('#clpChip'); if (c) c.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.__vbClipper = C;   // test hook
  VB.on('auth', (u) => { if (!u) gate('Signed out', 'Sign in again to keep clipping.', true); });
  boot();
})();
</script>
</body>
</html>
