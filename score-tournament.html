<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tournament Scorecard — Scorvix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Public cricket tournament scorecard powered by Scorvix">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --radius-lg:16px; --radius-md:12px; --radius-sm:8px; --font-display:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  :root[data-theme="dark"]{ --bg:#0a0e17; --bg-soft:#0d1220; --panel:#121826; --panel-2:#171f30; --border:#232c40; --border-soft:#1a2233; --text:#eef1f6; --text-dim:#8791a3; --text-faint:#576174; --accent:#22c55e; --accent-soft:rgba(34,197,94,.14); --accent-contrast:#06170c; --wicket:#ef4444; --wicket-soft:rgba(239,68,68,.16); --live:#ef4444; --shadow:0 8px 30px rgba(0,0,0,.35); --gradient-hero: radial-gradient(120% 140% at 15% -10%, rgba(34,197,94,.16), transparent 55%), radial-gradient(100% 120% at 100% 0%, rgba(168,85,247,.10), transparent 50%); }
  :root[data-theme="light"]{ --bg:#f4f6f8; --bg-soft:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --border:#e3e7ec; --border-soft:#ececf0; --text:#12161f; --text-dim:#5c6474; --text-faint:#99a1b0; --accent:#128a4a; --accent-soft:rgba(18,138,74,.10); --accent-contrast:#ffffff; --wicket:#d92b2b; --wicket-soft:rgba(217,43,43,.09); --live:#d92b2b; --shadow:0 8px 24px rgba(20,25,40,.08); --gradient-hero: radial-gradient(120% 140% at 15% -10%, rgba(18,138,74,.08), transparent 55%), radial-gradient(100% 120% at 100% 0%, rgba(138,31,212,.05), transparent 50%); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .25s ease,color .25s ease; padding-bottom:40px; }
  a{ color:inherit; text-decoration:none; }
  .tabnum{ font-variant-numeric:tabular-nums; }
  #brandbar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 18px; background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  #brand-id{ display:flex; align-items:center; gap:10px; min-width:0; }
  #brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  #brand-text .name{ font-family:var(--font-display); font-weight:800; font-size:15px; }
  #brand-text .tag{ font-size:10.5px; color:var(--text-dim); font-weight:600; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); cursor:pointer; color:var(--text-dim); }
  #wrap{ max-width:1040px; margin:20px auto; padding:0 16px; display:flex; flex-direction:column; gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow); }
  .section-title{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); margin-bottom:14px; }
  .section-title .dash{ width:14px; height:2px; background:var(--accent); border-radius:2px; }
  #tourney-hero{ position:relative; overflow:hidden; padding:22px; }
  #tourney-hero::before{ content:''; position:absolute; inset:0; background:var(--gradient-hero); pointer-events:none; }
  #tourney-name{ position:relative; font-family:var(--font-display); font-weight:800; font-size:clamp(20px,3.4vw,28px); }
  #tourney-meta{ position:relative; color:var(--text-dim); font-size:12.5px; font-weight:600; margin-top:4px; }
  .chip{ padding:3px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); font-size:11px; font-weight:700; }
  .chip.live{ background:rgba(239,68,68,.12); color:var(--live); border-color:transparent; display:inline-flex; align-items:center; gap:5px; }
  .chip.live .lv-dot{ width:6px; height:6px; border-radius:50%; background:var(--live); animation:pulseDot 1.4s infinite; }
  @keyframes pulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  #tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .tab-btn{ flex:none; padding:9px 16px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); font-weight:700; font-size:12.5px; color:var(--text-dim); cursor:pointer; white-space:nowrap; }
  .tab-btn.active{ background:var(--accent); color:var(--accent-contrast); border-color:transparent; }
  .tab-panel{ display:none; flex-direction:column; gap:14px; }
  .tab-panel.active{ display:flex; }
  .match-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .match-row:last-child{ border-bottom:none; }
  .match-row:hover{ background:var(--panel-2); border-radius:var(--radius-sm); }
  .match-teams{ font-weight:700; font-size:13.5px; }
  .match-meta{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .match-score{ text-align:right; font-size:12.5px; color:var(--text-dim); font-weight:600; flex:none; }
  .match-result{ font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; padding:0 8px 8px; border-bottom:1px solid var(--border); }
  thead th.num, td.num{ text-align:right; }
  #points-table th, #points-table td{ text-align:center; }
  #points-table th:first-child, #points-table td:first-child{ text-align:left; }
  tbody td{ padding:8px 8px; border-bottom:1px solid var(--border-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  .leaderboard-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  /* ============================================================
     LEADERBOARD — visual pass. Cricket-flavoured (Orange/Purple Cap
     framing, medal ranks, player avatars, relative form bars) instead
     of a plain data grid, while staying inside the existing token set
     (fonts/colors/radii) so it still reads as one coherent product.
     ============================================================ */
  .lb-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .cap-badge{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-display); font-weight:800; font-size:12.5px; letter-spacing:.2px; }
  .cap-badge .cap-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .cap-badge.orange .cap-dot{ background:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.18); }
  .cap-badge.purple .cap-dot{ background:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,.18); }
  .lb-leader-strip{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-md); margin-bottom:12px; border:1px solid var(--border-soft); }
  .lb-leader-strip.orange{ background:linear-gradient(90deg, rgba(249,115,22,.14), transparent 85%); }
  .lb-leader-strip.purple{ background:linear-gradient(90deg, rgba(168,85,247,.14), transparent 85%); }
  .lb-leader-strip .ls-label{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--text-faint); }
  .lb-leader-strip .ls-name{ font-family:var(--font-display); font-weight:800; font-size:14px; }
  .lb-leader-strip .ls-stat{ margin-left:auto; font-family:var(--font-display); font-weight:800; font-size:15px; }
  .lb-leader-strip.orange .ls-stat{ color:#f97316; }
  .lb-leader-strip.purple .ls-stat{ color:#a855f7; }
  .lb-table-wrap{ overflow-x:auto; }
  .rank-medal{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-family:var(--font-display); font-weight:800; font-size:10.5px; flex:none; }
  .rank-medal.r1{ background:linear-gradient(145deg,#ffe08a,#f5b93f); color:#5a3d00; }
  .rank-medal.r2{ background:linear-gradient(145deg,#e6e9ee,#b9c0cc); color:#3a3f47; }
  .rank-medal.r3{ background:linear-gradient(145deg,#e8b48a,#c67c46); color:#4a2c10; }
  .rank-medal.rn{ background:var(--panel-2); border:1px solid var(--border); color:var(--text-faint); }
  th.rank-col, td.rank-col{ width:30px; padding-right:2px; }
  .lb-player{ display:flex; align-items:center; gap:8px; min-width:0; }
  .lb-avatar{ width:24px; height:24px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:9.5px; color:#fff; }
  .lb-player-name{ display:flex; flex-direction:column; min-width:0; }
  .lb-player-name .nm{ font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }
  .lb-bar-track{ height:4px; border-radius:2px; background:var(--border-soft); margin-top:4px; width:100%; max-width:110px; overflow:hidden; }
  .lb-bar-fill{ height:100%; border-radius:2px; }
  .lb-bar-fill.orange{ background:linear-gradient(90deg,#fbbf24,#f97316); }
  .lb-bar-fill.purple{ background:linear-gradient(90deg,#d8b4fe,#a855f7); }
  tr.lb-row-top td{ background:color-mix(in srgb, var(--accent) 5%, transparent); }
  .lb-hs-cell.milestone{ color:var(--accent); font-weight:800; }
  .lb-best-cell.standout{ color:var(--wicket); font-weight:800; }
  .lb-search-wrap{ margin-bottom:10px; }
  .lb-search-input{ width:100%; padding:8px 12px; border-radius:99px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:var(--font-body); font-size:12.5px; }
  .lb-search-input:focus{ outline:none; border-color:var(--accent); }

  /* ---- Hero "at a glance" tournament stat strip ---- */
  #tourney-stats{ position:relative; display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .tstat-chip{ flex:1; min-width:92px; background:color-mix(in srgb, var(--panel) 55%, var(--panel-2)); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:9px 12px; }
  .tstat-chip .ts-v{ font-family:var(--font-display); font-weight:800; font-size:17px; }
  .tstat-chip .ts-k{ font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; margin-top:1px; }

  /* ---- Tournament Awards trophy cabinet ---- */
  #awards-card{ padding-bottom:14px; }
  .awards-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .award-card{ position:relative; overflow:hidden; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px; cursor:pointer; transition:transform .15s ease, border-color .15s ease; }
  .award-card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .award-card .aw-icon{ font-size:18px; line-height:1; }
  .award-card .aw-label{ font-family:var(--font-display); font-weight:800; font-size:11.5px; margin-top:6px; }
  .award-card .aw-sub{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.3px; font-weight:700; }
  .award-card .aw-player{ display:flex; align-items:center; gap:6px; margin-top:9px; }
  .award-card .aw-name{ font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .award-card .aw-value{ font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--accent); margin-top:5px; }

  /* ---- Points table: form guide + qualification zone ---- */
  .form-dot{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:4px; font-size:8.5px; font-weight:800; color:#fff; margin-right:2px; }
  .form-dot.win{ background:var(--accent); }
  .form-dot.loss{ background:var(--wicket); }
  .form-dot.tie{ background:#a1a1aa; }
  tr.pt-qualify td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
  tr.pt-divider td{ padding:4px 8px; font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); text-align:center; border-bottom:1px dashed var(--border); background:var(--panel-2); font-weight:700; }
  .empty-state{ text-align:center; color:var(--text-faint); padding:30px 10px; font-size:13px; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .live-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; background:var(--panel-2); border-radius:var(--radius-md); border:1px solid var(--border-soft); }
  .watch-btn{ padding:8px 16px; border-radius:99px; background:var(--accent); color:var(--accent-contrast); font-weight:700; font-size:12.5px; flex:none; }
  footer{ text-align:center; padding:22px 10px 4px; color:var(--text-faint); font-size:11.5px; }
  footer a{ color:var(--accent); font-weight:700; }
  @media (max-width:700px){ .leaderboard-grid{ grid-template-columns:1fr; } }

  /* ============================================================
     LEADERBOARD PLAYER CLIPS — same clip icon/list/video-modal
     pattern as cricket-scorecard.html and score-match.html, but the
     modal body here is organised MATCH BY MATCH across the whole
     tournament (opponent + that match's runs/wickets line, then that
     match's own Four/Six/Dismissal clips) rather than one flat list.
     ============================================================ */
  th.clip-col, td.clip-col{ width:34px; text-align:center; padding-left:0; padding-right:6px; }
  .clip-btn{ width:26px; height:26px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .clip-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .clip-btn svg{ width:12px; height:12px; }
  #clip-modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(4,6,10,.7); z-index:100; align-items:center; justify-content:center; padding:16px; }
  #clip-modal-backdrop.open{ display:flex; }
  #clip-modal{ width:min(520px, 100%); max-height:82vh; overflow-y:auto; background:var(--panel); border-radius:var(--radius-lg); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #clip-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); z-index:1; }
  #clip-modal-head h3{ margin:0; font-family:var(--font-display); font-size:14.5px; font-weight:700; }
  #clip-modal-close{ width:28px; height:28px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #clip-modal-body{ padding:12px 14px 18px; }
  .cd-stat-row{ display:flex; gap:8px; }
  .cd-stat-box{ flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; text-align:center; }
  .cd-stat-box .k{ font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; }
  .cd-stat-box .v{ font-family:var(--font-display); font-weight:800; font-size:14px; margin-top:2px; }
  .clip-group-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); margin:12px 0 6px; }
  .clip-row{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); margin-bottom:8px; cursor:pointer; }
  .clip-row:hover{ border-color:var(--accent); }
  .clip-row .cr-badge{ width:26px; height:26px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; color:#fff; }
  .clip-row .cr-badge.four{ background:#3b82f6; } .clip-row .cr-badge.six{ background:#a855f7; } .clip-row .cr-badge.wicket{ background:var(--wicket); }
  .clip-row .cr-info{ flex:1; min-width:0; }
  .clip-row .cr-over{ font-weight:700; font-size:12.5px; font-family:var(--font-display); }
  .clip-row .cr-sub{ font-size:11px; color:var(--text-dim); margin-top:1px; }
  .clip-watch-btn{ width:28px; height:28px; border-radius:99px; background:var(--accent-soft); color:var(--accent); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .clip-watch-btn svg{ width:12px; height:12px; }
  .clip-watch-btn:disabled{ opacity:.35; cursor:default; }
  /* One block per match inside the "Tournament Report" modal — a small
     card so a player's clips read as an organised, professional
     match-by-match breakdown rather than one undifferentiated list. */
  .tpm-match{ border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px; margin-top:12px; }
  .tpm-match-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .tpm-vs{ font-family:var(--font-display); font-weight:700; font-size:13px; }
  .tpm-date{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .tpm-statline{ font-size:12.5px; font-weight:700; color:var(--accent); margin-top:4px; }
  #video-modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:110; align-items:center; justify-content:center; padding:16px; }
  #video-modal-backdrop.open{ display:flex; }
  #video-modal{ width:min(720px,100%); background:#000; border-radius:var(--radius-lg); overflow:hidden; }
  #video-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#0b0e14; }
  #video-modal-head .vm-title{ color:#fff; font-size:12.5px; font-weight:700; }
  #video-modal-close{ width:28px; height:28px; border-radius:99px; background:rgba(255,255,255,.1); color:#fff; border:none; cursor:pointer; }
  #video-modal video{ width:100%; display:block; max-height:70vh; background:#000; }
  #video-modal-loading{ color:#fff; text-align:center; padding:60px 0; font-size:12.5px; }
</style>
</head>
<body>

<div id="brandbar">
  <div id="brand-id">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M9 22.5c4-5.5 6.5-9 12-13.5" stroke="var(--accent-contrast)" stroke-width="2.1" stroke-linecap="round"/><circle cx="22.5" cy="8.7" r="2.6" fill="var(--accent-contrast)"/></svg>
    <div id="brand-text"><span class="name">Tournament by Scorvix</span><span class="tag">Public tournament portal</span></div>
  </div>
  <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
    <svg id="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
  </button>
</div>

<div id="wrap">
  <div id="loading-state" class="card"><div class="empty-state"><div class="spinner"></div>Loading tournament…</div></div>
  <div id="content" style="display:none;"></div>
</div>

<footer>Powered by <a href="/">Scorvix</a> — live scoring &amp; broadcast graphics</footer>

<!-- Leaderboard player clips — tournament-wide, match-by-match -->
<div id="clip-modal-backdrop">
  <div id="clip-modal">
    <div id="clip-modal-head">
      <h3 id="clip-modal-title">Clips</h3>
      <button id="clip-modal-close" aria-label="Close">✕</button>
    </div>
    <div id="clip-modal-body"></div>
  </div>
</div>

<!-- Video player -->
<div id="video-modal-backdrop">
  <div id="video-modal">
    <div id="video-modal-head">
      <span class="vm-title" id="video-modal-title">Clip</span>
      <button id="video-modal-close" aria-label="Close">✕</button>
    </div>
    <div id="video-modal-body"><div id="video-modal-loading">Loading clip…</div></div>
  </div>
</div>

<script>
const SUN='M12 4V2M12 22v-2M4.93 4.93 3.51 3.51M20.49 20.49l-1.42-1.42M4 12H2M22 12h-2M4.93 19.07l-1.42 1.42M20.49 3.51l-1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z';
const MOON='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z';
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); document.getElementById('theme-icon').innerHTML=`<path d="${t==='dark'?SUN:MOON}"/>`; try{ localStorage.setItem('scorvix-theme',t); }catch(e){} }
applyTheme((()=>{ try{ return localStorage.getItem('scorvix-theme'); }catch(e){ return null; } })() || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('theme-toggle').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtOvers(o,b){ return `${o||0}.${b||0}`; }
function strikeRate(r,b){ return b?((r/b)*100).toFixed(1):'0.0'; }
function economy(r,o,b){ const of=(o||0)+((b||0)/6); return of?(r/of).toFixed(2):'0.00'; }
function resultText(m){
  if(m.winningTeam==='TIE') return 'Match Tied';
  if(m.winningTeam==='A') return `${m.teamA.short||m.teamA.name} won`;
  if(m.winningTeam==='B') return `${m.teamB.short||m.teamB.name} won`;
  return 'In progress';
}

/* ---- Leaderboard visual helpers (avatars, medals, form bars, cap strip) ---- */
const AVATAR_PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#0ea5e9'];
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length-1][0] : '')).toUpperCase();
}
function avatarColor(name){
  const s = String(name||'');
  let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function rankMedalHtml(i){
  const cls = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
  return `<span class="rank-medal ${cls}">${i+1}</span>`;
}
function lbPlayerCellHtml(name){
  return `<div class="lb-player"><div class="lb-avatar" style="background:${avatarColor(name)}">${initials(name)}</div>
    <div class="lb-player-name"><span class="nm">${escapeHtml(name)}</span></div></div>`;
}
function barHtml(value, max, variant){
  const pct = max > 0 ? Math.max(4, Math.round((value / max) * 100)) : 0;
  return `<div class="lb-bar-track"><div class="lb-bar-fill ${variant}" style="width:${pct}%"></div></div>`;
}

function runsLeaderboardHtml(rows){
  const leader = rows[0];
  const maxRuns = Math.max(...rows.map(r => r.runs), 1);
  const strip = leader ? `<div class="lb-leader-strip orange"><div class="lb-avatar" style="background:${avatarColor(leader.name)}">${initials(leader.name)}</div>
    <div><div class="ls-label">Orange Cap holder</div><div class="ls-name">${escapeHtml(leader.name)}</div></div>
    <div class="ls-stat tabnum">${leader.runs} runs</div></div>` : '';
  const rowsHtml = rows.map((r, i) => `<tr class="${i===0?'lb-row-top':''}">
      <td class="rank-col">${rankMedalHtml(i)}</td>
      <td>${lbPlayerCellHtml(r.name)}${barHtml(r.runs, maxRuns, 'orange')}</td>
      <td class="num tabnum">${r.innings}</td>
      <td class="num tabnum" style="font-weight:800;">${r.runs}</td>
      <td class="num tabnum lb-hs-cell${r.highScore>=50?' milestone':''}">${r.highScore}</td>
      <td class="num tabnum">${r.average}</td>
      <td class="num tabnum">${r.strikeRate}</td>
      <td class="clip-col">${clipBtnHtml(r.name, 'batter')}</td>
    </tr>`).join('');
  return `${strip}<div class="lb-table-wrap"><table><thead><tr><th class="rank-col"></th><th>Batter</th><th class="num">Inn</th><th class="num">Runs</th><th class="num">HS</th><th class="num">Avg</th><th class="num">SR</th><th class="clip-col"></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`;
}

function wicketsLeaderboardHtml(rows){
  const leader = rows[0];
  const maxWkts = Math.max(...rows.map(r => r.wickets), 1);
  const strip = leader ? `<div class="lb-leader-strip purple"><div class="lb-avatar" style="background:${avatarColor(leader.name)}">${initials(leader.name)}</div>
    <div><div class="ls-label">Purple Cap holder</div><div class="ls-name">${escapeHtml(leader.name)}</div></div>
    <div class="ls-stat tabnum">${leader.wickets} wkts</div></div>` : '';
  const rowsHtml = rows.map((r, i) => {
    const bestWkts = parseInt(String(r.bestFigures).split('/')[0], 10) || 0;
    return `<tr class="${i===0?'lb-row-top':''}">
      <td class="rank-col">${rankMedalHtml(i)}</td>
      <td>${lbPlayerCellHtml(r.name)}${barHtml(r.wickets, maxWkts, 'purple')}</td>
      <td class="num tabnum">${r.innings}</td>
      <td class="num tabnum">${r.overs}</td>
      <td class="num tabnum" style="font-weight:800;">${r.wickets}</td>
      <td class="num tabnum lb-best-cell${bestWkts>=4?' standout':''}">${escapeHtml(r.bestFigures)}</td>
      <td class="num tabnum">${r.economy}</td>
      <td class="clip-col">${clipBtnHtml(r.name, 'bowler')}</td>
    </tr>`;
  }).join('');
  return `${strip}<div class="lb-table-wrap"><table><thead><tr><th class="rank-col"></th><th>Bowler</th><th class="num">Inn</th><th class="num">Ov</th><th class="num">Wkts</th><th class="num">Best</th><th class="num">Econ</th><th class="clip-col"></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`;
}

/* ---- Tournament-wide "at a glance" stats, computed from every saved
   match's full battingCard/bowlingCard (not just the top-15 leaderboard
   rows), so these totals are the real tournament totals. ---- */
function computeTourneyGlance(matches){
  let totalRuns=0, totalSixes=0, totalFours=0, totalWickets=0, highestScore=0, highestScorer='';
  matches.forEach(m => {
    ['A','B'].forEach(k => {
      (m.battingCard && m.battingCard[k] || []).forEach(b => {
        totalRuns += b.runs||0; totalSixes += b.sixes||0; totalFours += b.fours||0;
        if((b.runs||0) > highestScore){ highestScore = b.runs||0; highestScorer = b.name||''; }
      });
      (m.bowlingCard && m.bowlingCard[k] || []).forEach(b => { totalWickets += b.wickets||0; });
    });
  });
  return { totalRuns, totalSixes, totalFours, totalWickets, highestScore, highestScorer };
}
function heroStatsHtml(glance){
  const chips = [
    { v: glance.totalRuns, k: 'Total Runs' },
    { v: glance.totalWickets, k: 'Total Wickets' },
    { v: glance.totalSixes, k: 'Sixes' },
    { v: glance.totalFours, k: 'Fours' },
  ];
  if(glance.highestScore) chips.push({ v: glance.highestScore, k: `Best Knock${glance.highestScorer ? ' · ' + glance.highestScorer : ''}` });
  return `<div id="tourney-stats">${chips.map(c => `<div class="tstat-chip"><div class="ts-v tabnum">${c.v}</div><div class="ts-k">${escapeHtml(c.k)}</div></div>`).join('')}</div>`;
}

/* ---- Tournament Awards — derived entirely from the leaderboard rows
   already loaded (topRuns/topWickets), no extra requests needed. Small
   sample-size guards (min balls/overs) stop a one-ball cameo from
   "winning" Best Strike Rate or Best Economy. ---- */
function computeAwards(lb){
  const topRuns = lb.topRuns || [], topWickets = lb.topWickets || [];
  const awards = [];
  if(topRuns.length) awards.push({ icon:'🏏', label:'Orange Cap', sub:'Most Runs', name:topRuns[0].name, value:`${topRuns[0].runs} runs` });
  if(topWickets.length) awards.push({ icon:'🎯', label:'Purple Cap', sub:'Most Wickets', name:topWickets[0].name, value:`${topWickets[0].wickets} wkts` });
  const byHS = topRuns.slice().sort((a,b) => b.highScore - a.highScore)[0];
  if(byHS && byHS.highScore > 0) awards.push({ icon:'💯', label:'Best Knock', sub:'Highest Score', name:byHS.name, value:`${byHS.highScore}` });
  const bySixes = topRuns.slice().sort((a,b) => b.sixes - a.sixes)[0];
  if(bySixes && bySixes.sixes > 0) awards.push({ icon:'🚀', label:'Biggest Hitter', sub:'Most Sixes', name:bySixes.name, value:`${bySixes.sixes} sixes` });
  const bySR = topRuns.filter(r => r.balls >= 10).sort((a,b) => b.strikeRate - a.strikeRate)[0];
  if(bySR) awards.push({ icon:'⚡', label:'Fastest Scorer', sub:'Best Strike Rate (min. 10b)', name:bySR.name, value:`SR ${bySR.strikeRate}` });
  const byEcon = topWickets.filter(r => r.overs >= 2).sort((a,b) => a.economy - b.economy)[0];
  if(byEcon) awards.push({ icon:'🧊', label:'Most Economical', sub:'Best Economy (min. 2ov)', name:byEcon.name, value:`${byEcon.economy} RPO` });
  return awards;
}
function awardCardHtml(a){
  return `<div class="award-card" data-player="${escapeHtml(a.name)}">
    <div class="aw-icon">${a.icon}</div>
    <div class="aw-label">${escapeHtml(a.label)}</div>
    <div class="aw-sub">${escapeHtml(a.sub)}</div>
    <div class="aw-player"><div class="lb-avatar" style="width:20px;height:20px;font-size:8.5px;background:${avatarColor(a.name)}">${initials(a.name)}</div><div class="aw-name">${escapeHtml(a.name)}</div></div>
    <div class="aw-value tabnum">${a.value}</div>
  </div>`;
}

/* ---- Points table form guide — each team's last 5 completed results,
   as W/L/T dots, keyed the same way computePointsTable keys teams
   server-side (full team name, trimmed + lowercased) so the two line
   up regardless of whether the UI displays short names elsewhere. ---- */
function computeFormGuide(matches){
  const form = {};
  const finished = matches.filter(m => m.winningTeam).slice().sort((a,b) => new Date(a.savedAt||0) - new Date(b.savedAt||0));
  finished.forEach(m => {
    const aKey = ((m.teamA && m.teamA.name) || '').trim().toLowerCase();
    const bKey = ((m.teamB && m.teamB.name) || '').trim().toLowerCase();
    if(!aKey || !bKey) return;
    if(!form[aKey]) form[aKey] = [];
    if(!form[bKey]) form[bKey] = [];
    if(m.winningTeam === 'TIE'){ form[aKey].push('T'); form[bKey].push('T'); }
    else if(m.winningTeam === 'A'){ form[aKey].push('W'); form[bKey].push('L'); }
    else if(m.winningTeam === 'B'){ form[aKey].push('L'); form[bKey].push('W'); }
  });
  Object.keys(form).forEach(k => { form[k] = form[k].slice(-5); });
  return form;
}
function formDotsHtml(seq){
  if(!seq || !seq.length) return '<span style="color:var(--text-faint); font-size:11px;">—</span>';
  return seq.map(r => `<span class="form-dot ${r==='W'?'win':r==='L'?'loss':'tie'}" title="${r==='W'?'Won':r==='L'?'Lost':'Tied'}">${r}</span>`).join('');
}

function pathParts(){ return location.pathname.split('/').filter(Boolean); } // ['score','tournament',token,'match'?,matchId?]

async function init(){
  const parts = pathParts();
  const token = decodeURIComponent(parts[2] || '');
  const matchId = parts[3] === 'match' ? decodeURIComponent(parts[4] || '') : null;
  if(!token){ showEmpty('No tournament specified.'); return; }
  try{
    if(matchId){
      // Past matches render through the exact same page (same hero, same
      // tables, same clip icons) that live matches use — cricket-scorecard.html
      // in "history" mode. This keeps ONE code path for every match view
      // instead of a second, clip-less renderer living here, so a match's
      // clips only ever load through the one place that scopes them by
      // matchId (fetchMatchClips / fetchTeamClips / fetchPlayerClips) —
      // no chance of one match's clips showing up under another.
      location.replace(`/cricket-scorecard?token=${encodeURIComponent(token)}&match=${encodeURIComponent(matchId)}&history=1`);
      return;
    } else {
      const res = await fetch(`/api/public/tournament/${encodeURIComponent(token)}`);
      const data = await res.json();
      if(data && data.success){ renderPortal(data, token); }
      else { showEmpty(data.error || 'Tournament not found.'); }
    }
  }catch(e){ showEmpty('Could not load this tournament right now — please try again shortly.'); }
}
function showEmpty(msg){
  document.getElementById('loading-state').style.display='none';
  const c = document.getElementById('content'); c.style.display='';
  c.innerHTML = `<div class="card"><div class="empty-state">${escapeHtml(msg)}</div></div>`;
}

/* ---- Tournament portal (live + previous + points table + leaderboards) ---- */
function renderPortal(data, token){
  document.getElementById('loading-state').style.display='none';
  const c = document.getElementById('content'); c.style.display='';
  document.title = `${data.displayName} — Scorvix`;
  // Stashed so the leaderboard clip icons (wired further below) can look
  // up this tournament's own match list + token without re-fetching the
  // portal payload — buildTournamentPlayerReport() reads these.
  tournamentDataCache = data;
  tournamentTokenCache = token;

  const matches = data.matches || [];
  const finished = matches.filter(m => m.winningTeam);
  const inProgress = matches.filter(m => !m.winningTeam);
  const isLive = !!(data.live && data.live.roomId);
  const glance = computeTourneyGlance(matches);

  const heroCard = `
  <div class="card" id="tourney-hero">
    <div id="tourney-name">${escapeHtml(data.displayName)}</div>
    <div id="tourney-meta">${matches.length} match${matches.length===1?'':'es'} played${isLive ? ' · <span class="chip live"><span class="lv-dot"></span>Live now</span>' : ''}</div>
    ${matches.length ? heroStatsHtml(glance) : ''}
  </div>`;

  const lb = data.leaderboards || { topRuns: [], topWickets: [] };
  const awards = computeAwards(lb);
  const awardsCard = awards.length ? `
  <div class="card" id="awards-card">
    <div class="section-title"><span class="dash"></span>Tournament Awards</div>
    <div class="awards-grid">${awards.map(awardCardHtml).join('')}</div>
  </div>` : '';

  const tabsCard = `
  <div id="tabs">
    <button class="tab-btn active" data-tab="matches">Matches</button>
    <button class="tab-btn" data-tab="points">Points Table</button>
    <button class="tab-btn" data-tab="leaderboards">Leaderboards</button>
  </div>`;

  const liveHtml = isLive ? `
    <div class="card"><div class="section-title"><span class="dash"></span>Live Now</div>
      <div class="live-card">
        <div><div class="match-teams">Match in progress</div><div class="match-meta">Follow ball-by-ball updates</div></div>
        <a class="watch-btn" href="/cricket-scorecard?room=${encodeURIComponent(data.live.roomId)}">Watch Live →</a>
      </div>
    </div>` : '';

  const matchRow = (m) => `
    <div class="match-row" data-goto-match="${escapeHtml(m.matchId)}">
      <div>
        <div class="match-teams">${escapeHtml(m.teamA.short||m.teamA.name)} vs ${escapeHtml(m.teamB.short||m.teamB.name)}</div>
        <div class="match-meta">${escapeHtml(m.venue||'')}${m.venue?' · ':''}${m.savedAt ? new Date(m.savedAt).toLocaleDateString() : ''}</div>
      </div>
      <div class="match-score">
        <div class="tabnum">${m.scoreA.runs}-${m.scoreA.wickets} / ${m.scoreB.runs}-${m.scoreB.wickets}</div>
        <div class="match-result">${escapeHtml(resultText(m))}</div>
      </div>
    </div>`;

  const previousHtml = finished.length
    ? `<div class="card"><div class="section-title"><span class="dash"></span>Previous Matches</div>${finished.slice().reverse().map(matchRow).join('')}</div>`
    : `<div class="card"><div class="empty-state">No completed matches yet.</div></div>`;

  const inProgressHtml = inProgress.length
    ? `<div class="card"><div class="section-title"><span class="dash"></span>In Progress</div>${inProgress.map(matchRow).join('')}</div>` : '';

  // Upcoming fixtures aren't part of the current data model (the panel has
  // no "schedule a future match" feature yet — matches only exist once
  // they've started being scored) — shown honestly as empty rather than
  // faked.
  const upcomingHtml = `<div class="card"><div class="section-title"><span class="dash"></span>Upcoming Matches</div><div class="empty-state">No upcoming fixtures scheduled yet.</div></div>`;

  const matchesPanel = `<div class="tab-panel active" data-panel="matches">${liveHtml}${inProgressHtml}${previousHtml}${upcomingHtml}</div>`;

  const pt = data.pointsTable || [];
  const formGuide = computeFormGuide(matches);
  const qualifyCount = pt.length > 4 ? 4 : Math.ceil(pt.length / 2);
  const pointsRowHtml = (r, i) => `<tr class="${i < qualifyCount ? 'pt-qualify' : ''}"><td>${escapeHtml(r.team)}</td><td class="num tabnum">${r.played}</td><td class="num tabnum">${r.won}</td><td class="num tabnum">${r.lost}</td><td class="num tabnum">${r.tied}</td><td class="num tabnum">${r.points}</td><td class="num tabnum">${r.nrr>0?'+':''}${r.nrr}</td><td>${formDotsHtml(formGuide[r.team.trim().toLowerCase()])}</td></tr>`;
  const pointsRows = pt.map(pointsRowHtml);
  if(qualifyCount > 0 && qualifyCount < pt.length) pointsRows.splice(qualifyCount, 0, `<tr class="pt-divider"><td colspan="8">Qualification line</td></tr>`);
  const pointsPanel = `<div class="tab-panel" data-panel="points">
    <div class="card"><div class="section-title"><span class="dash"></span>Points Table</div>
      ${pt.length ? `<div class="lb-table-wrap"><table id="points-table"><thead><tr><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">T</th><th class="num">Pts</th><th class="num">NRR</th><th>Form</th></tr></thead>
      <tbody>${pointsRows.join('')}</tbody></table></div>`
      : '<div class="empty-state">No matches played yet.</div>'}
    </div>
  </div>`;

  const leaderboardsPanel = `<div class="tab-panel" data-panel="leaderboards">
    <div class="leaderboard-grid">
      <div class="card">
        <div class="lb-card-head"><div class="section-title" style="margin-bottom:0;"><span class="dash"></span>Top Run Scorers</div>${lb.topRuns.length ? `<span class="cap-badge orange"><span class="cap-dot"></span>Orange Cap</span>` : ''}</div>
        ${lb.topRuns.length ? `<div class="lb-search-wrap"><input class="lb-search-input" type="text" placeholder="Search batters…"></div>${runsLeaderboardHtml(lb.topRuns)}` : '<div class="empty-state">No batting data yet.</div>'}
      </div>
      <div class="card">
        <div class="lb-card-head"><div class="section-title" style="margin-bottom:0;"><span class="dash"></span>Top Wicket Takers</div>${lb.topWickets.length ? `<span class="cap-badge purple"><span class="cap-dot"></span>Purple Cap</span>` : ''}</div>
        ${lb.topWickets.length ? `<div class="lb-search-wrap"><input class="lb-search-input" type="text" placeholder="Search bowlers…"></div>${wicketsLeaderboardHtml(lb.topWickets)}` : '<div class="empty-state">No bowling data yet.</div>'}
      </div>
    </div>
  </div>`;

  c.innerHTML = heroCard + awardsCard + tabsCard + matchesPanel + pointsPanel + leaderboardsPanel;

  c.querySelectorAll('.award-card').forEach(card => card.addEventListener('click', () => openTournamentPlayerModal(card.dataset.player)));
  c.querySelectorAll('.lb-search-input').forEach(inp => inp.addEventListener('input', () => {
    const term = inp.value.trim().toLowerCase();
    const wrap = inp.closest('.card').querySelector('.lb-table-wrap');
    if(!wrap) return;
    wrap.querySelectorAll('tbody tr').forEach(tr => {
      const nameEl = tr.querySelector('.nm');
      const name = nameEl ? nameEl.textContent.toLowerCase() : '';
      tr.style.display = (!term || name.includes(term)) ? '' : 'none';
    });
  }));

  c.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    c.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    c.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    c.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
  }));
  c.querySelectorAll('[data-goto-match]').forEach(row => row.addEventListener('click', () => {
    // Same destination as the matchId branch in init() above — one single
    // place (cricket-scorecard.html, history mode) renders every past
    // match, clips included, correctly scoped to that one matchId.
    location.href = `/cricket-scorecard?token=${encodeURIComponent(token)}&match=${encodeURIComponent(row.dataset.gotoMatch)}&history=1`;
  }));
}

/* ============================================================
   LEADERBOARD PLAYER CLIPS — tournament-wide, organised match by
   match. Reuses the exact endpoints the rest of the app already
   relies on for a public (token-scoped) link, so no new backend
   surface is needed:
     - /api/public/tournament/:token/match/:matchId  → that ONE
       match's full saved scorecard (battingCard/bowlingCard), same
       endpoint cricket-scorecard.html's loadMatchSnapshot() uses.
     - /api/clips/player/:playerKey?scope=match&matchId=…  → that
       player's clips for that one match, same endpoint
       score-match.html's clip modal uses.
   For every match in this tournament we check whether the tapped
   player actually appears in that match's card, pull their line for
   it, and fetch that match's clips for them — then render one
   compact "match card" per appearance instead of one flat list, so a
   viewer can see exactly how the player did IN EACH match along with
   that match's own 4s/6s/dismissal clips.
   ============================================================ */
let tournamentDataCache = null;
let tournamentTokenCache = '';
const matchSnapshotCache = {}; // matchId -> saved match record | null (cached across every player's modal)

const CLIP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

// Mirrors the server's playerKey() exactly (name.trim().toLowerCase()).
function playerKeyOf(name){ return String(name||'').trim().toLowerCase() || null; }
function clipApiBase(){ return ''; }

function clipBtnHtml(name, role){
  if(!name) return '';
  return `<button class="clip-btn" data-player="${escapeHtml(name)}" data-role="${role}" aria-label="Clips for ${escapeHtml(name)}">${CLIP_ICON}</button>`;
}

async function fetchMatchSnapshot(matchId){
  if(Object.prototype.hasOwnProperty.call(matchSnapshotCache, matchId)) return matchSnapshotCache[matchId];
  try{
    const res = await fetch(`${clipApiBase()}/api/public/tournament/${encodeURIComponent(tournamentTokenCache)}/match/${encodeURIComponent(matchId)}`);
    const data = await res.json();
    const match = (data && data.success && data.match) || null;
    matchSnapshotCache[matchId] = match;
    return match;
  } catch(err){ console.warn('Match snapshot fetch failed', err); matchSnapshotCache[matchId] = null; return null; }
}

async function fetchClipsForMatch(name, matchId){
  const pk = playerKeyOf(name);
  if(!pk) return null;
  try{
    const res = await fetch(`${clipApiBase()}/api/clips/player/${encodeURIComponent(pk)}?scope=match&matchId=${encodeURIComponent(matchId)}`);
    if(!res.ok) return null;
    return await res.json();
  } catch(err){ console.warn('Clip fetch failed', err); return null; }
}

function findPlayerRow(card, name){
  const pk = playerKeyOf(name);
  return (card || []).find(r => playerKeyOf(r.name) === pk) || null;
}

// For one match: figure out whether/where this player appears (which
// team's card, so we can label the opponent correctly), pull BOTH their
// batting and bowling lines for that match (a player can bat in one
// match and only bowl in another, or do both in the same one), and
// fetch every clip category for them in this match — fours, sixes,
// dismissal AND wickets together, not just whichever discipline the
// leaderboard button happened to be clicked from. Returns null only if
// the player didn't feature in this match at all.
async function buildMatchEntry(matchSummary, name){
  const snap = await fetchMatchSnapshot(matchSummary.matchId);
  if(!snap) return null;

  let teamKey = null, battingRow = null, bowlingRow = null;
  if(snap.battingCard){
    if(findPlayerRow(snap.battingCard.A, name)){ teamKey = 'A'; battingRow = findPlayerRow(snap.battingCard.A, name); }
    else if(findPlayerRow(snap.battingCard.B, name)){ teamKey = 'B'; battingRow = findPlayerRow(snap.battingCard.B, name); }
  }
  if(snap.bowlingCard){
    if(findPlayerRow(snap.bowlingCard.A, name)){ teamKey = teamKey || 'A'; bowlingRow = findPlayerRow(snap.bowlingCard.A, name); }
    else if(findPlayerRow(snap.bowlingCard.B, name)){ teamKey = teamKey || 'B'; bowlingRow = findPlayerRow(snap.bowlingCard.B, name); }
  }
  if(!teamKey) return null; // didn't feature in this match

  const oppTeamObj = (teamKey === 'A' ? snap.teamB : snap.teamA) || (teamKey === 'A' ? matchSummary.teamB : matchSummary.teamA);
  const opponent = (oppTeamObj && (oppTeamObj.short || oppTeamObj.name)) || 'Opponent';

  // CLIPS SCOPE FIX: clips are tagged with the live room id at capture
  // time, not with the tournament match's own database matchId — same
  // fix as cricket-scorecard.html's getClipMatchId(). Use the room id
  // the snapshot carries (once the backend sends it) and only fall back
  // to matchSummary.matchId when it's missing.
  const clipMatchId = snap.roomId || matchSummary.matchId;
  const clipsData = await fetchClipsForMatch(name, clipMatchId);
  return {
    matchId: matchSummary.matchId, opponent,
    venue: matchSummary.venue || '', savedAt: matchSummary.savedAt || null,
    battingRow, bowlingRow, clipsData
  };
}

async function buildTournamentPlayerReport(name){
  const matches = (tournamentDataCache && tournamentDataCache.matches) || [];
  const entries = await Promise.all(matches.map(m => buildMatchEntry(m, name)));
  return entries.filter(Boolean).sort((a, b) => new Date(b.savedAt || 0) - new Date(a.savedAt || 0));
}

function battingStatLine(statRow){
  const notOutTag = statRow.out === false ? '*' : '';
  return `Bat: ${statRow.runs||0}${notOutTag} (${statRow.balls||0}b) · 4s ${statRow.fours||0} · 6s ${statRow.sixes||0} · SR ${strikeRate(statRow.runs||0, statRow.balls||0)}`;
}
function bowlingStatLine(statRow){
  return `Bowl: ${statRow.wickets||0}-${statRow.runs||0} (${fmtOvers(statRow.overs, statRow.balls)} ov) · Econ ${economy(statRow.runs||0, statRow.overs, statRow.balls)}`;
}

function clipGroupHtml(label, clips){
  if(!clips || !clips.length) return '';
  return `<div class="clip-group-label">${escapeHtml(label)} (${clips.length})</div>` + clips.map(clipRowHtml).join('');
}

function clipRowHtml(c){
  const badgeCls = c.eventType === 'FOUR' ? 'four' : c.eventType === 'SIX' ? 'six' : 'wicket';
  const badgeLabel = c.eventType === 'FOUR' ? '4' : c.eventType === 'SIX' ? '6' : 'W';
  const overLabel = `${c.over ?? '—'}.${c.ballInOver ?? ''}`;
  const sub = c.eventType === 'WICKET'
    ? [c.dismissalType, c.bowler ? 'b. ' + c.bowler : null].filter(Boolean).join(' · ')
    : (c.bowler ? 'off ' + c.bowler : '');
  const disabled = c.ready ? '' : 'disabled';
  return `<div class="clip-row" data-clip-id="${c.clipId}" data-title="${escapeHtml((c.striker||c.bowler||'') + ' — ' + c.eventType)}">
    <div class="cr-badge ${badgeCls}">${badgeLabel}</div>
    <div class="cr-info"><div class="cr-over tabnum">Over ${overLabel}</div><div class="cr-sub">${escapeHtml(sub || (c.ready ? 'Tap to watch' : 'Processing…'))}</div></div>
    <button class="clip-watch-btn" ${disabled} aria-label="Watch">${PLAY_ICON}</button>
  </div>`;
}

function wireClipRows(root){
  root.querySelectorAll('.clip-row').forEach(row => {
    const id = row.dataset.clipId, title = row.dataset.title;
    const watchBtn = row.querySelector('.clip-watch-btn');
    if(watchBtn && !watchBtn.disabled) watchBtn.addEventListener('click', (e) => { e.stopPropagation(); openVideoModal(id, title); });
    row.addEventListener('click', () => { if(watchBtn && !watchBtn.disabled) openVideoModal(id, title); });
  });
}

function matchEntryHtml(entry){
  const dateStr = entry.savedAt ? new Date(entry.savedAt).toLocaleDateString() : '';
  const statLines = [];
  if(entry.battingRow) statLines.push(battingStatLine(entry.battingRow));
  if(entry.bowlingRow) statLines.push(bowlingStatLine(entry.bowlingRow));

  // All clip categories for this match, together, regardless of which
  // leaderboard (batting or bowling) the modal was opened from — a
  // six and the wicket that dismissed the same player both belong to
  // the same match card.
  let clipsHtml = '';
  if(entry.clipsData && entry.clipsData.success){
    clipsHtml = clipGroupHtml('Sixes', entry.clipsData.batting.sixes)
      + clipGroupHtml('Fours', entry.clipsData.batting.fours)
      + clipGroupHtml('Wickets', entry.clipsData.bowling.wickets)
      + clipGroupHtml('Dismissal', entry.clipsData.batting.dismissal);
  }
  if(!clipsHtml) clipsHtml = '<div class="empty-state" style="padding:8px 0;">No clips recorded for this match.</div>';
  return `<div class="tpm-match">
    <div class="tpm-match-head">
      <div class="tpm-vs">vs ${escapeHtml(entry.opponent)}</div>
      <div class="tpm-date">${escapeHtml(dateStr)}${entry.venue ? ' · ' + escapeHtml(entry.venue) : ''}</div>
    </div>
    ${statLines.map(s => `<div class="tpm-statline">${escapeHtml(s)}</div>`).join('')}
    ${clipsHtml}
  </div>`;
}

// Aggregate line across every match shown, so the modal opens on a
// tournament-wide total before drilling into the match-by-match cards.
// Shows whichever discipline(s) the player actually has entries for —
// an all-rounder gets both a batting line and a bowling line here.
function summaryLineHtml(entries){
  let runs = 0, balls = 0, battingMatches = 0;
  let wkts = 0, bowlRuns = 0, bowlBalls = 0, bowlingMatches = 0;
  entries.forEach(e => {
    if(e.battingRow){ battingMatches++; runs += e.battingRow.runs || 0; balls += e.battingRow.balls || 0; }
    if(e.bowlingRow){ bowlingMatches++; wkts += e.bowlingRow.wickets || 0; bowlRuns += e.bowlingRow.runs || 0; bowlBalls += (e.bowlingRow.overs || 0) * 6 + (e.bowlingRow.balls || 0); }
  });
  const boxes = [`<div class="cd-stat-box"><div class="k">Matches</div><div class="v tabnum">${entries.length}</div></div>`];
  if(battingMatches){
    boxes.push(`<div class="cd-stat-box"><div class="k">Runs</div><div class="v tabnum">${runs}</div></div>`);
    boxes.push(`<div class="cd-stat-box"><div class="k">SR</div><div class="v tabnum">${strikeRate(runs, balls)}</div></div>`);
  }
  if(bowlingMatches){
    const econ = bowlBalls ? (bowlRuns / (bowlBalls / 6)).toFixed(2) : '0.00';
    boxes.push(`<div class="cd-stat-box"><div class="k">Wkts</div><div class="v tabnum">${wkts}</div></div>`);
    boxes.push(`<div class="cd-stat-box"><div class="k">Econ</div><div class="v tabnum">${econ}</div></div>`);
  }
  return `<div class="cd-stat-row" style="flex-wrap:wrap;">${boxes.join('')}</div>`;
}

async function openTournamentPlayerModal(name){
  document.getElementById('clip-modal-title').textContent = `${name} — Tournament Report`;
  const body = document.getElementById('clip-modal-body');
  body.innerHTML = '<div class="empty-state">Loading…</div>';
  document.getElementById('clip-modal-backdrop').classList.add('open');

  const entries = await buildTournamentPlayerReport(name);
  if(!entries.length){
    body.innerHTML = '<div class="empty-state">No match data found for this player yet.</div>';
    return;
  }
  body.innerHTML = summaryLineHtml(entries) + entries.map(matchEntryHtml).join('');
  wireClipRows(body);
}

document.getElementById('clip-modal-close').addEventListener('click', () => document.getElementById('clip-modal-backdrop').classList.remove('open'));
document.getElementById('clip-modal-backdrop').addEventListener('click', (e) => { if(e.target.id === 'clip-modal-backdrop') document.getElementById('clip-modal-backdrop').classList.remove('open'); });

function openVideoModal(clipId, title){
  document.getElementById('video-modal-title').textContent = title || 'Clip';
  document.getElementById('video-modal-body').innerHTML = '<div id="video-modal-loading">Loading clip…</div>';
  document.getElementById('video-modal-backdrop').classList.add('open');
  const src = `${clipApiBase()}/api/clips/${encodeURIComponent(clipId)}/watch`;
  const dl = `${clipApiBase()}/api/clips/${encodeURIComponent(clipId)}/download`;
  requestAnimationFrame(() => {
    document.getElementById('video-modal-body').innerHTML =
      `<video src="${src}" controls autoplay playsinline></video>
       <div style="padding:10px 14px; background:#0b0e14; display:flex; justify-content:flex-end;">
         <a href="${dl}" style="color:#fff; font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:6px;">${DOWNLOAD_ICON} Download</a>
       </div>`;
  });
}
document.getElementById('video-modal-close').addEventListener('click', () => {
  document.getElementById('video-modal-backdrop').classList.remove('open');
  document.getElementById('video-modal-body').innerHTML = '<div id="video-modal-loading">Loading clip…</div>';
});
document.getElementById('video-modal-backdrop').addEventListener('click', (e) => { if(e.target.id === 'video-modal-backdrop') document.getElementById('video-modal-close').click(); });

// Delegated — the leaderboard tables are re-rendered wholesale on load,
// so one listener on <body> covers every clip-btn without re-wiring.
document.body.addEventListener('click', (e) => {
  const btn = e.target.closest('.clip-btn');
  if(!btn) return;
  openTournamentPlayerModal(btn.dataset.player);
});

init();
</script>
</body>
</html>
