<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tennis Overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<!--
  🎾 THE TENNIS BROADCAST OVERLAY — a vMix / OBS browser source at
  1920 × 1080 with a transparent background.

  Everything on it comes from the match's saved event ledger, pushed over
  the /tennis socket namespace (never another sport's): the corner score
  bug (or the wide bar) with sets, games, points, the server, tie-breaks
  and the pressure of the coming point; lower thirds; call-outs (ACE,
  BREAK POINT, SET POINT …, each once per event); and the full-screen
  graphics the panel takes to air.

  WHAT IS ON AIR is the server's call (tennis-graphics.js). This page only
  draws it, one transition at a time, and always towards the LATEST state:
  a scene never sits on the score bug (the bug leaves, the scene comes in,
  and when it goes the bug returns once with the score as it is now).
  Repeated or stale updates change nothing (sequence numbers); a call-out
  plays once for the event that earned it.

  Built for vMix's browser: a fixed 1920 × 1080 canvas scaled to the
  source, a transparent page, colours worked out here (no color-mix), no
  flex gap, no :has(), Web Animations on transform / opacity / clip-path.

  ?match=<id>  [&key=<overlay key> — private tournaments]
  [&layout=bug | bar | graphics]  [&monitor=1 — a preview monitor, not counted as on air]  [&debug=1]
-->
<style>
:root{--acc:#c8f031;--accInk:#0d1512;--base:#0b1f17;--baseHi:#16301f;--baseLo:#04100b;--font:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --ca:#0f766e;--cb:#b45309;--sf:#2563eb;--sfLine:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
.up{text-transform:uppercase}
#diag{position:absolute;left:24px;bottom:18px;font:700 18px Inter,Arial,sans-serif;color:#fff;background:rgba(0,0,0,.72);padding:8px 14px;border-radius:10px;display:none}
#diag.show{display:block}

/* ================= the corner score bug ================= */
#bug{position:absolute;left:64px;top:52px;width:auto;min-width:560px;opacity:0;will-change:transform,opacity}
body.pos-tr #bug{left:auto;right:64px} body.pos-bl #bug{top:auto;bottom:70px} body.pos-br #bug{left:auto;right:64px;top:auto;bottom:70px}
.bplate{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--baseHi),var(--base) 55%,var(--baseLo));box-shadow:0 18px 44px -16px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
.bline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--acc);transform-origin:0 50%}
.bhead{display:flex;align-items:center;height:34px;padding:4px 14px 0 12px;font:700 17px/1 var(--font);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.bhead img{height:22px;max-width:60px;margin-right:10px;object-fit:contain}
.bhead .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .r{margin-left:16px;color:var(--acc)}
.brow{position:relative;display:flex;align-items:center;height:54px;padding-left:16px}
.brow+.brow{border-top:1px solid rgba(255,255,255,.08)}
.brow .stripe{position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:0 3px 3px 0}
.brow .ctry{flex:none;width:52px;height:26px;margin-right:12px;border-radius:5px;background:rgba(255,255,255,.12);font:800 17px/26px var(--font);letter-spacing:1px;text-align:center;color:rgba(255,255,255,.9)}
.brow .nm{flex:1;min-width:150px;font:700 30px/1 var(--font);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.brow .nm small{font-size:19px;color:rgba(255,255,255,.55);margin-left:8px;letter-spacing:0}
.brow .nm .sv{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--acc);margin-right:10px;vertical-align:4px;box-shadow:0 0 12px rgba(200,240,49,.75);transform:scale(0)}
.brow.srv .nm .sv.on{transform:scale(1)}
.brow .sets{display:flex;flex:none;height:100%}
.brow .sets span{position:relative;width:44px;text-align:center;font:700 32px/54px var(--font);color:rgba(255,255,255,.5)}
.brow .sets span.w{color:#fff}
.brow .sets span.cur{color:#fff;background:rgba(255,255,255,.08)}
.brow .sets sup{position:absolute;top:7px;right:4px;font-size:16px;line-height:1;color:rgba(255,255,255,.6)}
.brow .pts{flex:none;width:72px;height:100%;background:var(--acc);color:var(--accInk);font:800 34px/54px var(--font);text-align:center}
.brow .pts .roll,.brow .sets .roll{display:inline-block}
.btag{position:absolute;left:0;top:100%;margin-top:8px;height:40px;padding:0 18px 0 14px;border-radius:9px;display:flex;align-items:center;font:800 22px/1 var(--font);letter-spacing:2.5px;text-transform:uppercase;color:var(--accInk);background:var(--acc);box-shadow:0 12px 30px -12px rgba(0,0,0,.7);opacity:0}
.btag i{display:inline-block;width:8px;height:22px;border-radius:2px;margin-right:12px;background:var(--accInk)}
.btag.k-match{background:#e11d48;color:#fff}.btag.k-match i{background:#fff}
.btag.k-set{background:#7c3aed;color:#fff}.btag.k-set i{background:#fff}
.btag.k-ends{background:#1d4ed8;color:#fff}.btag.k-ends i{background:#fff}

/* the call-out beside the bug */
#moment{position:absolute;top:0;height:100%;display:flex;align-items:center;opacity:0;pointer-events:none}
#moment .mo{position:relative;height:100%;min-width:300px;padding:0 34px 0 30px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  background:linear-gradient(135deg,var(--mc,#0f766e),var(--mcd,#064e3b));box-shadow:0 18px 44px -16px rgba(0,0,0,.75)}
#moment .mo:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--acc)}
#moment .mk{font:800 54px/1 var(--font);letter-spacing:3px;text-transform:uppercase;white-space:nowrap}
#moment .ms{font:700 22px/1.1 var(--font);letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:6px;white-space:nowrap}
#moment .shine{position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));transform:skewX(-18deg)}

/* ================= the wide score bar ================= */
#bar{position:absolute;left:50%;bottom:58px;width:1240px;margin-left:-620px;height:96px;opacity:0;will-change:transform,opacity}
#bar .bp{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--baseHi),var(--base) 60%,var(--baseLo));box-shadow:0 22px 50px -18px rgba(0,0,0,.8)}
#bar .bl{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--acc);transform-origin:50% 50%}
#bar .sd{position:absolute;top:0;bottom:0;width:440px;display:flex;align-items:center}
#bar .sd.a{left:0;padding-left:26px}#bar .sd.b{right:0;padding-right:26px;flex-direction:row-reverse;text-align:right}
#bar .sd .stripe{position:absolute;top:0;bottom:0;width:8px}#bar .sd.a .stripe{left:0}#bar .sd.b .stripe{right:0}
#bar .sd .nm{font:700 38px/1 var(--font);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
#bar .sd .ctry{font:800 20px/30px var(--font);padding:0 8px;border-radius:5px;background:rgba(255,255,255,.12);margin:0 14px}
#bar .sd .sv{width:16px;height:16px;border-radius:50%;background:var(--acc);margin:0 14px;transform:scale(0)}
#bar .sd .sv.on{transform:scale(1)}
#bar .mid{position:absolute;left:440px;right:440px;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#bar .mid .g{font:800 56px/1 var(--font);margin:0 14px}
#bar .mid .p{min-width:84px;height:62px;border-radius:12px;background:var(--acc);color:var(--accInk);font:800 44px/62px var(--font);text-align:center;margin:0 8px}
#bar .mid .sl{position:absolute;left:0;right:0;top:6px;text-align:center;font:700 16px/1 var(--font);letter-spacing:3px;color:rgba(255,255,255,.62);text-transform:uppercase}
#bar .bt{position:absolute;left:50%;bottom:100%;margin-bottom:10px;transform:translateX(-50%);height:38px;padding:0 18px;border-radius:9px;font:800 21px/38px var(--font);letter-spacing:2.5px;text-transform:uppercase;background:var(--acc);color:var(--accInk);white-space:nowrap;opacity:0}

/* ================= lower thirds ================= */
#lower{position:absolute;left:120px;bottom:92px;opacity:0}
.lt{position:relative;display:flex;align-items:stretch;height:128px;min-width:720px}
.lt .ph{position:relative;width:128px;flex:none;border-radius:16px 0 0 16px;overflow:hidden;background:var(--lc,#0f766e)}
.lt .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lt .ph .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 56px/1 var(--font);color:rgba(255,255,255,.92)}
.lt .bd{position:relative;flex:1;padding:18px 34px 0 26px;border-radius:0 16px 16px 0;background:linear-gradient(180deg,var(--baseHi),var(--base) 70%,var(--baseLo));overflow:hidden;box-shadow:0 22px 50px -18px rgba(0,0,0,.8)}
.lt.nophoto .bd{border-radius:16px}
.lt .bd:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lc,#0f766e)}
.lt .k{font:700 20px/1 var(--font);letter-spacing:3.5px;text-transform:uppercase;color:var(--acc)}
.lt .n{font:800 52px/1.05 var(--font);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;margin-top:6px}
.lt .n small{font-size:26px;color:rgba(255,255,255,.6);margin-left:12px}
.lt .s{font:600 24px/1.2 var(--font);letter-spacing:1px;color:rgba(255,255,255,.78);margin-top:4px;white-space:nowrap}
.lt .st{display:flex;margin-top:8px}
.lt .st div{margin-right:34px}
.lt .st b{display:block;font:800 40px/1 var(--font)}
.lt .st small{font:700 16px/1 var(--font);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6)}
#ticker{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(180deg,var(--baseHi),var(--baseLo));opacity:0;overflow:hidden;box-shadow:0 -10px 30px -10px rgba(0,0,0,.6)}
#ticker .lab{position:absolute;left:0;top:0;bottom:0;width:220px;background:var(--acc);color:var(--accInk);font:800 26px/62px var(--font);letter-spacing:3px;text-align:center;z-index:1}
#ticker .run{position:absolute;left:220px;right:0;top:0;bottom:0;overflow:hidden}
#ticker .tx{position:absolute;left:0;top:0;white-space:nowrap;font:700 30px/62px var(--font);letter-spacing:1px;padding-left:40px}

/* ================= full-screen scenes ================= */
#gfx{position:absolute;inset:0;opacity:0}
.bd{position:absolute;inset:0}
.backdrop{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 30%,var(--baseHi),var(--base) 55%,var(--baseLo));opacity:0}
body.bd-scrim .backdrop{background:radial-gradient(1200px 700px at 50% 30%,rgba(22,48,31,.9),rgba(11,31,23,.92) 55%,rgba(4,16,11,.95))}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%;opacity:.12}
.sc{position:absolute;inset:0}
.kick{font:700 26px/1 var(--font);letter-spacing:7px;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.kick:before{content:'';display:inline-block;width:40px;height:5px;margin:0 16px 7px 0;background:var(--acc);vertical-align:middle}
.ttl{font:800 92px/.95 var(--font);text-transform:uppercase;letter-spacing:1px}
.sub{font:600 30px/1.2 var(--font);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.tlogo{height:84px;max-width:220px;object-fit:contain}
.photo{position:relative;overflow:hidden;background:var(--pc,#0f766e)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 150px/1 var(--font);color:rgba(255,255,255,.85)}
.photo .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.chipc{display:inline-block;font:800 26px/40px var(--font);padding:0 12px;border-radius:7px;background:rgba(255,255,255,.14);letter-spacing:2px;vertical-align:middle}
.accline{position:absolute;height:6px;background:var(--acc);transform-origin:0 50%}
/* intro / comparison: two halves */
.half{position:absolute;top:160px;bottom:170px;width:660px}
.half.l{left:100px}.half.r{right:100px}
.half .photo{position:absolute;top:0;left:50%;margin-left:-230px;width:460px;height:500px;border-radius:24px}
.half .who{position:absolute;top:522px;left:0;right:0;text-align:center}
.who .nmf{font:600 36px/1 var(--font);letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.who .nml{font:800 100px/.92 var(--font);text-transform:uppercase;letter-spacing:1px;margin-top:4px;white-space:nowrap}
.who .meta{margin-top:14px;font:700 27px/1.3 var(--font);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.who .meta b{color:var(--acc)}
.vs{position:absolute;left:50%;top:390px;width:160px;height:160px;margin-left:-80px;border-radius:50%;background:var(--acc);color:var(--accInk);font:800 76px/160px var(--font);text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
.vsr{position:absolute;left:50%;top:580px;width:440px;margin-left:-220px;text-align:center;font:700 30px/1.2 var(--font);letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.82)}
.foot{position:absolute;left:110px;right:110px;bottom:84px;height:70px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font:700 30px/1 var(--font);letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.foot span{margin:0 22px}.foot i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.top{position:absolute;left:110px;right:110px;top:62px;display:flex;align-items:center}
.top .t{flex:1;margin-left:24px}
.top .tn{font:800 46px/1 var(--font);text-transform:uppercase;letter-spacing:1px}
.top .tr{font:600 24px/1 var(--font);letter-spacing:3px;color:rgba(255,255,255,.7);text-transform:uppercase;margin-top:8px}
/* doubles teams */
.team{position:absolute;top:170px;width:780px;height:640px}
.team.l{left:90px}.team.r{right:90px}
.team .pp{position:absolute;top:0;width:360px;height:470px;border-radius:20px}
.team .pp:nth-child(1){left:0}.team .pp:nth-child(2){left:390px}
.team .tnm{position:absolute;top:500px;left:0;right:0;font:800 64px/1 var(--font);text-transform:uppercase;text-align:center;white-space:nowrap}
.team .tmeta{position:absolute;top:578px;left:0;right:0;font:700 26px/1 var(--font);letter-spacing:3px;text-align:center;color:rgba(255,255,255,.7);text-transform:uppercase}
/* centre card (toss, server, start, tiebreak, set winner, result, pressure) */
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cardin{position:relative;width:1240px;padding:60px 80px 56px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:0 40px 100px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.1);text-align:center;overflow:hidden}
.big{font:800 150px/.9 var(--font);text-transform:uppercase;letter-spacing:2px}
.score{font:800 110px/1 var(--font);letter-spacing:6px}
.cardin .photo{width:230px;height:230px;border-radius:50%;margin:0 auto 26px;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
/* tables (set score, statistics) */
.tbl{position:absolute;left:50%;top:190px;width:1400px;margin-left:-700px}
.tbl .hd{display:flex;align-items:flex-end;height:90px;border-bottom:2px solid rgba(255,255,255,.14);padding:0 20px 14px}
.tbl .hd .h{flex:1;font:800 44px/1 var(--font);text-transform:uppercase}
.tbl .hd .h.b{text-align:right}
.tbl .rw{display:flex;align-items:center;height:64px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.tbl .rw .v{width:260px;font:800 42px/1 var(--font)}.tbl .rw .v.b{text-align:right}
.tbl .rw .l{flex:1;text-align:center;font:700 28px/1 var(--font);letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.tbl .rw .bars{position:absolute;left:0;right:0;bottom:0;height:5px}
.tbl .rw{position:relative}
.tbl .rw .ba,.tbl .rw .bb{position:absolute;bottom:0;height:5px;border-radius:3px}
.tbl .rw .ba{right:50%;background:var(--ca)}.tbl .rw .bb{left:50%;background:var(--cb)}
.sett{position:absolute;left:50%;top:330px;width:1300px;margin-left:-650px;border-radius:24px;overflow:hidden;background:rgba(0,0,0,.25)}
.sett .r{display:flex;align-items:center;height:130px;padding:0 36px}
.sett .r+.r{border-top:1px solid rgba(255,255,255,.1)}
.sett .r .st{width:14px;height:80px;border-radius:7px;margin-right:30px}
.sett .r .n{flex:1;font:800 64px/1 var(--font);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sett .r .g{width:110px;text-align:center;font:800 84px/1 var(--font);color:rgba(255,255,255,.45)}
.sett .r .g.w{color:#fff}
.sett .r .g sup{font-size:34px;vertical-align:top;color:rgba(255,255,255,.6)}
.sett .r .s{width:130px;height:100px;border-radius:16px;background:var(--acc);color:var(--accInk);text-align:center;font:800 84px/100px var(--font);margin-left:20px}
/* profile */
.prof{position:absolute;left:150px;top:150px;right:150px;bottom:150px}
.prof .photo{position:absolute;left:0;top:0;width:560px;height:780px;border-radius:28px}
.prof .info{position:absolute;left:640px;top:70px;right:0}
.prof .facts{display:flex;flex-wrap:wrap;margin-top:44px}
.prof .facts div{width:300px;margin:0 30px 34px 0}
.prof .facts b{display:block;font:800 60px/1 var(--font)}
.prof .facts small{font:700 22px/1 var(--font);letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.62)}
.prof .ach{margin-top:10px;font:700 30px/1.35 var(--font);letter-spacing:1px;color:rgba(255,255,255,.85)}
.prof .ach div:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-right:16px;vertical-align:3px}
/* the pressure banners */
.press{position:absolute;left:0;right:0;top:50%;height:300px;margin-top:-150px}
.press .band{position:absolute;inset:0;background:linear-gradient(90deg,var(--pc1,#7f1d1d),var(--pc2,#e11d48));transform-origin:0 50%}
.press .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.press .w{font:800 170px/.9 var(--font);letter-spacing:12px;text-transform:uppercase}
.press .n{font:700 52px/1 var(--font);letter-spacing:6px;text-transform:uppercase;margin-top:12px;color:rgba(255,255,255,.88)}
</style></head>
<body>
<div id="fit">
  <div id="gfx"></div>
  <div id="bug"><div class="bplate"><div class="bline"></div><div class="bhead"><span class="t" id="bhT"></span><span class="r" id="bhR"></span></div><div class="brow" data-s="A"></div><div class="brow" data-s="B"></div></div><div class="btag" id="btag"><i></i><span></span></div><div id="moment"></div></div>
  <div id="bar"><div class="bp"><div class="bl"></div><div class="sd a" data-s="A"></div><div class="mid"></div><div class="sd b" data-s="B"></div></div><div class="bt" id="bartag"></div></div>
  <div id="lower"></div>
  <div id="ticker"><div class="lab">LIVE</div><div class="run"><div class="tx"></div></div></div>
  <div id="diag"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/tennis-graphics.js"></script>
<script>
(function () {
  'use strict';
  var GX = window.TennisGraphics;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var qs = new URLSearchParams(location.search);
  var urlLayout = ['bug', 'bar', 'graphics'].indexOf(qs.get('layout')) >= 0 ? qs.get('layout') : null;
  var O = {
    matchId: qs.get('match'), key: qs.get('key') || undefined, monitor: qs.get('monitor') === '1', debug: qs.has('debug'),
    socket: null, match: null, tournament: null, summary: null, seq: -1, offset: 0, style: GX.normalizeStyle(null),
    air: GX.idle(), airSeq: -1, stats: null, statsSeq: -1, profiles: {}, upcoming: null, outputId: 'o' + Math.random().toString(36).slice(2, 10)

      html = topHtml() + '<div class="card"><div class="cardin"><div class="kick" style="display:inline-block">Match starting</div><div class="big" data-fit style="margin-top:24px;font-size:110px">' + esc(bigName('A')) + '</div><div class="sub" style="margin:14px 0">versus</div><div class="big" data-fit style="font-size:110px">' + esc(bigName('B')) + '</div><div class="sub" style="margin-top:30px;color:var(--acc)">' + esc([courtLabel(), rulesLabel()].filter(Boolean).join(' · ')) + '</div></div></div>';
    } else if (kind === 'tournament') {
      var t = O.tournament || {};
      html = '<div class="card"><div class="cardin" style="padding:70px">' + (t.logo ? '<img class="tlogo" style="height:150px;max-width:340px" src="' + esc(t.logo + (O.key ? '&match=' + O.matchId + '&key=' + O.key : '')) + '" alt="">' : '') + '<div class="ttl" style="margin-top:26px">' + esc(t.name || '') + '</div><div class="sub" style="margin-top:20px">' + esc([t.venue, t.city].filter(Boolean).join(' · ')) + '</div><div class="sub" style="margin-top:10px;color:var(--acc)">' + esc([surfaceLabel(), t.startDate && t.endDate ? t.startDate + ' – ' + t.endDate : ''].filter(Boolean).join(' · ')) + '</div></div></div>';
    } else if (kind === 'setScore' || kind === 'setWinner' || kind === 'result') {
      var sets = (res && res.scores) || (sum.sets || []);
      var winnerSide = kind === 'setWinner' ? ((sum.sets || []).filter(function (x) { return x.set === d.set; })[0] || {}).winner : (res && res.winner);
      var rowHtml = function (s) {
        return '<div class="r"><i class="st" style="background:' + sideColor(s) + '"></i><span class="n">' + esc(m.format === 'doubles' ? bugName(s) : sideName(s)) + '</span>'
          + sets.filter(function (x) { return x.winner || x.A + x.B > 0; }).map(function (x) { var g = x.mtb && x.tb ? x.tb[s] : x[s]; return '<span class="g ' + (x.winner === s ? 'w' : '') + '">' + g + (x.tb && !x.mtb && x.winner && x.winner !== s ? '<sup>' + x.tb[s] + '</sup>' : '') + '</span>'; }).join('')
          + (kind !== 'setWinner' && sum.status !== 'completed' && sum.display ? '<span class="s">' + esc(sum.display[s]) + '</span>' : '') + '</div>';
      };
      var kick = kind === 'setWinner' ? 'Set ' + d.set : kind === 'result' ? (res && res.reason === 'retired' ? 'Retirement' : res && res.reason === 'walkover' ? 'Walkover' : 'Game, set and match') : 'Set score';
      var headline = kind === 'setWinner' ? esc(bigName(winnerSide)) : kind === 'result' && winnerSide ? esc(bigName(winnerSide)) : '';
      // the set winner shows the match up to that set (not the one being played)
      if (kind === 'setWinner') sets = sets.filter(function (x) { return x.set <= d.set; });
      html = topHtml() + '<div style="position:absolute;left:0;right:0;top:170px;text-align:center"><div class="kick" style="display:inline-block">' + esc(kick) + '</div>' + (headline ? '<div class="ttl" data-fit style="margin-top:20px">' + headline + '</div>' : '') + '</div>'
        + '<div class="sett" style="top:' + (headline ? 420 : 330) + 'px">' + rowHtml('A') + rowHtml('B') + '</div>'
        + (kind === 'result' && sum.endedAt && sum.startedAt ? footHtml(['Duration ' + fmtDur(sum.endedAt - sum.startedAt), courtLabel(), surfaceLabel()]) : '')
        + (kind === 'setWinner' ? (function () {
          var si = (sum.sets || []).filter(function (x) { return x.set === d.set; })[0] || {};
          var won = (sum.sets || []).filter(function (x) { return x.winner && x.set <= d.set; });
          var a = won.filter(function (x) { return x.winner === 'A'; }).length, b = won.length - a;
          var lead = a === b ? 'Sets level ' + a + '-' + b : (a > b ? bigName('A') : bigName('B')) + ' leads ' + Math.max(a, b) + '-' + Math.min(a, b) + ' in sets';
          return footHtml([si.startedAt && si.endedAt && si.endedAt - si.startedAt >= 60000 ? 'Set ' + d.set + ' in ' + fmtDur(si.endedAt - si.startedAt) : '', lead]);
        })() : '');
    } else if (kind === 'tiebreak') {
      var cur = (sum.sets || [])[(sum.sets || []).length - 1] || { A: 6, B: 6 };
      html = '<div class="press" style="--pc1:' + rgb(mix(rgbOf(O.style.base), [0, 0, 0], 0.3)) + ';--pc2:' + O.style.base + '"><div class="band"></div><div class="in"><div class="w">' + (sum.matchTiebreak ? 'Match tie-break' : 'Tie-break') + '</div><div class="n">' + esc(bugName('A') + '  ' + cur.A + ' – ' + cur.B + '  ' + bugName('B')) + '</div></div></div>';
    } else if (kind === 'breakPoint' || kind === 'matchPoint') {
      var h = sum.headline || {};
      var side = d.side || (h.side !== 'both' ? h.side : 'A');
      var cnt = h.count > 1 ? h.count + ' ' : '';
      var c1 = kind === 'matchPoint' ? '#7f1d1d' : rgb(mix(rgbOf(sideColor(side)), [0, 0, 0], 0.45)), c2 = kind === 'matchPoint' ? '#e11d48' : sideColor(side);
      html = '<div class="press" style="--pc1:' + c1 + ';--pc2:' + c2 + '"><div class="band"></div><div class="in"><div class="w">' + esc(cnt + (kind === 'matchPoint' ? 'Match point' : 'Break point') + (cnt ? 's' : '')) + '</div><div class="n">' + esc(bugName(side)) + '</div></div></div>';
    } else if (kind === 'stats') {
      var st2 = await statsNow();
      var a = st2 && st2.sides.A, b = st2 && st2.sides.B;
      var pr = function (x) { return x == null ? '–' : x; };
      var rowsS = a ? [
        ['Aces', a.serve.aces, b.serve.aces], ['Double faults', a.serve.doubleFaults, b.serve.doubleFaults],
        a.serve.firstPct != null ? ['1st serve in', a.serve.firstPct + '%', b.serve.firstPct + '%', a.serve.firstPct, b.serve.firstPct] : null,
        a.serve.firstWonPct != null ? ['1st serve points won', a.serve.firstWonPct + '%', (b.serve.firstWonPct != null ? b.serve.firstWonPct + '%' : '–'), a.serve.firstWonPct, b.serve.firstWonPct] : null,
        ['Break points won', a.ret.bpConverted + '/' + a.ret.bpChances, b.ret.bpConverted + '/' + b.ret.bpChances, a.ret.bpConverted, b.ret.bpConverted],
        a.winners != null ? ['Winners', a.winners, b.winners] : null, a.unforcedErrors != null ? ['Unforced errors', a.unforcedErrors, b.unforcedErrors] : null,
        a.net ? ['Net points won', a.net.won + '/' + a.net.points, b.net.won + '/' + b.net.points, a.net.won, b.net.won] : null,
        ['Total points won', a.pointsWon, b.pointsWon]
      ].filter(Boolean) : [];
      html = topHtml('Match statistics') + '<div class="tbl"><div class="hd"><span class="h" style="color:' + sideColor('A') + '">' + esc(bugName('A')) + '</span><span class="h b" style="color:' + sideColor('B') + '">' + esc(bugName('B')) + '</span></div>'
        + rowsS.map(function (r) { var x = Number(r[3] != null ? r[3] : r[1]) || 0, y = Number(r[4] != null ? r[4] : r[2]) || 0, tt = x + y || 1; return '<div class="rw"><span class="v">' + esc(pr(r[1])) + '</span><span class="l">' + esc(r[0]) + '</span><span class="v b">' + esc(pr(r[2])) + '</span><i class="ba" style="width:' + (x / tt * 50) + '%"></i><i class="bb" style="width:' + (y / tt * 50) + '%"></i></div>'; }).join('') + '</div>';
    } else if (kind === 'upcoming') {
      var nx = await upcomingMatch(d);
      if (!nx) return null;
      var nm = function (s) { var x = nx.sides && nx.sides[s]; return x ? x.name : 'To be decided'; };
      html = topHtml('Coming up') + '<div class="card"><div class="cardin"><div class="kick" style="display:inline-block">Up next' + (nx.court ? ' · ' + esc(/court/i.test(nx.court) ? nx.court : 'Court ' + nx.court) : '') + '</div><div class="big" style="margin-top:26px;font-size:104px">' + esc(nm('A')) + '</div><div class="sub" style="margin:14px 0">versus</div><div class="big" style="font-size:104px">' + esc(nm('B')) + '</div>'
        + '<div class="sub" style="margin-top:28px;color:var(--acc)">' + esc([nx.eventName, nx.stage && nx.stage.round, nx.scheduledAt ? new Date(nx.scheduledAt).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : ''].filter(Boolean).join(' · ')) + '</div></div></div>';
    } else return null;
    root.innerHTML = '<div class="backdrop">' + courtSvg() + '</div>' + html;
    return root;
  }
  // a name too long for its box is set smaller (never cut, never over its neighbour)
  function fitText(root) {
    Array.prototype.slice.call(root.querySelectorAll('[data-fit]')).forEach(function (el) {
      var box = el.parentNode, max = box.clientWidth || 1600;
      if (el.closest('.cardin')) max = el.closest('.cardin').clientWidth - 160;
      var size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
      el.style.whiteSpace = 'nowrap';
      el.style.display = 'block';
      while (el.scrollWidth > max && size > 30 && guard++ < 40) { size = Math.round(size * 0.93); el.style.fontSize = size + 'px'; }
    });
  }
  function fmtDur(ms) { if (!ms || ms < 0) return ''; var mn = Math.round(ms / 60000); return mn >= 60 ? Math.floor(mn / 60) + 'h ' + (mn % 60) + 'm' : mn + ' min'; }
  function preload(root) {
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
    return Promise.all(imgs.map(function (im) { return new Promise(function (res) { if (im.complete) return res(); var t = setTimeout(res, 2500); im.onload = im.onerror = function () { clearTimeout(t); if (!im.naturalWidth) im.style.display = 'none'; res(); }; }); }));
  }
  async function sceneIn(g) {
    var root;
    try { root = await buildScene(g); } catch (e) { console.error(e); root = null; }
    if (!root) { C.failed = { id: g.id, error: 'This graphic has nothing to show yet' }; reportOutput(); return false; }
    var cur = O.air;
    if (!cur || cur.id !== g.id) return false;            // overtaken while it was being built
    await preload(root);
    var host = $('#gfx');
    host.innerHTML = '';
    host.appendChild(root);
    host.style.opacity = 1;
    fitText(root);
    C.failed = null;
    var bd = $('.backdrop', root);
    var list = [anim(bd, [{ opacity: 0 }, { opacity: 1 }], 520)];
    var stagger = 160;
    Array.prototype.slice.call(root.querySelectorAll('.top,.half,.team,.card,.prof,.tbl,.sett,.foot,.vs,.press,.kick,.ttl')).forEach(function (el, i) {
      if (el.closest('.card') && el !== el.closest('.card')) return;
      var dir = el.classList.contains('r') ? 60 : el.classList.contains('l') ? -60 : 0;
      var kf = el.classList.contains('vs') ? [{ transform: 'scale(0)', opacity: 0 }, { transform: 'none', opacity: 1 }]
        : el.classList.contains('press') ? [{ opacity: 0 }, { opacity: 1 }]
        : el.classList.contains('card') ? [{ transform: 'translate(-50%,-46%) scale(.94)', opacity: 0 }, { transform: 'translate(-50%,-50%)', opacity: 1 }]
        : [{ transform: 'translate(' + dir + 'px,' + (dir ? 0 : 26) + 'px)', opacity: 0 }, { transform: 'none', opacity: 1 }];
      list.push(anim(el, kf, el.classList.contains('vs') ? 640 : 680, 220 + i * stagger * 0.6, el.classList.contains('vs') ? EASE.back : EASE.out));
    });
    Array.prototype.slice.call(root.querySelectorAll('.photo')).forEach(function (el, i) {
      var left = !!el.closest('.l');
      list.push(anim(el, [{ clipPath: left ? 'polygon(0 0,0 0,0 100%,0 100%)' : 'polygon(100% 0,100% 0,100% 100%,100% 100%)' }, { clipPath: 'polygon(0 0,100% 0,100% 100%,0 100%)' }], 820, 300 + i * 120, EASE.inout));
    });
    Array.prototype.slice.call(root.querySelectorAll('.press .band')).forEach(function (el) { list.push(anim(el, [{ transform: 'scaleX(0)' }, { transform: 'none' }], 620, 120, EASE.out)); });
    Array.prototype.slice.call(root.querySelectorAll('.press .w')).forEach(function (el) { list.push(anim(el, [{ transform: 'scale(1.25)', opacity: 0, letterSpacing: '40px' }, { transform: 'none', opacity: 1, letterSpacing: '12px' }], 760, 300, EASE.out)); });
    C.lastWasScene = true;
    await all(list);
    return true;
  }
  function sceneOut() {
    var host = $('#gfx'), root = host.firstChild;
    if (!root) return Promise.resolve();
    var list = [];
    Array.prototype.slice.call(root.querySelectorAll('.top,.half,.team,.card,.prof,.tbl,.sett,.foot,.vs,.press')).reverse().forEach(function (el, i) {
      var kf = el.classList.contains('card') ? [{ opacity: 1, transform: 'translate(-50%,-50%)' }, { opacity: 0, transform: 'translate(-50%,-53%) scale(.97)' }] : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-18px)' }];
      list.push(anim(el, kf, 380, i * 50, EASE.in));
    });
    list.push(anim($('.backdrop', root), [{ opacity: 1 }, { opacity: 0 }], 420, 220, EASE.in));
    return all(list).then(function () { host.style.opacity = 0; host.innerHTML = ''; });
  }
  function refreshScene() {
    // a scene showing the score follows it while it is up (the set score, the statistics)
    if (!C.scene || ['setScore', 'stats'].indexOf(C.scene.scene) < 0) return;
    clearTimeout(refreshScene.t);
    refreshScene.t = setTimeout(async function () {
      if (!C.scene) return;
      var root = await buildScene(C.scene);
      if (root && C.scene) { var host = $('#gfx'); root.querySelector('.backdrop').style.opacity = 1; host.innerHTML = ''; host.appendChild(root); }
    }, 300);
  }

  /* ---------- what this output shows (the panels read ON AIR from it) ---------- */
  var lastReport = '';
  function reportOutput(force) {
    if (!O.socket || !O.socket.connected || !O.match) return;
    var st = { matchId: O.matchId, outputId: O.outputId, monitor: O.monitor, layoutParam: urlLayout, state: C.state, graphicId: C.scene ? C.scene.id : (C.state === 'GRAPHIC_ENTERING' && O.air ? O.air.id : null), scene: C.scene ? C.scene.scene : (O.air && O.air.scene) || null,
      layout: C.liveShown, lowerId: C.lower ? C.lower.id : null, momentId: C.moment ? C.moment.id : null, failed: C.failed, airSeq: O.airSeq };
    var k = JSON.stringify(st);
    if (!force && k === lastReport) return;
    lastReport = k;
    O.socket.emit('tn:output', st);
  }
  function tick() {
    var g = O.air;
    if (!g) return;
    var now = serverNow();
    if ((C.moment && now >= C.moment.expiresAt) || (C.lower && C.lower.expiresAt != null && now >= C.lower.expiresAt)) request();
  }
  function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); $('#fit').style.transform = 'translate(' + (innerWidth - 1920 * k) / 2 + 'px,' + (innerHeight - 1080 * k) / 2 + 'px) scale(' + k + ')'; }
  window.addEventListener('resize', fit);
  fit();
  document.body.classList.add('bd-scrim');
  start();
  window.__tnOverlay = { O: O, C: C };
})();
</script>
</body></html>
