<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Panel · AllSportsLive</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="stylesheet" href="/volleyball-ui.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
  body { --ca: #0a84ff; --cb: #ff9f0a; overflow-x: hidden;
    background: radial-gradient(60vmax 45vmax at 0% 0%, color-mix(in srgb, var(--cl) 16%, transparent), transparent 62%),
                radial-gradient(60vmax 45vmax at 100% 100%, color-mix(in srgb, var(--cr) 16%, transparent), transparent 62%), var(--bg); }
  .topbar .title { font-weight: 700; font-size: 15px; min-width: 0; }
  .topbar .title small { display: block; font-weight: 500; color: var(--mute); font-size: 12px; }
  #main { padding: 14px clamp(10px, 1.6vw, 22px) 40px; }
  .live { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px) minmax(0, 1fr); gap: clamp(10px, 1.2vw, 16px); align-items: start; }
  @media (max-width: 1080px) { .live { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .center { grid-column: 1 / -1; order: 3; } }
  @media (max-width: 680px) { .live { grid-template-columns: minmax(0, 1fr); } }
  .team { --c: #0a84ff; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 26px; background: var(--card); box-shadow: var(--shadow), 0 0 0 1px var(--line); transition: box-shadow .4s var(--spring); position: relative; }
  .team.serving { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 80%, transparent), 0 24px 60px -26px color-mix(in srgb, var(--c) 85%, transparent); }
  .team .th { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .team .tname { font-weight: 800; font-size: clamp(17px, 1.6vw, 21px); letter-spacing: -.02em; }
  .serve { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); white-space: nowrap; opacity: 0; transform: scale(.7); transition: all .4s var(--bounce); }
  .serving .serve { opacity: 1; transform: none; }
  :root[data-theme="dark"] .serve, :root:not([data-theme="light"]) .serve { filter: brightness(1.25); }
  .bigscore { text-align: center; font-size: clamp(84px, 14vh, 170px); line-height: 1; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; position: relative; }
  .bigscore.pend::after { content: ''; position: absolute; top: 10%; right: 18%; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); animation: vbpulse 1s infinite; }
  .pop { animation: pop .45s var(--bounce); }
  @keyframes pop { from { transform: scale(.82); opacity: .4; } }
  .pips { display: flex; gap: 6px; justify-content: center; align-items: center; color: var(--mute); font-weight: 600; font-size: 13px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--fill2); display: inline-block; }
  .pips i.f { background: var(--c); box-shadow: 0 0 10px -1px var(--c); }
  .point { height: clamp(78px, 12vh, 118px); border-radius: 22px; color: var(--tc, #fff); font-weight: 800; font-size: clamp(22px, 3.4vh, 32px); letter-spacing: -.02em; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 80%, #000));
    box-shadow: 0 14px 34px -12px color-mix(in srgb, var(--c) 75%, transparent), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .3s var(--bounce), filter .2s; }
  .point:hover:not(:disabled) { filter: brightness(1.06); }
  .point:active:not(:disabled) { transform: scale(.965); }
  .point kbd { font: 700 12px/1 inherit; padding: 4px 8px; border-radius: 7px; background: rgba(255,255,255,.24); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick .chip { height: 34px; }
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tool { height: 44px; border-radius: 14px; background: var(--fill); font-weight: 650; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .25s var(--bounce), background .2s; }
  .tool:hover:not(:disabled) { background: var(--fill2); }
  .tool:active:not(:disabled) { transform: scale(.95); }
  .tool .dots { display: inline-flex; gap: 3px; } .tool .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .25; } .tool .dots i.u { opacity: 1; }
  .center { display: grid; gap: 12px; }
  .setbox { text-align: center; padding: 14px; }
  .setbox h2 { font-size: 24px; letter-spacing: -.03em; }
  .status { text-align: center; padding: 10px 12px; border-radius: 16px; font-weight: 800; background: var(--fill); min-height: 42px; }
  .status.sp { background: color-mix(in srgb, var(--orange) 22%, transparent); }
  .status.mp { background: color-mix(in srgb, var(--red) 20%, transparent); }
  .status.cs { background: color-mix(in srgb, var(--blue) 20%, transparent); }
  .status.to { background: color-mix(in srgb, var(--purple) 20%, transparent); }
  .setchips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .setchips span { padding: 4px 10px; border-radius: 99px; background: var(--fill); font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .court { display: grid; grid-template-columns: 1fr 6px 1fr; gap: 0; border-radius: 18px; overflow: hidden; background: color-mix(in srgb, #f59e0b 22%, var(--card)); box-shadow: inset 0 0 0 2px color-mix(in srgb, #fff 55%, transparent); }
  .court .net { background: repeating-linear-gradient(0deg, #fff 0 3px, #9ca3af 3px 6px); }
  .half { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px; padding: 8px; min-height: 196px; }
  .pos { border-radius: 12px; background: color-mix(in srgb, var(--card) 86%, transparent); display: grid; place-items: center; text-align: center; padding: 4px; min-width: 0; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pos b { font-size: 20px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .pos small { display: block; font-size: 11px; font-weight: 600; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .pos em { position: absolute; top: 3px; left: 6px; font-style: normal; font-size: 9.5px; font-weight: 800; color: var(--mute); }
  .pos.srv { box-shadow: 0 0 0 3px var(--c); }
  .pos.srv::after { content: '🏐'; position: absolute; top: -7px; right: -5px; font-size: 14px; }
  .pos.lib { background: color-mix(in srgb, #ffd60a 55%, var(--card)); }
  .timeline { display: grid; gap: 6px; max-height: 360px; overflow: auto; }
  .tl { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--fill); font-size: 13px; }
  .tl.void { opacity: .45; text-decoration: line-through; }
  .tl .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
  .tl .tm { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .steps { display: grid; gap: 14px; max-width: 1100px; margin: 0 auto; }
  .step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; }
  .step .n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--fill); }
  .step.done .n { background: var(--green); color: #fff; }
  .lineups { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .lineups { grid-template-columns: minmax(0, 1fr); } }
  .lu-court { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .lu-slot { min-height: 62px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; text-align: center; padding: 4px; font-size: 12px; border: 2px dashed transparent; }
  .lu-slot.sel { border-color: var(--blue); }
  .lu-slot b { font-size: 18px; }
  .lu-bench { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .pick button { text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--fill); display: flex; gap: 10px; align-items: center; min-width: 0; }
  .pick button:hover { background: var(--fill2); }
  .pick button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .pick button b { font-size: 18px; min-width: 26px; font-variant-numeric: tabular-nums; }
  .ovr { display: grid; gap: 10px; }
  .sidebadge { position: absolute; top: 12px; right: 14px; font-size: 11px; font-weight: 700; color: var(--mute); }
  .chip.air.on { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--ink); }
  /* 🎛 the on-air control centre */
  .airbox { padding: 14px 16px; border-radius: 16px; background: var(--fill); transition: box-shadow .3s, background .3s; }
  .airbox.k-on { background: color-mix(in srgb, var(--red) 11%, var(--fill)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 70%, transparent); }
  .airbox.k-live { box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 55%, transparent); }
  .airbox.k-move { box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 60%, transparent); }
  .airbox.k-warn, .airbox.k-bad { background: color-mix(in srgb, var(--orange) 14%, var(--fill)); }
  .airbox.k-bad { box-shadow: 0 0 0 2px var(--red); }
  .airbox #airLine { font-size: 16px; letter-spacing: -.01em; }
  .airbox .outs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--mute); }
  .airbox .outs span { display: inline-flex; align-items: center; gap: 6px; } .airbox .outs .warn { color: var(--orange); font-weight: 700; }
  .lvmode { margin: 0 0 8px; gap: 10px; }
  .lvcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .lvcard { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--fill); box-shadow: 0 0 0 1px var(--line); }
  .lvcard.sel { box-shadow: 0 0 0 2px var(--blue); }
  .lvcard.s-on { box-shadow: 0 0 0 2px var(--red); }
  .lvtxt { display: grid; gap: 3px; justify-items: start; min-width: 0; }
  .lvtxt small { color: var(--mute); font-size: 12px; line-height: 1.3; }
  .lvtxt .btn { margin-top: 4px; }
  .lvst { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--mute); }
  .s-on .lvst { color: var(--red); } .s-move .lvst { color: var(--orange); }
  .lvp { position: relative; width: 132px; height: 74px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, #2f4f2f, #16261a); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .lvbar { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 14px; display: grid; grid-template-columns: 1fr 8px 13px 13px 8px 1fr; align-items: center; border-radius: 3px; overflow: hidden; background: #0a1136; font: 800 7px/1 system-ui; color: #fff; font-style: normal; }
  .lvbar b { height: 100%; display: grid; place-items: center; background: var(--tc); white-space: nowrap; overflow: hidden; }
  .lvbar em { font-style: normal; text-align: center; opacity: .7; } .lvbar strong { text-align: center; font-size: 8px; }
  .lvcor { position: absolute; left: 7px; top: 7px; width: 58px; display: grid; gap: 1px; font: 800 6.5px/1 system-ui; color: #fff; font-style: normal; }
  .lvcor span { display: grid; grid-template-columns: 3px 1fr 7px 9px; gap: 3px; align-items: center; height: 10px; padding-right: 2px; background: #0a1136; }
  .lvcor b { height: 100%; background: var(--tc); } .lvcor em { font-style: normal; opacity: .7; text-align: center; } .lvcor strong { text-align: right; }
  .gfxdur { margin: 16px 0 4px; }
  .gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
  .gtile { position: relative; border-radius: 14px; background: var(--fill); min-width: 0; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .25s, opacity .25s; }
  .gtile .gmain { display: grid; gap: 4px; width: 100%; text-align: left; padding: 12px 14px 10px; border-radius: 14px; }
  .gtile .gmain:hover:not([aria-disabled="true"]) { background: var(--fill2); }
  .gtile .gmain:active:not([aria-disabled="true"]) { transform: scale(.985); }
  .gtile .gtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gtile .gmain small { font-weight: 600; color: var(--mute); font-size: 12px; line-height: 1.3; }
  .gtile .gtime { font-size: 11px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
  .gtile .goff { position: absolute; right: 8px; bottom: 8px; }
  .gtile .sub { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .gtile .sub .chip { height: 28px; font-size: 12px; }
  .gtile.s-na { opacity: .55; } .gtile.s-na .gmain { cursor: not-allowed; }
  .gtile.s-on { box-shadow: 0 0 0 2px var(--red); background: color-mix(in srgb, var(--red) 8%, var(--fill)); }
  .gtile.s-taking { box-shadow: 0 0 0 2px var(--orange); animation: gtake 1.1s infinite; }
  @keyframes gtake { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--orange) 35%, transparent); } }
  .gtile.s-exiting { box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 60%, transparent); }
  .gtile.s-failed { box-shadow: 0 0 0 2px var(--red); } .gtile.s-failed small { color: var(--red); }
  .ontag { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--red); }
  .ontag.taking, .ontag.exiting { color: var(--orange); }
  .pcards .chip { height: 32px; }
  .pcards.flash { animation: pflash 1.2s; border-radius: 12px; }
  @keyframes pflash { 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 55%, transparent); } }
  .lvmode > span { flex: 1 1 260px; }
  @media (max-width: 560px) {
    .gfxdur .seg { display: flex; flex-wrap: wrap; width: 100%; }
    .gfxdur .seg button { flex: 1 1 auto; }
    .lvcard { grid-template-columns: 104px minmax(0, 1fr); }
    .lvp { width: 104px; height: 60px; }
  }
  .linkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .linkrow input { min-width: 0; font: 600 12.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tlc { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
  button.clipst { cursor: pointer; }
  /* who earned the point — fixed at the bottom so nothing above it moves */
  .ask { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(1180px, calc(100vw - 20px)); z-index: 40; }
  .ask[hidden] { display: none; }
  .ask-in { --c: #0a84ff; display: grid; gap: 8px; padding: 10px 12px; border-radius: 20px; background: var(--card); box-shadow: 0 24px 60px -18px rgba(0,0,0,.55), 0 0 0 2px var(--c); animation: askin .28s var(--spring); }
  @keyframes askin { from { transform: translateY(26px); opacity: 0; } }
  .ask-h { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .ask-h .tm { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .ask-now { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--fill2); }
  .ask-now.done { background: color-mix(in srgb, var(--green) 22%, transparent); }
  .ask-x { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); font-size: 18px; line-height: 1; flex: none; }
  .ask-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ask-types { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: var(--fill); }
  .ask-types button { height: 36px; padding: 0 12px; border-radius: 9px; font-weight: 700; font-size: 13px; }
  .ask-types button[aria-pressed="true"] { background: var(--c); color: #fff; }
  .ask-types button:disabled { opacity: .38; }
  .ask-pl { flex: 1 1 460px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
  .ask-pl button { height: 42px; padding: 0 10px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 600; }
  .ask-pl button:hover:not(:disabled) { background: var(--fill2); }
  .ask-pl button[aria-pressed="true"] { background: var(--c); color: #fff; }
  .ask-pl button:disabled { opacity: .4; }
  .ask-pl kbd { font: 700 10px/1 inherit; padding: 3px 5px; border-radius: 5px; background: var(--fill2); color: var(--mute); }
  .ask-pl b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .ask-err button { font-size: 13px; }
  body.asking #main { padding-bottom: 170px; }
  @media (max-width: 680px) {
    .ask { bottom: 6px; } .ask-pl { flex-basis: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); } .ask-pl button { padding: 0 8px; gap: 5px; } .ask-pl kbd { display: none; }
    body.asking #main { padding-bottom: 260px; }
    /* the top bar: the status chips get their own row, scrolling inside it */
    .topbar { flex-wrap: wrap; row-gap: 8px; } .topbar .title { flex: 1 1 0; }
    #chips { order: 5; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } #chips::-webkit-scrollbar { display: none; }
    .chip.clp .clpx { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/volleyball" title="Volleyball dashboard" style="color:inherit"><span class="ball">🏐</span></a>
  <div class="title grow ellipsis" id="title">Volleyball Panel<small>Loading…</small></div>
  <span class="row small" id="chips"></span>
  <button class="btn sm" id="gfxBtn" title="On-air graphics (G)">Graphics</button>
  <button class="btn sm" id="fixBtn" title="Corrections and officials">Corrections</button>
  <button class="btn sm" id="moreBtn">⋯</button>
</header>
<div class="wrap" style="max-width:1500px;padding-top:10px" id="banner"></div>
<main id="main"><div class="skel" style="height:300px;max-width:1100px;margin:20px auto"></div></main>

<script src="/socket.io/socket.io.js"></script>
<script src="/volleyball-common.js"></script>
<script src="/volleyball-engine.js"></script>
<script src="/volleyball-graphics.js"></script>
<script src="/volleyball-clipper.js"></script>
<script>
(function () {
  'use strict';
  const { $, $$, esc, toast, api } = VB;
  const E = window.VolleyballEngine;
  const qs = new URLSearchParams(location.search);
  const P = {
    matchId: qs.get('match'), match: null, tournament: null, L: null, socket: null, connected: false,
    outbox: [], flushing: false, lease: { token: null, mine: false, holder: null },
    CL: null, ask: null,
    followCourt: VB.store.get('vb_follow_court', true), lastPointAt: 0,
    lastPop: {}, graphic: null
  };
  if (!P.matchId) { $('#main').innerHTML = '<div class="empty card" style="max-width:520px;margin:40px auto"><b>No match chosen</b>Open a match from the <a href="/volleyball">volleyball dashboard</a>.</div>'; return; }
  const OUTBOX_KEY = 'vb_outbox:' + P.matchId, LEASE_KEY = 'vb_lease:' + P.matchId;
  P.outbox = VB.store.get(OUTBOX_KEY, []);
  P.lease.token = VB.store.get(LEASE_KEY, null);

  /* =============================== boot */
  async function boot() {
    const user = await VB.authReady;
    if (!user) return gate('Sign in to score', 'The panel is for the tournament’s authorised account.', true);
    VB.syncClock();
    P.socket = await VB.connect();
    P.socket.on('connect', onConnect);
    P.socket.on('disconnect', () => { P.connected = false; renderChips(); renderBanner(); });
    P.socket.on('vb:update', onUpdate);
    P.socket.on('vb:lease', (d) => { if (d.matchId !== P.matchId) return; P.lease.holder = d.lease; checkLease(); });
    P.socket.on('vb:match', (d) => { if (d.matchId === P.matchId) { Object.assign(P.match, d.match, { clipToken: P.match.clipToken, overlayKey: P.match.overlayKey, canManage: P.match.canManage }); rebuildSetupIfNeeded(); render(); } });
    P.socket.on('vb:report', (d) => { if (d.matchId === P.matchId) { P.match.report = Object.assign(P.match.report || {}, { status: d.status, version: d.version || (P.match.report && P.match.report.version) }); render(); } });
    P.socket.on('vb:graphic', (d) => { if (d.matchId === P.matchId) setAirState(d.graphic); });
    // what the outputs (vMix, OBS, monitors) really show — ON AIR is read from these
    P.socket.on('vb:outputs', (d) => { if (d.matchId === P.matchId) { P.outputs = d.outputs || []; renderAir(); } });
    P.socket.on('vb:style', (d) => { if (P.match && d.tournamentId === P.match.tournamentId) { P.style = GX.normalizeStyle(d.style); renderAir(); } });
    setInterval(heartbeat, 10000);
    setInterval(renderStatus, 500);   // a time-out counts down
  }
  function gate(title, text, signIn) {
    $('#main').innerHTML = `<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><div style="font-size:40px">🏐</div><h2 style="margin:6px 0">${esc(title)}</h2><p class="muted">${esc(text)}</p>
      ${signIn ? '<button class="btn primary" style="margin-top:14px" id="gsi">Sign in with Google</button>' : '<a class="btn" style="margin-top:14px" href="/volleyball">Volleyball dashboard</a>'}</div>`;
    if ($('#gsi')) $('#gsi').onclick = () => VB.signIn().then(() => location.reload());
  }
  async function onConnect() {
    P.connected = true;
    const r = await VB.ack(P.socket, 'vb:join', { matchId: P.matchId, events: true, timeline: true });
    if (!r.ok) return gate('Match not found', 'It may have been deleted, or this account cannot open it.');
    if (!r.match.canManage) return gate('View only', 'Only the account that runs this tournament can score it. The public scorecard is open to everyone.');
    P.match = r.match;
    P.style = GX.normalizeStyle(r.style);
    P.outputs = r.outputs || [];
    P.graphic = null; setAirState(r.graphic);
    loadTournament();
    rebuild(r.events || []);
    await checkLease(true);
    startClipper();
    renderChips(); renderBanner();
    flush();
  }
  // 🎬 The Clipper: volleyball's OWN local program (VolleyballClipper.exe,
  // localhost:5007 — never the Cricket Panel's ClipperHelper.exe), cutting
  // every point from the vMix recording (see volleyball-clipper.js).
  function startClipper() {
    if (P.CL) { P.CL.refresh(); return; }
    let paint = 0;
    P.CL = VBClipper.create({
      matchId: P.matchId, role: 'panel', socket: P.socket, toast,
      getMatch: () => P.match, getTournament: () => P.tournament, getTimeline: () => (P.L ? P.L.timeline : []),
      playerOf: (t, id) => (P.L ? player(t, id) : null),
      onChange: () => { cancelAnimationFrame(paint); paint = requestAnimationFrame(() => { renderChips(); renderTimeline(); paintClipper(); }); }
    });
  }
  async function loadTournament() {
    const r = await api('GET', `/api/volleyball/tournaments/${P.match.tournamentId}`);
    if (r.ok) { P.tournament = r.json.tournament; P.tTeams = r.json.teams; renderTitle(); }
  }
  function setupOf(m) {
    const side = (s) => ({ teamId: m['team' + s] && m['team' + s].teamId, name: m['team' + s] ? m['team' + s].name : 'Team ' + s, shortName: m['team' + s] && m['team' + s].shortName, players: (m.squads && m.squads[s]) || [] });
    return { teams: { A: side('A'), B: side('B') }, rules: m.rules };
  }
  let setupKey = '';
  function rebuildSetupIfNeeded() { const k = JSON.stringify(setupOf(P.match)); if (k !== setupKey) resync(); }
  // The ledger = what the server has stored + what this device sent and is waiting to hear about.
  function rebuild(events) {
    setupKey = JSON.stringify(setupOf(P.match));
    P.L = new E.Ledger(setupOf(P.match), events);
    P.confirmedSeq = P.L.seq;
    const keep = [];
    P.outbox.forEach((o) => {
      if (P.L.has(o.event.eventId)) return;          // the server already has it
      const ev = Object.assign({}, o.event); delete ev.seq;
      const chk = P.L.check(ev);
      if (chk.ok) { P.L.commit(chk.pending); keep.push({ event: chk.pending.event, triggered: o.triggered }); }
      else toast(`Not saved: ${chk.error}`, 'err');
    });
    P.outbox = keep; saveOutbox();
    applyColors(); render();
  }
  let resyncTimer = null;
  function resync() {
    clearTimeout(resyncTimer);
    resyncTimer = setTimeout(async () => {
      if (!P.socket || !P.connected) return;
      const r = await VB.ack(P.socket, 'vb:sync', { matchId: P.matchId });
      if (r.ok) { P.match = Object.assign(P.match, r.match); rebuild(r.events || []); }
    }, 60);
  }
  function saveOutbox() { if (P.outbox.length) VB.store.set(OUTBOX_KEY, P.outbox); else VB.store.del(OUTBOX_KEY); }

  /* =============================== the controller lease */
  async function checkLease(first) {
    const holder = P.lease.holder || (P.match && P.match.lease);
    if (P.lease.token && P.connected) {
      const r = await VB.ack(P.socket, 'vb:lease:heartbeat', { matchId: P.matchId, leaseToken: P.lease.token });
      P.lease.mine = !!r.ok;
      P.lease.holder = r.lease || holder || null;
      if (!r.ok && r.lost) { P.lease.token = null; VB.store.del(LEASE_KEY); if (!first) toast('Another device took control of this match', 'err'); }
    } else { P.lease.mine = false; P.lease.holder = holder || null; }
    if (first && !P.lease.mine && !(P.lease.holder && P.lease.holder.active) && !P.match.locked) await takeControl(false, true);
    renderChips(); renderBanner(); render();
  }
  async function takeControl(force, quiet) {
    const r = await api('POST', `/api/volleyball/matches/${P.matchId}/lease`, { deviceId: VB.deviceId(), force: !!force });
    if (r.ok) {
      P.lease.token = r.json.leaseToken; P.lease.mine = true; P.lease.holder = r.json.lease;
      VB.store.set(LEASE_KEY, P.lease.token);
      if (!quiet) toast('This device is now scoring the match');
      flush();
    } else if (r.json.code === 'LEASE_HELD' && !quiet) {
      const h = r.json.holder || {};
      if (await VB.confirm('Take control from another device?', `${h.email || 'Another device'} is scoring this match (last seen ${VB.ago(h.heartbeatAt)}). Taking over stops that device from scoring — it is told straight away.`, 'Take control')) return takeControl(true);
    } else if (!quiet) toast(r.json.error || 'Could not take control', 'err');
    renderChips(); renderBanner(); render();
  }
  async function heartbeat() {
    if (!P.lease.token || !P.connected) return;
    const r = await VB.ack(P.socket, 'vb:lease:heartbeat', { matchId: P.matchId, leaseToken: P.lease.token }, 6000);
    if (r.lost) { P.lease.mine = false; P.lease.token = null; VB.store.del(LEASE_KEY); P.lease.holder = r.lease; toast('Another device took control of this match', 'err'); renderChips(); renderBanner(); render(); }
  }

  /* =============================== sending events */
  // Checked here with the same rules the server uses, applied at once, and
  // kept until the server confirms it (sent again with the same id if the
  // line drops — the server never counts it twice).
  function send(raw, opts) {
    opts = opts || {};
    if (!P.L) return null;
    if (P.match.locked) { toast('This match is locked', 'err'); return null; }
    if (!P.lease.mine) { toast('Take control of the match first', 'err'); return null; }
    // When it happened, on the server's clock (so a Clipper on another PC
    // finds the same moment in its recording) — this device's own clock is
    // what its local clip engine understands.
    const localAt = raw.at || Date.now();
    const ev = Object.assign({ eventId: VB.uid() }, raw, { at: Math.round(localAt + VB.clock.offset) });
    const chk = P.L.check(ev);
    if (!chk.ok) {
      if (chk.overridable && !opts.noOverride) offerOverride(chk, raw);
      else toast(chk.error, 'err');
      return null;
    }
    P.L.commit(chk.pending);
    const item = { event: chk.pending.event };
    P.outbox.push(item); saveOutbox();
    if (ev.type === 'RALLY') {
      // the point is counted NOW; its clip job and the "who earned it?"
      // question follow it — neither ever holds up the next point
      if (P.CL) P.CL.point(chk.pending.event, P.L.timeline[P.L.timeline.length - 1], localAt);
      if (opts.ask !== false) openAsk(chk.pending.event.eventId, opts.ask);
    }
    render();
    renderChips();   // "Saving 2…" / "Offline · 2 waiting"
    flush();
    return chk.pending;
  }
  // fn once the server has stored the event (not only this device)
  function whenSaved(pending, fn) {
    if (!pending) return;
    const id = pending.event.eventId, until = Date.now() + 20000;
    const tick = () => {
      if (!P.outbox.some((o) => o.event.eventId === id)) { if (P.L && P.L.has(id)) fn(); return; }
      if (Date.now() < until) setTimeout(tick, 200);
    };
    tick();
  }
  async function flush() {
    if (P.flushing || !P.connected || !P.lease.mine) return;
    P.flushing = true;
    try {
      while (P.outbox.length && P.connected) {
        const item = P.outbox[0];
        const ev = Object.assign({}, item.event); const localSeq = ev.seq; delete ev.seq;
        const r = await VB.ack(P.socket, 'vb:event', { matchId: P.matchId, leaseToken: P.lease.token, event: ev }, 12000);
        if (r.ok) {
          P.outbox.shift(); saveOutbox();
          P.confirmedSeq = r.seq;
          if (!r.duplicate && r.seq !== localSeq) { resync(); break; }
          if (r.summary && r.summary.status !== P.L.state.status && !P.outbox.length) resync();
          continue;
        }
        if (r.timeout || r.retry) break;                          // the line: keep it, try again
        P.outbox = []; saveOutbox();                               // refused: back to what the server has
        if (r.code === 'LEASE_REQUIRED') { P.lease.mine = false; P.lease.token = null; VB.store.del(LEASE_KEY); }
        toast(r.error || 'Not saved', 'err');
        resync();
        break;
      }
    } finally { P.flushing = false; renderChips(); renderPending(); }
  }
  function onUpdate(u) {
    if (u.matchId !== P.matchId || !P.L) return;
    if (P.outbox.some((o) => o.event.eventId === (u.event && u.event.eventId))) return;   // our own, the ack handles it
    if (P.L.has(u.event && u.event.eventId)) return;
    // a point scored on another device: clipped here if this PC clips the match
    if (P.CL && u.event && u.event.type === 'RALLY') P.CL.remotePoint(u.event, u.entry);
    if (!P.outbox.length && u.event && u.seq === P.L.seq + 1 && !u.full) {
      const chk = P.L.check(Object.assign({}, u.event, { seq: undefined }));
      if (chk.ok) { P.L.commit(chk.pending); P.confirmedSeq = u.seq; render(); return; }
    }
    resync();
  }
  function offerOverride(chk, raw) {
    const s = VB.sheet(`<h3>Rule check</h3><div class="banner warn" style="margin:12px 0">${esc(chk.error)}</div>
      <p class="muted small">Record it anyway only if the referees allowed it. The reason is kept with the event and in the audit log.</p>
      <input class="input" id="or" maxlength="200" placeholder="Reason (e.g. first referee allowed it)" style="margin-top:10px" autofocus>
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="ok">Record anyway</button></div>`);
    $('#ok', s.el).onclick = () => { const reason = $('#or', s.el).value.trim(); if (!reason) return $('#or', s.el).focus(); s.close(); send(Object.assign({}, raw, { override: { reason } }), { noOverride: true }); };
  }

  /* =============================== the Clipper (volleyball-clipper.js) */
  function clipperChip() { return P.CL ? VBClipper.chip(P.CL) : ''; }
  let clipperSheet = null;
  function openClipper() {
    if (!P.CL) return;
    clipperSheet = VB.sheet('<div id="clp"></div>', { wide: true, onClose: () => { clipperSheet = null; } });
    paintClipper();
    P.CL.refresh();
  }
  function paintClipper() {
    if (!clipperSheet || !P.CL) return;
    const el = $('#clp', clipperSheet.el);
    if (!el) return;
    VBClipper.paint(P.CL, el, {
      teamOf, short, canAssign: P.lease.mine, matchId: P.matchId,
      onAssign: (eventId) => { clipperSheet.close(); openAsk(eventId); },
      onPlay: (eventId) => playClip(eventId)
    });
  }
  function playClip(eventId) { if (P.CL) VBClipper.play(P.CL, eventId, teamOf); }

  /* =============================== who earned the point */
  // Asked the moment a point is recorded — the point is already counted and
  // its clip is already on its way, so nothing waits for the answer. One tap
  // names the player (a kill, or a blocker in Block); Ace, Opponent error and
  // Team point need no name. Ignored, it stays "to assign" for later — the
  // next point simply asks about itself.
  function openAsk(eventId, mode) {
    if (!P.lease.mine || P.match.locked) return;
    const e = P.L.timeline.find((x) => x.eventId === eventId);
    if (!e || e.type !== 'RALLY') return;
    P.ask = { eventId, mode: mode === 'BLOCK' ? 'block' : mode === 'opp' ? 'opp' : 'kill', picked: [], at: Date.now() };
    renderAsk();
  }
  function closeAsk() { P.ask = null; renderAsk(); }
  // the scoring team's six on court AT that point (a substitution since then changes nothing)
  let courtMemo = { k: '', v: [] };
  function onCourtAt(eventId, team) {
    const k = eventId + team + P.L.events.length;
    if (courtMemo.k === k) return courtMemo.v;
    const i = P.L.events.findIndex((x) => x.eventId === eventId);
    if (i < 0) return [];
    const target = P.L.events[i];
    const r = E.replay(P.L.setup, P.L.events.filter((x, j) => (x.seq != null && target.seq != null ? x.seq < target.seq : j < i)));
    courtMemo = { k, v: (r.state.positions && r.state.positions[team]) || [] };
    return courtMemo.v;
  }
  function pendingAsks() {
    return P.L.timeline.filter((e) => e.type === 'RALLY' && !e.voided && !e.invalid && VBClipper.attributionOf(e).pending).slice(-12);
  }
  function renderAsk() {
    let el = $('#ask');
    if (!el) { el = document.createElement('div'); el.id = 'ask'; el.className = 'ask'; el.setAttribute('role', 'region'); el.setAttribute('aria-label', 'Who earned this point'); document.body.appendChild(el); }
    const e = P.ask && P.L && P.L.timeline.find((x) => x.eventId === P.ask.eventId);
    if (!P.ask || !e || e.voided || e.invalid || !P.lease.mine) { P.ask = null; el.hidden = true; document.body.classList.remove('asking'); return; }
    const team = e.team, tm = teamOf(team);
    const a = VBClipper.attributionOf(e, (t, id) => player(t, id));
    const six = onCourtAt(e.eventId, team);
    const lib = P.L.setup.teams[team].liberos || [];
    const served = !!(e.rallyServer && e.rallyServer.team === team);
    const others = pendingAsks().filter((x) => x.eventId !== e.eventId).length;
    const block = P.ask.mode === 'block', opp = P.ask.mode === 'opp';
    const oppServed = !!(e.rallyServer && e.rallyServer.team === E.other(team));
    const sel = new Set(block ? P.ask.picked : a.type === 'kill' ? a.players.map((x) => x.playerId) : []);
    const pressed = (k) => (k === 'kill' ? !block && !opp && (a.type === 'kill' || a.pending) : k === 'block' ? block || a.type === 'block' : k === 'ace' ? a.type === 'ace' : k === 'opp' ? opp || a.type === 'opp_error' : a.type === 'team');
    const now = a.pending ? 'Not assigned yet' : (VBClipper.TYPES[a.type] || '') + (a.players.length ? ' · ' + a.players.map((x) => `#${x.number} ${short(x.name || '')}`).join(' + ') : '');
    el.innerHTML = `<div class="ask-in" style="--c:${esc(VB.teamColor(tm))}">
      <div class="ask-h"><span class="tm"></span><b>Who earned this point?</b><span class="muted small">Set ${e.after.set} · ${e.after.score.A}–${e.after.score.B} · ${esc(tm.shortName || tm.name)}</span><span class="ask-now ${a.pending ? '' : 'done'}">${esc(now)}</span><button class="ask-x" data-ax title="Later (Esc)" aria-label="Assign later">×</button></div>
      <div class="ask-row">
        <div class="ask-types">${[['kill', 'Kill'], ['block', 'Block'], ['ace', 'Ace'], ['opp', 'Opp. error'], ['team', 'Team point']].map(([k, l]) => `<button data-at="${k}" aria-pressed="${pressed(k)}" ${k === 'ace' && !served ? `disabled title="${esc(tm.shortName || tm.name)} was not serving"` : ''}>${l}</button>`).join('')}</div>
        ${opp ? `<div class="ask-pl ask-err">${OPP_KINDS.filter(([k]) => k !== 'SERVICE_ERROR' || oppServed).map(([k, l]) => `<button data-ae="${k}" aria-pressed="${e.outcome === k}">${l}</button>`).join('')}</div>`
          : `<div class="ask-pl">${six.map((id, i) => { const p = player(team, id); return p ? `<button data-ap="${esc(id)}" aria-pressed="${sel.has(id)}" ${lib.includes(id) && block ? 'disabled title="A libero cannot block"' : ''}><kbd>${i + 1}</kbd><b>${esc(p.number)}</b><span class="ellipsis">${esc(short(p.name))}</span></button>` : ''; }).join('')}</div>`}
        ${block ? `<button class="btn sm primary" data-adone ${P.ask.picked.length ? '' : 'disabled'}>Save block</button>` : ''}
        ${others ? `<button class="btn sm ghost" data-anext>${others} more to assign ▸</button>` : ''}
      </div></div>`;
    el.hidden = false;
    document.body.classList.add('asking');
    $$('[data-at]', el).forEach((b) => b.onclick = () => askType(b.dataset.at));
    $$('[data-ap]', el).forEach((b) => b.onclick = () => askPlayer(b.dataset.ap));
    $$('[data-ae]', el).forEach((b) => b.onclick = () => attribute(P.ask.eventId, b.dataset.ae, null));
    const d = $('[data-adone]', el); if (d) d.onclick = () => attribute(P.ask.eventId, 'BLOCK', { blockers: P.ask.picked.slice() });
    const n = $('[data-anext]', el); if (n) n.onclick = () => { const x = pendingAsks().filter((y) => y.eventId !== P.ask.eventId).pop(); if (x) openAsk(x.eventId); };
    $('[data-ax]', el).onclick = closeAsk;
  }
  function askType(k) {
    if (!P.ask) return;
    if (k === 'kill') { P.ask.mode = 'kill'; P.ask.picked = []; return renderAsk(); }
    if (k === 'block') { P.ask.mode = 'block'; P.ask.picked = []; return renderAsk(); }
    if (k === 'ace') return attribute(P.ask.eventId, 'ACE', null);
    if (k === 'opp') {
      const e = P.L.timeline.find((x) => x.eventId === P.ask.eventId);
      if (e && VBClipper.attributionOf(e).type !== 'opp_error') attribute(P.ask.eventId, 'OPP_ERROR', null, true);
      if (P.ask) { P.ask.mode = 'opp'; renderAsk(); }
      return;
    }
    if (k === 'team') return attribute(P.ask.eventId, 'GENERAL', null);
  }
  function askPlayer(id) {
    if (!P.ask) return;
    if (P.ask.mode === 'block') {
      const i = P.ask.picked.indexOf(id);
      if (i >= 0) P.ask.picked.splice(i, 1); else if (P.ask.picked.length < 3) P.ask.picked.push(id);
      return renderAsk();
    }
    attribute(P.ask.eventId, 'ATTACK_KILL', { attacker: id });
  }
  // The point reads differently from now on (statistics, the clip's player,
  // the timeline) — a logged correction marked as an attribution, so Undo
  // still takes back the score, not this.
  const OPP_KINDS = [['ATTACK_ERROR', 'Attack error'], ['SERVICE_ERROR', 'Service error'], ['NET_FAULT', 'Net fault'], ['BALL_OUT', 'Ball out'], ['FOUR_HITS', 'Four hits'], ['DOUBLE_CONTACT', 'Double contact'], ['ROTATION_FAULT', 'Rotation fault'], ['OPP_ERROR', 'Other error']];
  function attribute(eventId, outcome, players, keepOpen) {
    const r = send({ type: 'CORRECT', target: eventId, patch: { outcome, players: players || null }, reason: 'Point attribution', attribution: true }, { ask: false });
    if (!r) return;
    const e = P.L.timeline.find((x) => x.eventId === eventId);
    const a = VBClipper.attributionOf(e, (t, id) => player(t, id));
    toast(`✓ ${VBClipper.TYPES[a.type] || 'Point'}${OPP_KINDS.some(([k]) => k === outcome && k !== 'OPP_ERROR') ? ' · ' + E.OUTCOMES[outcome].label : ''}${a.players.length ? ' · ' + a.players.map((x) => `#${x.number} ${x.name}`).join(' + ') : ''}`);
    if (!keepOpen && P.ask && P.ask.eventId === eventId) closeAsk();
  }

  /* =============================== rendering */
  function applyColors() {
    const m = P.match;
    const ca = VB.teamColor(m.teamA, '#0a84ff'), cb = VB.teamColor(m.teamB, '#ff9f0a');
    const s = P.L ? E.summary(P.L.setup, P.L.state) : null;
    const left = sideOrder(s)[0];
    document.body.style.setProperty('--cl', left === 'A' ? ca : cb);
    document.body.style.setProperty('--cr', left === 'A' ? cb : ca);
  }
  function sideOrder(s) { return P.followCourt && s && s.leftSide === 'B' ? ['B', 'A'] : ['A', 'B']; }
  function renderTitle() {
    const m = P.match, t = P.tournament;
    const stage = m.stage ? [m.stage.group ? 'Group ' + m.stage.group : '', m.stage.round].filter(Boolean).join(' · ') : '';
    $('#title').innerHTML = `${esc(m.teamA ? m.teamA.name : 'TBD')} v ${esc(m.teamB ? m.teamB.name : 'TBD')}<small>${esc([t && t.name, m.matchNo ? 'Match ' + m.matchNo : '', stage].filter(Boolean).join(' · '))}</small>`;
    document.title = `${m.teamA ? m.teamA.shortName : ''} v ${m.teamB ? m.teamB.shortName : ''} · Volleyball Panel`;
  }
  function renderChips() {
    if (!P.match) return;
    const conn = P.connected ? (P.outbox.length ? `<span class="chip"><span class="dot wait"></span>Saving ${P.outbox.length}…</span>` : '<span class="chip"><span class="dot ok"></span>Live</span>') : `<span class="chip"><span class="dot bad"></span>Offline${P.outbox.length ? ' · ' + P.outbox.length + ' waiting' : ''}</span>`;
    const lease = P.lease.mine ? '<span class="chip on" title="This device is scoring">● In control</span>' : '<button class="chip" id="takeBtn">View only · Take control</button>';
    $('#chips').innerHTML = '<button class="chip air" id="air" title="What the overlay shows — click for the graphics"></button>' + clipperChip() + conn + lease;
    $('#air').onclick = openGfx;
    if ($('#clpChip')) $('#clpChip').onclick = openClipper;
    renderAir();
    if ($('#takeBtn')) $('#takeBtn').onclick = () => takeControl(false);
    renderTitle();
  }
  function renderBanner() {
    if (!P.match) return;
    let h = '';
    if (P.match.locked) h += `<div class="banner bad">🔒 This match is locked${P.match.lockReason ? ' — ' + esc(P.match.lockReason) : ''}. Unlock it from the dashboard to score.</div>`;
    else if (!P.lease.mine) {
      const hd = P.lease.holder;
      h += `<div class="banner warn">${hd && hd.active ? `${esc(hd.email || 'Another device')} is scoring this match (seen ${esc(VB.ago(hd.heartbeatAt))}). This screen follows along.` : 'No device is in control right now.'}<span class="grow"></span><button class="btn sm primary" id="takeBtn2">Take control</button></div>`;
    }
    if (!P.connected && P.match) h += `<div class="banner bad" style="margin-top:6px">No connection to the website. ${P.outbox.length ? P.outbox.length + ' action(s) are saved on this device and will be sent the moment it is back.' : 'Nothing is lost — keep scoring, it is sent when the line is back.'}</div>`;
    $('#banner').innerHTML = h;
    if ($('#takeBtn2')) $('#takeBtn2').onclick = () => takeControl(false);
  }
  function renderPending() {
    $$('.bigscore').forEach((b) => b.classList.toggle('pend', P.outbox.some((o) => o.event.type === 'RALLY' && o.event.winner === b.dataset.team)));
  }
  function render() {
    if (!P.L || !P.match) return;
    renderView();
    if (P.CL) P.CL.reconcile();   // the helper hears of any attribution / undo
    renderAsk();
    if (gfxSheet) paintGfx();     // what the match can show now (a point from another device too)
  }
  function renderView() {
    applyColors();
    const s = E.summary(P.L.setup, P.L.state);
    if (s.status === 'pregame') return renderPregame(s);
    if (s.status === 'in_set') return renderLive(s);
    if (s.status === 'set_break') return renderBreak(s);
    return renderDone(s);
  }
  function teamOf(side) { return P.match['team' + side]; }
  function player(side, id) { return P.L.setup.teams[side].byId[id] || null; }
  function pname(side, id) { const p = player(side, id); return p ? `#${p.number} ${p.name}` : '—'; }
  function short(name) { const w = String(name || '').trim().split(/\s+/); return w.length > 1 ? w[0][0] + '. ' + w[w.length - 1] : (name || ''); }

  /* ---------- live ---------- */
  function renderLive(s) {
    const [L, R] = sideOrder(s);
    const prevMain = $('#main');
    if (!$('.live', prevMain)) prevMain.innerHTML = `<div class="live">${teamCard(L, 'left')}<div class="center" id="center"></div>${teamCard(R, 'right')}</div>`;
    else if ($('.team.left', prevMain).dataset.t !== L) prevMain.innerHTML = `<div class="live">${teamCard(L, 'left')}<div class="center" id="center"></div>${teamCard(R, 'right')}</div>`;
    ['A', 'B'].forEach((t) => fillTeam(t, s));
    renderCenter(s);
    renderPending();
    wireTeamButtons();
  }
  function teamCard(t, pos) {
    const tm = teamOf(t), c = VB.teamColor(tm);
    return `<section class="team ${pos}" data-t="${t}" style="--c:${esc(c)};--tc:${esc(VB.onColor(c))}">
      <span class="sidebadge">${pos === 'left' ? 'LEFT' : 'RIGHT'} COURT</span>
      <div class="th">${VB.logoHtml(tm)}<div class="grow"><div class="tname ellipsis">${esc(tm.name)}</div><span class="serve" data-serve>🏐 Serving</span></div></div>
      <div class="bigscore" data-pts data-team="${t}">0</div>
      <div class="pips" data-pips></div>
      <button class="point" data-point="${t}">＋ Point <kbd>${pos === 'left' ? 'A' : 'L'}</kbd></button>
      <div class="quick"><span class="tiny muted" style="width:100%">Point by ${esc(tm.shortName || tm.name)}:</span>
        <button class="chip" data-q="ATTACK_KILL" data-qt="${t}">Kill</button><button class="chip" data-q="BLOCK" data-qt="${t}">Block</button><button class="chip" data-q="ACE" data-qt="${t}">Ace</button>
        <button class="chip" data-q="OPP" data-qt="${t}">Opponent error ▾</button></div>
      <div class="tools"><button class="tool" data-to="${t}">Time-out <span class="dots" data-tod></span></button><button class="tool" data-sub="${t}">Subs <span class="num" data-subs></span></button><button class="tool" data-lib="${t}">Libero</button></div>
    </section>`;
  }
  function fillTeam(t, s) {
    const el = $(`.team[data-t="${t}"]`);
    if (!el) return;
    el.classList.toggle('serving', s.serving === t);
    const sv = $('[data-serve]', el);
    sv.textContent = s.serving === t && s.server ? `🏐 Serving · #${s.server.number} ${short(s.server.name)}` : '🏐 Serving';
    const pts = $('[data-pts]', el);
    const v = String(s.points[t]);
    if (pts.textContent !== v) { pts.textContent = v; if (P.lastPop[t] !== undefined) { pts.classList.remove('pop'); void pts.offsetWidth; pts.classList.add('pop'); } }
    P.lastPop[t] = v;
    $('[data-pips]', el).innerHTML = 'Sets ' + Array.from({ length: s.setsToWin }, (_, i) => `<i class="${i < s.setsWon[t] ? 'f' : ''}"></i>`).join('');
    const tl = s.timeoutsLeft[t], tot = P.L.state.rules.timeoutsPerSet;
    $('[data-tod]', el).innerHTML = Array.from({ length: tot }, (_, i) => `<i class="${i < tot - tl ? 'u' : ''}"></i>`).join('');
    $('[data-to]', el).disabled = tl <= 0 || !P.lease.mine;
    $('[data-subs]', el).textContent = `${s.subsLeft[t]} left`;
    const lib = P.L.setup.teams[t].liberos.length;
    $('[data-lib]', el).disabled = !lib || !P.L.state.rules.liberoEnabled || !P.lease.mine;
    $('[data-lib]', el).textContent = s.libero[t] ? 'Libero out' : 'Libero in';
    $$('[data-point],[data-q],[data-sub]', el).forEach((b) => { b.disabled = !P.lease.mine || P.match.locked; });
  }
  function wireTeamButtons() {
    $$('[data-point]').forEach((b) => b.onclick = () => point(b.dataset.point));
    $$('[data-q]').forEach((b) => b.onclick = () => quickPoint(b.dataset.qt, b.dataset.q));
    $$('[data-to]').forEach((b) => b.onclick = () => send({ type: 'TIMEOUT', team: b.dataset.to }));
    $$('[data-sub]').forEach((b) => b.onclick = () => subSheet(b.dataset.sub));
    $$('[data-lib]').forEach((b) => b.onclick = () => liberoSheet(b.dataset.lib));
  }
  function renderCenter(s) {
    const c = $('#center');
    if (!c) return;
    const r = P.L.state.rules;
    c.innerHTML = `<div class="card setbox"><h2>Set ${s.set}${s.deciding ? ' · Deciding set' : ''}</h2>
        <div class="muted small">First to ${s.target}, win by ${r.winBy}${r.pointCap ? ` (cap ${r.pointCap})` : ''} · best of ${r.bestOf}</div>
        <div class="setchips" style="margin-top:8px">${s.sets.filter((x) => x.status === 'completed').map((x) => `<span>S${x.set} ${x.A}-${x.B}</span>`).join('') || '<span class="muted">First set</span>'}</div></div>
      <div class="status" id="status"></div>
      <div class="card" style="padding:10px"><div class="court" id="court"></div>
        <div class="row tiny muted" style="justify-content:space-between;margin-top:6px"><span>Front row at the net · 🏐 server (position I)</span><label class="row"><button class="switch" style="transform:scale(.7)" role="switch" aria-checked="${!!P.followCourt}" id="fc"></button>Follow court sides</label></div></div>
      <div class="tools"><button class="tool" id="undo" title="Undo (Z)">↶ Undo</button><button class="tool" id="redo" title="Redo (Y)">↷ Redo</button><button class="tool" id="replay" title="Replay the rally (R)">⟲ Replay</button></div>
      <div class="card" style="padding:12px"><div class="row" style="margin-bottom:8px"><b class="grow">Timeline</b><button class="btn xs" id="detail" title="Add who scored to the last point">Add detail to last point</button></div><div class="timeline" id="timeline"></div></div>`;
    renderStatus(); renderCourt(s); renderTimeline();
    $('#fc').onclick = () => { P.followCourt = !P.followCourt; VB.store.set('vb_follow_court', P.followCourt); $('#main').innerHTML = ''; render(); };
    $('#undo').onclick = undo; $('#redo').onclick = redo;
    $('#replay').onclick = () => replaySheet();
    $('#detail').onclick = () => detailLast();
    $('#undo').disabled = !P.lease.mine || !E.lastUndoable(P.L.events);
    $('#redo').disabled = !P.lease.mine || !E.lastRedoable(P.L.events);
  }
  // The latest time-out, while it runs (no rally since).
  function runningTimeout() {
    if (!P.L || P.L.state.status !== 'in_set') return null;
    const tl = P.L.timeline;
    for (let i = tl.length - 1; i >= 0; i--) {
      const e = tl[i];
      if (e.voided || e.invalid) continue;
      if (e.type === 'RALLY' || e.type === 'SET_START' || e.type === 'REPLAY') return null;
      if (e.type === 'TIMEOUT') {
        const secs = P.L.state.rules.timeoutSeconds;
        const left = Math.ceil(((e.at || 0) - VB.clock.offset + secs * 1000 - Date.now()) / 1000);
        return left > 0 && left <= secs + 5 ? { team: e.team, left: Math.min(left, secs) } : null;
      }
    }
    return null;
  }
  function renderStatus() {
    const el = $('#status'); if (!el || !P.L) return;
    const s = E.summary(P.L.setup, P.L.state);
    const last = P.L.timeline[P.L.timeline.length - 1];
    let txt = 'Play on', k = '';
    const to = runningTimeout();
    if (to) { txt = `Time-out ${teamOf(to.team).shortName || teamOf(to.team).name} · ${to.left} s`; k = 'to'; }
    else if (last && last.effects && last.effects.some((e) => e.type === 'CHANGE_COURTS') && !last.voided) { txt = 'Change courts — the leading team reached ' + P.L.state.rules.decidingSetSwitchAt; k = 'cs'; }
    else if (s.matchPoint) { txt = 'Match point · ' + teamOf(s.matchPoint).name; k = 'mp'; }
    else if (s.setPoint) { txt = 'Set point · ' + teamOf(s.setPoint).name; k = 'sp'; }
    el.className = 'status ' + k; el.textContent = txt;
  }
  function renderCourt(s) {
    const [Lt, Rt] = sideOrder(s);
    // left team faces right: front row (IV III II) next to the net
    const leftMap = [[4, 3], [5, 2], [0, 1]];   // rows top→bottom: [back idx, front idx]
    const rightMap = [[1, 0], [2, 5], [3, 4]];  // rows: [front idx, back idx]
    const cell = (t, idx) => {
      const id = P.L.state.positions[t] ? P.L.state.positions[t][idx] : null;
      const p = id ? player(t, id) : null;
      const isSrv = s.serving === t && idx === 0;
      const isLib = !!(s.libero[t] && s.libero[t].liberoId === id);
      return `<div class="pos ${isSrv ? 'srv' : ''} ${isLib ? 'lib' : ''}" style="--c:${esc(VB.teamColor(teamOf(t)))}"><em>${VB.POS[idx]}</em><div><b>${p ? esc(p.number) : '?'}</b><small>${p ? esc(short(p.name)) : ''}${isLib ? ' · L' : ''}</small></div></div>`;
    };
    $('#court').innerHTML = `<div class="half">${leftMap.map((r) => cell(Lt, r[0]) + cell(Lt, r[1])).join('')}</div><div class="net"></div><div class="half">${rightMap.map((r) => cell(Rt, r[0]) + cell(Rt, r[1])).join('')}</div>`;
  }
  // a short word in the row; the whole story in the tooltip
  const CLIP_SHORT = { QUEUED: 'Clip queued', WAITING_FOR_VIDEO: 'Clip…', CUTTING: 'Cutting…', UPLOAD_PENDING: 'Clip ✓ · uploading', READY: 'Clip ✓', FAILED: 'No clip', CANCELLED: 'Clip kept' };
  function clipBadge(eventId) {
    const r = P.CL && P.CL.row(eventId);
    if (!r || !r.state) return '';
    const st = r.state;
    const label = st.k === 'READY' && /Deleted/.test(st.text) ? 'Deleted' : CLIP_SHORT[st.k] || st.text;
    return `<span class="clipst ${st.cls}" title="${esc(r.error ? st.text + ' — ' + r.error : st.text)}">🎬 ${esc(label)}${r.partial ? ' (short)' : ''}</span>${r.attribution.pending && !r.voided && P.lease.mine ? `<button class="clipst wait" data-tlask="${esc(eventId)}" title="Who earned this point?">Assign</button>` : ''}`;
  }
  function renderTimeline() {
    const el = $('#timeline'); if (!el || !P.L) return;
    const rows = P.L.timeline.filter((e) => !E.META[e.type] && e.type !== 'NOTE').slice(-40).reverse();
    el.innerHTML = rows.map((e) => {
      const sc = e.after ? `${e.after.score.A}-${e.after.score.B}` : '';
      let what = '';
      if (e.type === 'RALLY') {
        const o = E.OUTCOMES[e.outcome] || E.OUTCOMES.GENERAL, p = e.players || {};
        const who = p.attacker ? pname(e.outcome === 'ATTACK_ERROR' || e.outcome === 'BLOCK' ? E.other(e.team) : e.team, p.attacker) : (p.blockers && p.blockers.length ? p.blockers.map((b) => pname(e.team, b)).join(' + ') : e.outcome === 'ACE' && e.rallyServer ? pname(e.rallyServer.team, e.rallyServer.playerId) : (p.errorBy ? pname(E.other(e.team), p.errorBy) : ''));
        what = `<span class="tm" style="background:${esc(VB.teamColor(teamOf(e.team)))}"></span><b>${esc(teamOf(e.team).shortName || teamOf(e.team).name)}</b> ${e.outcome === 'GENERAL' ? '' : esc(o.label)}${who ? ' · ' + esc(who) : ''}${e.corrected ? ' <span class="badge">corrected</span>' : ''}`;
      } else if (e.type === 'TIMEOUT') what = `Time-out · ${esc(teamOf(e.team).name)}`;
      else if (e.type === 'SUBSTITUTION') what = `Sub · ${esc(teamOf(e.team).shortName)} ${(e.pairs || []).map((x) => esc(pname(e.team, x.in)) + ' for ' + esc(pname(e.team, x.out))).join(', ')}`;
      else if (e.type === 'LIBERO') what = `Libero ${e.action === 'out' ? 'out' : 'in'} · ${esc(pname(e.team, e.libero))}${e.action !== 'out' ? ' for ' + esc(pname(e.team, e.replaces)) : ''}`;
      else if (e.type === 'SET_START') what = `<b>Set ${e.after ? e.after.set : ''} starts</b>`;
      else if (e.type === 'REPLAY') what = 'Rally replayed (no point)';
      else if (e.type === 'TOSS') what = `Toss · ${esc(teamOf(e.toss.winner).name)} chose ${esc(e.toss.choice)}`;
      else if (e.type === 'LINEUP') what = `Line-up · ${esc(teamOf(e.team).shortName)} (set ${e.set || ''})`;
      else what = esc(e.type.toLowerCase().replace(/_/g, ' ')) + (e.reason ? ' · ' + esc(e.reason) : '');
      return `<div class="tl ${e.voided ? 'void' : ''}" title="${e.invalid ? esc(e.invalid.error) : ''}"><span class="sc">${esc(sc)}</span><span class="ellipsis">${what}${e.invalid ? ' <span class="badge warn">no longer applies</span>' : ''}</span>${e.type === 'RALLY' ? `<span class="tlc">${clipBadge(e.eventId)}</span>` : '<span></span>'}</div>`;
    }).join('') || '<div class="muted small">Nothing yet</div>';
    $$('[data-tlask]', el).forEach((b) => b.onclick = () => openAsk(b.dataset.tlask));
  }

  /* ---------- scoring actions ---------- */
  // ask: how the "who earned it?" strip opens ('kill' — tap a name; 'BLOCK';
  // 'opp' — the kind of error; false — not at all)
  function point(team, extra, ask) {
    const now = Date.now();
    if (now - P.lastPointAt < 600) { toast('Ignored a double tap'); return; }   // no rally is that short
    P.lastPointAt = now;
    return send(Object.assign({ type: 'RALLY', winner: team, outcome: 'GENERAL' }, extra || {}), { ask: ask === undefined ? 'kill' : ask });
  }
  // The detailed buttons record the point AT ONCE as well — the press is the
  // moment of the clip — and leave only the name (or the kind of error) to
  // the strip, which never stands in the way of the next point.
  function quickPoint(team, kind) {
    const s = E.summary(P.L.setup, P.L.state);
    if (kind === 'ACE') {
      if (s.serving !== team) return toast(`An ace can only be scored by the serving team (${teamOf(s.serving).name})`, 'err');
      return point(team, { outcome: 'ACE' }, false);   // the server is known from the rotation
    }
    if (kind === 'OPP') return point(team, { outcome: 'OPP_ERROR' }, 'opp');
    return point(team, {}, kind === 'BLOCK' ? 'BLOCK' : 'kill');
  }
  function onCourt(t) { return (P.L.state.positions[t] || []).slice(); }
  function pickHtml(t, ids, multi) {
    return `<div class="pick">${ids.map((id) => { const p = player(t, id); return p ? `<button data-pid="${esc(id)}" aria-pressed="false"><b>${esc(p.number)}</b><span class="ellipsis">${esc(p.name)}</span></button>` : ''; }).join('')}</div>`;
  }
  function undo() {
    const last = E.lastUndoable(P.L.events);
    if (!last) return toast('Nothing to undo');
    if (P.L.state.status === 'completed') {
      return VB.prompt('Undo the final point?', 'The match is complete. Undoing reopens it (the report is remade when it is complete again).', 'Reason', 'Undo').then((reason) => { if (reason) send({ type: 'UNDO', target: last.eventId, reason }); });
    }
    send({ type: 'UNDO', target: last.eventId });
  }
  function redo() { const u = E.lastRedoable(P.L.events); if (!u) return toast('Nothing to redo'); send({ type: 'REDO', target: u.eventId }); }
  function replaySheet() {
    const sh = VB.sheet(`<h3>Replay the rally</h3><p class="muted small" style="margin:6px 0 12px">No point, same server.</p><div class="row wrapr">${Object.keys(E.REPLAY_REASONS).map((k) => `<button class="chip" data-r="${k}">${esc(E.REPLAY_REASONS[k])}</button>`).join('')}</div><div class="foot"><button class="btn" data-close>Cancel</button></div>`);
    $$('[data-r]', sh.el).forEach((b) => b.onclick = () => { sh.close(); send({ type: 'REPLAY', reason: b.dataset.r }); });
  }
  // Add who scored to the latest rally (a correction the audit log keeps).
  function detailLast() {
    const e = [...P.L.timeline].reverse().find((x) => x.type === 'RALLY' && !x.voided && !x.invalid);
    if (!e) return toast('No point yet');
    const team = e.team, opp = E.other(team);
    const kinds = [['ATTACK_KILL', 'Kill'], ['BLOCK', 'Block'], ['ACE', 'Ace'], ['ATTACK_ERROR', 'Attack error'], ['SERVICE_ERROR', 'Service error'], ['RECEPTION_ERROR', 'Reception error'], ['NET_FAULT', 'Net fault'], ['BALL_OUT', 'Ball out'], ['OPP_ERROR', 'Other error'], ['GENERAL', 'Unclassified']];
    const sh = VB.sheet(`<h3>Last point · ${esc(teamOf(team).name)} (${e.after.score.A}-${e.after.score.B})</h3>
      <div class="row wrapr" style="margin:12px 0">${kinds.map(([k, l]) => `<button class="chip ${e.outcome === k ? 'on' : ''}" data-k="${k}">${l}</button>`).join('')}</div><div id="who"></div><div class="foot"><button class="btn" data-close>Close</button></div>`);
    const apply = (outcome, players) => { sh.close(); send({ type: 'CORRECT', target: e.eventId, patch: { outcome, players: players || null }, reason: 'Detail added by the scorer', attribution: true }, { ask: false }); };
    $$('[data-k]', sh.el).forEach((b) => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'GENERAL' || k === 'SERVICE_ERROR' || k === 'ACE') return apply(k, null);
      const side = k === 'ATTACK_KILL' || k === 'BLOCK' ? team : opp;
      const multi = k === 'BLOCK';
      const picked = new Set();
      $('#who', sh.el).innerHTML = `<p class="small muted" style="margin-bottom:8px">Who? (${esc(teamOf(side).name)})</p>${pickHtml(side, P.L.setup.teams[side].order, multi)}<div class="foot">${multi ? '<button class="btn primary" id="done">Save block</button>' : ''}<button class="btn" id="skip">Without a name</button></div>`;
      $$('[data-pid]', sh.el).forEach((pb) => pb.onclick = () => {
        const id = pb.dataset.pid;
        if (multi) { if (picked.has(id)) picked.delete(id); else picked.add(id); pb.setAttribute('aria-pressed', String(picked.has(id))); return; }
        apply(k, k === 'ATTACK_KILL' || k === 'ATTACK_ERROR' ? { attacker: id } : k === 'RECEPTION_ERROR' ? { receiver: id } : { errorBy: id });
      });
      if (multi) $('#done', sh.el).onclick = () => apply(k, picked.size ? { blockers: [...picked] } : null);
      $('#skip', sh.el).onclick = () => apply(k, null);
    });
  }
  function subSheet(team) {
    const pos = onCourt(team), lib = P.L.state.libero[team];
    const bench = P.L.setup.teams[team].order.filter((id) => !pos.includes(id) && !P.L.setup.teams[team].liberos.includes(id) && !(lib && lib.replaced === id));
    let out = null, inn = null, exceptional = false;
    const sh = VB.sheet(`<h3>Substitution · ${esc(teamOf(team).name)}</h3><p class="small muted" style="margin:4px 0 12px">${E.summary(P.L.setup, P.L.state).subsLeft[team]} of ${P.L.state.rules.substitutionsPerSet} left this set. The rules (once out, once back, only for the same player) are checked as you choose.</p>
      <div class="grid2"><div><b class="small">Going out (on court)</b><div class="pick" id="po" style="margin-top:8px">${pos.filter((id) => !(lib && lib.liberoId === id)).map((id) => `<button data-o="${esc(id)}" aria-pressed="false"><b>${esc(player(team, id).number)}</b><span class="ellipsis">${esc(player(team, id).name)}</span></button>`).join('')}</div></div>
      <div><b class="small">Coming in</b><div class="pick" id="pi" style="margin-top:8px">${bench.map((id) => `<button data-i="${esc(id)}" aria-pressed="false"><b>${esc(player(team, id).number)}</b><span class="ellipsis">${esc(player(team, id).name)}</span></button>`).join('') || '<span class="muted small">No one on the bench</span>'}</div></div></div>
      <label class="row small" style="margin-top:12px"><button class="switch" role="switch" aria-checked="false" id="exc"></button>Exceptional substitution (injury — FIVB 15.7)</label>
      <div id="check" class="small" style="margin-top:10px;min-height:20px"></div>
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok" disabled>Substitute</button></div>`, { wide: true });
    const check = () => {
      $$('[data-o]', sh.el).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.o === out)));
      $$('[data-i]', sh.el).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.i === inn)));
      if (!out || !inn) { $('#ok', sh.el).disabled = true; $('#check', sh.el).textContent = ''; return; }
      const r = P.L.check({ eventId: 'probe', type: 'SUBSTITUTION', team, pairs: [{ out, in: inn }], exceptional });
      $('#check', sh.el).innerHTML = r.ok ? '<span style="color:var(--green)">✓ Legal substitution</span>' : `<span style="color:var(--red)">${esc(r.error)}</span>`;
      $('#ok', sh.el).disabled = !r.ok && !r.overridable;
      $('#ok', sh.el).textContent = r.ok ? 'Substitute' : 'Record anyway…';
    };
    $$('[data-o]', sh.el).forEach((b) => b.onclick = () => { out = b.dataset.o; check(); });
    $$('[data-i]', sh.el).forEach((b) => b.onclick = () => { inn = b.dataset.i; check(); });
    $('#exc', sh.el).onclick = (e) => { exceptional = !exceptional; e.currentTarget.setAttribute('aria-checked', String(exceptional)); check(); };
    $('#ok', sh.el).onclick = () => { sh.close(); send({ type: 'SUBSTITUTION', team, pairs: [{ out, in: inn }], exceptional, reason: exceptional ? 'Injury' : undefined }); };
  }
  function liberoSheet(team) {
    const cur = P.L.state.libero[team], libs = P.L.setup.teams[team].liberos;
    if (cur) {
      const other = libs.filter((x) => x !== cur.liberoId);
      const sh = VB.sheet(`<h3>Libero · ${esc(teamOf(team).name)}</h3><p class="small muted" style="margin:6px 0 12px">${esc(pname(team, cur.liberoId))} is on court for ${esc(pname(team, cur.replaced))}.</p>
        <div class="stack"><button class="btn primary" id="out">${esc(pname(team, cur.replaced))} comes back</button>${other.map((id) => `<button class="btn" data-sw="${esc(id)}">Second libero ${esc(pname(team, id))} replaces ${esc(pname(team, cur.liberoId))}</button>`).join('')}</div><div class="foot"><button class="btn" data-close>Cancel</button></div>`);
      $('#out', sh.el).onclick = () => { sh.close(); send({ type: 'LIBERO', team, libero: cur.liberoId, action: 'out', returning: cur.replaced }); };
      $$('[data-sw]', sh.el).forEach((b) => b.onclick = () => { sh.close(); send({ type: 'LIBERO', team, libero: b.dataset.sw, replaces: cur.liberoId }); });
      return;
    }
    const pos = onCourt(team);
    const s = E.summary(P.L.setup, P.L.state);
    let lib = libs[0] || null;
    const sh = VB.sheet(`<h3>Libero in · ${esc(teamOf(team).name)}</h3><div class="row wrapr" style="margin:10px 0">${libs.map((id) => `<button class="chip ${id === lib ? 'on' : ''}" data-l="${esc(id)}">${esc(pname(team, id))}</button>`).join('')}</div>
      <p class="small muted" style="margin-bottom:8px">Replaces a back-row player${s.serving === team ? ' (not the server)' : ''}:</p><div class="pick">${[0, 4, 5].map((idx) => { const id = pos[idx]; const p = player(team, id); const dis = idx === 0 && s.serving === team; return p ? `<button data-r="${esc(id)}" ${dis ? 'disabled' : ''}><b>${esc(p.number)}</b><span class="ellipsis">${esc(p.name)} · ${VB.POS[idx]}</span></button>` : ''; }).join('')}</div><div class="foot"><button class="btn" data-close>Cancel</button></div>`);

  }

  /* ---------- pre-match / between sets ---------- */
  function renderPregame(s) {
    const m = P.match, st = P.L.state;
    const toss = st.tosses[1];
    const lu = st.lineups[1] || {};
    const squadOk = ['A', 'B'].every((t) => P.L.setup.teams[t].order.length >= 6);
    $('#main').innerHTML = `<div class="steps">
      <div class="card"><div class="row wrapr"><div class="grow"><h2>Before the match</h2><div class="muted small">${esc(m.venue || '')} ${m.scheduledAt ? '· ' + esc(VB.fmtDate(m.scheduledAt)) : ''} · ${esc(rulesLine(st.rules))}</div></div>
        <button class="btn sm" data-g="intro">Show match intro</button></div></div>
      <div class="card step ${squadOk ? 'done' : ''}"><span class="n">1</span><div><h3>Squads</h3><p class="small muted">${['A', 'B'].map((t) => `${esc(teamOf(t).name)}: ${P.L.setup.teams[t].order.length} players, ${P.L.setup.teams[t].liberos.length} libero(s)`).join(' · ')}</p>
        ${squadOk ? '' : '<div class="banner warn" style="margin-top:8px">Each team needs at least six players in its squad — edit the match in the dashboard.</div>'}<a class="btn sm" style="margin-top:8px" href="/volleyball#/t/${esc(m.tournamentId)}">Edit squads in the dashboard</a></div></div>
      <div class="card step ${toss ? 'done' : ''}"><span class="n">2</span><div><h3>Toss</h3>${toss ? `<p class="small">${esc(tossText(toss))}</p><div class="row" style="margin-top:8px"><button class="btn sm" data-g="toss">Show toss on air</button></div>` : `<p class="small muted">The toss winner chooses to serve, to receive, or the side of the court.</p><button class="btn primary sm" id="tossBtn" style="margin-top:8px" ${P.lease.mine ? '' : 'disabled'}>Record the toss</button>`}</div></div>
      <div class="card step ${lu.A && lu.B ? 'done' : ''}"><span class="n">3</span><div><h3>Starting line-ups — set 1</h3><p class="small muted">Tap a position, then a player. Position I serves first. The libero is not part of the six.</p><div class="lineups" id="lus" style="margin-top:10px"></div></div></div>
      <div class="card step"><span class="n">4</span><div class="row wrapr"><div class="grow"><h3>Start the match</h3><p class="small muted">${toss ? esc(teamOf(toss.firstServe).name) + ' serves first.' : 'Record the toss first.'}</p></div><button class="btn sm" data-g="lineup">Show line-ups</button><button class="btn green" id="startBtn" ${toss && lu.A && lu.B && P.lease.mine ? '' : 'disabled'}>Start set 1</button></div></div>
    </div>`;
    if ($('#tossBtn')) $('#tossBtn').onclick = () => tossSheet(1);
    $('#startBtn').onclick = () => { if (send({ type: 'SET_START', set: 1 })) graphic('scorebug'); };
    $$('[data-g]').forEach((b) => b.onclick = () => graphic(b.dataset.g));
    lineupEditors(1, $('#lus'));
  }
  function rulesLine(r) { return `Best of ${r.bestOf} · to ${r.setPoints}${r.bestOf >= 3 ? '/' + r.decidingSetPoints : ''} · win by ${r.winBy}${r.official ? ' · FIVB' : ' · competition rules'}`; }
  function tossText(t) { return `${teamOf(t.winner).name} won the toss and chose ${t.choice === 'court' ? 'the court side' : 'to ' + t.choice}${t.choice !== 'serve' ? ` — ${teamOf(t.firstServe).name} serves first` : ''}.`; }
  function tossSheet(set) {
    let winner = null, choice = null, firstServe = null, leftSide = null;
    const sh = VB.sheet(`<h3>${set === 1 ? 'Toss' : 'Deciding-set toss'}</h3><p class="small muted" style="margin:4px 0 12px">Record the real toss — nothing here is random.</p>
      <div class="stack"><div><b class="small">Won the toss</b><div class="row wrapr" style="margin-top:6px">${['A', 'B'].map((t) => `<button class="chip" data-w="${t}">${esc(teamOf(t).name)}</button>`).join('')}</div></div>
      <div><b class="small">Chose</b><div class="row wrapr" style="margin-top:6px"><button class="chip" data-c="serve">To serve</button><button class="chip" data-c="receive">To receive</button><button class="chip" data-c="court">The court side</button></div></div>
      <div id="fsx" class="hide"><b class="small">The other team chose — who serves first?</b><div class="row wrapr" style="margin-top:6px">${['A', 'B'].map((t) => `<button class="chip" data-f="${t}">${esc(teamOf(t).name)}</button>`).join('')}</div></div>
      <div><b class="small">On the scorer's LEFT</b><div class="row wrapr" style="margin-top:6px">${['A', 'B'].map((t) => `<button class="chip" data-l="${t}">${esc(teamOf(t).name)}</button>`).join('')}</div></div></div>
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok" disabled>Save toss</button></div>`);
    const upd = () => {
      $$('[data-w]', sh.el).forEach((b) => b.classList.toggle('on', b.dataset.w === winner));
      $$('[data-c]', sh.el).forEach((b) => b.classList.toggle('on', b.dataset.c === choice));
      $$('[data-f]', sh.el).forEach((b) => b.classList.toggle('on', b.dataset.f === firstServe));
      $$('[data-l]', sh.el).forEach((b) => b.classList.toggle('on', b.dataset.l === leftSide));
      $('#fsx', sh.el).classList.toggle('hide', choice !== 'court');
      $('#ok', sh.el).disabled = !(winner && choice && leftSide && (choice !== 'court' || firstServe));
    };
    $$('[data-w]', sh.el).forEach((b) => b.onclick = () => { winner = b.dataset.w; upd(); });
    $$('[data-c]', sh.el).forEach((b) => b.onclick = () => { choice = b.dataset.c; upd(); });
    $$('[data-f]', sh.el).forEach((b) => b.onclick = () => { firstServe = b.dataset.f; upd(); });
    $$('[data-l]', sh.el).forEach((b) => b.onclick = () => { leftSide = b.dataset.l; upd(); });
    // the toss goes on air once the server has it (the server shows only what it has)
    $('#ok', sh.el).onclick = () => { sh.close(); whenSaved(send({ type: 'TOSS', set, winner, choice, firstServe: choice === 'court' ? firstServe : undefined, leftSide }), () => graphic('toss', { set })); };
  }
  // Six slots per team, laid out as the team sees its court (front row IV III II).
  const luDraft = {};
  function lineupEditors(set, host) {
    const st = P.L.state;
    ['A', 'B'].forEach((t) => {
      const key = set + t;
      const saved = st.lineups[set] && st.lineups[set][t];
      const prev = st.sets.length ? st.sets[st.sets.length - 1].lineup : null;
      if (!luDraft[key]) luDraft[key] = { slots: (saved || (prev && prev[t]) || new Array(6).fill(null)).slice(), sel: 0 };

      const d = luDraft[set + t], saved = st.lineups[set] && st.lineups[set][t];

      const used = new Set(d.slots.filter(Boolean));
