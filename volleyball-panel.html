        <div class="lu-court">${order.map((idx) => { const id = d.slots[idx]; const p = id ? player(t, id) : null; return `<button class="lu-slot ${d.sel === idx ? 'sel' : ''}" data-slot="${t}|${idx}"><div><span class="tiny muted">${VB.POS[idx]}${idx === 0 ? ' · serves' : ''}</span><br>${p ? `<b>${esc(p.number)}</b><br><span class="tiny">${esc(short(p.name))}</span>` : '<span class="muted">—</span>'}</div></button>`; }).join('')}</div>
        <div class="tiny muted" style="margin-top:6px">↑ net · front row IV III II, back row V VI I</div>
        <div class="lu-bench">${bench.map((id) => { const p = player(t, id); return `<button class="chip ${used.has(id) ? 'on' : ''}" data-bp="${t}|${esc(id)}">#${esc(p.number)} ${esc(short(p.name))}${p.role ? ' · ' + esc(p.role) : ''}</button>`; }).join('')}
        ${P.L.setup.teams[t].liberos.map((id) => `<span class="chip" style="opacity:.6" title="Libero — enters by libero replacement">L #${esc(player(t, id).number)} ${esc(short(player(t, id).name))}</span>`).join('')}</div>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-clear="${t}">Clear</button><span class="grow"></span><button class="btn sm primary" data-save="${t}" ${d.slots.every(Boolean) && P.lease.mine ? '' : 'disabled'}>Save line-up</button></div></div>`;
    }).join('');
    $$('[data-slot]', host).forEach((b) => b.onclick = () => { const [t, idx] = b.dataset.slot.split('|'); luDraft[set + t].sel = Number(idx); lineupEditors(set, host); });
    $$('[data-bp]', host).forEach((b) => b.onclick = () => {
      const [t, id] = b.dataset.bp.split('|'); const d = luDraft[set + t];
      const at = d.slots.indexOf(id);
      if (at >= 0) d.slots[at] = null;
      d.slots[d.sel] = id;
      const next = [3, 2, 1, 4, 5, 0].find((i) => !d.slots[i]);
      if (next != null) d.sel = next;
      lineupEditors(set, host);
    });
    $$('[data-clear]', host).forEach((b) => b.onclick = () => { luDraft[set + b.dataset.clear] = { slots: new Array(6).fill(null), sel: 3 }; lineupEditors(set, host); });
    $$('[data-save]', host).forEach((b) => b.onclick = () => { const t = b.dataset.save; if (send({ type: 'LINEUP', set, team: t, positions: luDraft[set + t].slots })) toast('Line-up saved'); });
  }
  function renderBreak(s) {
    const st = P.L.state, last = st.sets[st.sets.length - 1], next = st.sets.length + 1;
    const needToss = s.nextDeciding && st.rules.decidingSetToss && !st.tosses[next];
    const lu = st.lineups[next] || {};
    $('#main').innerHTML = `<div class="steps"><div class="card" style="text-align:center"><div class="muted small">SET ${last.number} · ${esc(last.deciding ? 'Deciding set' : '')}</div>
        <h2 style="font-size:30px;margin:4px 0">${esc(teamOf(last.winner).name)} win the set ${last.points.A}-${last.points.B}</h2>
        <div class="setchips">${s.sets.map((x) => `<span>S${x.set} ${x.A}-${x.B}</span>`).join('')}</div>
        <div class="muted" style="margin-top:6px">Sets ${s.setsWon.A}-${s.setsWon.B} · ${s.nextDeciding ? 'next: the deciding set' : 'next: set ' + next}</div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" data-g="setSummary">Show set summary</button><button class="btn sm" id="undoB">↶ Undo last point</button></div></div>
      ${needToss ? `<div class="card step"><span class="n">!</span><div><h3>Deciding-set toss</h3><p class="small muted">FIVB 7.1: a new toss before the deciding set.</p><button class="btn primary sm" id="dtoss" style="margin-top:8px">Record the toss</button></div></div>` : ''}
      <div class="card step ${lu.A && lu.B ? 'done' : ''}"><span class="n">${next}</span><div><h3>Line-ups for set ${next}</h3><p class="small muted">Courts change${s.nextDeciding ? ' as the toss decided' : ''}. Starting from the last set's six — change what you need.</p><div class="lineups" id="lus" style="margin-top:10px"></div></div></div>
      <div class="card row wrapr"><div class="grow"><h3>Start set ${next}</h3></div><button class="btn sm" data-g="lineup">Show line-ups</button><button class="btn green" id="startBtn" ${!needToss && lu.A && lu.B && P.lease.mine ? '' : 'disabled'}>Start set ${next}</button></div></div>`;
    if ($('#dtoss')) $('#dtoss').onclick = () => tossSheet(next);
    $('#undoB').onclick = undo;
    $('#startBtn').onclick = () => { if (send({ type: 'SET_START', set: next })) graphic('scorebug'); };
    $$('[data-g]').forEach((b) => b.onclick = () => graphic(b.dataset.g));
    lineupEditors(next, $('#lus'));
  }
  function renderDone(s) {
    const st = P.L.state, rep = P.match.report;
    const w = st.winner;
    $('#main').innerHTML = `<div class="steps"><div class="card" style="text-align:center;padding:28px">
        <div class="muted small">${st.status === 'abandoned' ? 'ABANDONED' : 'FINAL'}${st.forfeit ? ' · FORFEIT' : ''}</div>
        <div class="row" style="justify-content:center;gap:24px;margin:12px 0">${VB.logoHtml(teamOf('A'), 'lg')}<div style="font-size:64px;font-weight:800;letter-spacing:-.04em" class="num">${s.setsWon.A} – ${s.setsWon.B}</div>${VB.logoHtml(teamOf('B'), 'lg')}</div>
        ${w ? `<h2>${esc(teamOf(w).name)} win</h2>` : `<h2>${esc(st.abandoned && st.abandoned.reason || 'No result')}</h2>`}
        <div class="setchips" style="margin-top:10px">${s.sets.map((x) => `<span>S${x.set} ${x.A}-${x.B}</span>`).join('')}</div>
        <div class="row wrapr" style="justify-content:center;margin-top:16px">
          ${rep && rep.status === 'ready' ? `<a class="btn primary" href="/api/volleyball/matches/${esc(P.matchId)}/report.pdf?key=${esc(P.match.overlayKey || '')}" target="_blank" rel="noopener">Match report (PDF v${rep.version})</a>` : `<span class="badge warn">${rep && rep.status === 'failed' ? 'Report failed — retrying' : 'Preparing the PDF report…'}</span>`}
          <button class="btn" id="regen">Remake report</button><a class="btn" href="/volleyball/match/${esc(P.matchId)}" target="_blank" rel="noopener">Scorecard</a><button class="btn" data-g="final">Show final result</button></div>
        <p class="tiny muted" style="margin-top:14px">Need to change something? Use <b>Corrections</b> (every change needs a reason and is logged); undoing the final point reopens the match.</p></div>
      <div class="card"><div class="row"><b class="grow">Timeline</b><button class="btn sm" id="undoD">↶ Undo final point…</button></div><div class="timeline" id="timeline" style="margin-top:8px"></div></div></div>`;
    renderTimeline();
    $('#undoD').onclick = undo;
    $('#regen').onclick = async () => { const r = await api('POST', `/api/volleyball/matches/${P.matchId}/report`); toast(r.ok ? 'The report is being remade' : (r.json.error || 'Could not request it'), r.ok ? '' : 'err'); };
    $$('[data-g]').forEach((b) => b.onclick = () => graphic(b.dataset.g));
  }

  /* ---------- graphics: the on-air control centre ----------
     What is on air is the server's word (one graphic at a time; it ends a
     timed graphic itself, so a closed panel cannot leave one up) — and
     whether it is really SHOWING is the outputs' word: every overlay on air
     (vMix, OBS, a monitor) reports what it draws, and a card says ON AIR
     only once one does. The live overlay — the score bar or the corner
     bug — runs by itself (Automatic) or exactly as taken on and off air
     here (Manual); a standalone graphic always steps it aside. */
  const GX = window.VolleyballGraphics;
  const airNow = () => Date.now() + (P.gOffset || 0);
  let gfxSheet = null;
  let gfxDur = VB.store.get('vb_gfx_dur', 'default');        // 'default' | 'hold' | seconds
  const gfxBusy = {};                                        // a card whose command is on its way
  function setAirState(g) {
    if (!g || typeof g.seq !== 'number') return;
    if (P.graphic && typeof P.graphic.seq === 'number' && g.seq < P.graphic.seq) return;
    P.graphic = g;
    if (g.serverNow) P.gOffset = g.serverNow - Date.now();
    renderAir();
  }
  function airLabel(g) {
    if (!g || !g.scene) return '';
    let x = GX.SCENES[g.scene] ? GX.SCENES[g.scene].label : g.scene;
    const d = g.data || {};
    if (g.scene === 'lineup') x += d.team ? ' · ' + teamOf(d.team).name : ' · both teams';
    if (g.scene === 'setSummary' && d.set) x += ' · set ' + d.set;
    if (g.scene === 'playerStat' && d.playerId) { const t = player('A', d.playerId) ? 'A' : 'B'; const pl = player(t, d.playerId); if (pl) x += ' · #' + pl.number + ' ' + short(pl.name); }
    return x;
  }
  const airLeft = (g) => (g && g.scene && g.expiresAt != null ? Math.max(0, Math.ceil((g.expiresAt - airNow()) / 1000)) : null);
  const LIVE_NAME = GX.LIVE_NAMES;
  // what the programme outputs (studio monitors aside) draw — shared with the studio
  const onAirNow = () => GX.readOutputs(P.outputs, P.graphic, airNow());
  const airLine = () => GX.airSummary(P.graphic, P.style, P.outputs, airNow(), airLabel(P.graphic));
  function renderAir() {
    const el = $('#air');
    const g = P.graphic || {};
    if (el) {
      const n = onAirNow();
      if (g.scene) {
        const left = airLeft(g), c = GX.sceneCard(g.scene, g, P.outputs, airNow()) || {}, showing = n.up.length > 0;
        const word = showing ? 'On air' : !n.o.length ? 'On air (no output)' : c.k === 'failed' ? 'Not showing' : 'Taking';
        el.className = 'chip air on'; el.innerHTML = `<span class="dot ${showing ? 'bad' : 'wait'}"></span>${word} · ${esc(airLabel(g))} · ${left != null ? left + ' s' : 'hold'}`;
      }
      else if (g.clean) { el.className = 'chip air'; el.innerHTML = '<span class="dot wait"></span>Overlay hidden'; }
      else { const choice = GX.liveLayout(g, P.style, null); el.className = 'chip air'; el.innerHTML = `<span class="dot ${choice ? 'ok' : ''}"></span>${choice ? (choice === 'bar' ? 'Live score' : 'Corner bug') : 'Live overlay off'}`; }
    }
    if (gfxSheet) paintGfx();
  }
  setInterval(() => { if (P.graphic && P.graphic.scene) renderAir(); }, 1000);
  async function airCmd(cmd, key) {
    if (!P.socket) return { ok: false };
    if (key) { if (gfxBusy[key]) return { ok: false, busy: true }; gfxBusy[key] = true; if (gfxSheet) paintGfx(true); }
    const r = await VB.ack(P.socket, 'vb:graphic', Object.assign({ matchId: P.matchId }, cmd));
    if (key) delete gfxBusy[key];
    if (r && r.graphic) setAirState(r.graphic); else if (gfxSheet) paintGfx(true);
    if (!r || !r.ok) toast(r && r.stale ? 'That graphic is no longer on air' : r && r.error && !/^[a-z-]+$/.test(r.error) ? r.error : 'Could not change the graphic — check the connection', 'err');
    return r || { ok: false };
  }
  // scorebug = the live score only, none = hide everything (the screens' own buttons use these)
  function graphic(scene, data, durationSec) {
    if (scene === 'scorebug') return airCmd({ action: 'live' }, 'master');
    if (scene === 'none') return airCmd({ action: 'clean' }, 'master');
    const cmd = { action: 'take', scene, data: data || {}, reqId: VB.uid() };
    const d = durationSec !== undefined ? durationSec : gfxDur;
    if (d !== 'default') cmd.durationSec = d;
    return airCmd(cmd, 'g:' + scene);
  }
  // what the match can show right now (the server checks again — this only greys out the obvious)
  function sceneHint(sc) {
    const st = P.L && P.L.state;
    if (!st) return { ok: false, hint: 'Loading…' };
    const s = E.summary(P.L.setup, st);
    const nextSet = s.status === 'in_set' ? s.set : (s.nextSet || st.sets.length || 1);
    const lu = st.lineups[nextSet] || {};
    switch (sc) {
      case 'intro': return { ok: true, hint: 'Teams, venue, date' };
      case 'toss': return st.tosses[1] ? { ok: true, hint: tossText(st.tosses[1]).replace(/\.$/, '') } : { ok: false, hint: 'Record the toss first' };
      case 'lineup': return lu.A || lu.B ? { ok: true, hint: 'Set ' + nextSet + (lu.A && lu.B ? ' · both saved' : ' · one saved') } : { ok: false, hint: 'Save the line-ups first' };
      case 'setStart': return s.status === 'completed' || s.status === 'abandoned' ? { ok: false, hint: 'The match is over' } : { ok: true, hint: 'Set ' + nextSet + (s.status === 'in_set' ? ' · now' : ' · coming up') };
      case 'rotation': return s.status === 'in_set' ? { ok: true, hint: 'Who stands where now' } : { ok: false, hint: 'During a set' };
      case 'timeout': { const to = s.status === 'in_set' ? GX.runningTimeout(P.L.timeline, st.rules, VB.serverNow()) : null; return to ? { ok: true, hint: (to.technical ? 'Technical' : teamOf(to.team).name) + ' · ends with it' } : { ok: false, hint: 'When a time-out is called' }; }
      case 'playerStat': return { ok: true, hint: 'Pick a player below' };
      case 'setSummary': { const done = st.sets.filter((x) => x.status === 'completed'); return done.length ? { ok: true, hint: 'Set ' + done[done.length - 1].number + ' · or pick a set' } : { ok: false, hint: 'After a set' }; }
      case 'final': return st.sets.length ? { ok: true, hint: s.status === 'completed' ? 'Final result' : 'The match score so far' } : { ok: false, hint: 'Once play starts' };
      case 'scorecard': return st.sets.length ? { ok: true, hint: 'Team figures, top scorers' } : { ok: false, hint: 'Once play starts' };
      case 'standings': return { ok: true, hint: 'The table as it stands now' };
      default: return { ok: true, hint: '' };
    }
  }
  // A graphic card's state, from the server's state and what the outputs draw.
  function cardState(sc) {
    if (gfxBusy['g:' + sc]) return { k: 'taking', word: 'Taking to air…' };
    const c = GX.sceneCard(sc, P.graphic, P.outputs, airNow());
    if (c) return c;
    const h = sceneHint(sc);
    return h.ok ? { k: 'ready', word: '' } : { k: 'na', word: '', why: h.hint };
  }
  const durWord = (sc) => { const d = GX.defaultDuration(sc, P.style); return d == null ? 'held' : d + ' s'; };
  // the player credited with the very last point (a named kill, ace or block) — never a guess
  function lastScorer() {
    const tl = P.L ? P.L.timeline : [];
    for (let i = tl.length - 1; i >= 0; i--) {

      if (reason) send(Object.assign({ type: 'FORFEIT', team, reason }, scope === 'set' ? { scope: 'set' } : {}));
    });
    if (kind === 'abandon') { const reason = await VB.prompt('Abandon the match', 'No result is recorded and the match is not counted in the standings.', 'Reason', 'Abandon'); if (reason) send({ type: 'ABANDON', reason }); }
  }
  async function auditSheet() {
    const r = await api('GET', `/api/volleyball/matches/${P.matchId}/audit`);
    if (!r.ok) return toast('Could not load the audit log', 'err');
    VB.sheet(`<h3>Audit log</h3><div class="list" style="margin-top:12px;max-height:60vh;overflow:auto">${r.json.audit.map((a) => `<div class="li small"><span class="muted" style="width:140px">${esc(VB.fmtDate(a.at, { weekday: undefined }))}</span><b>${esc(a.action)}</b><span class="grow ellipsis muted">${esc(a.by && a.by.email || '')} ${esc(a.details ? JSON.stringify(a.details).slice(0, 140) : '')}</span></div>`).join('') || '<div class="empty">Nothing yet</div>'}</div><div class="foot"><button class="btn" data-close>Close</button></div>`, { wide: true });
  }

  $('#moreBtn').onclick = () => {
    const base = `${location.origin}/volleyball-overlay?match=${P.matchId}${P.tournament && P.tournament.visibility === 'private' ? '&key=' + P.match.overlayKey : ''}`;
    const links = [['Score bar + graphics', base], ['Corner bug + graphics', base + '&layout=compact'], ['Graphics only (no score bar)', base + '&layout=graphics']];
    // a long link sits in its own field (it scrolls inside it) — the sheet never grows sideways
    const sh = VB.sheet(`<h3>Match links</h3><p class="small muted" style="margin:4px 0 10px">Add an overlay as a <b>Browser source</b> in vMix / OBS at 1920 × 1080 — its background is transparent.</p>
      <div class="stack">${links.map(([l, u], i) => `<div><div class="small" style="font-weight:700;margin:0 2px 4px">${esc(l)}</div><div class="linkrow"><input class="input" readonly value="${esc(u)}" aria-label="${esc(l)} link"><button class="btn sm" data-cp="${i}">Copy</button><a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">Open</a></div></div>`).join('')}
      <div class="grid2"><a class="btn" href="/volleyball-templates?match=${esc(P.matchId)}" target="_blank" rel="noopener">Graphics studio</a><a class="btn" href="/volleyball-clipper?match=${esc(P.matchId)}" target="_blank" rel="noopener" title="For a vMix PC that does not score — it clips the points scored here">Clipper page (vMix PC)</a>
        <a class="btn" href="/volleyball/match/${esc(P.matchId)}" target="_blank" rel="noopener">Public scorecard</a><a class="btn" href="/volleyball#/t/${esc(P.match.tournamentId)}">Tournament dashboard</a></div>
      <div class="row wrapr"><span class="grow small">Theme</span><div class="seg" id="th"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
      <p class="tiny muted">Keys: A / L = point to the left / right team · Z undo · Y redo · R replay · G graphics.</p></div><div class="foot"><button class="btn" data-close>Done</button></div>`);
    $$('[data-cp]', sh.el).forEach((b) => b.onclick = () => { const u = links[Number(b.dataset.cp)][1]; VB.copy(u).then((ok) => toast(ok ? 'Overlay link copied' : u)); });
    $$('.linkrow input', sh.el).forEach((inp) => inp.onfocus = () => inp.select());
    const cur = VB.store.get('vb_theme', 'auto');
    $$('#th button', sh.el).forEach((b) => { b.setAttribute('aria-pressed', String(b.dataset.v === cur)); b.onclick = () => { VB.store.set('vb_theme', b.dataset.v); VB.applyTheme(); $$('#th button', sh.el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; });
  };

  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.altKey || $('.scrim')) return;
    // the "who earned it?" strip: 1–6 = the player in that row, Esc = later
    if (P.ask && !e.ctrlKey) {
      if (e.key === 'Escape') { e.preventDefault(); return closeAsk(); }
      if (/^[1-8]$/.test(e.key)) { const b = $$('#ask .ask-pl button')[Number(e.key) - 1]; if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
    }
    if (!P.L || P.L.state.status !== 'in_set') { if (e.key.toLowerCase() === 'z' && P.L) undo(); return; }
    const s = E.summary(P.L.setup, P.L.state), [Lt, Rt] = sideOrder(s);
    const k = e.key.toLowerCase();
    if (e.ctrlKey && k !== 'z') return;
    if (k === 'a') point(Lt);
    else if (k === 'l') point(Rt);
    else if (k === 'z') undo();
    else if (k === 'y') redo();
    else if (k === 'r') replaySheet();
    else if (k === 'g') $('#gfxBtn').click();
    else return;
    e.preventDefault();
  });
  window.addEventListener('beforeunload', (e) => { if (P.outbox.length) { e.preventDefault(); e.returnValue = ''; } });
  window.__vbPanel = P;   // test hook: the browser checks drop the line on purpose
  VB.on('auth', (u) => { if (!u) gate('Signed out', 'Sign in again to keep scoring.', true); });
  boot();
})();
</script>
</body>
</html>
