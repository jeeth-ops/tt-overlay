<!DOCTYPE html>

<head>

<!--
  🏐 The public volleyball scorecard — /volleyball/match/:matchId, in the
  cricket scorecard's look and with its tabs: Summary (how each set went,
  rally by rally), Scorecard, Point by point, Clips, Line-ups, Insights,
  MVP, Info and Head to head. Everything is derived from the match's saved
  event ledger on the server (scores, sets, per-player statistics, point
  by point), live over the /volleyball socket while the match is on. A
  player's 🎬 icon opens the clips of the points that player is part of —
  the same point event id that scored the point, credited the statistic
  and cut the clip. ?tab=<name> opens a tab directly.
-->
<style>
  /* the whole width of the screen, in the two teams' colours (--tA / --tB, set from the match) */
  main.wrap { max-width: 1640px; padding: 16px clamp(12px, 2.4vw, 36px) 30px; }
  .topbar .crumb { min-width: 0; font-size: 13px; font-weight: 600; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .crumb a { color: var(--ink2); }
  @media (max-width: 560px) { .topbar .crumb { display: none; } }
  /* the hero: both teams in their colours, the sets in the middle */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: clamp(14px, 2.4vw, 26px) clamp(14px, 3vw, 36px) clamp(18px, 2.6vw, 28px); color: #fff;
    background: linear-gradient(105deg, color-mix(in srgb, var(--tA) 70%, #050914) 0%, color-mix(in srgb, var(--tA) 24%, #0a1020) 38%, #0a1020 50%, color-mix(in srgb, var(--tB) 24%, #0a1020) 62%, color-mix(in srgb, var(--tB) 70%, #050914) 100%);
    box-shadow: 0 26px 60px -32px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .07) inset; isolation: isolate; }
  .hero::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(40% 120% at 0% 0%, color-mix(in srgb, var(--tA) 40%, transparent), transparent 70%), radial-gradient(40% 120% at 100% 0%, color-mix(in srgb, var(--tB) 40%, transparent), transparent 70%), repeating-linear-gradient(115deg, rgba(255, 255, 255, .022) 0 2px, transparent 2px 14px); }
  .hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--tA) 0 50%, var(--tB) 50% 100%); }
  .hero .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero .top .grow { min-width: 10px; }
  .hero .badge { background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(255, 255, 255, .1) inset; }
  .hero .badge.live { background: #ef4444; color: #fff; } .hero .badge.live::before { background: #fff; }
  .hero .badge.done { background: rgba(34, 197, 94, .2); color: #bbf7d0; }
  .hero .badge.warn { background: rgba(245, 158, 11, .24); color: #fde68a; }
  .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(12px, 3vw, 40px); margin-top: 18px; }
  .side { display: flex; align-items: center; gap: clamp(12px, 1.6vw, 20px); min-width: 0; padding: clamp(10px, 1.4vw, 16px); border-radius: 20px; background: rgba(5, 9, 20, .32); box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset; }
  .side.win { box-shadow: 0 0 0 1px rgba(255, 255, 255, .22) inset, 0 18px 40px -24px var(--tc); }
  .side.r { flex-direction: row-reverse; text-align: right; }
  .side .logo.lg { width: clamp(54px, 6vw, 84px); height: clamp(54px, 6vw, 84px); border-radius: 20px; font-size: clamp(17px, 1.8vw, 24px); box-shadow: 0 12px 30px rgba(0, 0, 0, .35), 0 0 0 3px rgba(255, 255, 255, .18); }
  .side .nm { font-size: clamp(18px, 2.6vw, 32px); font-weight: 800; letter-spacing: -.02em; min-width: 0; line-height: 1.1; }

  .mid { display: grid; justify-items: center; gap: 10px; }

  .score i { font-style: normal; color: rgba(255, 255, 255, .4); font-weight: 600; font-size: .55em; }
  .score .w { color: #fff; } .score .l { color: rgba(255, 255, 255, .42); }
  .rpill { padding: 8px 18px; border-radius: 99px; font-weight: 900; font-size: clamp(12px, 1.2vw, 14.5px); letter-spacing: .06em; text-transform: uppercase; text-align: center; color: #fde68a; background: rgba(250, 204, 21, .12); box-shadow: 0 0 0 1px rgba(250, 204, 21, .3) inset; }

  .nowpts { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .nowpts b { min-width: 46px; height: 40px; display: grid; place-items: center; border-radius: 12px; font-size: 24px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--tc) 70%, #000); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14) inset; }
  .nowpts span { font-size: 12px; color: rgba(255, 255, 255, .7); letter-spacing: .06em; text-transform: uppercase; }
  @media (max-width: 640px) {

    .side .nm.ellipsis { white-space: normal; overflow-wrap: anywhere; }
    .side .nm small { display: none; }
    .side .logo.lg { width: 48px; height: 48px; border-radius: 14px; font-size: 15px; }
    .hero { border-radius: 20px; }
    .score { font-size: 40px; gap: 6px; }
    .rpill { padding: 6px 10px; letter-spacing: .03em; }
  }
  .live-now { margin-top: 14px; text-align: center; font-weight: 700; color: rgba(255, 255, 255, .92); }
  .setchips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .setchips span { padding: 5px 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14) inset; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .72); }
  .setchips span small { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; opacity: .75; }
  .setchips span b { color: #fff; }
  .setchips span.won { background: color-mix(in srgb, var(--tc) 50%, rgba(0, 0, 0, .3)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 70%, #fff 10%) inset; }
  .setchips span.now { background: rgba(239, 68, 68, .2); box-shadow: 0 0 0 1px rgba(239, 68, 68, .55) inset; }
  .tossline { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: rgba(255, 255, 255, .78); text-align: center; }
  .tossline .logo.sm { width: 22px; height: 22px; border-radius: 7px; font-size: 9px; }
  .hero .acts { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hero .acts .btn.primary { background: #fff; color: #0b1120; }
  /* layout */
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
  .duo { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
  .tables { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .duo { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 1360px) { .tables { grid-template-columns: minmax(0, 1fr); } }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-width: 0; }
  .card-h h3 { flex: 1; min-width: 0; }
  .card-h .sub { font-size: 12.5px; color: var(--mute); font-weight: 600; }
  .tkey { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
  .tkey::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--tc); flex: none; }
  .tkey.line::before { width: 14px; height: 3px; border-radius: 2px; }
  /* match leaders */
  .leaders { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .lead { position: relative; overflow: hidden; border-radius: var(--r); padding: 14px 16px 14px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 16%, var(--card)), var(--card) 70%); box-shadow: var(--shadow), 0 0 0 1px var(--line); min-width: 0; }
  .lead::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tc); }
  .lead .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
  .lead .v { font-size: 30px; font-weight: 900; letter-spacing: -.03em; line-height: 1.15; margin-top: 4px; }
  .lead .who { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 700; font-size: 14px; min-width: 0; }
  .lead .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 600px) {
    .leaders { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .lead { padding: 12px 12px 12px 16px; } .lead .v { font-size: 24px; } .lead .who { font-size: 13px; }
    .pcard-h { flex-wrap: wrap; } .pcard-h .tot { width: 100%; justify-content: flex-start; }
  }
  /* the points won, as one bar in the two colours */
  .split { margin-top: 14px; }
  .split .lbls { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .split .bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--fill); gap: 2px; }
  .split .bar i { display: block; height: 100%; }
  /* set scores */
  .sets td.tm { font-weight: 700; border-left: 4px solid var(--tc); }

  .sets td.lost { color: var(--mute); }
  .sets td.tot { font-size: 16px; font-weight: 900; }
  /* the players, per team */
  .pcard { padding: 0; overflow: hidden; }
  .pcard-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #fff; background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 80%, #000), color-mix(in srgb, var(--tc) 30%, #0a1020)); }
  .pcard-h .logo { box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); }
  .pcard-h h3 { flex: 1; min-width: 0; font-size: 17px; }
  .pcard-h .tot { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pcard-h .tot span { padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .16); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pcard .tbl-wrap { border-radius: 0; box-shadow: none; background: transparent; }
  .ptbl th, .ptbl td { padding-left: 8px; padding-right: 8px; }
  .ptbl td:first-child, .ptbl th:first-child { padding-left: 14px; }
  .ptbl tr.top td { background: color-mix(in srgb, var(--tc) 9%, transparent); }
  .jer { display: inline-grid; place-items: center; min-width: 28px; height: 24px; padding: 0 6px; border-radius: 7px; background: var(--tc); color: var(--on); font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  tr.dim .jer { background: var(--fill); color: var(--mute); }
  .cmp-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) minmax(110px, 170px) minmax(0, 1fr) 60px; gap: 10px; align-items: center; padding: 7px 0; font-variant-numeric: tabular-nums; }
  .cmp-row .lbl { text-align: center; font-size: 12.5px; color: var(--mute); font-weight: 600; }
  .cmp-row .v { text-align: center; font-weight: 800; font-size: 15px; }

  @media (max-width: 600px) { .cmp-row { grid-template-columns: 40px minmax(0, 1fr) 92px minmax(0, 1fr) 40px; gap: 6px; } .cmp-row .lbl { font-size: 11.5px; } .cmp-row .v { font-size: 13px; } }
  .cmp-row .bar { height: 10px; border-radius: 99px; background: var(--fill); overflow: hidden; display: flex; }
  .cmp-row .bar.l { justify-content: flex-end; }
  .cmp-row .bar i { display: block; height: 100%; border-radius: 99px; }
  /* a team's own colour, lifted on a dark page so a navy team stays readable */
  .tcol { color: var(--tc); } .tfill { background: var(--tc); }
  :root:not([data-theme="light"]) .tcol { color: color-mix(in srgb, var(--tc) 50%, #fff); } :root:not([data-theme="light"]) .tfill { background: color-mix(in srgb, var(--tc) 72%, #fff); }
  .vid { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 8px; background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); font-weight: 700; font-size: 12.5px; }

  .pname { font-weight: 600; text-align: left; }
  .pname:hover { color: var(--blue); }
  /* point by point */
  .rally { display: grid; grid-template-columns: 62px 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; font-size: 13.5px; }

  .form { display: inline-flex; gap: 3px; }

  /* charts (summary / insights) */

  .setcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
  .setcard { padding: 14px; border-radius: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 16%, var(--card2)), var(--card2) 70%); box-shadow: 0 0 0 1px var(--line); cursor: pointer; text-align: left; width: 100%; transition: transform .25s var(--bounce), box-shadow .2s; }

  .setcard .w { font-size: 13px; font-weight: 700; margin-top: 2px; }

  /* point sources (categorical slots 1–4 + a neutral "other") */
  .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s0: #9ca3af; }

  .lunotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .lunotes .ttl { font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  @media (max-width: 640px) { .luhalf { grid-template-columns: minmax(0, 1fr); padding: 8px; gap: 6px; } .luhalf::before { display: none; } .lupos { padding: 6px 7px; gap: 6px; } .lupos b.n { min-width: 26px; height: 26px; font-size: 12.5px; } .lunotes { grid-template-columns: minmax(0, 1fr); } }
  /* MVP */
  .podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
  .mvp { position: relative; overflow: hidden; padding: 18px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 30%, var(--card)), var(--card) 70%); box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--tc) 30%, var(--line)); }
  .mvp.first { box-shadow: var(--shadow), 0 0 0 2px #facc15; }
  .mvp .rk { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .mvp .who { display: flex; align-items: center; gap: 12px; margin-top: 12px; min-width: 0; }
  .mvp .who .jer { min-width: 46px; height: 46px; border-radius: 14px; font-size: 18px; }
  .mvp .who b { display: block; font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mvp .who small { color: var(--mute); font-weight: 600; }
  .mvp .big { position: absolute; right: 18px; top: 14px; font-size: 40px; font-weight: 900; letter-spacing: -.03em; }
  .mvp .big small { display: block; text-align: right; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-top: -4px; }
  .mvp .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .mvp .chips span { padding: 4px 10px; border-radius: 99px; background: var(--fill); font-size: 12.5px; font-weight: 700; }
  .mvp .chips span b { font-variant-numeric: tabular-nums; }
  /* info */
  .kv { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 0; }
  .kv > * { padding: 9px 2px; border-top: 1px solid var(--line); font-size: 13.5px; min-width: 0; }
  .kv > :nth-child(-n + 2) { border-top: 0; }
  .kv dt { color: var(--mute); font-weight: 600; }
  .kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .squad .li { gap: 10px; padding: 8px 4px; }
  .h2hres { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 12px; padding: 14px; border-radius: 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--tA) 24%, var(--card2)), var(--card2) 45%, var(--card2) 55%, color-mix(in srgb, var(--tB) 24%, var(--card2))); }
  .h2hres .s { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 800; }
  .h2hres .s.r { flex-direction: row-reverse; text-align: right; }
  .h2hres .big { font-size: 32px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters select { width: auto; min-width: 150px; height: 36px; border-radius: 99px; padding: 0 12px; font-size: 13.5px; }
</style>

<body>
<header class="topbar">
  <a class="brand" href="/volleyball"><span class="asl" aria-hidden="true"></span><span class="bt"><b>Scorecard <em>by All Sports Live</em></b><small>Live volleyball, point by point</small></span></a>
  <div class="grow crumb" id="crumb"></div>
  <a class="visit" href="/">Visit Website ↗</a>
  <button class="theme-btn" data-theme-btn aria-label="Light or dark theme"></button>
</header>
<main class="wrap" id="main"><div class="skel" style="height:260px;border-radius:26px"></div></main>

<script src="/socket.io/socket.io.js"></script>
<script src="/volleyball-common.js"></script>
<script>
(function () {
  'use strict';
  const { $, $$, esc, api } = VB;
  const matchId = decodeURIComponent((location.pathname.match(/\/volleyball\/match\/([^/?#]+)/) || [])[1] || new URLSearchParams(location.search).get('match') || '');
  const key = new URLSearchParams(location.search).get('key') || '';
  const TABS = [['summary', 'Summary', 'summary'], ['card', 'Scorecard', 'card'], ['points', 'Point by point', 'points'], ['clips', 'Clips', 'clips'], ['lineups', 'Line-ups', 'lineups'], ['insights', 'Insights', 'insights'], ['mvp', 'MVP', 'mvp'], ['info', 'Info', 'info'], ['teams', 'Head to head', 'h2h']];
  const asked = new URLSearchParams(location.search).get('tab');
  const S = { match: null, tournament: null, timeline: [], summary: null, stats: null, clipCounts: {}, clips: [], tab: TABS.some(([k]) => k === asked) ? asked : VB.store.get('vb_sc_tab', 'card'), h2h: null, hist: {}, sumSet: null, cf: { set: '', team: '', kind: '', player: '' } };
  if (!TABS.some(([k]) => k === S.tab)) S.tab = 'card';
  const OUT = { GENERAL: 'Point', ATTACK_KILL: 'Attack kill', BLOCK: 'Block point', ACE: 'Ace', RECEPTION_ERROR: 'Reception error', SERVICE_ERROR: 'Service error', ATTACK_ERROR: 'Attack error', OPP_ERROR: 'Opponent error', NET_FAULT: 'Net fault', FOUR_HITS: 'Four hits', DOUBLE_CONTACT: 'Double contact', BALL_OUT: 'Ball out', BALL_IN: 'Ball in', ROTATION_FAULT: 'Rotation fault', PENALTY: 'Penalty' };
  const q = key ? '?key=' + encodeURIComponent(key) : '';
  const qa = key ? '&key=' + encodeURIComponent(key) : '';
  // Videos and the PDF are opened without the sign-in header: a private
  // match's own account uses the match key it was given.
  const mq = () => { const k = key || (S.match && S.match.overlayKey) || ''; return k ? '?key=' + encodeURIComponent(k) : ''; };

  async function load() {
    const [m, st, cl] = await Promise.all([
      api('GET', `/api/volleyball/matches/${encodeURIComponent(matchId)}?timeline=1${qa}`),
      api('GET', `/api/volleyball/matches/${encodeURIComponent(matchId)}/stats${q}`),
      api('GET', `/api/volleyball/matches/${encodeURIComponent(matchId)}/clips${q}`)
    ]);
    if (!m.ok) return notFound(m.status);
    S.match = m.json.match; S.tournament = m.json.tournament; S.timeline = m.json.timeline || []; S.summary = m.json.summary;
    if (st.ok) { S.stats = st.json.stats; S.clipCounts = st.json.clipCounts || {}; }
    if (cl.ok) S.clips = cl.json.clips || [];
    render();
  }
  function notFound(status) {
    VB.authReady.then((u) => {
      $('#main').innerHTML = `<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><div style="font-size:40px">🏐</div><h2 style="margin:6px 0">${status === 0 ? 'No connection' : 'Match not found'}</h2>
        <p class="muted">${status === 0 ? 'Check the connection and try again.' : 'It may be part of a private tournament.'}</p>
        ${!u && status ? '<button class="btn primary" style="margin-top:14px" id="gsi">Sign in</button>' : '<a class="btn" style="margin-top:14px" href="/volleyball">All volleyball</a>'}</div>`;
      if ($('#gsi')) $('#gsi').onclick = () => VB.signIn().then(() => location.reload());
    });
  }
  let reloadTimer = null;
  function reloadSoon(ms) { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, ms || 1200); }

  /* ---------- helpers ---------- */
  const team = (s) => S.match['team' + s] || { name: 'To be decided', shortName: 'TBD', colors: {} };
  const short = (s) => team(s).shortName || team(s).name;
  const color = (s) => VB.teamColor(team(s), s === 'A' ? '#0a84ff' : '#ff9f0a');
  const tcs = (s) => `--tc:${esc(color(s))};--on:${esc(VB.onColor(color(s)))}`;
  // a team's colour as a chart mark: lifted on the dark page when it is a dark colour
  const mark = (s) => { const c = color(s); return VB.theme() === 'dark' && VB.lum(c) < 0.3 ? `color-mix(in srgb, ${c} 62%, #fff)` : c; };
  function player(id) {
    for (const s of ['A', 'B']) { const p = ((S.match.squads || {})[s] || []).find((x) => x.playerId === id); if (p) return Object.assign({ team: s }, p); }
    return null;
  }
  const pn = (id) => { const p = player(id); return p ? `#${p.number} ${p.name}` : ''; };
  const pct = (v) => (v == null ? '–' : Math.round(v * 100) + '%');
  const r1 = (v) => Math.round(v * 10) / 10;
  const ratio = (a, b) => (b > 0 ? a / b : null);
  const live = () => S.match.status === 'live';
  const rallies = () => S.timeline.filter((e) => e.type === 'RALLY' && !e.voided && !e.invalid && e.after);
  const dur = (ms) => { if (!(ms > 0)) return '–'; const m = Math.round(ms / 60000); return m < 1 ? '< 1 min' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
  const ago = (ms) => (ms ? VB.fmtDate(ms) : '–');

  /* ---------- render ---------- */
  function render() {
    const m = S.match, s = S.summary || m.summary || {}, t = S.tournament;
    $('#crumb').innerHTML = t ? `<a href="/volleyball/tournament/${esc(t.tournamentId)}">${esc(t.name)}</a>` : '';
    document.title = `${team('A').name} v ${team('B').name} · Volleyball · All Sports Live`;
    const done = m.status === 'completed';
    const badge = live() ? '<span class="badge live">LIVE</span>' : done ? '<span class="badge done">Final</span>' : m.status === 'abandoned' ? '<span class="badge warn">Abandoned</span>' : '<span class="badge">Scheduled</span>';
    const sets = s.setsWon || { A: 0, B: 0 };
    const w = s.winner || (m.result && m.result.winner);
    const stage = m.stage ? [m.stage.group ? 'Group ' + m.stage.group : '', m.stage.round].filter(Boolean).join(' · ') : '';
    const inSet = live() && s.status === 'in_set';
    const setChips = (s.sets || []).filter((x) => x.status === 'completed' || inSet).map((x) => { const now = x.status !== 'completed'; return `<span class="${now ? 'now' : x.winner ? 'won' : ''}" style="--tc:${esc(color(x.winner || 'A'))}" title="Set ${x.set}${x.winner ? ' — ' + esc(team(x.winner).name) : now ? ' — in progress' : ''}"><small>Set ${x.set}</small><b>${x.A}–${x.B}</b>${x.forfeit ? ' (forfeit)' : ''}</span>`; }).join('');
    const pill = done && w ? `<div class="rpill">${esc(short(w))} won ${Math.max(sets.A, sets.B)}–${Math.min(sets.A, sets.B)}${s.forfeit ? ' (forfeit)' : ''}</div>`
      : inSet ? `<div class="rpill live">Set ${s.set}${s.deciding ? ' · deciding' : ''}${s.matchPoint ? ' · match point' : s.setPoint ? ' · set point' : ''}</div>`
      : live() && s.status === 'set_break' ? '<div class="rpill wait">Between sets</div>'
      : m.status === 'abandoned' ? '<div class="rpill wait">Abandoned</div>'
      : `<div class="rpill wait">${esc(m.scheduledAt ? VB.fmtDate(m.scheduledAt) : 'Time to be set')}</div>`;
    const nowLine = inSet ? `<div class="nowpts"><b style="${tcs('A')}">${s.points.A}</b><span>points</span><b style="${tcs('B')}">${s.points.B}</b></div>` : '';
    const srvIcon = (x) => (inSet && s.serving === x ? `<span class="srv" title="Serving">${VB.icon('ball')}</span>` : '');
    const toss = s.toss ? `<div class="tossline">${VB.logoHtml(team(s.toss.winner), 'sm')}<span><b>${esc(team(s.toss.winner).name)}</b> won the toss and chose ${s.toss.choice === 'serve' ? 'to <b>serve</b>' : s.toss.choice === 'receive' ? 'to <b>receive</b>' : 'the <b>side of the court</b>'}</span></div>` : '';
    $('#main').style.setProperty('--tA', color('A'));
    $('#main').style.setProperty('--tB', color('B'));
    $('#main').innerHTML = `
      <section class="hero">
        <div class="top">${[stage, m.matchNo ? 'Match ' + m.matchNo : '', m.venue].filter(Boolean).map((x) => `<span class="badge">${esc(x)}</span>`).join('')}<span class="grow"></span>${badge}</div>
        <div class="vs">
          <div class="side ${w === 'A' ? 'win' : ''}" style="${tcs('A')}">${VB.logoHtml(team('A'), 'lg')}<div class="nm ellipsis">${esc(team('A').name)}${srvIcon('A')}<small>${esc([team('A').city, w === 'A' ? 'Winner' : ''].filter(Boolean).join(' · '))}</small></div></div>
          <div class="mid"><div class="score"><span class="${w === 'A' ? 'w' : w ? 'l' : ''}">${sets.A}</span><i>–</i><span class="${w === 'B' ? 'w' : w ? 'l' : ''}">${sets.B}</span></div>${pill}${nowLine}</div>
          <div class="side r ${w === 'B' ? 'win' : ''}" style="${tcs('B')}">${VB.logoHtml(team('B'), 'lg')}<div class="nm ellipsis">${esc(team('B').name)}${srvIcon('B')}<small>${esc([team('B').city, w === 'B' ? 'Winner' : ''].filter(Boolean).join(' · '))}</small></div></div>
        </div>
        ${setChips ? `<div class="setchips">${setChips}</div>` : ''}${toss}
        <div class="acts">${reportHtml()}</div>
      </section>
      <nav class="ptabs scroll" id="tabs" aria-label="Scorecard sections">${TABS.map(([k, l, ic]) => `<button data-t="${k}" aria-pressed="${S.tab === k}">${VB.icon(ic)}${esc(l)}</button>`).join('')}</nav>
      <div id="tab"></div>
      <footer class="foot-note">Powered by <b>All Sports Live</b> — professional live sports overlays &amp; scorecards</footer>`;
    $$('#tabs button').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; VB.store.set('vb_sc_tab', S.tab); const u = new URL(location.href); u.searchParams.set('tab', S.tab); history.replaceState(null, '', u); render(); });
    const nav = $('#tabs'), sel = $('#tabs [aria-pressed="true"]');
    if (sel && nav.scrollWidth > nav.clientWidth) nav.scrollLeft += sel.getBoundingClientRect().left - nav.getBoundingClientRect().left - (nav.clientWidth - sel.offsetWidth) / 2;
    ({ summary: renderSummary, card: renderCard, points: renderPoints, clips: renderClips, lineups: renderLineups, insights: renderInsights, mvp: renderMvp, info: renderInfo, teams: renderTeams })[S.tab]();
  }
  // The PDF link only exists when there is a PDF.
  function reportHtml() {
    const r = S.match.report;
    if (S.match.status !== 'completed') return '';
    if (r && r.url && (r.status === 'ready' || r.version)) return `<a class="btn primary sm" href="${esc(r.url)}${mq()}" target="_blank" rel="noopener">Match report (PDF${r.version ? ' v' + r.version : ''})</a>${r.stale || r.status === 'generating' ? '<span class="badge warn">Updating after a correction…</span>' : ''}`;
    if (r && r.status === 'failed') return '<span class="badge warn">The PDF report could not be made yet — it is retried automatically</span>';
    return '<span class="badge">Preparing the PDF report…</span>';
  }
  const noStats = () => { $('#tab').innerHTML = '<div class="card empty"><b>No statistics yet</b>They appear as soon as the first point is scored.</div>'; };

  /* ---------- summary: how each set went, rally by rally ---------- */
  // everything a set's rallies say: the lead after each one, runs, ties, lead changes
  function setStory(n) {
    const rs = rallies().filter((e) => e.after.set === n);
    const pts = [{ A: 0, B: 0 }], out = { n, rallies: rs, pts, maxLead: { A: 0, B: 0 }, run: { team: null, n: 0 }, ties: 0, changes: 0 };
    let leader = null, cur = { team: null, n: 0 };
    rs.forEach((e) => {
      const sc = e.after.score; pts.push({ A: sc.A, B: sc.B });
      const d = sc.A - sc.B;
      if (d > out.maxLead.A) out.maxLead.A = d;
      if (-d > out.maxLead.B) out.maxLead.B = -d;
      if (d === 0 && sc.A > 0) out.ties += 1;
      const now = d > 0 ? 'A' : d < 0 ? 'B' : leader;
      if (leader && now && now !== leader) out.changes += 1;
      if (d !== 0) leader = now;
      cur = cur.team === e.team ? { team: e.team, n: cur.n + 1 } : { team: e.team, n: 1 };
      if (cur.n > out.run.n) out.run = Object.assign({}, cur);
    });
    return out;
  }
  function renderSummary() {
    const s = S.summary || {}, sets = (s.sets || []);
    if (!sets.length || !rallies().length) { $('#tab').innerHTML = '<div class="card empty"><b>The story appears with the first point</b>Each set’s score progression and momentum, rally by rally.</div>'; return; }
    if (!S.sumPicked || !sets.some((x) => x.set === S.sumSet)) S.sumSet = sets[sets.length - 1].set;
    const stories = sets.map((x) => setStory(x.set));
    const all = rallies();
    const best = stories.reduce((a, x) => (x.run.n > a.n ? x.run : a), { team: null, n: 0 });
    const big = stories.reduce((a, x) => { ['A', 'B'].forEach((t) => { if (x.maxLead[t] > a.v) a = { t, v: x.maxLead[t], set: x.n }; }); return a; }, { t: null, v: 0 });
    const m = S.match;
    const took = m.startedAt ? (m.completedAt || (live() ? VB.serverNow() : 0)) - m.startedAt : 0;
    const tile = (v, l) => `<div class="tile"><b>${v}</b><small>${esc(l)}</small></div>`;
    const setInfo = (n) => (s.setInfo || []).find((x) => x.set === n) || {};
    const st = S.stats;
    const tops = st ? Object.values(st.players).filter((p) => p.points > 0).sort((a, b) => b.points - a.points || (b.attack.efficiency || 0) - (a.attack.efficiency || 0)).slice(0, 3) : [];
    $('#tab').innerHTML = `<div class="stack">
      <div class="tiles on-card" style="max-width:none;margin-top:0">${tile(all.length, 'Rallies played')}${tile(best.n ? `${best.n}` : '–', best.n ? `Longest run · ${short(best.team)}` : 'Longest run')}${tile(big.v ? '+' + big.v : '–', big.v ? `Biggest lead · ${short(big.t)}` : 'Biggest lead')}${tile(stories.reduce((a, x) => a + x.changes, 0), 'Lead changes')}${tile(stories.reduce((a, x) => a + x.ties, 0), 'Times tied')}${tile(took > 0 ? esc(dur(took)) : '–', live() ? 'Playing for' : 'Match duration')}</div>
      <div class="setcards" id="setcards">${sets.map((x, i) => { const y = stories[i], inf = setInfo(x.set), now = x.status !== 'completed'; return `<button class="setcard" data-set="${x.set}" aria-pressed="${S.sumSet === x.set}" style="--tc:${esc(color(x.winner || (x.A >= x.B ? 'A' : 'B')))}">
          <div class="h"><span>Set ${x.set}${x.deciding ? ' · deciding' : ''}</span>${now ? '<span class="badge live">LIVE</span>' : ''}</div>
          <div class="s">${x.A}–${x.B}</div><div class="w">${x.winner ? esc(team(x.winner).name) + ' won' : 'In progress'}</div>
          <div class="f"><span>Longest run<br><b>${y.run.n}${y.run.team ? ' · ' + esc(short(y.run.team)) : ''}</b></span><span>Biggest lead<br><b>${(() => { const t = y.maxLead.A >= y.maxLead.B ? 'A' : 'B'; return y.maxLead[t] ? '+' + y.maxLead[t] + ' · ' + esc(short(t)) : '–'; })()}</b></span><span>Lead changes<br><b>${y.changes}</b></span><span>Length<br><b>${inf.startedAt ? esc(dur((inf.endedAt || (now ? VB.serverNow() : 0)) - inf.startedAt)) : '–'}</b></span></div></button>`; }).join('')}</div>
      <div class="grid-2">
        <div class="card"><div class="card-h"><h3>Score progression · Set ${S.sumSet}</h3><span class="tkey line" style="--tc:${mark('A')}">${esc(short('A'))}</span><span class="tkey line" style="--tc:${mark('B')}">${esc(short('B'))}</span></div><div class="chart" id="ch-prog"></div></div>
        <div class="card"><div class="card-h"><h3>Momentum · Set ${S.sumSet}</h3><span class="tkey" style="--tc:${mark('A')}">${esc(short('A'))} ahead</span><span class="tkey" style="--tc:${mark('B')}">${esc(short('B'))} ahead</span></div><div class="chart" id="ch-lead"></div><p class="tiny muted" style="margin-top:6px">The lead after every rally — above the line ${esc(short('A'))} ahead, below it ${esc(short('B'))}.</p></div>
      </div>
      ${tops.length ? `<div class="card"><div class="card-h"><h3>Top performers</h3><button class="btn sm" data-goto="mvp">${VB.icon('mvp')}MVP race</button></div><div class="leaders">${tops.map((p) => `<div class="lead" style="${tcs(p.team)}"><div class="k">${esc(team(p.team).shortName || team(p.team).name)}</div><div class="who" style="margin-top:8px"><span class="jer" style="${tcs(p.team)}">${esc(p.number)}</span><span>${esc(p.name)}</span></div><div class="v">${r1(p.points)} <span class="small muted" style="font-weight:600;letter-spacing:0">pts · ${p.attack.kills} K · ${r1(p.block.points)} B · ${p.serve.aces} A</span></div></div>`).join('')}</div></div>` : ''}
      </div>`;
    $$('#setcards .setcard').forEach((b) => b.onclick = () => { S.sumSet = +b.dataset.set; S.sumPicked = true; renderSummary(); });
    $$('[data-goto]').forEach((b) => b.onclick = () => $(`#tabs [data-t="${b.dataset.goto}"]`).click());
    const story = stories.find((x) => x.n === S.sumSet);
    progChart($('#ch-prog'), story, sets.find((x) => x.set === S.sumSet));
    leadChart($('#ch-lead'), story);
  }
  // the hover layer shared by both charts: a crosshair that snaps to the
  // nearest rally, one tooltip with both teams, arrows on keyboard focus
  function hover(el, svg, n, x0, step, H, tipOf) {
    const tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip);
    const xh = svg.querySelector('.xh');
    let at = -1;
    const show = (i) => {
      at = Math.max(0, Math.min(n, i));
      const x = x0 + at * step;
      xh.setAttribute('x1', x); xh.setAttribute('x2', x);
      tip.textContent = '';
      tipOf(at, tip);
      const box = svg.getBoundingClientRect(), k = box.width / svg.viewBox.baseVal.width, px = x * k;
      tip.style.left = Math.max(0, Math.min(box.width - tip.offsetWidth, px + (px > box.width / 2 ? -tip.offsetWidth - 14 : 14))) + 'px';
      tip.style.top = '8px';
      el.classList.add('hover');
    };
    const pick = (e) => { const box = svg.getBoundingClientRect(), k = svg.viewBox.baseVal.width / box.width; show(Math.round(((e.clientX - box.left) * k - x0) / step)); };
    svg.addEventListener('pointermove', pick);
    svg.addEventListener('pointerdown', pick);
    svg.addEventListener('pointerleave', () => el.classList.remove('hover'));
    svg.addEventListener('focus', () => show(at < 0 ? n : at));

  const tipRow = (tip, s, v, label) => { const r = document.createElement('div'); r.className = 'tr'; r.style.setProperty('--tc', mark(s)); const i = document.createElement('i'); const b = document.createElement('b'); b.textContent = v; const sp = document.createElement('span'); sp.textContent = label; r.append(i, b, sp); tip.appendChild(r); };

  function progChart(el, y, set) {
    const n = y.rallies.length, W = 720, H = 280, pl = 34, pr = 70, pt = 14, pb = 28;

      ${lbl('A', close && last.A >= last.B ? -7 : close ? 7 : 0)}${lbl('B', close && last.B > last.A ? -7 : close ? 7 : 0)}

  function leadChart(el, y) {

      const p = d > 0 ? `M${x} ${y0}V${yy + r}Q${x} ${yy} ${x + r} ${yy}H${x + bw - r}Q${x + bw} ${yy} ${x + bw} ${yy + r}V${y0}Z`

    const ticks = []; for (let v = -lim; v <= lim; v += lim / 2) ticks.push(v);

      ${ticks.map((v) => `<text class="ax" x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? 0 : Math.abs(v)}</text>`).join('')}
      ${xt.map((i) => `<text class="ax" x="${X(i)}" y="${H - 8}" text-anchor="middle">${i}</text>`).join('')}

  // two teams in near colours: the second line is dashed so the two never rely on colour alone

  // rows: [label, a, b, fmt?, fewerIsBetter?]

  // 🎬 A player's clips — the points that player is part of, from the server.
  async function playerClips(pid) {
    const p = player(pid);

    wireClipRows(el, list, (c) => `${p ? `#${p.number} ${p.name}` : 'Player'} · ${sub(c)}`);
  }
  // 🎬 Clip rows (like the cricket scorecard's): badge, the point, how it was

  const BADGE = { ATTACK_KILL: 'K', BLOCK: 'B', ACE: 'A', PENALTY: 'P', GENERAL: '•' };

        ${d ? `<span class="vclip-dur">${d}</span>` : ''}

  function playList(list, titleOf, i) {

    el.innerHTML = `<div class="row wrapr" style="gap:8px;margin-bottom:12px"><span class="chip">${tot.m} match${tot.m === 1 ? '' : 'es'}</span><span class="chip">${r1(tot.p)} points</span><span class="chip">${tot.k} kills</span><span class="chip">${r1(tot.b)} blocks</span><span class="chip">${tot.a} aces</span><span class="chip">${tot.d} digs</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Match</th><th>Tournament</th><th class="c">Pts</th><th class="c">K</th><th class="c">Blk</th><th class="c">Ace</th><th class="c">Dig</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td><a href="/volleyball/match/${esc(x.match.matchId)}">${esc(x.match.teamA ? x.match.teamA.shortName || x.match.teamA.name : '')} v ${esc(x.match.teamB ? x.match.teamB.shortName || x.match.teamB.name : '')}</a> ${x.match.status === 'live' ? '<span class="badge live">LIVE</span>' : ''}</td><td class="muted">${esc(x.tournamentName)}</td><td class="c"><b>${r1(x.stats.points)}</b></td><td class="c">${x.stats.attack.kills}</td><td class="c">${r1(x.stats.block.points)}</td><td class="c">${x.stats.serve.aces}</td><td class="c">${x.stats.digs}</td></tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------- point by point ---------- */
  function renderPoints() {
    const tl = S.timeline;
    if (!tl.length) { $('#tab').innerHTML = '<div class="card empty"><b>No points yet</b></div>'; return; }
    const clipByEvent = new Map(S.clips.map((c) => [c.eventId, c]));
    const bySet = new Map();
    tl.forEach((e) => {
      const n = e.after ? e.after.set : 0;
      if (!n || !['RALLY', 'TIMEOUT', 'SUBSTITUTION', 'SANCTION', 'REPLAY', 'SET_START'].includes(e.type)) return;
      if (!bySet.has(n)) bySet.set(n, []);
      bySet.get(n).push(e);
    });
    const sets = [...bySet.keys()].sort((a, b) => b - a);
    const sum = (S.summary || {}).sets || [];
    $('#tab').innerHTML = sets.map((n) => {
      const items = bySet.get(n).slice().reverse(), x = sum.find((y) => y.set === n);
      return `<div class="section-title"><span class="h-bar">Set ${n}</span>${x ? `<span class="n">${x.A}–${x.B}</span>` : ''}</div><div class="list">${items.map((e) => line(e, clipByEvent.get(e.eventId))).join('')}</div>`;
    }).join('') + '<p class="tiny muted" style="margin-top:10px">Newest first. A struck-through point was taken back by the scorer.</p>';
    $$('[data-play]').forEach((b) => b.onclick = () => {
      // the match's clips in point order — Previous / Next walk through the match
      const list = S.clips.filter((x) => x.watchUrl && !x.eventVoided).slice().sort((a, x) => (a.set || 0) - (x.set || 0) || (a.pointNo || 0) - (x.pointNo || 0));
      const i = list.findIndex((x) => x.clipId === b.dataset.play);
      if (i >= 0) playList(list, (c) => OUT[c.outcome] || 'Point', i);
    });
  }
  function line(e, clip) {
    const sc = e.after ? `${e.after.score.A}–${e.after.score.B}` : '';
    if (e.type === 'RALLY') {
      const p = e.players || {};
      const who = [p.attacker && pn(p.attacker), (p.blockers || []).map(pn).join(' + '), p.errorBy && pn(p.errorBy), p.receiver && pn(p.receiver)].filter(Boolean).join(' · ');
      const srv = e.outcome === 'ACE' && e.rallyServer ? pn(e.rallyServer.playerId) : '';
      return `<div class="rally ${e.voided ? 'void' : ''}"><span class="sc">${sc}</span><span class="ob" style="${tcs(e.team)}" title="${esc(team(e.team).name)}">${esc(badgeOf(e.outcome))}</span><span class="ellipsis"><b>${esc(OUT[e.outcome] || 'Point')}</b> · ${esc(short(e.team))}${e.sideOut === false ? ' <span class="badge">Break point</span>' : ''}${who || srv ? ` <span class="muted">— ${esc(who || srv)}</span>` : ''}</span>
        ${clip && clip.watchUrl && !e.voided ? `<button class="vid" data-play="${esc(clip.clipId)}">▶</button>` : clip && !e.voided ? `<span class="tiny muted">${esc(clip.displayStatus)}</span>` : '<span></span>'}</div>`;
    }
    const txt = e.type === 'TIMEOUT' ? `Time-out · ${team(e.team).name}` : e.type === 'SUBSTITUTION' ? `Substitution · ${short(e.team)}: ${(e.pairs || []).map((x) => `${pn(x.in)} for ${pn(x.out)}`).join(', ')}`
      : e.type === 'SANCTION' ? `Sanction (${e.kind}) · ${e.playerId ? pn(e.playerId) : team(e.team).name}` : e.type === 'REPLAY' ? 'Rally replayed' : `Set ${e.after.set} starts`;
    const ic = e.type === 'TIMEOUT' ? 'T' : e.type === 'SUBSTITUTION' ? '⇄' : e.type === 'SANCTION' ? '!' : e.type === 'REPLAY' ? '↻' : '▶';
    return `<div class="rally ev ${e.voided ? 'void' : ''}"><span class="sc">${sc}</span><span class="ob">${ic}</span><span class="ellipsis small">${esc(txt)}</span><span></span></div>`;
  }

  /* ---------- clips library ---------- */
  const KINDS = [['', 'All'], ['kill', 'Kills'], ['block', 'Blocks'], ['ace', 'Aces'], ['error', 'Errors'], ['other', 'Other']];
  const kindOf = (o) => (o === 'ATTACK_KILL' || o === 'BALL_IN' ? 'kill' : o === 'BLOCK' ? 'block' : o === 'ACE' ? 'ace' : /ERROR|FAULT|OUT|HITS|CONTACT/.test(o || '') ? 'error' : 'other');
  function renderClips() {
    const all = S.clips.filter((c) => !c.eventVoided).slice().sort((a, b) => (a.set || 0) - (b.set || 0) || (a.pointNo || 0) - (b.pointNo || 0));
    if (!all.length) { $('#tab').innerHTML = `<div class="card empty"><b>No clips for this match yet</b>${live() ? 'Each point’s clip appears here a few seconds after it is scored.' : 'No point of this match was recorded.'}</div>`; return; }
    const f = S.cf;
    const inClips = new Map();
    all.forEach((c) => (c.players || []).forEach((p) => { if (!inClips.has(p.playerId)) inClips.set(p.playerId, player(p.playerId)); }));
    const list = all.filter((c) => (!f.set || String(c.set) === f.set) && (!f.team || c.team === f.team) && (!f.kind || kindOf(c.outcome) === f.kind) && (!f.player || (c.players || []).some((p) => p.playerId === f.player)));
    const sets = [...new Set(all.map((c) => c.set))].sort((a, b) => a - b);
    const ready = list.filter((c) => c.watchUrl).length;
    const subOf = (c) => [OUT[c.outcome] || 'Point', c.team ? `to ${short(c.team)}` : '', (c.players || []).slice(0, 2).map((p) => pn(p.playerId)).filter(Boolean).join(', ')].filter(Boolean).join(' · ');
    $('#tab').innerHTML = `<div class="card"><div class="card-h"><h3 class="h-bar">Clips library</h3><span class="sub">${ready} of ${list.length} ready to watch</span>${ready > 1 ? `<button class="btn sm primary" id="playall">${VB.icon('play')}Play all</button>` : ''}</div>
      <div class="filters"><div class="ptabs" style="margin:0" id="ck">${KINDS.map(([k, l]) => `<button data-k="${k}" aria-pressed="${f.kind === k}">${esc(l)} <span class="muted">${(k ? all.filter((c) => kindOf(c.outcome) === k) : all).length}</span></button>`).join('')}</div>
        <select class="input" id="cs" aria-label="Set"><option value="">All sets</option>${sets.map((n) => `<option value="${n}" ${f.set === String(n) ? 'selected' : ''}>Set ${n}</option>`).join('')}</select>
        <select class="input" id="ct" aria-label="Team"><option value="">Both teams</option>${['A', 'B'].map((s) => `<option value="${s}" ${f.team === s ? 'selected' : ''}>${esc(team(s).name)}</option>`).join('')}</select>
        <select class="input" id="cp" aria-label="Player"><option value="">Every player</option>${[...inClips.entries()].filter(([, p]) => p).sort((a, b) => a[1].team.localeCompare(b[1].team) || (parseInt(a[1].number, 10) || 0) - (parseInt(b[1].number, 10) || 0)).map(([id, p]) => `<option value="${esc(id)}" ${f.player === id ? 'selected' : ''}>${esc(short(p.team))} · #${esc(p.number)} ${esc(p.name)}</option>`).join('')}</select></div>
      <div class="vclips" id="clist">${list.length ? clipRows(list, subOf) : '<div class="empty small"><b>No clip matches these filters</b></div>'}</div></div>`;
    $$('#ck button').forEach((b) => b.onclick = () => { f.kind = b.dataset.k; renderClips(); });
    $('#cs').onchange = (e) => { f.set = e.target.value; renderClips(); };
    $('#ct').onchange = (e) => { f.team = e.target.value; renderClips(); };
    $('#cp').onchange = (e) => { f.player = e.target.value; renderClips(); };
    wireClipRows($('#clist'), list, subOf);
    if ($('#playall')) $('#playall').onclick = () => playList(list, subOf, list.findIndex((c) => c.watchUrl));
  }

  /* ---------- line-ups: the starting six of every set, on the court ---------- */
  function lineupOf(n, s) {
    const ev = S.timeline.filter((e) => e.type === 'LINEUP' && e.team === s && Number(e.set) === n && !e.voided && !e.invalid).pop();
    return ev ? ev.positions || [] : null;
  }
  function renderLineups() {
    const s = S.summary || {};
    const sets = (s.sets || []).map((x) => x.set);
    const next = s.nextSet && (lineupOf(s.nextSet, 'A') || lineupOf(s.nextSet, 'B')) ? [s.nextSet] : [];
    const list = [...sets, ...next.filter((n) => !sets.includes(n))];
    if (!list.length) { $('#tab').innerHTML = '<div class="card empty"><b>No line-ups yet</b>The starting six of each team appear once the scorer enters them.</div>'; return; }
    const libs = (side) => ((S.match.squads || {})[side] || []).filter((p) => p.libero);
    // a team's half: front row at the net. Team A plays left (IV top), team B right (IV bottom).
    const half = (side, ids, firstServe) => {
      if (!ids) return `<div class="luhalf ${side === 'A' ? 'a' : 'b'}" style="place-items:center;color:#fff;font-weight:700">Not entered</div>`;
      const cell = (idx) => { const p = player(ids[idx]); const srv = firstServe === side && idx === 0; return `<div class="lupos ${srv ? 'srv' : ''}" style="${tcs(side)}" title="${srv ? 'Served first' : ''}"><em>${VB.POS[idx]}</em><b class="n">${esc(p ? p.number : '?')}</b><span><span class="pn">${esc(p ? p.name : 'Unknown')}</span><small>${esc(p ? (p.libero ? 'Libero' : VB.ROLES[p.role] || '') + (p.captain ? ' · C' : '') : '')}</small></span></div>`; };
      // A: back column (V, VI, I) | front column (IV, III, II); B mirrored
      const order = side === 'A' ? [4, 3, 5, 2, 0, 1] : [1, 0, 2, 5, 3, 4];
      return `<div class="luhalf ${side === 'A' ? 'a' : 'b'}">${order.map(cell).join('')}</div>`;
    };
    const subsIn = (n, side) => S.timeline.filter((e) => e.type === 'SUBSTITUTION' && e.team === side && e.after && e.after.set === n && !e.voided && !e.invalid).flatMap((e) => (e.pairs || []).map((p) => `${pn(p.in)} for ${pn(p.out)} (${e.after.score.A}–${e.after.score.B})`));
    if (!S.luPicked || !list.includes(S.luSet)) S.luSet = list[list.length - 1];
    const chips = list.length > 1 ? `<div class="ptabs" style="margin:0" id="lus">${list.map((n) => `<button data-n="${n}" aria-pressed="${S.luSet === n}">Set ${n}</button>`).join('')}</div>` : '';
    $('#tab').innerHTML = `<div class="lineups">${chips}${[S.luSet].map((n) => {
      const x = (s.sets || []).find((y) => y.set === n), inf = (s.setInfo || []).find((y) => y.set === n) || {};
      const A = lineupOf(n, 'A'), B = lineupOf(n, 'B');
      return `<div class="card"><div class="lu-head"><h3 class="h-bar">Set ${n}</h3>${x ? `<span class="badge">${x.A}–${x.B}</span>` : '<span class="badge">Next set</span>'}${inf.firstServe ? `<span class="small muted">${esc(team(inf.firstServe).name)} served first</span>` : ''}<span class="grow"></span><span class="tkey" style="--tc:${mark('A')}">${esc(short('A'))}</span><span class="tkey" style="--tc:${mark('B')}">${esc(short('B'))}</span></div>
        <div class="lucourt">${half('A', A, inf.firstServe)}<div class="net" aria-hidden="true"></div>${half('B', B, inf.firstServe)}</div>
        <div class="lunotes">${['A', 'B'].map((side) => { const subs = subsIn(n, side), L = libs(side); return `<div><div class="ttl"><span class="tkey" style="--tc:${mark(side)}">${esc(team(side).name)}</span></div><div style="margin-top:4px">${L.length ? 'Libero: ' + L.map((p) => `#${esc(p.number)} ${esc(p.name)}`).join(', ') : 'No libero listed'}</div><div>${subs.length ? 'Substitutions: ' + subs.map(esc).join(' · ') : 'No substitutions'}</div></div>`; }).join('')}</div></div>`;
    }).join('')}<p class="tiny muted">The six each team gave the scorer before the set, in rotation order — position I serves. Front row at the net.</p></div>`;
    $$('#lus button').forEach((b) => b.onclick = () => { S.luSet = +b.dataset.n; S.luPicked = true; renderLineups(); });
  }

  /* ---------- insights ---------- */
  function renderInsights() {
    const st = S.stats;
    if (!st) return noStats();
    const T = st.teams, A = T.A, B = T.B;
    const so = (x, y) => ratio(x.sideOutPoints, y.serve.attempts), br = (x) => ratio(x.breakPoints, x.serve.attempts);
    const rec = (s) => Object.values(st.players).filter((p) => p.team === s).reduce((a, p) => { a.att += p.reception.attempts; a.err += p.reception.errors; a.digs += p.digs; return a; }, { att: 0, err: 0, digs: 0 });
    const ra = rec('A'), rb = rec('B');
    const rows = [
      ['Side-out %', so(A, B), so(B, A), pct],
      ['Break-point %', br(A), br(B), pct],
      ['Attack efficiency', A.attack.attempts ? A.attack.efficiency : null, B.attack.attempts ? B.attack.efficiency : null, pct],
      ['Kill %', ratio(A.attack.kills, A.attack.attempts), ratio(B.attack.kills, B.attack.attempts), pct],
      ['Ace %', ratio(A.serve.aces, A.serve.attempts), ratio(B.serve.aces, B.serve.attempts), pct],
      ['Service error %', ratio(A.serve.errors, A.serve.attempts), ratio(B.serve.errors, B.serve.attempts), pct, true],
      ['Serves', A.serve.attempts, B.serve.attempts],
      ['Digs', ra.digs, rb.digs],
      ['Reception errors', ra.err, rb.err, null, true],
      ['Longest run', A.longestRun, B.longestRun]];
    const CATS = [['attack', 'Attack', '--s1'], ['block', 'Block', '--s2'], ['serve', 'Serve', '--s3'], ['opponentError', 'Opponent errors', '--s4'], ['other', 'Other', '--s0']];
    const catVal = (t, k) => (k === 'other' ? (t.byCategory.general || 0) + (t.byCategory.penalty || 0) : t.byCategory[k] || 0);
    const stack = (s, t) => {
      const tot = t.points || 0;
      return `<div class="stackrow"><span class="t">${VB.logoHtml(team(s), 'sm')}<span class="ellipsis">${esc(team(s).name)}</span></span><div class="stackbar">${CATS.map(([k, l, v]) => { const n = catVal(t, k); if (!n) return ''; const w = n / Math.max(1, tot) * 100; return `<i style="width:${w}%;background:var(${v})" title="${esc(l)}: ${n} (${Math.round(w)}%)">${w >= 9 ? n : ''}</i>`; }).join('')}</div><span class="n">${tot}</span></div>`;
    };
    const per = (st.bySet || []).map((x) => ({ n: x.set, a: x.A, b: x.B }));
    $('#tab').innerHTML = `<div class="stack">
      <div class="duo">${cmpCard('Phase by phase', rows.slice(0, 6))}<div class="card viz"><div class="card-h"><h3 class="h-bar">Where the points came from</h3></div>${stack('A', A)}${stack('B', B)}
        <div class="legendrow">${CATS.map(([, l, v]) => `<span><i style="--c:var(${v})"></i>${esc(l)}</span>`).join('')}</div>
        <div class="tbl-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Points from</th><th class="c">${esc(short('A'))}</th><th class="c">${esc(short('B'))}</th></tr></thead><tbody>${CATS.map(([k, l]) => `<tr><td>${esc(l)}</td><td class="c">${catVal(A, k)}</td><td class="c">${catVal(B, k)}</td></tr>`).join('')}</tbody></table></div></div></div>
      <div class="duo">${cmpCard('Serve, defence and runs', rows.slice(6))}
        <div class="card"><div class="card-h"><h3 class="h-bar">Set by set</h3><span class="sub">Side-out % · break-point %</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Set</th><th class="c">${esc(short('A'))} SO</th><th class="c">${esc(short('B'))} SO</th><th class="c">${esc(short('A'))} BP</th><th class="c">${esc(short('B'))} BP</th><th class="c">Longest run</th></tr></thead><tbody>
          ${per.map((x) => `<tr><td><b>Set ${x.n}</b></td><td class="c">${pct(so(x.a, x.b))}</td><td class="c">${pct(so(x.b, x.a))}</td><td class="c">${pct(br(x.a))}</td><td class="c">${pct(br(x.b))}</td><td class="c">${(() => { const r = setStory(x.n).run; return r.n ? `${r.n} · ${esc(short(r.team))}` : '–'; })()}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No sets yet</td></tr>'}</tbody></table></div>
          <p class="tiny muted" style="margin-top:8px">Side-out %: rallies won when the other team served. Break-point %: rallies won on your own serve.</p></div></div>
    </div>`;
  }

  /* ---------- MVP: the points each player scored, and how ---------- */
  function renderMvp() {
    const st = S.stats;
    if (!st) return noStats();
    const ps = Object.values(st.players).filter((p) => p.setsPlayed > 0).sort((a, b) => b.points - a.points || (b.attack.efficiency || 0) - (a.attack.efficiency || 0) || (b.block.points - a.block.points));
    if (!ps.length || !ps[0].points) { $('#tab').innerHTML = '<div class="card empty"><b>No one has scored yet</b></div>'; return; }
    const done = S.match.status === 'completed';
    const chip = (n, one) => `<span><b>${n}</b> ${n === 1 ? one : one + 's'}</span>`;
    const chips = (p) => `<div class="chips">${chip(p.attack.kills, 'kill')}${chip(r1(p.block.points), 'block')}${chip(p.serve.aces, 'ace')}${chip(p.digs, 'dig')}<span>eff <b>${p.attack.attempts ? pct(p.attack.efficiency) : '–'}</b></span>${chip(p.setsPlayed, 'set')}</div>`;
    const card = (p, i) => `<div class="mvp ${i === 0 ? 'first' : ''}" style="${tcs(p.team)}"><div class="rk"><span class="rank-pill r${i + 1}">${i + 1}</span>${i === 0 ? (done ? 'Player of the match' : 'Leading the way') : i === 1 ? 'Runner-up' : 'Third'}</div>
      <div class="big">${r1(p.points)}<small>points</small></div>
      <div class="who"><span class="jer">${esc(p.number)}</span><span style="min-width:0"><b>${esc(p.name)}</b><small>${esc(team(p.team).name)}${p.role ? ' · ' + esc(VB.ROLES[p.role] || p.role) : ''}</small></span></div>${chips(p)}</div>`;
    $('#tab').innerHTML = `<div class="stack"><div class="podium">${ps.slice(0, 3).map(card).join('')}</div>
      <div class="card" style="padding:0;overflow:hidden"><div class="card-h" style="padding:14px 16px 0"><h3 class="h-bar">Everyone who played</h3><span class="sub">Ranked by points scored</span></div><div class="tbl-wrap" style="border-radius:0;box-shadow:none;background:transparent;margin-top:8px"><table class="tbl"><thead><tr><th class="c">#</th><th>Player</th><th>Team</th><th class="c">Pts</th><th class="c">K</th><th class="c">Blk</th><th class="c">Ace</th><th class="c">Dig</th><th class="c">Eff</th><th class="c">Errors</th></tr></thead><tbody>
        ${ps.map((p, i) => `<tr><td class="c"><span class="rank-pill ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</span></td><td><span class="jer" style="${tcs(p.team)}">${esc(p.number)}</span> <b>${esc(p.name)}</b></td><td><span class="tkey" style="--tc:${mark(p.team)}">${esc(short(p.team))}</span></td><td class="c"><b>${r1(p.points)}</b></td><td class="c">${p.attack.kills}</td><td class="c">${r1(p.block.points)}</td><td class="c">${p.serve.aces}</td><td class="c">${p.digs}</td><td class="c">${p.attack.attempts ? pct(p.attack.efficiency) : '–'}</td><td class="c">${p.attack.errors + p.serve.errors + p.reception.errors}</td></tr>`).join('')}</tbody></table></div></div>
      <p class="tiny muted">Points are kills + aces + block points, exactly as the scorer recorded them — no formula on top. A tie goes to the better attack efficiency.</p></div>`;
  }

  /* ---------- info ---------- */
  function renderInfo() {
    const m = S.match, s = S.summary || {}, R = m.rules || {}, t = S.tournament;
    const kv = (rows) => `<dl class="kv">${rows.filter((r) => r[1] !== '' && r[1] != null).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
    const tossTxt = (x) => (x ? `${esc(team(x.winner).name)} — chose ${x.choice === 'serve' ? 'to serve' : x.choice === 'receive' ? 'to receive' : 'the side of the court'}` : '');
    const took = m.startedAt && m.completedAt ? dur(m.completedAt - m.startedAt) : '';
    const squad = (side) => `<div class="card" style="${tcs(side)}"><div class="card-h">${VB.logoHtml(team(side), 'sm')}<h3 class="ellipsis">${esc(team(side).name)}</h3><span class="sub">${((m.squads || {})[side] || []).length} players</span></div>
      <div class="list squad">${((m.squads || {})[side] || []).map((p) => `<div class="li small"><span class="jer">${esc(p.number)}</span><span class="grow ellipsis"><b>${esc(p.name)}</b></span><span class="muted">${esc(p.libero ? 'Libero' : VB.ROLES[p.role] || '')}${p.captain ? ' · Captain' : ''}</span></div>`).join('') || '<div class="empty small">No squad listed</div>'}</div></div>`;
    $('#tab').innerHTML = `<div class="stack"><div class="grid-2">
      <div class="card"><div class="card-h"><h3 class="h-bar">Match</h3></div>${kv([
        ['Tournament', t ? `<a href="/volleyball/tournament/${esc(t.tournamentId)}">${esc(t.name)}</a>` : ''],
        ['Stage', esc(m.stage ? [m.stage.group ? 'Group ' + m.stage.group : '', m.stage.round].filter(Boolean).join(' · ') : '')],
        ['Match', m.matchNo ? 'Match ' + m.matchNo : ''],
        ['Venue', esc(m.venue || '')],
        ['Scheduled', m.scheduledAt ? esc(VB.fmtDate(m.scheduledAt)) : ''],
        ['Started', m.startedAt ? esc(ago(m.startedAt)) : ''],
        ['Finished', m.completedAt ? esc(ago(m.completedAt)) : ''],
        ['Duration', esc(took)],
        ['Toss', tossTxt(s.toss)],
        ['Deciding-set toss', tossTxt(s.decidingToss)],
        ['Notes', esc(m.notes || '')]])}</div>
      <div class="card"><div class="card-h"><h3 class="h-bar">Rules</h3>${R.official ? '<span class="badge done">Official</span>' : '<span class="badge warn">Custom</span>'}</div>${kv([
        ['Ruleset', esc(R.ruleset || '')],
        ['Format', R.bestOf > 1 ? `Best of ${R.bestOf} sets` : 'One set'],
        ['Sets to', `${R.setPoints} points${R.bestOf > 1 ? ` · deciding set ${R.decidingSetPoints}` : ''}`],
        ['Win by', R.winBy ? `${R.winBy} points${R.pointCap ? ` · capped at ${R.pointCap}` : ''}` : ''],
        ['Time-outs', `${R.timeoutsPerSet} per set · ${R.timeoutSeconds} s`],
        ['Substitutions', `${R.substitutionsPerSet} per set`],
        ['Libero', R.liberoEnabled ? `Up to ${R.maxLiberos}${R.liberoCanServe ? ' · may serve' : ''}` : 'Not used'],
        ['Change of courts', R.bestOf > 1 && R.decidingSetSwitchAt ? `Deciding set at ${R.decidingSetSwitchAt}` : '']])}</div></div>
      ${(s.setInfo || []).length ? `<div class="card"><div class="card-h"><h3 class="h-bar">Set by set</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Set</th><th class="c">Score</th><th>Won by</th><th>First serve</th><th>Started</th><th class="c">Length</th></tr></thead><tbody>
        ${s.setInfo.map((x) => { const y = (s.sets || []).find((z) => z.set === x.set) || {}; return `<tr><td><b>Set ${x.set}</b></td><td class="c">${y.A != null ? `${y.A}–${y.B}` : '–'}</td><td>${y.winner ? `<span class="tkey" style="--tc:${mark(y.winner)}">${esc(team(y.winner).name)}</span>` : '<span class="muted">In progress</span>'}</td><td>${x.firstServe ? esc(team(x.firstServe).name) : '–'}</td><td>${x.startedAt ? esc(VB.fmtDate(x.startedAt, { weekday: undefined })) : '–'}</td><td class="c">${x.startedAt && x.endedAt ? esc(dur(x.endedAt - x.startedAt)) : '–'}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
      <div class="grid-2">${squad('A')}${squad('B')}</div></div>`;
  }

  /* ---------- head to head ---------- */
  async function renderTeams() {
    const A = team('A'), B = team('B');
    $('#tab').innerHTML = `<div class="grid-2"><div class="card" id="h2h"><h3 class="h-bar">Head to head</h3><div class="skel" style="height:80px;margin-top:10px"></div></div><div class="stack" id="hist"></div></div>`;
    if (!A.teamId || !B.teamId) { $('#h2h').innerHTML = '<h3 class="h-bar">Head to head</h3><p class="muted small" style="margin-top:8px">Both teams are not known yet.</p>'; return; }
    // history changes only when a match ends — no need to fetch it on every point
    if (!S.teamsData || Date.now() - S.teamsData.at > 60000) {
      const got = await Promise.all([
        api('GET', `/api/volleyball/h2h?teamA=${encodeURIComponent(A.teamId)}&teamB=${encodeURIComponent(B.teamId)}`),
        api('GET', `/api/volleyball/teams/${encodeURIComponent(A.teamId)}/history?tournamentId=${encodeURIComponent(S.match.tournamentId)}`),
        api('GET', `/api/volleyball/teams/${encodeURIComponent(B.teamId)}/history?tournamentId=${encodeURIComponent(S.match.tournamentId)}`)
      ]);
      S.teamsData = { at: Date.now(), got };
    }
    const [h, ha, hb] = S.teamsData.got;
    if (S.tab !== 'teams' || !$('#h2h')) return;
    if (h.ok) {
      const j = h.json;
      $('#h2h').innerHTML = `<h3 class="h-bar">Head to head</h3><div class="h2hres"><span class="s">${VB.logoHtml(A)}<b class="ellipsis">${esc(A.shortName || A.name)}</b></span><span class="big">${j.wins[A.teamId] || 0} – ${j.wins[B.teamId] || 0}</span><span class="s r">${VB.logoHtml(B)}<b class="ellipsis">${esc(B.shortName || B.name)}</b></span></div>
        <p class="small muted" style="text-align:center;margin-top:8px">Sets ${j.sets[A.teamId] || 0}–${j.sets[B.teamId] || 0} · points ${j.points[A.teamId] || 0}–${j.points[B.teamId] || 0} · ${j.matches.length} completed match${j.matches.length === 1 ? '' : 'es'}</p>
        <div class="list" style="margin-top:10px">${j.matches.slice(0, 8).map((x) => `<a class="li small" href="/volleyball/match/${esc(x.matchId)}"><span class="grow ellipsis">${esc(x.tournamentName)}</span><b>${x.result ? `${x.result.sets[x.teamA.teamId === A.teamId ? 'A' : 'B']}–${x.result.sets[x.teamA.teamId === A.teamId ? 'B' : 'A']}` : ''}</b><span class="muted">${esc(VB.fmtDate(x.completedAt, { weekday: undefined, hour: undefined, minute: undefined }))}</span></a>`).join('') || '<div class="empty small">They have not met yet</div>'}</div>`;
    }
    const histCard = (t, r) => {
      if (!r.ok) return '';
      const j = r.json, a = j.allTime, form = j.matches.slice(0, 5).map((x) => { const sd = x.teamA.teamId === t.teamId ? 'A' : 'B'; return x.result && x.result.winner === sd ? 'W' : 'L'; }).reverse();
      return `<div class="card"><div class="row">${VB.logoHtml(t, 'sm')}<h3 class="grow ellipsis">${esc(t.name)}</h3><span class="form">${form.map((f) => `<i class="${f}">${f}</i>`).join('')}</span></div>
        <p class="small muted" style="margin-top:8px">All competitions: ${a.played} played · ${a.won} won · sets ${a.setsWon}–${a.setsLost}${j.tournament ? ` · this tournament: ${j.tournament.won}–${j.tournament.lost}` : ''}</p>
        <div class="list" style="margin-top:10px">${j.matches.slice(0, 6).map((x) => { const sd = x.teamA.teamId === t.teamId ? 'A' : 'B', op = sd === 'A' ? x.teamB : x.teamA, won = x.result && x.result.winner === sd; return `<a class="li small" href="/volleyball/match/${esc(x.matchId)}"><span class="form"><i class="${won ? 'W' : 'L'}">${won ? 'W' : 'L'}</i></span><span class="grow ellipsis">v ${esc(op ? op.name : '')}</span><b>${x.result ? `${x.result.sets[sd]}–${x.result.sets[sd === 'A' ? 'B' : 'A']}` : ''}</b></a>`; }).join('') || '<div class="empty small">No completed matches yet</div>'}</div></div>`;
    };
    $('#hist').innerHTML = histCard(A, ha) + histCard(B, hb);
  }

  /* ---------- live ---------- */
  async function connectLive() {
    const s = await VB.connect();
    s.on('connect', async () => { const r = await VB.ack(s, 'vb:join', { matchId, key: key || undefined }); if (r.ok && S.match && r.seq !== S.match.eventSeq) reloadSoon(200); });
    s.on('vb:update', (d) => { if (d.matchId !== matchId || !S.match) return; S.summary = d.summary; S.match.status = d.status; render(); reloadSoon(1500); });
    s.on('vb:clip', (d) => { if (d.matchId === matchId) reloadSoon(2000); });
    s.on('vb:report', (d) => { if (d.matchId === matchId) reloadSoon(500); });
    s.on('vb:match', (d) => { if (d.matchId === matchId) reloadSoon(500); });
  }
  // the theme changes the charts' marks: draw them again
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('[data-theme-btn]') && S.match) setTimeout(render, 0); });
  if (!matchId) { notFound(404); return; }
  load().then(connectLive);
})();
</script>
</body>
</html>
