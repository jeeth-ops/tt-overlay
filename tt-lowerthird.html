<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Lower Third Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            padding: 50px;
        }

        /* Lower Third Container with Slide Animation */
        .lower-third-container {
            position: relative;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lower-third-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Title Box (Top Small Tag) */
        .lt-title-box {
            background: #000000;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 20px;
            display: inline-block;
            border-top: 2px solid #ef4444; /* Red accent */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* Main Content Box */
        .lt-main-box {
            background: linear-gradient(135deg, rgba(15, 15, 15, 0.95), rgba(30, 0, 0, 0.95));
            color: #ffffff;
            padding: 18px 30px;
            font-size: 1.8rem;
            font-weight: 800;
            border-left: 6px solid #ef4444; /* Bold Red Border */
            border-top: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            min-width: 500px;
            max-width: 800px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="lower-third-container" id="ltContainer">
        <div id="ltTitle" class="lt-title-box">MATCH HIGHLIGHT</div>
        <div id="ltText" class="lt-main-box">Announcement text goes here</div>
    </div>

    <script>
        // Live data update aur animation ke liye WebSocket ya Server polling
        function updateData() {
            fetch('/api/tt-data')
                .then(res => res.json())
                .then(data => {
                    if (data.ltTitle) document.getElementById('ltTitle').innerText = data.ltTitle;
                    if (data.ltText) document.getElementById('ltText').innerText = data.ltText;
                    
                    const container = document.getElementById('ltContainer');
                    if (data.ltVisible) {
                        container.classList.add('show');
                    } else {
                        container.classList.remove('show');
                    }
                })
                .catch(err => console.log('Error fetching data:', err));
        }

        setInterval(updateData, 500);
        updateData();
    </script>
</body>
</html>
