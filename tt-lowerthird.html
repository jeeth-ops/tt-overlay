<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Lower Third Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: transparent;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 50px;
            overflow: hidden;
        }

        .lower-third-container {
            position: relative;
            width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Main Announcement Box */
        .lt-body {
            background: linear-gradient(90deg, #1a0505 0%, #450a0a 50%, #1a0505 100%);
            color: #ffffff;
            width: 100%;
            padding: 16px 24px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 600;
            border-bottom: 3px solid #ef4444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 0 0 6px 6px; /* Neeche se rounded */
            z-index: 2;
            
            /* Animation Defaults */
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. Title Box - Announcement ke center se bina gap ke upar niklega */
        .lt-title {
            background-color: #000000;
            color: #ef4444;
            font-size: 0.8rem;
            padding: 5px 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px 4px 0 0; /* Upar se rounded */
            position: absolute;
            bottom: 100%; /* Ekdum announcement box ke border ke upar chipka rahega */
            left: 50%;
            z-index: 1;
            
            /* Animation Defaults */
            opacity: 0;
            transform: translate(-50%, 15px) scaleY(0.2);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }

        /* Jab Active hoga */
        .lower-third-container.active .lt-body {
            opacity: 1;
            transform: translateY(0);
        }

        .lower-third-container.active .lt-title {
            opacity: 1;
            /* Center se khul kar bina kisi gap ke upar baith jayega */
            transform: translate(-50%, 0) scaleY(1);
        }
    </style>
</head>
<body>

    <div id="lowerThird" class="lower-third-container">
        <div id="ltTitle" class="lt-title">MATCH HIGHLIGHT</div>
        <div id="ltText" class="lt-body">Announcement text goes here</div>
    </div>

    <script>
        // --- Room/UID Isolation Setup ---
        const urlParams = new URLSearchParams(window.location.search);
        const roomVal = urlParams.get('room') || urlParams.get('uid');
        const apiQueryString = roomVal ? `?room=${roomVal}` : '';

        function fetchLowerThirdData() {
            fetch(`/api/tt-data${apiQueryString}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('ltTitle').textContent = data.ltTitle;
                    document.getElementById('ltText').textContent = data.ltText;
                    
                    const container = document.getElementById('lowerThird');
                    if (data.ltVisible) {
                        container.classList.add('active');
                    } else {
                        container.classList.remove('active');
                    }
                })
                .catch(err => console.log('Error fetching data:', err));
        }

        setInterval(fetchLowerThirdData, 500);
        fetchLowerThirdData();
    </script>
</body>
</html>
