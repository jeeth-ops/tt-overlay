<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Player · AllSportsLive</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="stylesheet" href="/tennis-ui.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<!-- 🎾 A player's page: the profile as entered (achievements only when
     verified, a ranking only when configured), the record, and every match
     the visitor may see, with the player's own figures from each. -->
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="asl"></span><span class="bt"><b>Tennis</b><small>by All Sports Live</small></span></a>
  <span class="grow"></span>
  <button class="theme-btn" data-theme-btn aria-label="Theme"></button>
</header>
<main class="wrap" id="app" style="padding-bottom:70px;max-width:1000px"><div class="skel" style="height:260px;margin-top:20px"></div></main>
<footer class="asl-foot" data-asl-footer></footer>
<script src="/asl-footer.js?v=20261114" defer></script>
<script src="/tennis-common.js"></script>
<script>
(function () {
  'use strict';
  const { $, esc, api } = TN;
  const pid = decodeURIComponent(location.pathname.split('/').pop() || '');
  (async () => {
    const r = await api('GET', `/api/tennis/players/${encodeURIComponent(pid)}`);
    if (!r.ok) { $('#app').innerHTML = '<div class="empty card" style="margin-top:30px"><b>Player not found</b><a href="/">All Sports Live</a></div>'; return; }
    const p = r.json.player, rec = r.json.record, ms = r.json.matches || [];
    document.title = `${p.name} · Tennis · AllSportsLive`;
    const facts = [['Country', p.country], ['Club', p.club], ['Plays', p.hand ? (p.hand === 'L' ? 'Left-handed' : 'Right-handed') : ''], ['Backhand', p.backhand ? (p.backhand === '1H' ? 'One-handed' : 'Two-handed') : ''], ['Ranking', p.ranking ? (p.ranking.label ? p.ranking.label + ' ' : '') + '#' + p.ranking.value : '']].filter((x) => x[1]);
    const totals = ms.reduce((o, x) => { const s = x.stats; if (!s || !s.serve) return o; o.aces += s.serve.aces || 0; o.df += s.serve.doubleFaults || 0; o.bpw += (s.ret && s.ret.bpConverted) || 0; o.bpc += (s.ret && s.ret.bpChances) || 0; return o; }, { aces: 0, df: 0, bpw: 0, bpc: 0 });
    $('#app').innerHTML = `<section class="cover" style="margin-top:18px;min-height:240px">${TN.coverArt('hard', TN.colorOf(p))}<div class="in"><div class="row" style="align-items:flex-end;gap:18px">${TN.avatar(p, 110)}<div class="grow"><div class="kick" style="color:var(--optic)">${esc(p.country || 'Tennis player')}</div><h1>${esc(p.name)}</h1></div></div></div></section>
      <div class="tiles" style="margin-top:14px"><div class="tile"><small>Matches</small><b>${rec.played}</b></div><div class="tile"><small>Won</small><b>${rec.won}</b></div><div class="tile"><small>Aces</small><b>${totals.aces}</b></div><div class="tile"><small>Break points won</small><b>${totals.bpw}/${totals.bpc}</b></div></div>
      ${facts.length ? `<div class="info card" style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px">${facts.map(([k, v]) => `<div><small class="muted" style="display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
      ${p.achievements && p.achievements.length ? `<div class="section-title">Achievements</div><div class="list">${p.achievements.map((a) => `<div class="li">🏆 <span>${esc(a)}</span></div>`).join('')}</div>` : ''}
      ${p.bio ? `<p class="muted" style="margin-top:12px">${esc(p.bio)}</p>` : ''}
      <div class="section-title">Matches</div><div class="mcards">${ms.map((x) => TN.matchCard(Object.assign({}, x.match, { eventName: [x.tournamentName, x.match.eventName].filter(Boolean).join(' · ') }))).join('') || '<div class="empty card">No matches yet.</div>'}</div>`;
  })();
})();
</script>
</body>
</html>
