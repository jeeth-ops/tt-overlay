<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Ultimate Broadcast Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* 🖥️ Desktop 1920x1080 Fit: No Scroll View 🖥️ */
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            overflow: hidden;
        }

        /* Background Video */
        .bg-animations {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -999; overflow: hidden;
            background-color: var(--bg-dark);
            pointer-events: none;
        }
        .bg-video {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: blur(12px) brightness(0.4);
            opacity: 0.35;
        }

        /* Top Header */
        header { text-align: center; }
        header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
        header h1 span { color: var(--accent); }

        /* Main Control Board Container */
        .control-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 950px;
        }

        /* Team Control Box */
        .team-box {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .team-input {
            width: 65%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        .team-input:focus { border-color: var(--accent); }

        /* Serve Indicator Button */
        .serve-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .serve-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Score & Sets row */
        .score-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 8px 0;
        }

        .label-small {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .set-display {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .ctrl-btn.add { background: var(--accent); }
        .ctrl-btn.add:hover { background: var(--accent-hover); }
        .ctrl-btn.small { padding: 5px 10px; font-size: 0.8rem; }

        /* 🎬 Advanced Animation & Graphic Triggers Panel 🎬 */
        .animation-triggers {
            width: 100%;
            max-width: 950px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 20px;
            backdrop-filter: blur(10px);
        }

        .trigger-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .triggers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .trig-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .trig-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }

        /* Bottom Match Actions Bar */
        .match-actions {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .action-btn:hover { color: white; border-color: white; }

        /* 📱 Mobile Responsive View 📱 */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; padding: 10px; }
            .control-wrapper { grid-template-columns: 1fr; gap: 10px; }
            .triggers-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="bg-animations">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="Sequence 04.mp4" type="video/mp4">
        </video>
    </div>

    <header>
        <h1>Scor<span>vix</span> Pro Broadcast Controller</h1>
    </header>

    <div class="control-wrapper">
        <div class="team-box">
            <div class="team-header">
                <input type="text" id="teamA-name" class="team-input" value="Player A">
                <button class="serve-btn" id="serveA" onclick="toggleServe('A')">Serve ⚪</button>
            </div>
            
            <div class="score-row">
                <div class="score-group">
                    <div class="label-small">Score</div>
                    <div class="score-display" id="scoreA">0</div>
                </div>
                <div class="set-group">
                    <div class="label-small">Sets Won</div>
                    <div class="set-display" id="setsA">0</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="ctrl-btn" onclick="updateScore('A', -1)">-</button>
                <button class="ctrl-btn add" onclick="updateScore('A', 1)">+</button>
                <button class="ctrl-btn small" onclick="updateSets('A', 1)">+ Set</button>
            </div>
        </div>

        <div class="team-box">
            <div class="team-header">
                <input type="text" id="teamB-name" class="team-input" value="Player B">
                <button class="serve-btn" id="serveB" onclick="toggleServe('B')">Serve ⚪</button>
            </div>
            
            <div class="score-row">
                <div class="score-group">
                    <div class="label-small">Score</div>
                    <div class="score-display" id="scoreB">0</div>
                </div>
                <div class="set-group">
                    <div class="label-small">Sets Won</div>
                    <div class="set-display" id="setsB">0</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="ctrl-btn" onclick="updateScore('B', -1)">-</button>
                <button class="ctrl-btn add" onclick="updateScore('B', 1)">+</button>
                <button class="ctrl-btn small" onclick="updateSets('B', 1)">+ Set</button>
            </div>
        </div>
    </div>

    <div class="animation-triggers">
        <div class="trigger-title">Broadcast Graphics & Animation Triggers (In/Out)</div>
        <div class="triggers-grid">
            <button class="trig-btn" onclick="triggerAnimation('Title Card')">🏷️ Title Card</button>
            <button class="trig-btn" onclick="triggerAnimation('Scorecard')">📊 Show Scorecard</button>
            <button class="trig-btn" onclick="triggerAnimation('Action Replay')">⚡ Action Replay</button>
            <button class="trig-btn" onclick="triggerAnimation('Winner Card')">🏆 Winner Card</button>
            <button class="trig-btn" onclick="triggerAnimation('Hide Graphics')" style="border-color: var(--accent);">❌ Hide All</button>
        </div>
    </div>

    <div class="match-actions">
        <button class="action-btn" onclick="resetMatch()">🔄 Reset Match</button>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Status: Broadcast Ready (1080p View)</span>
        <button class="action-btn" onclick="window.location.href='/'">🏠 Home</button>
    </div>

    <script>
        let scoreA = 0, scoreB = 0;
        let setsA = 0, setsB = 0;
        let currentServe = 'A';

        function updateScore(team, val) {
            if (team === 'A') {
                scoreA = Math.max(0, scoreA + val);
                document.getElementById('scoreA').innerText = scoreA;
            } else {
                scoreB = Math.max(0, scoreB + val);
                document.getElementById('scoreB').innerText = scoreB;
            }
        }

        function updateSets(team, val) {
            if (team === 'A') {
                setsA = Math.max(0, setsA + val);
                document.getElementById('setsA').innerText = setsA;
            } else {
                setsB = Math.max(0, setsB + val);
                document.getElementById('setsB').innerText = setsB;
            }
        }

        function toggleServe(team) {
            currentServe = team;
            if (team === 'A') {
                document.getElementById('serveA').classList.add('active');
                document.getElementById('serveA').innerText = 'Serve 🟢';
                document.getElementById('serveB').classList.remove('active');
                document.getElementById('serveB').innerText = 'Serve ⚪';
            } else {
                document.getElementById('serveB').classList.add('active');
                document.getElementById('serveB').innerText = 'Serve 🟢';
                document.getElementById('serveA').classList.remove('active');
                document.getElementById('serveA').innerText = 'Serve ⚪';
            }
        }

        function triggerAnimation(type) {
            // Yahan par aap WebSocket ya LocalStorage ke through overlay page ko signal bhej sakte ho
            console.log(`Triggered Broadcast Graphic: ${type}`);
            alert(`Animation Triggered: ${type}`);
        }

        function resetMatch() {
            scoreA = 0; scoreB = 0;
            setsA = 0; setsB = 0;
            document.getElementById('scoreA').innerText = 0;
            document.getElementById('scoreB').innerText = 0;
            document.getElementById('setsA').innerText = 0;
            document.getElementById('setsB').innerText = 0;
        }
    </script>
</body>
</html>
