<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Overlay - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌟 Video Background with Blur & Low Opacity for Cool Vibe 🌟 */
        .video-bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0f172a;
        }

        .video-bg-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(12px); /* Thoda blur taaki quality issue na dikhe */
            opacity: 0.35;       /* Low opacity taaki cool vibe aaye */
            transform: scale(1.1); /* Blur edges chupane ke liye */
        }

        /* Dark overlay gradient to make text readable */
        .video-overlay-gradient {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,23,42,0.6) 0%, rgba(15,23,42,0.9) 100%);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Top Header Section */
        .header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 45px; height: 45px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-size: 1.2rem;
            backdrop-filter: blur(8px);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
        }

        .title-group .step-indicator {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title-group h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Search Bar */
        .search-bar-container {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            width: 100%;
            outline: none;
        }
        .search-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        /* Single Overlay Grid Layout */
        .overlays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .overlay-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .overlay-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .overlay-card h3 {
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.5);
        }

        /* Preview Box inside card */
        .preview-box {
            background: linear-gradient(135deg, rgba(30,58,138,0.6) 0%, rgba(15,23,42,0.8) 100%);
            height: 220px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Exact Scoreboard Graphic Replica matching the screenshot */
        .exact-scoreboard {
            width: 310px;
            background: #0f172a;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .score-row {
            display: grid;
            grid-template-columns: 8px 1fr 45px 55px;
            height: 38px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .score-row:last-child {
            border-bottom: none;
        }

        /* Left Accent strip */
        .strip-blue { background: #38bdf8; height: 100%; }
        .strip-empty { background: transparent; height: 100%; }

        /* Team Name & Serve Indicator */
        .team-info {
            padding-left: 10px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .serve-arrow {
            width: 0; 
            height: 0; 
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 8px solid #f59e0b;
        }

        /* Middle Score */
        .mid-score {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #cbd5e1;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Right Purple Box Score */
        .purple-score {
            background: #7c3aed;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover button effect */
        .use-template-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--accent);
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .overlay-card:hover .use-template-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .overlay-card:hover .exact-scoreboard {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="video-bg-container">
        <video autoplay muted loop playsinline>
            <source src="table tennis video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay-gradient"></div>
    </div>

    <div class="container">
        
        <div class="header-top">
            <a href="/" class="back-btn">←</a>
            <div class="title-group">
                <div class="step-indicator">Step 2 of 5</div>
                <h1>Select an Overlay for Table Tennis</h1>
                <p>Choose the active overlay design for your stream</p>
            </div>
        </div>

        <div class="search-bar-container">
            <div class="search-input-wrapper">
                <span>🔍</span>
                <input type="text" placeholder="Search templates (1 available)">
            </div>
        </div>

        <div class="overlays-grid">
            <a href="tt-panel.html" class="overlay-card">
                <h3>Purple Elite</h3>
                <div class="preview-box">
                    
                    <div class="exact-scoreboard">
                        <div class="score-row">
                            <div class="strip-blue"></div>
                            <div class="team-info">
                                PHANTOM STARS <div class="serve-arrow"></div>
                            </div>
                            <div class="mid-score">0</div>
                            <div class="purple-score">0</div>
                        </div>
                        <div class="score-row">
                            <div class="strip-empty"></div>
                            <div class="team-info">MUMBAI MOZARTT</div>
                            <div class="mid-score">0</div>
                            <div class="purple-score">0</div>
                        </div>
                    </div>

                    <div class="use-template-btn">+ Use This Template</div>
                </div>
            </a>
        </div>

    </div>

</body>
</html>
