<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Templates</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .template-card {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            margin: 20px;
            border: 1px solid #444;
            transition: 0.3s;
        }
        .template-card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .template-card a { color: #00ff88; text-decoration: none; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Select a Table Tennis Template</h2>
    
    <div class="template-card">
        <h3>Template 1 (Classic)</h3>
        <p>Simple blue and red theme</p>
        <!-- Yeh button aapke banaye hue control panel par le jayega -->
        <a href="/tt-panel">Use This Template ➔</a> 
    </div>

    <!-- Future mein yahan aur templates add kar sakte hain -->

</body>
</html>
