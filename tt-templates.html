<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Overlay - Scorvix</title>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 🌟 Animated Background 🌟 */
        .bg-animations {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden;
        }
        
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: pulseGlow 8s infinite alternate;
        }
        .glow-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #10b981; }
        .glow-2 { bottom: -20%; right: -10%; width: 600px; height: 600px; background: #3b82f6; }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.4; }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Top Header Section */
        .header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 45px; height: 45px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .title-group .step-indicator {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title-group h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Search Bar (Optional kept minimal) */
        .search-bar-container {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            width: 100%;
            outline: none;
        }
        .search-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        /* Single Overlay Grid Layout */
        .overlays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 25px;
        }

        .overlay-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .overlay-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .overlay-card h3 {
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Preview Box inside card */
        .preview-box {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            height: 220px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Simulated Scoreboard graphic */
        .simulated-scoreboard {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .team-name { color: white; display: flex; align-items: center; gap: 6px; }
        .score-box { background: #000; padding: 2px 8px; border-radius: 3px; color: #10b981; }

        /* Hover button effect */
        .use-template-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--accent);
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .overlay-card:hover .use-template-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .overlay-card:hover .simulated-scoreboard {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- 🌟 Animated Background 🌟 -->
    <div class="bg-animations">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="container">
        
        <!-- Header Top -->
        <div class="header-top">
            <a href="/" class="back-btn">←</a>
            <div class="title-group">
                <div class="step-indicator">Step 2 of 5</div>
                <h1>Select an Overlay for Table Tennis</h1>
                <p>Choose the active overlay design for your stream</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar-container">
            <div class="search-input-wrapper">
                <span>🔍</span>
                <input type="text" placeholder="Search templates (1 available)">
            </div>
        </div>

        <!-- Overlays Grid (Single Box) -->
        <div class="overlays-grid">
            
            <!-- Active Table Tennis Template Card -->
            <a href="/table-tennis-scoreboard" class="overlay-card">
                <h3>Pro Stream Overlay (Classic Dark)</h3>
                <div class="preview-box">
                    <div class="simulated-scoreboard">
                        <div class="team-row"><span class="team-name">🏓 Player A</span><span class="score-box">0</span></div>
                        <div class="team-row"><span class="team-name">🏓 Player B</span><span class="score-box">0</span></div>
                    </div>
                    <div class="use-template-btn">+ Use This Template</div>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
