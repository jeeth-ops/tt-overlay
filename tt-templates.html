<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Compact Table Tennis Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* 🖥️ Desktop 1920x1080 Fit: No Scroll View 🖥️ */
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            overflow: hidden; /* Scroll bilkul nahi aayega, 1080p mein fit rahega */
        }

        /* Background Video */
        .bg-animations {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -999; overflow: hidden;
            background-color: var(--bg-dark);
            pointer-events: none;
        }
        .bg-video {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: blur(12px) brightness(0.4);
            opacity: 0.35;
        }

        /* Top Header */
        header {
            text-align: center;
            margin-bottom: 5px;
        }
        header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        header h1 span { color: var(--accent); }
        header p { font-size: 0.8rem; color: var(--text-muted); }

        /* Main Control Board Container (Compact for 1080p) */
        .control-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: auto 0;
        }

        /* Team Control Box */
        .team-box {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .team-box h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .team-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .team-input:focus { border-color: var(--accent); }

        /* Score Control */
        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: white;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .ctrl-btn.add { background: var(--accent); }
        .ctrl-btn.add:hover { background: var(--accent-hover); }

        /* Center Match Actions (Reset / Sets) */
        .match-actions {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .action-btn:hover { color: white; border-color: white; }

        /* 📱 Mobile Responsive View 📱 */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* Mobile par agar choti screen ho toh scroll chalega */
                height: auto;
                padding: 10px;
            }
            .control-wrapper {
                grid-template-columns: 1fr;
                gap: 15px;
                margin: 20px 0;
            }
            .score-display { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="bg-animations">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="Sequence 04.mp4" type="video/mp4">
        </video>
    </div>

    <header>
        <h1>Scor<span>vix</span> Controller</h1>
        <p>Table Tennis Live Score Manager</p>
    </header>

    <div class="control-wrapper">
        <div class="team-box">
            <h2>Player / Team 1</h2>
            <input type="text" id="teamA-name" class="team-input" value="Player A" placeholder="Enter Name">
            <div class="score-display" id="scoreA">0</div>
            <div class="btn-group">
                <button class="ctrl-btn" onclick="updateScore('A', -1)">-</button>
                <button class="ctrl-btn add" onclick="updateScore('A', 1)">+</button>
            </div>
        </div>

        <div class="team-box">
            <h2>Player / Team 2</h2>
            <input type="text" id="teamB-name" class="team-input" value="Player B" placeholder="Enter Name">
            <div class="score-display" id="scoreB">0</div>
            <div class="btn-group">
                <button class="ctrl-btn" onclick="updateScore('B', -1)">-</button>
                <button class="ctrl-btn add" onclick="updateScore('B', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="match-actions">
        <button class="action-btn" onclick="resetScores()">🔄 Reset Scores</button>
        <span style="font-size: 0.85rem; color: var(--text-muted);">Status: Live Overlay Connected</span>
        <button class="action-btn" onclick="window.location.href='/'">🏠 Home</button>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;

        function updateScore(team, val) {
            if (team === 'A') {
                scoreA = Math.max(0, scoreA + val);
                document.getElementById('scoreA').innerText = scoreA;
            } else {
                scoreB = Math.max(0, scoreB + val);
                document.getElementById('scoreB').innerText = scoreB;
            }
        }

        function resetScores() {
            scoreA = 0;
            scoreB = 0;
            document.getElementById('scoreA').innerText = 0;
            document.getElementById('scoreB').innerText = 0;
        }
    </script>
</body>
</html>
