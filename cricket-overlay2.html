<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    /* ---- fully editable via the controller's colour pickers ---- */
    --team-a:      #17337a;   /* Team A colour  -> left side of the centre gradient */
    --team-b:      #7a1620;   /* Team B colour  -> right side of the centre gradient */
    --badge:       #ff7a1a;   /* "Overs badge" colour -> the big score chip        */
    --bottombar:   #0a1330;   /* "Bottom bar" colour  -> centre segment base tone   */
    --progress:    #f0b429;   /* "Progress bar" colour -> gold accents / run rate   */

    /* fixed look, matches the reference photo */
    --cream-1: #fbfbf6;
    --cream-2: #e7e6dc;
    --navy: #142268;
    --navy-soft: #3a4680;
    --grey: #8891ab;
    --white: #ffffff;
    --gap: 10px;
    --seg-h: 106px;
    font-size: 16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; background:transparent; overflow:hidden; }
  body{ font-family:'Poppins',sans-serif; }

  #stage{
    position:fixed; left:0; right:0; bottom:34px;
    display:flex; justify-content:center; align-items:flex-end;
    pointer-events:none;
  }

  /* ===================== MAIN SCORE BUG ===================== */
  #scorebug{
    display:flex; align-items:center; gap:var(--gap);
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.45));
  }
  .seg{
    height:var(--seg-h); border-radius:999px; display:flex; align-items:center;
    position:relative; white-space:nowrap;
  }

  /* ---- left: logo + batsmen ---- */
  .seg-left{
    background:linear-gradient(180deg,var(--cream-1),var(--cream-2));
    padding:0 26px 0 58px;
  }
  .seg-right{
    background:linear-gradient(180deg,var(--cream-1),var(--cream-2));
    padding:0 58px 0 26px;
  }
  .logo-wrap{
    position:absolute; top:50%; transform:translateY(-50%);
    width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #dcdde3);
    border:4px solid #fff; box-shadow:0 6px 14px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; z-index:3;
  }
  .logo-left{ left:-24px; }
  .logo-right{ right:-24px; }
  .logo-wrap img{ width:100%; height:100%; object-fit:cover; }
  .logo-fallback{ font-weight:900; font-size:19px; color:#fff; letter-spacing:.5px; }

  .batsmen{ display:flex; flex-direction:column; gap:6px; }
  .bline{ display:flex; align-items:baseline; gap:9px; color:var(--navy); }
  .bline .arrow{ width:11px; color:var(--progress); font-size:13px; flex:none; }
  .bline .bname{ font-weight:800; font-size:16px; letter-spacing:.2px; min-width:150px; text-transform:uppercase; }
  .bline .bruns{ font-weight:900; font-size:19px; min-width:26px; text-align:right; }
  .bline .bballs{ font-weight:600; font-size:12px; color:var(--grey); min-width:20px; }
  .bline:not(.onstrike){ opacity:.72; }
  .bline:not(.onstrike) .arrow{ visibility:hidden; }

  .bowler{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; margin-right:16px; }
  .bowler-name{ font-weight:800; font-size:16px; color:var(--navy); text-transform:uppercase; letter-spacing:.3px; }
  .bowler-figs{ display:flex; align-items:baseline; gap:8px; }
  .bowler-figs .figs{ font-weight:900; font-size:19px; color:var(--navy); }
  .bowler-figs .ov{ font-weight:600; font-size:12px; color:var(--grey); }

  .pips{ display:flex; gap:5px; margin-right:16px; }
  .pip{
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#fff; background:transparent; border:2px solid var(--navy-soft);
  }
  .pip.empty{ background:transparent; border-color:#c7cadd; }
  .pip.dot{ background:var(--navy-soft); }
  .pip.dot::after{ content:''; width:5px; height:5px; border-radius:50%; background:#fff; }
  .pip.run{ background:var(--navy-soft); }
  .pip.four{ background:#1fa463; border-color:#1fa463; }
  .pip.six{ background:var(--progress); border-color:var(--progress); color:#3a2900; }
  .pip.wicket{ background:#d5364b; border-color:#d5364b; }
  .pip.extra{ background:transparent; border-color:var(--progress); color:var(--progress); }

  /* ---- centre: match state ---- */
  .seg-center{
    background:linear-gradient(90deg,var(--team-a),var(--bottombar) 46%,var(--bottombar) 54%,var(--team-b));
    padding:0 30px; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-width:420px;
  }
  .center-top{ display:flex; align-items:center; gap:12px; }
  .match-code{ color:#fff; font-weight:700; font-size:14px; letter-spacing:.4px; opacity:.9; }
  .match-code b{ color:var(--progress); }
  .score-chip{
    background:linear-gradient(135deg,var(--badge),#c23a24);
    color:#fff; font-weight:900; font-size:30px; letter-spacing:.5px;
    padding:2px 18px; border-radius:999px; line-height:1.25;
  }
  .phase-badge{
    background:#fff; color:var(--navy); font-weight:800; font-size:12px;
    padding:4px 11px; border-radius:999px; letter-spacing:.3px;
  }
  .overs-text{ color:#fff; font-weight:800; font-size:20px; letter-spacing:.3px; }
  .center-bottom{
    color:var(--progress); font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase;
  }

  /* ===================== FREE HIT BANNER ===================== */
  #freehit-banner{
    position:fixed; left:50%; bottom:158px; transform:translateX(-50%);
    background:linear-gradient(135deg,var(--progress),#c98a10); color:#241a02;
    font-weight:900; font-size:15px; letter-spacing:.8px; padding:9px 22px;
    border-radius:999px; box-shadow:0 8px 18px rgba(0,0,0,.4); opacity:0; pointer-events:none;
  }

  /* ===================== EVENT BANNER ===================== */
  #event-banner{
    position:fixed; left:50%; top:12%; transform:translateX(-50%);
    text-align:center; opacity:0; pointer-events:none;
  }
  #event-banner .ev-text{
    background:linear-gradient(90deg,var(--team-a),var(--bottombar),var(--team-b));
    color:#fff; font-weight:900; font-size:34px; letter-spacing:2px; text-transform:uppercase;
    padding:14px 46px; border-radius:16px; box-shadow:0 14px 30px rgba(0,0,0,.5);
  }
  #event-banner .ev-sub{
    margin-top:8px; color:var(--progress); font-weight:700; font-size:16px; letter-spacing:1px;
  }

  /* ===================== SUMMARY CARDS (scorecard-themed) ===================== */
  /* Palette pulled straight from the score bug's own CSS vars, so a colour
     change on the bug re-skins these cards automatically — same "kit". */
  .summary-card{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    width:660px; max-width:92vw; border-radius:20px; overflow:hidden;
    background:linear-gradient(180deg,var(--cream-1),var(--cream-2));
    box-shadow:0 28px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.4) inset;
    opacity:0; pointer-events:none; font-family:'Poppins',sans-serif;
  }
  .summary-card .sc-inner{ position:relative; }

  /* -- top strip: flags + competition tag, gradient lifted from the centre segment -- */
  .sc-topbar{
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(90deg,var(--team-a),var(--bottombar) 46%,var(--bottombar) 54%,var(--team-b));
    padding:10px 18px;
  }
  .sc-flag{
    width:30px; height:20px; border-radius:4px; overflow:hidden; flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center;
  }
  .sc-flag img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sc-flag .fb{ font-size:9px; font-weight:900; color:#fff; }
  .sc-tag{
    background:var(--badge); color:#fff; font-weight:800; font-size:11px; letter-spacing:1.2px;
    padding:5px 16px; border-radius:999px; text-transform:uppercase; box-shadow:0 3px 8px rgba(0,0,0,.35);
  }

  /* -- team header row -- */
  .sc-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 26px 4px; background:linear-gradient(180deg,var(--cream-1),var(--cream-2));
  }
  .sc-tname{ font-weight:900; font-size:21px; color:var(--navy); text-transform:uppercase; letter-spacing:.2px; line-height:1.15; }
  .sc-tname.right{ text-align:right; }
  .sc-trophy{
    flex:none; width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff9e0,var(--progress));
    display:flex; align-items:center; justify-content:center; font-size:17px;
    box-shadow:0 4px 12px rgba(0,0,0,.3), 0 0 0 3px #fff inset;
  }
  .sc-venue{
    text-align:center; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--grey);
    text-transform:uppercase; padding:2px 20px 12px;
  }

  /* -- accent bands (score / overs strips) -- */
  .sc-band{ display:flex; }
  .sc-band > div{
    flex:1; padding:9px 22px; font-weight:900; color:#fff;
    background:linear-gradient(90deg,var(--badge),color-mix(in srgb, var(--badge) 65%, #000));
  }
  .sc-band > div + div{ background:linear-gradient(90deg,color-mix(in srgb, var(--badge) 65%, #000),var(--badge)); }
  .sc-band .big{ font-size:22px; letter-spacing:.4px; }
  .sc-band .small{ font-size:13px; letter-spacing:.6px; text-transform:uppercase; }
  .sc-band .right{ text-align:right; }

  /* -- two column stat lists (batsmen / bowlers) -- */
  .sc-cols{ display:flex; }
  .sc-col{ flex:1; padding:6px 0; }
  .sc-col + .sc-col{ border-left:1px solid #d8d7cc; }
  .sc-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    padding:6px 20px; font-family:'Inter',sans-serif;
  }
  .sc-row:nth-child(even){ background:rgba(20,34,104,.045); }
  .sc-row .nm{ font-weight:700; font-size:13px; color:var(--navy); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sc-row .dm{ display:block; font-weight:500; font-size:10px; color:var(--grey); text-transform:none; letter-spacing:.2px; }
  .sc-row .vv{ font-weight:800; font-size:14px; color:var(--navy); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .sc-row .vv i{ font-style:normal; font-weight:600; font-size:11px; color:var(--grey); margin-left:2px; }
  .sc-row.not-out .nm{ color:var(--navy); }
  .sc-row.not-out .nm-text::after{ content:'*'; color:var(--progress); font-weight:900; }
  .sc-row.best .vv{ color:color-mix(in srgb, var(--badge) 80%, #000); }

  /* -- fall of wickets strip -- */
  .sc-fow{
    padding:10px 22px 4px; font-family:'Inter',sans-serif;
  }
  .sc-fow .lbl{ font-size:10px; font-weight:800; letter-spacing:1px; color:var(--grey); text-transform:uppercase; margin-bottom:5px; }
  .sc-fow .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .sc-fow .chip{
    font-size:11px; font-weight:700; color:var(--navy); background:#fff; border:1px solid #d8d7cc;
    border-radius:999px; padding:3px 9px; white-space:nowrap;
  }
  .sc-fow .chip b{ color:var(--badge); }

  /* -- result / total banner -- */
  .sc-resultband{
    text-align:center; color:#fff; font-weight:900; font-size:16px; letter-spacing:1px;
    text-transform:uppercase; padding:13px 20px;
    background:linear-gradient(90deg,var(--team-a),var(--bottombar) 46%,var(--bottombar) 54%,var(--team-b));
  }
  .sc-section-title{
    font-size:11px; font-weight:800; letter-spacing:1.2px; color:#fff; text-transform:uppercase;
    padding:8px 22px; background:var(--bottombar);
  }

  /* -- ambient life: shimmer sweep on the top strip, soft pulse on the trophy -- */
  .sc-topbar{ position:relative; overflow:hidden; }
  .sc-topbar::after{
    content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.28),transparent);
    animation:sc-shimmer 3.4s ease-in-out infinite;
  }
  @keyframes sc-shimmer{ 0%{ left:-60%; } 55%{ left:130%; } 100%{ left:130%; } }
  .sc-trophy{ animation:sc-trophy-pulse 2.4s ease-in-out infinite; }
  @keyframes sc-trophy-pulse{
    0%,100%{ box-shadow:0 4px 12px rgba(0,0,0,.3), 0 0 0 3px #fff inset, 0 0 0 0 color-mix(in srgb, var(--progress) 55%, transparent); }
    50%{ box-shadow:0 4px 12px rgba(0,0,0,.3), 0 0 0 3px #fff inset, 0 0 0 9px color-mix(in srgb, var(--progress) 0%, transparent); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="scorebug">
    <div class="seg seg-left" id="segLeft">
      <div class="logo-wrap logo-left" id="logoBatting"></div>
      <div class="batsmen">
        <div class="bline" id="lineNonStriker">
          <span class="arrow">▸</span><span class="bname"></span><span class="bruns"></span><span class="bballs"></span>
        </div>
        <div class="bline onstrike" id="lineStriker">
          <span class="arrow">▸</span><span class="bname"></span><span class="bruns"></span><span class="bballs"></span>
        </div>
      </div>
    </div>

    <div class="seg seg-center" id="segCenter">
      <div class="center-top">
        <span class="match-code" id="matchCode"></span>
        <span class="score-chip" id="scoreChip"></span>
        <span class="phase-badge" id="phaseBadge"></span>
        <span class="overs-text" id="oversText"></span>
      </div>
      <div class="center-bottom" id="rateLine"></div>
    </div>

    <div class="seg seg-right" id="segRight">
      <div class="bowler">
        <div class="bowler-name" id="bowlerName"></div>
        <div class="bowler-figs"><span class="figs" id="bowlerFigs"></span><span class="ov" id="bowlerOvers"></span></div>
      </div>
      <div class="pips" id="overPips"></div>
      <div class="logo-wrap logo-right" id="logoBowling"></div>
    </div>
  </div>
</div>

<div id="freehit-banner">⚡ FREE HIT IN PLAY</div>

<div id="event-banner">
  <div class="ev-text" id="evText"></div>
  <div class="ev-sub" id="evSub"></div>
</div>

<div class="summary-card" id="inningsCard"></div>
<div class="summary-card" id="matchCard"></div>

<script>
/* ============================================================
   STATE + FORMAT RULES  (mirrors the controller panel)
   ============================================================ */
const FORMAT_RULES = {
  T20:   { oversPerInnings: 20, powerplayEnd: 6  },
  ODI:   { oversPerInnings: 50, powerplayEnd: 10 },
  Test:  { oversPerInnings: null, powerplayEnd: null },
  Custom:{ oversPerInnings: 20, powerplayEnd: 6  }
};

function defaultState(){
  return {
    format:'T20', customOvers:20, venue:'',
    teamA:{ name:'Team A', short:'A', color:'#17337a', logoUrl:'' },
    teamB:{ name:'Team B', short:'B', color:'#7a1620', logoUrl:'' },
    theme:{ badgeColor:'#ff7a1a', bottomBarColor:'#0a1330', progressColor:'#f0b429' },
    battingTeam:'A', score:{ runs:0, wickets:0, overs:0, balls:0 }, target:null,
    striker:{ name:'', runs:0, balls:0 }, nonStriker:{ name:'', runs:0, balls:0 },
    bowler:{ name:'', overs:0, balls:0, runs:0, wickets:0 },
    thisOver:[], visible:true, freeHit:false
  };
}
let state = defaultState();

function fmtOvers(o,b){ return `${o||0}.${b||0}`; }
function bowlingTeamKey(){ return state.battingTeam === 'A' ? 'B' : 'A'; }
function calcCRR(){
  const tb = state.score.overs*6 + state.score.balls;
  return tb === 0 ? 0 : state.score.runs / (tb/6);
}
function ballsPerInnings(){
  const r = state.format === 'Custom' ? { oversPerInnings: state.customOvers } : FORMAT_RULES[state.format];
  return r.oversPerInnings ? r.oversPerInnings*6 : null;
}
function calcRRR(){
  if(!state.target) return null;
  const total = ballsPerInnings(); if(!total) return null;
  const left = total - (state.score.overs*6 + state.score.balls);
  if(left <= 0) return null;
  return (state.target - state.score.runs) / (left/6);
}
function computePhase(){
  const rules = state.format === 'Custom' ? { ...FORMAT_RULES.Custom, oversPerInnings: state.customOvers } : FORMAT_RULES[state.format];
  if(!rules.oversPerInnings) return null;
  const oversSoFar = state.score.overs + state.score.balls/6;
  const pp = rules.powerplayEnd || Math.round(rules.oversPerInnings*.3);
  if(oversSoFar < pp) return 'P1';
  if(oversSoFar < rules.oversPerInnings*.8) return 'P2';
  return 'P3';
}

/* ============================================================
   TEXT REVEAL HELPER — "Apple style": soft blur + rise + fade,
   staggered across the words of an element.
   ============================================================ */
function splitWords(el){
  const text = el.dataset.raw !== undefined ? el.dataset.raw : el.textContent;
  el.dataset.raw = text;
  el.innerHTML = text.split(' ').map(w => `<span class="w" style="display:inline-block">${w}&nbsp;</span>`).join('');
  return el.querySelectorAll('.w');
}
function revealTexts(container, tl, pos){
  const words = [];
  container.querySelectorAll('[data-anim]').forEach(el => words.push(...splitWords(el)));
  tl.fromTo(words,
    { opacity:0, y:10, filter:'blur(6px)' },
    { opacity:1, y:0, filter:'blur(0px)', duration:.5, ease:'power3.out', stagger:.028 },
    pos
  );
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function flagChip(team){
  if(team && team.logoUrl) return `<img src="${team.logoUrl}" alt="">`;
  return `<span class="fb">${escapeHtml((team && team.short) || '').slice(0,3)}</span>`;
}
function parseScoreStr(s){
  if(!s) return { main:'—', overs:'' };
  const m = String(s).match(/^(.*?)\s*\((.*?)\s*ov\)\s*$/i);
  if(m) return { main:m[1].trim(), overs:m[2].trim() };
  return { main:String(s).trim(), overs:'' };
}

/* ============================================================
   MAIN SCOREBUG — build once, play forward to show / reverse to hide
   ============================================================ */
let bugTL = null;
function buildBugTimeline(){
  const tl = gsap.timeline({ paused:true });
  gsap.set('#logoBatting,#logoBowling', { scale:0, opacity:0 });
  gsap.set('#segLeft,#segRight', { opacity:0, scale:.85 });
  gsap.set('#segCenter', { opacity:0, scale:.8, y:8 });

  tl.to('#logoBatting,#logoBowling', { scale:1, opacity:1, duration:.4, ease:'back.out(2)' }, 0);
  tl.to('#segCenter', { opacity:1, scale:1, y:0, duration:.4, ease:'power3.out' }, .18);
  tl.to('#segLeft,#segRight', { opacity:1, scale:1, duration:.4, ease:'power3.out' }, .3);

  revealTexts(document.getElementById('segCenter'), tl, .42);
  revealTexts(document.getElementById('segLeft'), tl, .5);
  revealTexts(document.getElementById('segRight'), tl, .5);
  return tl;
}
function showBug(){ if(bugTL) bugTL.timeScale(1).play(); }
function hideBug(){ if(bugTL) bugTL.timeScale(1.25).reverse(); }

/* ============================================================
   RENDER
   ============================================================ */
function teamLogo(el, team){
  el.innerHTML = team.logoUrl
    ? `<img src="${team.logoUrl}" alt="${team.short}">`
    : `<div class="logo-fallback" style="background:${team.color}">${(team.short||'').slice(0,3)}</div>`;
  if(!team.logoUrl){
    el.querySelector('.logo-fallback').style.cssText += 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;';
  }
}

function renderPips(){
  const wrap = document.getElementById('overPips');
  wrap.innerHTML = '';
  const balls = (state.thisOver || []).slice(-6);
  const slots = [...balls, ...Array(6 - balls.length).fill(null)];
  slots.forEach(b => {
    const d = document.createElement('div');
    if(b === null){ d.className = 'pip empty'; }
    else if(b === 'W'){ d.className = 'pip wicket'; d.textContent = 'W'; }
    else if(b === '6'){ d.className = 'pip six'; d.textContent = '6'; }
    else if(b === '4'){ d.className = 'pip four'; d.textContent = '4'; }
    else if(b === '0'){ d.className = 'pip dot'; }
    else if(['Wd','Nb','B','LB'].includes(b)){ d.className = 'pip extra'; d.textContent = b[0]; }
    else { d.className = 'pip run'; d.textContent = b; }
    wrap.appendChild(d);
  });
}

function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty('--team-a', state.teamA.color || '#17337a');
  r.setProperty('--team-b', state.teamB.color || '#7a1620');
  r.setProperty('--badge', state.theme.badgeColor || '#ff7a1a');
  r.setProperty('--bottombar', state.theme.bottomBarColor || '#0a1330');
  r.setProperty('--progress', state.theme.progressColor || '#f0b429');
}

function render(){
  applyTheme();

  const battingTeam = state.battingTeam === 'A' ? state.teamA : state.teamB;
  const bowlingTeam = state.battingTeam === 'A' ? state.teamB : state.teamA;
  teamLogo(document.getElementById('logoBatting'), battingTeam);
  teamLogo(document.getElementById('logoBowling'), bowlingTeam);

  const setText = (id, val) => {
    const el = document.getElementById(id);
    el.dataset.raw = val;
    el.setAttribute('data-anim','');
    el.textContent = val;
  };

  const ns = document.getElementById('lineNonStriker');
  const st = document.getElementById('lineStriker');
  ns.querySelector('.bname').textContent = (state.nonStriker.name || 'Batsman').toUpperCase();
  ns.querySelector('.bruns').textContent = state.nonStriker.runs || 0;
  ns.querySelector('.bballs').textContent = state.nonStriker.balls || 0;
  st.querySelector('.bname').textContent = (state.striker.name || 'Batsman').toUpperCase();
  st.querySelector('.bruns').textContent = state.striker.runs || 0;
  st.querySelector('.bballs').textContent = state.striker.balls || 0;

  setText('matchCode', `${state.teamA.short || 'A'} v ${state.teamB.short || 'B'}`);
  setText('scoreChip', `${state.score.runs}-${state.score.wickets}`);
  const phase = computePhase();
  document.getElementById('phaseBadge').style.display = phase ? '' : 'none';
  setText('phaseBadge', phase || '');
  setText('oversText', fmtOvers(state.score.overs, state.score.balls));

  const rrr = calcRRR();
  setText('rateLine', rrr !== null ? `REQUIRED RATE ${rrr.toFixed(2)}` : `CURRENT RATE ${calcCRR().toFixed(2)}`);

  document.getElementById('bowlerName').textContent = (state.bowler.name || 'Bowler').toUpperCase();
  document.getElementById('bowlerFigs').textContent = `${state.bowler.wickets||0}-${state.bowler.runs||0}`;
  document.getElementById('bowlerOvers').textContent = fmtOvers(state.bowler.overs, state.bowler.balls);

  renderPips();

  // free hit
  gsap.to('#freehit-banner', { opacity: state.freeHit ? 1 : 0, y: state.freeHit ? 0 : 10, duration:.35, ease:'power2.out' });
}

let bugVisible = false;
function applyVisibility(){
  if(state.visible && !bugVisible){ bugVisible = true; showBug(); }
  else if(!state.visible && bugVisible){ bugVisible = false; hideBug(); }
}

/* ============================================================
   EVENT BANNER (milestones)
   ============================================================ */
let evTL = null;
function playEvent(ev){
  document.getElementById('evText').textContent = ev.text || '';
  document.getElementById('evSub').textContent = ev.sub || '';
  if(evTL) evTL.kill();
  evTL = gsap.timeline();
  evTL.fromTo('#event-banner', { opacity:0, y:-22, scale:.9 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power3.out' });
  revealTexts(document.getElementById('event-banner'), evTL, '-=0.15');
  evTL.to('#event-banner', { opacity:0, y:-14, scale:.94, duration:.4, ease:'power2.in' }, `+=${((ev.durationMs||3500)/1000)}`);
}

/* ============================================================
   SUMMARY CARDS — same "kit" as the score bug (theme vars), same
   build language as the bug: box lands first, then each section
   cascades in one-by-one with the Apple-style blur/rise reveal,
   rows sliding in from their own side of the card.
   ============================================================ */
const summaryTLs = {};
function showSummaryCard(id, html){
  const el = document.getElementById(id);
  if(summaryTLs[id]) summaryTLs[id].kill();
  gsap.killTweensOf(el);
  gsap.killTweensOf(el.querySelectorAll('*'));

  el.innerHTML = `<div class="sc-inner">${html}</div>`;
  gsap.set(el, { display:'block' });
  const inner = el.querySelector('.sc-inner');
  const blocks = [...inner.children];

  const tl = gsap.timeline();
  tl.eventCallback('onReverseComplete', () => gsap.set(el, { display:'none' }));
  summaryTLs[id] = tl;

  // 1) the card itself lands
  tl.fromTo(el, { opacity:0, scale:.86, y:26 }, { opacity:1, scale:1, y:0, duration:.55, ease:'power3.out' });

  // 2) walk the sections top to bottom, each with its own flavour of reveal
  blocks.forEach((block, idx) => {
    const gapPos = idx === 0 ? '-=.18' : '<+.09';

    if(block.classList.contains('sc-topbar')){
      const flags = block.querySelectorAll('.sc-flag');
      tl.fromTo(block, { opacity:0 }, { opacity:1, duration:.25 }, gapPos);
      tl.fromTo(flags, { opacity:0, scale:.4, rotate:-20 }, { opacity:1, scale:1, rotate:0, duration:.5, ease:'back.out(2.5)', stagger:.08 }, '<');
      revealTexts(block, tl, '<+.05');

    } else if(block.classList.contains('sc-header')){
      const trophy = block.querySelector('.sc-trophy');
      tl.fromTo(block, { opacity:0 }, { opacity:1, duration:.3 }, gapPos);
      if(trophy) tl.fromTo(trophy, { opacity:0, scale:0, rotate:-100 }, { opacity:1, scale:1, rotate:0, duration:.6, ease:'back.out(2.6)' }, '<');
      revealTexts(block, tl, '<+.05');

    } else if(block.classList.contains('sc-venue')){
      tl.fromTo(block, { opacity:0 }, { opacity:1, duration:.3 }, gapPos);
      revealTexts(block, tl, '<');

    } else if(block.classList.contains('sc-cols')){
      const cols = [...block.querySelectorAll('.sc-col')];
      const rowGroups = cols.map(c => [...c.querySelectorAll('.sc-row')]);
      const maxLen = rowGroups.reduce((m,r) => Math.max(m, r.length), 0);
      rowGroups.forEach((rows, ci) => {
        gsap.set(rows, { opacity:0, x: ci === 0 ? -22 : 22, filter:'blur(6px)' });
      });
      for(let r = 0; r < maxLen; r++){
        const rp = (idx === 0 && r === 0) ? gapPos : '<+.055';
        rowGroups.forEach(rows => {
          const rowEl = rows[r];
          if(rowEl) tl.to(rowEl, { opacity:1, x:0, filter:'blur(0px)', duration:.38, ease:'power3.out' }, rp);
        });
      }

    } else if(block.classList.contains('sc-band') || block.classList.contains('sc-section-title')){
      tl.fromTo(block, { opacity:0, scaleX:.75 }, { opacity:1, scaleX:1, duration:.4, ease:'power2.out', transformOrigin:'left center' }, gapPos);
      revealTexts(block, tl, '<+.03');

    } else if(block.classList.contains('sc-fow')){
      tl.fromTo(block, { opacity:0 }, { opacity:1, duration:.3 }, gapPos);
      const chips = block.querySelectorAll('.chip');
      tl.fromTo(chips, { opacity:0, y:8, scale:.85 }, { opacity:1, y:0, scale:1, duration:.35, ease:'back.out(2)', stagger:.05 }, '<');
      revealTexts(block, tl, '<');

    } else if(block.classList.contains('sc-resultband')){
      tl.fromTo(block, { opacity:0, y:12 }, { opacity:1, y:0, duration:.5, ease:'power3.out' }, gapPos);
      revealTexts(block, tl, '<+.05');

    } else {
      tl.fromTo(block, { opacity:0, y:8 }, { opacity:1, y:0, duration:.35 }, gapPos);
      revealTexts(block, tl, '<');
    }
  });
}
function hideSummaryCard(id){
  const el = document.getElementById(id);
  const tl = summaryTLs[id];
  if(tl){ tl.timeScale(1.5).reverse(); }
  else { gsap.to(el, { opacity:0, scale:.9, y:12, duration:.35, ease:'power2.in' }); }
}

function inningsSummaryHTML(d){
  const batRows = (d.batsmen || []).map(b => `
    <div class="sc-row${(!b.howOut || b.howOut === 'not out') ? ' not-out' : ''}">
      <span class="nm"><span class="nm-text">${escapeHtml(b.name)}</span><span class="dm">${escapeHtml(b.howOut || 'not out')}</span></span>
      <span class="vv">${b.runs} <i>(${b.balls})</i></span>
    </div>`).join('');

  const bowlRows = (d.bowlers || []).map((b, i) => `
    <div class="sc-row${i === 0 ? ' best' : ''}">
      <span class="nm">${escapeHtml(b.name)}</span>
      <span class="vv">${b.wickets}-${b.runs} <i>(${b.overs} ov · ${b.econ} econ)</i></span>
    </div>`).join('');

  const fowChips = (d.fallOfWickets || []).map(w => `<span class="chip"><b>${w.wkt}</b>-${w.runs} <span style="color:#9096a8;">(${w.over})</span></span>`).join('');

  return `
    <div class="sc-topbar">
      <span class="sc-flag" style="background:${d.battingTeamColor || '#333'}">${flagChip({ logoUrl:d.battingTeamLogo, short:d.battingTeamShort })}</span>
      <span class="sc-tag" data-anim>${escapeHtml(d.format || 'MATCH')} • Innings Summary</span>
      <span class="sc-flag" style="background:${d.bowlingTeamColor || '#333'}">${flagChip({ logoUrl:d.bowlingTeamLogo, short:d.bowlingTeamShort })}</span>
    </div>
    <div class="sc-header">
      <span class="sc-tname left" data-anim>${escapeHtml(d.battingTeamName || 'Batting')}</span>
      <span class="sc-trophy">🏏</span>
      <span class="sc-tname right" data-anim style="color:var(--grey);font-size:15px;">vs ${escapeHtml(d.bowlingTeamName || '')}</span>
    </div>
    <div class="sc-venue" data-anim>${escapeHtml(d.venue || '')}</div>
    <div class="sc-band">
      <div class="big">${escapeHtml(d.total || '0-0')}</div>
      <div class="small right">${escapeHtml(d.overs || '0.0')} OVERS &nbsp;·&nbsp; ${d.extrasTotal || 0} EXTRAS</div>
    </div>
    <div class="sc-cols"><div class="sc-col" style="flex:1 1 100%;">${batRows}</div></div>
    <div class="sc-section-title" data-anim>Bowling — ${escapeHtml(d.bowlingTeamShort || '')}</div>
    <div class="sc-cols"><div class="sc-col" style="flex:1 1 100%;">${bowlRows}</div></div>
    ${fowChips ? `<div class="sc-fow"><div class="lbl" data-anim>Fall of wickets</div><div class="chips">${fowChips}</div></div>` : ''}
  `;
}

function matchSummaryHTML(d){
  const sa = parseScoreStr(d.teamA.score);
  const sb = parseScoreStr(d.teamB.score);
  const batRows = arr => (arr && arr.length ? arr : [{ name:'—', runs:0, balls:0 }])
    .map(b => `<div class="sc-row"><span class="nm">${escapeHtml(b.name)}</span><span class="vv">${b.runs} <i>(${b.balls})</i></span></div>`).join('');
  const bowlRows = arr => (arr && arr.length ? arr : [{ name:'—', figures:'0-0', overs:'0.0' }])
    .map((b, i) => `<div class="sc-row${i === 0 ? ' best' : ''}"><span class="nm">${escapeHtml(b.name)}</span><span class="vv">${escapeHtml(b.figures)} <i>(${b.overs})</i></span></div>`).join('');

  return `
    <div class="sc-topbar">
      <span class="sc-flag" style="background:${d.teamA.color || '#333'}">${flagChip(d.teamA)}</span>
      <span class="sc-tag" data-anim>${escapeHtml(d.format || 'MATCH')} SUMMARY</span>
      <span class="sc-flag" style="background:${d.teamB.color || '#333'}">${flagChip(d.teamB)}</span>
    </div>
    <div class="sc-header">
      <span class="sc-tname left" data-anim>${escapeHtml(d.teamA.name || 'Team A')}</span>
      <span class="sc-trophy">🏆</span>
      <span class="sc-tname right" data-anim>${escapeHtml(d.teamB.name || 'Team B')}</span>
    </div>
    <div class="sc-venue" data-anim>${escapeHtml(d.venue || '')}</div>
    <div class="sc-band">
      <div class="big">${escapeHtml(sa.main)}</div>
      <div class="big right">${escapeHtml(sb.main)}</div>
    </div>
    <div class="sc-cols">
      <div class="sc-col">${batRows(d.teamA.batsmen)}</div>
      <div class="sc-col">${batRows(d.teamB.batsmen)}</div>
    </div>
    <div class="sc-band">
      <div class="small">${sa.overs ? escapeHtml(sa.overs) + ' OVERS' : ''}</div>
      <div class="small right">${sb.overs ? escapeHtml(sb.overs) + ' OVERS' : ''}</div>
    </div>
    <div class="sc-cols">
      <div class="sc-col">${bowlRows(d.teamA.bowlers)}</div>
      <div class="sc-col">${bowlRows(d.teamB.bowlers)}</div>
    </div>
    <div class="sc-resultband" data-anim>${escapeHtml(d.winnerText || '')}</div>
  `;
}

/* ============================================================
   SOCKET
   ============================================================ */
function connect(){
  const matchId = new URLSearchParams(location.search).get('room') || '';
  const socket = io({ query: { uid: matchId } });

  socket.on('connect', () => { /* silent — this is a display-only surface */ });

  socket.on('liveCricketScore', (serverState) => {
    if(!serverState || !Object.keys(serverState).length) return;
    const wasFirstLoad = !bugTL;
    state = {
      ...defaultState(), ...serverState,
      teamA: { ...defaultState().teamA, ...(serverState.teamA||{}) },
      teamB: { ...defaultState().teamB, ...(serverState.teamB||{}) },
      theme: { ...defaultState().theme, ...(serverState.theme||{}) },
      score: { ...defaultState().score, ...(serverState.score||{}) },
      striker: { ...defaultState().striker, ...(serverState.striker||{}) },
      nonStriker: { ...defaultState().nonStriker, ...(serverState.nonStriker||{}) },
      bowler: { ...defaultState().bowler, ...(serverState.bowler||{}) }
    };
    render();
    if(wasFirstLoad){
      bugTL = buildBugTimeline();
      if(state.visible){ bugVisible = true; showBug(); }
    } else {
      applyVisibility();
    }
  });

  socket.on('cricketEvent', (msg) => { if(msg && msg.event) playEvent(msg.event); });
  socket.on('cricketInningsSummary', (msg) => { if(msg && msg.data) showSummaryCard('inningsCard', inningsSummaryHTML(msg.data)); });
  socket.on('cricketHideInningsSummary', () => hideSummaryCard('inningsCard'));
  socket.on('cricketMatchSummary', (msg) => { if(msg && msg.data) showSummaryCard('matchCard', matchSummaryHTML(msg.data)); });
  socket.on('cricketHideMatchSummary', () => hideSummaryCard('matchCard'));
}
