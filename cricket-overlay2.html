<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Overlay 2 — Broadcast Scorebug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/socket.io/socket.io.js" onerror="console.warn('socket.io client not found — this is fine if you are just previewing with ?demo=1')"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
<style>
/* ============================================================
   CRICKET OVERLAY 2 — pixel-matched broadcast scorebug
   Reference: white capsule bar / navy center pill / green-black
   outer border / country flags / bowler + batter info / ball dots.
   Design canvas: 1920x1080, scaled to fit via JS (fitStage()).
   ============================================================ */
:root{
  --navy:        #142463;      /* main text + center pill colour  */
  --navy-2:      #101c4d;      /* darker navy for pill bg gradient */
  --red:         #cf1330;      /* score badge                      */
  --red-2:       #a80f27;
  --blue:        #2e64ac;      /* session / innings badge          */
  --blue-2:      #1f4a86;
  --white:       #ffffff;
  --dim:         #8a93ad;

  --bar-w: 1920px;
  --bar-h: 172px;
  --radius: 82px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; overflow:hidden; background:transparent;
  font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
#stage{
  position:fixed; top:50%; left:50%; width:1920px; height:1080px;
  transform-origin:center center;
  will-change: transform;
}

/* ---------- outer bar shell ---------- */
#scorebar{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:var(--bar-w); height:var(--bar-h);
  display:flex; align-items:stretch;
  background:transparent;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.4));
  will-change: transform, opacity;
}
#scorebar.hidden{ visibility:hidden; }

/* White panels sit flush against each other — no gap, no coloured frame —
   so the whole bar reads as one continuous connected shape. Only the
   outermost corners (far left / far right) are rounded. */
.slot{ position:relative; background:var(--white); overflow:hidden; will-change:transform,clip-path; }
.flag-slot{
  flex:0 0 11.5%;
  display:flex; align-items:center; justify-content:center;
}
.flag-slot.left{ border-radius: var(--radius) 0 0 var(--radius); }
.flag-slot.right{ border-radius: 0 var(--radius) var(--radius) 0; }
.flag-box{
  width:76%; height:70%; border-radius:10px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  background:#e8e8e8;
  transform: translateX(0);
}
.flag-box img{ width:100%; height:100%; object-fit:cover; display:block; }
.flag-fallback{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:25px; letter-spacing:.5px; color:#fff;
}

.info-slot{
  flex:0 0 25.5%;
  display:flex; flex-direction:column; justify-content:center;
  padding:0 34px;
  gap:9px;
  min-width:0;
}

.player-row{
  display:flex; align-items:baseline; gap:14px; line-height:1; min-width:0;
}
.strike-tri{
  width:0; height:0;
  border-top:10px solid transparent; border-bottom:10px solid transparent;
  border-left:16px solid var(--red);
  opacity:0; flex:none; transform:translateX(-4px);
}
.player-row.striker .strike-tri{ opacity:1; }
.player-name{
  font-weight:800; font-size:36px; letter-spacing:.2px; color:var(--navy);
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1 1 auto; min-width:0;
}
.player-runs{ font-weight:900; font-size:38px; color:var(--navy); min-width:44px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
.player-balls{ font-weight:600; font-size:24px; color:var(--navy); opacity:.85; min-width:30px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }

/* right (bowler) slot */
.bowler-row{ display:flex; align-items:baseline; gap:14px; min-width:0; }
.bowler-name{
  font-weight:800; font-size:36px; color:var(--navy); text-transform:uppercase;
  flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bowler-figs{ font-weight:900; font-size:35px; color:var(--navy); font-variant-numeric:tabular-nums; flex:none; }
.bowler-overs{ font-weight:600; font-size:24px; color:var(--navy); opacity:.85; font-variant-numeric:tabular-nums; flex:none; }

.recent-balls{ display:flex; align-items:center; gap:12px; margin-top:5px; }
.ball-pip{
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; color:#fff;
  border:3px solid var(--navy); background:transparent;
  flex:none; transform:scale(1); will-change:transform,opacity;
}
.ball-pip.empty{ background:transparent; }
.ball-pip.dot::after{ content:''; width:10px; height:10px; border-radius:50%; background:var(--navy); }
.ball-pip.run{ background:var(--navy); color:#fff; }
.ball-pip.wicket{ background:var(--red); border-color:var(--red); color:#fff; }
.ball-pip.extra{ background:#c8781a; border-color:#c8781a; color:#fff; font-size:14px; }

/* ---------- center capsule ---------- */
.center-slot{
  flex:0 0 26%;
  display:flex; align-items:center; justify-content:center;
  background:transparent;
}
#capsule{
  position:relative;
  width:100%; height:120%;
  border-radius:50px;
  background:linear-gradient(180deg,var(--navy),var(--navy-2));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; padding:0 14px; overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
  will-change:transform,clip-path;
}
.capsule-top{ display:flex; align-items:center; gap:12px; flex-wrap:nowrap; white-space:nowrap; }
.vs-text{ color:#c9d3ef; font-weight:700; font-size:24px; letter-spacing:.3px; text-transform:uppercase; white-space:nowrap; flex:none; }
.vs-text b{ color:#fff; font-weight:900; font-size:30px; margin:0 3px; }
.score-badge{
  background:linear-gradient(180deg,#e0243f,var(--red-2));
  color:#fff; font-weight:900; font-size:31px; letter-spacing:.3px;
  padding:6px 20px; border-radius:30px; font-variant-numeric:tabular-nums;
  white-space:nowrap; flex:none;
}
.innings-badge{
  background:linear-gradient(180deg,#3d76c9,var(--blue-2));
  color:#fff; font-weight:800; font-size:20px; padding:4px 15px; border-radius:22px;
  white-space:nowrap; flex:none;
}
.overs-badge{ color:#fff; font-weight:900; font-size:31px; font-variant-numeric:tabular-nums; white-space:nowrap; flex:none; }
.rate-line{
  color:#fff; font-weight:700; font-size:19px; letter-spacing:.6px; text-transform:uppercase;
  opacity:.95; white-space:nowrap;
}
.rate-line b{ font-weight:900; }

/* free hit chip */
.freehit-chip{
  position:absolute; top:-18px; left:50%; transform:translateX(-50%) scale(0);
  background:#facc15; color:#241d02; font-weight:900; font-size:14px;
  padding:4px 13px; border-radius:14px; letter-spacing:.5px; white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.freehit-chip.show{ transform:translateX(-50%) scale(1); }

/* ============================================================
   EVENT BANNER (FOUR / SIX / WICKET / milestones etc.)
   ============================================================ */
#event-banner{
  position:absolute; left:50%; bottom:190px; transform:translateX(-50%) translateY(14px) scale(.92);
  opacity:0; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:14px 34px; border-radius:16px;
  background:linear-gradient(180deg,var(--navy),var(--navy-2));
  box-shadow:0 10px 24px rgba(0,0,0,.4);
  will-change:transform,opacity;
}
#event-banner .kind{ color:#fff; font-weight:900; font-size:30px; letter-spacing:1px; text-transform:uppercase; }
#event-banner .sub{ color:#c9d3ef; font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.4px; }
#event-banner.kind-FOUR .kind, #event-banner.kind-SIX .kind{ color:#ffd23f; }
#event-banner.kind-WICKET{ background:linear-gradient(180deg,var(--red),var(--red-2)); }
#event-banner.kind-VICTORY, #event-banner.kind-HUNDRED, #event-banner.kind-FIFTY{ background:linear-gradient(180deg,#1c8a4a,#0d5c30); }

/* ============================================================
   SUMMARY CARDS (Innings / Match)
   ============================================================ */
.summary-wrap{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.94);
  opacity:0; pointer-events:none;
  width:1220px; border-radius:28px; overflow:hidden;
  background:#0c1330; box-shadow:0 32px 80px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.08);
  will-change:transform,opacity;
}
.summary-head{
  padding:28px 40px 20px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(90deg, var(--accent-1,#142463), var(--accent-2,#101c4d));
}
.summary-head .title{ color:#fff; font-weight:900; font-size:30px; letter-spacing:.5px; text-transform:uppercase; }
.summary-head .meta{ color:#c9d3ef; font-weight:600; font-size:17px; }
.summary-body{ padding:24px 40px 34px; }
.summary-table{ width:100%; border-collapse:collapse; }
.summary-table th{
  text-align:left; font-size:15px; text-transform:uppercase; letter-spacing:.4px;
  color:#8a93ad; font-weight:700; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.12);
}
.summary-table td{
  padding:11px 10px; font-size:19px; color:#fff; font-weight:600;
  border-bottom:1px solid rgba(255,255,255,.06); font-variant-numeric:tabular-nums;
}
.summary-table td.name{ font-weight:800; text-transform:uppercase; }
.summary-table td.num{ text-align:right; }
.summary-foot{ display:flex; justify-content:space-between; margin-top:14px; color:#c9d3ef; font-size:17px; font-weight:700; }
.summary-tabs{ display:flex; gap:10px; margin-top:10px; }
.summary-tab{
  font-size:14px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#8a93ad;
  padding:6px 14px; border-radius:12px; background:rgba(255,255,255,.06);
}
.summary-tab.active{ color:#0c1330; background:#fff; }

.match-teams{ display:flex; gap:24px; }
.match-team{ flex:1; background:rgba(255,255,255,.04); border-radius:18px; padding:22px; }
.match-team .tname{ font-weight:900; font-size:21px; color:#fff; text-transform:uppercase; }
.match-team .tscore{ font-weight:700; font-size:17px; color:#c9d3ef; margin-top:3px; }
.match-team .row{ display:flex; justify-content:space-between; font-size:17px; color:#e5e9f7; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.match-winner{
  text-align:center; padding:18px; font-weight:900; font-size:25px; letter-spacing:.5px;
  color:#fff; text-transform:uppercase; background:rgba(255,255,255,.06); border-radius:16px; margin-bottom:18px;
}

/* ============================================================
   PREMIUM GLASSMORPHISM BACKDROP — shown behind any summary
   panel. Blurs/dims whatever sits beneath this browser source
   (in-page content, and — where the compositor supports it —
   layers under it) while keeping panels themselves crisp.
   ============================================================ */
#summary-glass{
  position:absolute; inset:0; z-index:5;
  opacity:0; pointer-events:none;
  background:rgba(6,10,26,.28);
  backdrop-filter:blur(0px) saturate(1);
  -webkit-backdrop-filter:blur(0px) saturate(1);
  transition:none;
  will-change:opacity,backdrop-filter;
}
.summary-wrap{ z-index:6; }

/* ============================================================
   FULL-SCREEN CENTER EVENT GRAPHICS (fx-stage)
   Broadcast-style momentary graphics: FOUR / SIX / WICKET /
   NO BALL / FREE HIT / WIDE. Everything here only animates
   transform + opacity for GPU-cheap 60-120fps compositing.
   ============================================================ */
#fx-stage{
  position:absolute; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; overflow:hidden;
}
.fx-root{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.fx-center{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }

.fx-title{
  font-weight:900; letter-spacing:2px; text-transform:uppercase; color:#fff;
  font-size:150px; line-height:1; white-space:nowrap;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.55));
  will-change:transform,opacity;
}
.fx-title .ch{ display:inline-block; will-change:transform,opacity; }
.fx-sub{
  font-weight:800; letter-spacing:6px; text-transform:uppercase; color:#fff;
  font-size:26px; opacity:.9; will-change:transform,opacity;
}

/* -- FOUR: motion streaks racing to center + clean gold type -- */
.fx-four .fx-title{ color:#ffd23f; -webkit-text-stroke:2px rgba(20,36,99,.5); }
.fx-streak{
  position:absolute; top:50%; height:6px; border-radius:4px;
  background:linear-gradient(90deg, transparent, #ffd23f, #fff, #ffd23f, transparent);
  will-change:transform,opacity; opacity:0;
}
.fx-dot{ position:absolute; width:8px; height:8px; border-radius:50%; background:#ffd23f; opacity:0; will-change:transform,opacity; box-shadow:0 0 10px 2px rgba(255,210,63,.7); }

/* -- SIX: shockwave ring + rotating light trails, biggest moment -- */
.fx-six .fx-title{ font-size:210px; color:#ffd23f; -webkit-text-stroke:3px rgba(20,36,99,.55); }
.fx-ring{
  position:absolute; border-radius:50%; border:6px solid rgba(255,210,63,.75);
  opacity:0; will-change:transform,opacity;
}
.fx-trail{
  position:absolute; width:3px; border-radius:3px;
  background:linear-gradient(180deg, transparent, #ffd23f, transparent);
  opacity:0; will-change:transform,opacity; transform-origin:center bottom;
}
.fx-spark{ position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; opacity:0; will-change:transform,opacity; box-shadow:0 0 12px 3px rgba(255,255,255,.8); }

/* -- WICKET: impact flash + radiating shards, dramatic red -- */
.fx-wicket .fx-title{ color:#fff; -webkit-text-stroke:2px rgba(160,10,30,.6); }
.fx-flash{ position:absolute; inset:0; background:radial-gradient(circle at center, rgba(207,19,48,.55), transparent 60%); opacity:0; will-change:opacity; }
.fx-shard{
  position:absolute; width:5px; background:linear-gradient(180deg, #fff, var(--red));
  opacity:0; will-change:transform,opacity; transform-origin:center bottom;
}

/* -- NO BALL: yellow caution stripes -- */
.fx-noball .fx-title{ color:#151515; -webkit-text-stroke:0; }
.fx-stripe{
  position:absolute; height:34px; width:140%; left:-20%;
  background:repeating-linear-gradient(-45deg,#f7c531 0 26px,#151515 26px 52px);
  opacity:0; will-change:transform,opacity;
}
.fx-noball .fx-panel{ background:linear-gradient(180deg,#f7c531,#d9a412); padding:22px 60px; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.5); }

/* -- FREE HIT: blue + gold premium reveal -- */
.fx-freehit .fx-panel{
  background:linear-gradient(135deg,#0d2b6b,#173f9c 55%, #d4af37);
  padding:26px 70px; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.25);
}
.fx-freehit .fx-title{ font-size:120px; background:linear-gradient(180deg,#fff,#f0d78a); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:0; }
.fx-bolt{ position:absolute; opacity:0; will-change:transform,opacity; }

/* -- WIDE: minimal elegant swipe -- */
.fx-wide .fx-title{ font-size:110px; color:#fff; -webkit-text-stroke:1.5px rgba(20,36,99,.4); font-weight:800; letter-spacing:10px; }
.fx-line{
  position:absolute; top:50%; height:3px; width:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
  opacity:0; will-change:transform,opacity;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div id="stage">

  <!-- ============ MAIN SCOREBAR ============ -->
  <div id="scorebar">
    <div class="slot flag-slot left">
      <div class="flag-box" id="flagLeftBox"><img id="flagLeftImg" alt=""></div>
    </div>

    <div class="slot info-slot left" id="infoLeft">
      <div class="player-row" id="rowTop">
        <span class="strike-tri"></span>
        <span class="player-name" id="nameTop">BATSMAN 1</span>
        <span class="player-runs" id="runsTop">0</span>
        <span class="player-balls" id="ballsTop">0</span>
      </div>
      <div class="player-row" id="rowBottom">
        <span class="strike-tri"></span>
        <span class="player-name" id="nameBottom">BATSMAN 2</span>
        <span class="player-runs" id="runsBottom">0</span>
        <span class="player-balls" id="ballsBottom">0</span>
      </div>
    </div>

    <div class="slot center-slot">
      <div id="capsule">
        <div class="freehit-chip" id="freehitChip">FREE HIT</div>
        <div class="capsule-top">
          <span class="vs-text" id="vsBowlShort">NZ</span>
          <span class="vs-text">v <b id="vsBatShort">IND</b></span>
          <span class="score-badge" id="scoreBadge">0-0</span>
          <span class="innings-badge" id="inningsBadge">1ST</span>
          <span class="overs-badge" id="oversBadge">0.0</span>
        </div>
        <div class="rate-line" id="rateLine">CURRENT RATE <b>0.00</b></div>
      </div>
    </div>

    <div class="slot info-slot right" id="infoRight">
      <div class="bowler-row">
        <span class="bowler-name" id="bowlerName">BOWLER</span>
        <span class="bowler-figs" id="bowlerFigs">0-0</span>
        <span class="bowler-overs" id="bowlerOversTxt">0.0</span>
      </div>
      <div class="recent-balls" id="recentBalls"></div>
    </div>

    <div class="slot flag-slot right">
      <div class="flag-box" id="flagRightBox"><img id="flagRightImg" alt=""></div>
    </div>
  </div>

  <!-- ============ EVENT BANNER ============ -->
  <div id="event-banner">
    <div class="kind" id="eventKind">FOUR!</div>
    <div class="sub" id="eventSub"></div>
  </div>

  <!-- ============ CINEMATIC GLASS BACKDROP (behind summary panels) ============ -->
  <div id="summary-glass"></div>

  <!-- ============ FULL-SCREEN CENTER EVENT GRAPHICS ============ -->
  <div id="fx-stage"></div>

  <!-- ============ INNINGS SUMMARY ============ -->
  <div class="summary-wrap" id="inningsSummary">
    <div class="summary-head">
      <div>
        <div class="title" id="isTitle">INNINGS SUMMARY</div>
        <div class="meta" id="isMeta">Venue</div>
      </div>
      <div style="text-align:right">
        <div class="title" id="isTotal">0-0</div>
        <div class="meta" id="isOvers">(0.0 ov)</div>
      </div>
    </div>
    <div class="summary-body">
      <div class="summary-tabs">
        <div class="summary-tab" id="tabBat">BATTING</div>
        <div class="summary-tab" id="tabBowl">BOWLING</div>
      </div>
      <div id="isBatWrap">
        <table class="summary-table" id="isBatTable">
          <thead><tr><th>Batter</th><th>How Out</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>
          <tbody id="isBatBody"></tbody>
        </table>
        <div class="summary-foot"><span id="isExtras">Extras: 0</span></div>
      </div>
      <div id="isBowlWrap" style="display:none">
        <table class="summary-table" id="isBowlTable">
          <thead><tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr></thead>
          <tbody id="isBowlBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ============ MATCH SUMMARY ============ -->
  <div class="summary-wrap" id="matchSummary" style="width:1020px">
    <div class="summary-head">
      <div class="title">MATCH SUMMARY</div>
      <div class="meta" id="msVenue">Venue</div>
    </div>
    <div class="summary-body">
      <div class="match-winner" id="msWinner">MATCH IN PROGRESS</div>
      <div class="match-teams">
        <div class="match-team" id="msTeamA">
          <div class="tname" id="msTeamAName">Team A</div>
          <div class="tscore" id="msTeamAScore">—</div>
          <div id="msTeamABat"></div>
          <div id="msTeamABowl"></div>
        </div>
        <div class="match-team" id="msTeamB">
          <div class="tname" id="msTeamBName">Team B</div>
          <div class="tscore" id="msTeamBScore">—</div>
          <div id="msTeamBBat"></div>
          <div id="msTeamBBowl"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   0. FIT / SCALE STAGE (1920x1080 design canvas, OBS/vMix safe)
   ============================================================ */
const stage = document.getElementById('stage');
function fitStage(){
  const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* ============================================================
   1. CUSTOM EASES — premium broadcast motion curves
   ============================================================ */
gsap.registerPlugin(CustomEase);
CustomEase.create('premiumOut',   'M0,0 C0.16,1 0.3,1 1,1');
CustomEase.create('premiumInOut', 'M0,0 C0.65,0 0.35,1 1,1');
CustomEase.create('softOvershoot','M0,0 C0.34,1.28 0.64,1 1,1');
CustomEase.create('snap',         'M0,0 C0.2,0 0,1 1,1');

/* ============================================================
   2. TINY "SplitText" RECREATION (Club plugin unavailable)
   Wraps each character of an element in its own span so it can
   be staggered / revealed independently. Idempotent — safe to
   call again after textContent changes.
   ============================================================ */
function splitChars(el){
  const text = el.textContent;
  el.textContent = '';
  const spans = [...text].map(ch => {
    const s = document.createElement('span');
    s.style.display = 'inline-block';
    s.style.willChange = 'transform,opacity';
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(s);
    return s;
  });
  return spans;
}
function revealChars(el, opts={}){
  const spans = splitChars(el);
  gsap.set(spans, { yPercent:120, opacity:0 });
  gsap.to(spans, {
    yPercent:0, opacity:1, duration:opts.duration||.5, ease:'premiumOut',
    stagger:opts.stagger||.018, delay:opts.delay||0
  });
  return spans;
}

/* ============================================================
   3. COUNTRY FLAG RESOLUTION (flagcdn.com), team short/name -> iso2
   ============================================================ */
const FLAG_MAP = {
  IND:'in', AUS:'au', ENG:'gb-eng', NZ:'nz', PAK:'pk', SA:'za', RSA:'za',
  SL:'lk', BAN:'bd', AFG:'af', ZIM:'zw', IRE:'ie', SCO:'gb-sct', NED:'nl',
  UAE:'ae', NAM:'na', NEP:'np', USA:'us', CAN:'ca', OMA:'om', OMAN:'om',
  PNG:'pg', HK:'hk', KEN:'ke', BER:'bm', JPN:'jp', GER:'de', ITA:'it',
  QAT:'qa', KUW:'kw', SIN:'sg', MAS:'my', THA:'th', PHI:'ph', VAN:'vu',
  FIJ:'fj', GHA:'gh', NGR:'ng', TAN:'tz', UGA:'ug', BOT:'bw', RWA:'rw',
  MLT:'mt', SPA:'es', FRA:'fr', SWZ:'ch', WAL:'gb-wls',
  india:'in', australia:'au', england:'gb-eng', 'new zealand':'nz',
  pakistan:'pk', 'south africa':'za', 'sri lanka':'lk', bangladesh:'bd',
  afghanistan:'af', zimbabwe:'zw', ireland:'ie', scotland:'gb-sct',
  netherlands:'nl', 'united arab emirates':'ae', namibia:'na', nepal:'np',
  'united states':'us', usa:'us', canada:'ca', oman:'om',
  'papua new guinea':'pg', 'hong kong':'hk', kenya:'ke', bermuda:'bm'
};
// West Indies has no ISO country flag — render a maroon crest fallback.
function isWestIndies(key){
  return ['WI','WEST INDIES','WESTINDIES'].includes(String(key).toUpperCase());
}
function resolveFlagIso(team){
  const short = (team.short||'').trim();
  const name  = (team.name||'').trim().toLowerCase();
  if(isWestIndies(short) || isWestIndies(name)) return null;
  return FLAG_MAP[short.toUpperCase()] || FLAG_MAP[short] || FLAG_MAP[name] || null;
}
function setFlag(boxEl, imgEl, team){
  boxEl.style.background = team.color || '#233';
  const fbExisting = boxEl.querySelector('.flag-fallback');

  // 1) Uploaded club/team logo always wins if present.
  if(team.logoUrl){
    imgEl.style.display = 'block';
    imgEl.style.objectFit = 'contain';
    imgEl.src = team.logoUrl;
    if(fbExisting) fbExisting.remove();
    return;
  }
  imgEl.style.objectFit = 'cover';

  // 2) Fall back to a country flag if the team short/name matches one.
  const iso = resolveFlagIso(team);
  if(iso){
    imgEl.style.display = 'block';
    imgEl.src = `https://flagcdn.com/w160/${iso}.png`;
    if(fbExisting) fbExisting.remove();
    return;
  }

  // 3) Last resort: coloured chip with the team's short code.
  imgEl.style.display = 'none';
  let fb = fbExisting;
  if(!fb){ fb = document.createElement('div'); fb.className='flag-fallback'; boxEl.appendChild(fb); }
  fb.textContent = (team.short || team.name || '').slice(0,3).toUpperCase();
}

/* ============================================================
   4. BALL PIP RENDERING (Dot / 1-6 / W / Wd / Nb / B / LB)
   ============================================================ */
function ballPipClass(kind){
  if(kind == null) return 'empty';
  if(kind === '0') return 'dot';
  if(/^[1-6]$/.test(kind)) return 'run';
  if(kind === 'W') return 'wicket';
  return 'extra'; // Wd, Nb, B, LB
}
function ballPipLabel(kind){
  if(kind == null || kind === '0') return '';
  if(/^[1-6]$/.test(kind)) return kind;
  if(kind === 'W') return 'W';
  const map = { Wd:'WD', Nb:'NB', B:'B', LB:'LB' };
  return map[kind] || kind;
}
function renderRecentBalls(thisOver){
  const wrap = document.getElementById('recentBalls');
  const slots = (thisOver || []).slice(0,6);
  while(slots.length < 6) slots.push(null);
  const isNew = wrap.children.length !== 6;
  slots.forEach((kind, i) => {
    let pip = wrap.children[i];
    if(!pip){
      pip = document.createElement('div');
      pip.className = 'ball-pip empty';
      wrap.appendChild(pip);
    }
    const cls = ballPipClass(kind);
    const changed = pip.dataset.kind !== String(kind);
    pip.className = 'ball-pip ' + cls;
    pip.textContent = ballPipLabel(kind);
    pip.dataset.kind = String(kind);
    if(changed && kind != null){ recentBallAnimation(pip); }
  });
}

/* ============================================================
   5. STATE + DOM REFS
   ============================================================ */
const $ = id => document.getElementById(id);
let currentState = null;
let firstRender = true;

const el = {
  bar: $('scorebar'), capsule: $('capsule'),
  flagLeftBox: $('flagLeftBox'), flagLeftImg: $('flagLeftImg'),
  flagRightBox: $('flagRightBox'), flagRightImg: $('flagRightImg'),
  infoLeft: $('infoLeft'), infoRight: $('infoRight'),
  rowTop: $('rowTop'), rowBottom: $('rowBottom'),
  nameTop: $('nameTop'), runsTop: $('runsTop'), ballsTop: $('ballsTop'),
  nameBottom: $('nameBottom'), runsBottom: $('runsBottom'), ballsBottom: $('ballsBottom'),
  vsBowlShort: $('vsBowlShort'), vsBatShort: $('vsBatShort'),
  scoreBadge: $('scoreBadge'), inningsBadge: $('inningsBadge'), oversBadge: $('oversBadge'),
  rateLine: $('rateLine'), freehitChip: $('freehitChip'),
  bowlerName: $('bowlerName'), bowlerFigs: $('bowlerFigs'), bowlerOversTxt: $('bowlerOversTxt')
};

function fmtOvers(o,b){ return `${o||0}.${b||0}`; }
function calcCRR(score){
  const totalBalls = (score.overs||0)*6 + (score.balls||0);
  if(totalBalls === 0) return 0;
  return score.runs / (totalBalls/6);
}
function ballsPerInnings(state){
  if(state.format === 'Custom') return (state.customOvers||20)*6;
  const rules = { T20:20, ODI:50, Test:Infinity }[state.format] ?? 20;
  return rules === Infinity ? null : rules*6;
}
function calcRRR(state){
  if(!state.target) return null;
  const total = ballsPerInnings(state);
  if(!total) return null;
  const bowled = (state.score.overs||0)*6 + (state.score.balls||0);
  const left = total - bowled;
  if(left <= 0) return null;
  return (state.target - state.score.runs) / (left/6);
}

/* ============================================================
   6. RENDER — diffs previous vs incoming state, triggers the
   matching micro-animation only for what actually changed.
   ============================================================ */
function renderState(state){
  const prev = currentState;
  currentState = state;

  const battingTeam = state.battingTeam === 'A' ? state.teamA : state.teamB;
  const bowlingTeam = state.battingTeam === 'A' ? state.teamB : state.teamA;
  const striker = state.striker, nonStriker = state.nonStriker;

  // --- flags ---
  setFlag(el.flagLeftBox, el.flagLeftImg, battingTeam);
  setFlag(el.flagRightBox, el.flagRightImg, bowlingTeam);

  // --- player rows: non-striker on top, striker (with ▶) on bottom ---
  const playerChanged = !prev || prev.striker.name !== striker.name || prev.nonStriker.name !== nonStriker.name;
  el.nameTop.textContent = (nonStriker.name || '').toUpperCase();
  el.runsTop.textContent = nonStriker.runs ?? 0;
  el.ballsTop.textContent = nonStriker.balls ?? 0;
  el.nameBottom.textContent = (striker.name || '').toUpperCase();
  el.runsBottom.textContent = striker.runs ?? 0;
  el.ballsBottom.textContent = striker.balls ?? 0;
  el.rowTop.classList.remove('striker');
  el.rowBottom.classList.add('striker');
  if(playerChanged && !firstRender) playerChangeAnimation();

  // --- score / overs / rate ---
  const newScoreTxt = `${state.score.runs}-${state.score.wickets}`;
  const scoreChanged = !prev || `${prev.score.runs}-${prev.score.wickets}` !== newScoreTxt;
  el.scoreBadge.textContent = newScoreTxt;
  el.oversBadge.textContent = fmtOvers(state.score.overs, state.score.balls);
  el.vsBowlShort.textContent = (bowlingTeam.short || bowlingTeam.name || '').toUpperCase();
  el.vsBatShort.textContent = (battingTeam.short || battingTeam.name || '').toUpperCase();
  el.inningsBadge.textContent = state.target ? '2ND' : '1ST';

  const rrr = calcRRR(state);
  const rateChanged = !prev; // recompute text always, animate on numeric change below
  if(rrr !== null){
    el.rateLine.innerHTML = `REQUIRED RATE <b>${rrr.toFixed(2)}</b>`;
  } else {
    el.rateLine.innerHTML = `CURRENT RATE <b>${calcCRR(state.score).toFixed(2)}</b>`;
  }

  if(scoreChanged && !firstRender){
    const runsScored = state.score.runs - (prev ? prev.score.runs : 0);
    if(runsScored === 6) boundaryAnimation(true);
    else if(runsScored === 4) boundaryAnimation(false);
    else scoreUpdateAnimation();
    if(prev && state.score.wickets > prev.score.wickets) wicketAnimation();
  }

  // --- bowler ---
  const bowlerChanged = !prev || prev.bowler.name !== state.bowler.name;
  el.bowlerName.textContent = (state.bowler.name || '—').toUpperCase();
  el.bowlerFigs.textContent = `${state.bowler.wickets||0}-${state.bowler.runs||0}`;
  el.bowlerOversTxt.textContent = fmtOvers(state.bowler.overs, state.bowler.balls);
  if(bowlerChanged && !firstRender) bowlerUpdateAnimation();

  // --- recent balls (current over) ---
  renderRecentBalls(state.thisOver);

  // --- free hit chip ---
  el.freehitChip.classList.toggle('show', !!state.freeHit);

  // --- overall visibility ---
  if(state.visible === false){
    if(!el.bar.classList.contains('hidden') && !firstRender) outroAnimation();
  } else {
    if(el.bar.classList.contains('hidden') || firstRender) introAnimation();
  }

  firstRender = false;
}

/* ============================================================
   7. INTRO / OUTRO — panel build, flags slide, text reveal
   ============================================================ */
function introAnimation(){
  el.bar.classList.remove('hidden');
  const tl = gsap.timeline({ defaults:{ ease:'premiumOut' } });
  tl.addLabel('start')
    .set(el.bar, { opacity:1 })
    .set('.info-slot, .flag-slot', { clipPath:'inset(0 50% 0 50%)', opacity:0 })
    .set('.center-slot', { opacity:1, clipPath:'inset(0 0% 0 0%)' })
    .set('#capsule', { scale:.9, opacity:0 })
    .to('.info-slot.left, .flag-slot.left', { clipPath:'inset(0 0% 0 0%)', opacity:1, duration:.55 }, 'start+=0.05')
    .to('.info-slot.right, .flag-slot.right', { clipPath:'inset(0 0% 0 0%)', opacity:1, duration:.55 }, 'start+=0.1')
    .to('#capsule', { scale:1, opacity:1, duration:.5, ease:'softOvershoot' }, 'start+=0.15')
    .addLabel('panelsDone', 'start+=0.65')
    .set(el.flagLeftBox, { xPercent:-160, opacity:0 }, 'panelsDone')
    .set(el.flagRightBox, { xPercent:160, opacity:0 }, 'panelsDone')
    .to(el.flagLeftBox, { xPercent:0, opacity:1, duration:.55, ease:'softOvershoot' }, 'panelsDone+=0.05')
    .to(el.flagRightBox, { xPercent:0, opacity:1, duration:.55, ease:'softOvershoot' }, 'panelsDone+=0.05')
    .addLabel('flagsDone', 'panelsDone+=0.5')
    .add(() => {
      revealChars(el.nameTop, { delay:0 });
      revealChars(el.nameBottom, { delay:.04 });
      revealChars(el.bowlerName, { delay:.08 });
      gsap.fromTo([el.runsTop, el.ballsTop, el.runsBottom, el.ballsBottom, el.bowlerFigs, el.bowlerOversTxt],
        { yPercent:60, opacity:0 }, { yPercent:0, opacity:1, duration:.4, stagger:.03, ease:'premiumOut' });
    }, 'flagsDone')
    .fromTo('#capsule .capsule-top > *', { yPercent:50, opacity:0 }, { yPercent:0, opacity:1, duration:.4, stagger:.05, ease:'premiumOut' }, 'flagsDone+=0.05')
    .fromTo('#scoreBadge', { scale:.9, opacity:0 }, { scale:1, opacity:1, duration:.35, ease:'premiumOut' }, 'flagsDone+=0.1')
    .fromTo('#rateLine', { opacity:0, y:6 }, { opacity:1, y:0, duration:.35 }, 'flagsDone+=0.18')
    .fromTo('.ball-pip', { scale:0, opacity:0 }, { scale:1, opacity:1, duration:.28, stagger:.06, ease:'softOvershoot' }, 'flagsDone+=0.22')
    .fromTo('.player-row.striker .strike-tri', { xPercent:-100, opacity:0 }, { xPercent:0, opacity:1, duration:.3, ease:'premiumOut' }, '>-0.1');
}
function outroAnimation(){
  const tl = gsap.timeline({ defaults:{ ease:'premiumInOut' }, onComplete:() => el.bar.classList.add('hidden') });
  tl.to('.strike-tri', { opacity:0, duration:.2 })
    .to('.ball-pip', { scale:0, opacity:0, duration:.2, stagger:.03 }, '<')
    .to(['#rateLine','.capsule-top > *','.player-row','.bowler-row'], { opacity:0, y:-6, duration:.25, stagger:.02 }, '<0.05')
    .to(el.flagLeftBox, { xPercent:-160, opacity:0, duration:.4 }, '>')
    .to(el.flagRightBox, { xPercent:160, opacity:0, duration:.4 }, '<')
    .to('#capsule', { scale:.9, opacity:0, duration:.35 }, '>-0.1')
    .to('.info-slot, .flag-slot', { clipPath:'inset(0 50% 0 50%)', opacity:0, duration:.4 }, '<')
    .to(el.bar, { opacity:0, duration:.2 }, '>-0.1');
}

/* ============================================================
   9b. GLASSMORPHISM BACKDROP — cinematic blur/dim behind any
   open summary panel. Smooth in on open, smooth out on close.
   ============================================================ */
const glassEl = $('summary-glass');
let glassOpenCount = 0;
function showGlass(){
  glassOpenCount++;
  gsap.killTweensOf(glassEl);
  gsap.set(glassEl, { pointerEvents:'auto' });
  gsap.fromTo(glassEl,
    { opacity:0, backdropFilter:'blur(0px) saturate(1)', webkitBackdropFilter:'blur(0px) saturate(1)' },
    { opacity:1, backdropFilter:'blur(14px) saturate(1.05)', webkitBackdropFilter:'blur(14px) saturate(1.05)',
      duration:.6, ease:'premiumOut' });

  glassOpenCount = Math.max(0, glassOpenCount - 1);

  gsap.killTweensOf(glassEl);
  gsap.to(glassEl, {
    opacity:0, backdropFilter:'blur(0px) saturate(1)', webkitBackdropFilter:'blur(0px) saturate(1)',
    duration:.5, ease:'premiumInOut', onComplete:() => { glassEl.style.pointerEvents='none'; }
  });
}

/* ============================================================
   9c. FULL-SCREEN CENTER EVENT GRAPHICS ENGINE
   Reusable primitives (streaks/particles/rings/shards/text
   reveal) composed into unique timelines per event kind. Only
   transform + opacity are animated — safe for 60-120fps in
   OBS/vMix. Config (enabled + duration) is editable live from
   the controller via the cricketEventConfig socket message.
   ============================================================ */
const FX_CONFIG = {
  FOUR:    { enabled:true, duration:1300 },
  SIX:     { enabled:true, duration:2000 },
  WICKET:  { enabled:true, duration:1800 },
  NO_BALL: { enabled:true, duration:1500 },
  FREE_HIT:{ enabled:true, duration:1800 },
  WIDE:    { enabled:true, duration:1200 }
};
function updateFxConfig(patch){
  Object.keys(patch||{}).forEach(k => {
    if(FX_CONFIG[k]) Object.assign(FX_CONFIG[k], patch[k]);
  });
}

const fxStage = $('fx-stage');
let fxTimeline = null;
function fxClear(){
  if(fxTimeline){ fxTimeline.kill(); fxTimeline = null; }
  gsap.killTweensOf(fxStage.querySelectorAll('*'));
  fxStage.innerHTML = '';
}
function fxEl(tag, cls, parent){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  (parent||fxStage).appendChild(e);
  return e;
}
function fxBuildTitleChars(el, text){
  el.textContent = '';
  return [...text].map(ch => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.style.display = 'inline-block';
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(s);
    return s;
  });
}
function fxAutoHide(tl, root, holdMs, exitDur){
  tl.to(root, { opacity:0, duration:exitDur, ease:'premiumInOut', onComplete:fxClear }, `+=${holdMs/1000}`);
}

/* ---- FOUR: fast horizontal streaks converging + crisp gold type ---- */
function playFour(sub){
  fxClear();
  const cfg = FX_CONFIG.FOUR; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-four');
  const center = fxEl('div','fx-center', root);
  const title = fxEl('div','fx-title', center); fxBuildTitleChars(title, 'FOUR');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || '';
  gsap.set(center, { opacity:0 });

  const streaks = [];
  for(let i=0;i<7;i++){
    const s = fxEl('div','fx-streak', root);
    const y = 540 + (i-3)*46;
    const fromLeft = i % 2 === 0;
    gsap.set(s, { top:y, width:220, left: fromLeft ? -260 : 1920+40, x:0 });
    streaks.push({ el:s, fromLeft });
  }

  const tl = gsap.timeline();
  fxTimeline = tl;
  streaks.forEach((s,i) => {
    tl.fromTo(s.el, { opacity:0, x:0 },
      { opacity:1, x: s.fromLeft ? 760 : -760, duration:.42, ease:'snap' }, i*0.015)
      .to(s.el, { opacity:0, duration:.18 }, `>-0.05`);
  });
  tl.to(center, { opacity:1, duration:.18 }, 0.28)
    .fromTo(title.querySelectorAll('.ch'), { yPercent:120, opacity:0, skewX:-8 },
      { yPercent:0, opacity:1, skewX:0, duration:.4, stagger:.03, ease:'softOvershoot' }, 0.3)
    .fromTo(sub_, { opacity:0, y:8 }, { opacity:1, y:0, duration:.3 }, 0.55)
    .fromTo(title, { scale:1.04 }, { scale:1, duration:.5, ease:'premiumOut' }, 0.3);

  fxAutoHide(tl, root, Math.max(200, cfg.duration - 900), .35);
}

/* ---- SIX: shockwave ring + rotating trails + sparks — the big one ---- */
function playSix(sub){
  fxClear();
  const cfg = FX_CONFIG.SIX; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-six');
  const ring1 = fxEl('div','fx-ring', root);
  const ring2 = fxEl('div','fx-ring', root);
  [ring1,ring2].forEach(r => gsap.set(r, { width:40, height:40, left:960-20, top:540-20 }));

  const trails = [];
  for(let i=0;i<10;i++){
    const t = fxEl('div','fx-trail', root);
    const angle = (360/10)*i;
    gsap.set(t, { height:0, left:960, top:540, rotate:angle });
    trails.push(t);
  }
  const sparks = [];
  for(let i=0;i<16;i++){
    const sp = fxEl('div','fx-spark', root);
    gsap.set(sp, { left:960, top:540 });
    sparks.push(sp);
  }

  const center = fxEl('div','fx-center', root);
  const title = fxEl('div','fx-title', center); fxBuildTitleChars(title, 'SIX');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || '';
  gsap.set(center, { opacity:0 });

  const tl = gsap.timeline();
  fxTimeline = tl;
  tl.to([ring1,ring2], { width:1500, height:1500, left:960-750, top:540-750, opacity:0, duration:1.1, ease:'premiumOut', stagger:.15 }, 0)
    .fromTo([ring1,ring2], { opacity:.9 }, { opacity:0, duration:1.1 }, 0)
    .to(trails, { height:220, duration:.5, ease:'snap', stagger:.02 }, 0.05)
    .to(trails, { rotate:'+=70', duration:1.3, ease:'premiumOut', stagger:.02 }, 0.05)
    .to(trails, { opacity:.9, duration:.15 }, 0.05)
    .to(trails, { opacity:0, duration:.6 }, 0.7)
    .to(sparks, {
        x: () => gsap.utils.random(-480,480), y: () => gsap.utils.random(-360,360),
        opacity:1, duration:.5, ease:'premiumOut', stagger:.015
      }, 0.1)
    .to(sparks, { opacity:0, duration:.5 }, 0.75)
    .to(center, { opacity:1, duration:.2 }, 0.35)
    .fromTo(title.querySelectorAll('.ch'), { scale:.4, opacity:0, rotateX:60 },
      { scale:1, opacity:1, rotateX:0, duration:.6, stagger:.05, ease:'softOvershoot' }, 0.4)
    .fromTo(sub_, { opacity:0, y:10 }, { opacity:1, y:0, duration:.35 }, 0.8)
    .to(title, { scale:1.06, duration:.7, ease:'premiumInOut', yoyo:true, repeat:1 }, 0.4);

  fxAutoHide(tl, root, Math.max(300, cfg.duration - 1500), .45);
}

/* ---- WICKET: impact flash + radiating shards, dramatic but clean ---- */
function playWicket(sub){
  fxClear();
  const cfg = FX_CONFIG.WICKET; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-wicket');
  const flash = fxEl('div','fx-flash', root);

  const shards = [];
  for(let i=0;i<12;i++){
    const s = fxEl('div','fx-shard', root);
    const angle = (360/12)*i + gsap.utils.random(-6,6);
    gsap.set(s, { height:0, left:960, top:540, rotate:angle });
    shards.push(s);
  }

  const center = fxEl('div','fx-center', root);
  const title = fxEl('div','fx-title', center); fxBuildTitleChars(title, 'WICKET');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || '';
  gsap.set(center, { opacity:0, scale:1.3 });

  const tl = gsap.timeline();
  fxTimeline = tl;
  tl.to(flash, { opacity:1, duration:.08 }, 0)
    .to(flash, { opacity:0, duration:.55, ease:'premiumOut' }, 0.08)
    .to(shards, { height:260, opacity:.85, duration:.35, ease:'snap', stagger:.008 }, 0.02)
    .to(shards, { opacity:0, duration:.5 }, 0.4)
    .to(root, { x:-8, duration:.05 }, 0.02)
    .to(root, { x:8, duration:.05 }, 0.07)
    .to(root, { x:-4, duration:.05 }, 0.12)
    .to(root, { x:0, duration:.05 }, 0.17)
    .to(center, { opacity:1, scale:1, duration:.32, ease:'snap' }, 0.15)
    .fromTo(title.querySelectorAll('.ch'), { opacity:0, y:-14 },
      { opacity:1, y:0, duration:.32, stagger:.025, ease:'premiumOut' }, 0.17)
    .fromTo(sub_, { opacity:0 }, { opacity:1, duration:.3 }, 0.45);

  fxAutoHide(tl, root, Math.max(250, cfg.duration - 1100), .4);
}

/* ---- NO BALL: yellow caution stripe sweep, smooth + professional ---- */
function playNoBall(sub){
  fxClear();
  const cfg = FX_CONFIG.NO_BALL; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-noball');
  const stripeTop = fxEl('div','fx-stripe', root);
  const stripeBot = fxEl('div','fx-stripe', root);
  gsap.set(stripeTop, { top:540-90, xPercent:-100 });
  gsap.set(stripeBot, { top:540+56, xPercent:100 });

  const center = fxEl('div','fx-center', root);
  const panel = fxEl('div','fx-panel', center);
  const title = fxEl('div','fx-title', panel); fxBuildTitleChars(title, 'NO BALL');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || ''; sub_.style.color = '#f7c531';
  gsap.set(center, { opacity:0, scale:.9 });

  const tl = gsap.timeline();
  fxTimeline = tl;
  tl.to([stripeTop,stripeBot], { opacity:1, duration:.05 }, 0)
    .to(stripeTop, { xPercent:0, duration:.5, ease:'premiumOut' }, 0)
    .to(stripeBot, { xPercent:0, duration:.5, ease:'premiumOut' }, 0.05)
    .to(center, { opacity:1, scale:1, duration:.4, ease:'softOvershoot' }, 0.25)
    .fromTo(title.querySelectorAll('.ch'), { opacity:0, yPercent:60 },
      { opacity:1, yPercent:0, duration:.3, stagger:.02, ease:'premiumOut' }, 0.32)
    .fromTo(sub_, { opacity:0 }, { opacity:1, duration:.3 }, 0.55)
    .to([stripeTop,stripeBot], { opacity:.0, duration:.4 }, 0.6);

  fxAutoHide(tl, root, Math.max(250, cfg.duration - 1000), .4);
}

/* ---- FREE HIT: premium blue + gold energetic reveal ---- */
function playFreeHit(sub){
  fxClear();
  const cfg = FX_CONFIG.FREE_HIT; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-freehit');
  const center = fxEl('div','fx-center', root);
  const panel = fxEl('div','fx-panel', center);
  const title = fxEl('div','fx-title', panel); fxBuildTitleChars(title, 'FREE HIT');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || ''; sub_.style.color = '#d4af37';
  gsap.set(center, { opacity:0, y:40, scale:.92 });

  const sparks = [];
  for(let i=0;i<14;i++){
    const sp = fxEl('div','fx-spark', root);
    gsap.set(sp, { left:960, top:540, background:'#d4af37', boxShadow:'0 0 10px 3px rgba(212,175,55,.7)' });
    sparks.push(sp);
  }

  const tl = gsap.timeline();
  fxTimeline = tl;
  tl.to(center, { opacity:1, y:0, scale:1, duration:.55, ease:'softOvershoot' }, 0)
    .fromTo(title.querySelectorAll('.ch'), { opacity:0, yPercent:80 },
      { opacity:1, yPercent:0, duration:.4, stagger:.025, ease:'premiumOut' }, 0.15)
    .to(sparks, {
        x: () => gsap.utils.random(-420,420), y: () => gsap.utils.random(-260,260),
        opacity:1, duration:.5, ease:'premiumOut', stagger:.02
      }, 0.15)
    .to(sparks, { opacity:0, duration:.5 }, 0.55)
    .fromTo(sub_, { opacity:0, y:8 }, { opacity:1, y:0, duration:.3 }, 0.4);

  fxAutoHide(tl, root, Math.max(250, cfg.duration - 1200), .4);
}

/* ---- WIDE: minimal, elegant swipe ---- */
function playWide(sub){
  fxClear();
  const cfg = FX_CONFIG.WIDE; if(!cfg.enabled) return;
  const root = fxEl('div','fx-root fx-wide');
  const line1 = fxEl('div','fx-line', root);
  const line2 = fxEl('div','fx-line', root);
  gsap.set(line1, { top:540-30, xPercent:-100 });
  gsap.set(line2, { top:540+30, xPercent:100 });

  const center = fxEl('div','fx-center', root);
  const title = fxEl('div','fx-title', center); fxBuildTitleChars(title, 'WIDE');
  const sub_ = fxEl('div','fx-sub', center); sub_.textContent = sub || '';
  gsap.set(center, { opacity:0, scale:.96 });

  const tl = gsap.timeline();
  fxTimeline = tl;
  tl.to([line1,line2], { opacity:1, xPercent:0, duration:.4, ease:'premiumOut' }, 0)
    .to(center, { opacity:1, scale:1, duration:.35, ease:'premiumOut' }, 0.12)
    .fromTo(title.querySelectorAll('.ch'), { opacity:0 }, { opacity:1, duration:.35, stagger:.02 }, 0.15)
    .fromTo(sub_, { opacity:0 }, { opacity:1, duration:.3 }, 0.35)
    .to([line1,line2], { opacity:0, duration:.35 }, 0.5);

  fxAutoHide(tl, root, Math.max(200, cfg.duration - 800), .3);
}

const FX_PLAYERS = {
  FOUR: playFour, SIX: playSix, WICKET: playWicket,
  NO_BALL: playNoBall, FREE_HIT: playFreeHit, WIDE: playWide
};
function playFx(kind, sub){
  const fn = FX_PLAYERS[kind];
  if(fn) fn(sub);
}

/* ============================================================
   10. INNINGS / MATCH SUMMARY CARDS
   ============================================================ */
let inningsTimers = [];
function clearInningsTimers(){ inningsTimers.forEach(clearTimeout); inningsTimers = []; }

function showInningsSummary(data){
  clearInningsTimers();
  showGlass();
  const wrap = $('inningsSummary');
  wrap.style.setProperty('--accent-1', data.battingTeamColor || '#142463');
  wrap.style.setProperty('--accent-2', data.bowlingTeamColor || '#101c4d');
  $('isTitle').textContent = `${data.battingTeamShort || data.battingTeamName} INNINGS`;
  $('isMeta').textContent = [data.venue, data.format].filter(Boolean).join(' · ');
  $('isTotal').textContent = data.total;
  $('isOvers').textContent = `(${data.overs} ov)`;
  $('isExtras').textContent = `Extras: ${data.extrasTotal || 0}`;

  const batBody = $('isBatBody'); batBody.innerHTML = '';
  (data.batsmen||[]).forEach(b => {
    batBody.insertAdjacentHTML('beforeend',
      `<tr><td class="name">${b.name}</td><td>${b.howOut}</td><td class="num">${b.runs}</td><td class="num">${b.balls}</td><td class="num">${b.fours}</td><td class="num">${b.sixes}</td><td class="num">${b.sr}</td></tr>`);
  });
  const bowlBody = $('isBowlBody'); bowlBody.innerHTML = '';
  (data.bowlers||[]).forEach(b => {
    bowlBody.insertAdjacentHTML('beforeend',
      `<tr><td class="name">${b.name}</td><td class="num">${b.overs}</td><td class="num">${b.maidens}</td><td class="num">${b.runs}</td><td class="num">${b.wickets}</td><td class="num">${b.econ}</td></tr>`);
  });

  $('tabBat').classList.add('active'); $('tabBowl').classList.remove('active');
  $('isBatWrap').style.display = ''; $('isBowlWrap').style.display = 'none';

  const ENTRY=1000, BATTING_HOLD=15000, SWITCH=800, BOWLING_HOLD=15000, EXIT=2800;
  gsap.timeline()
    .set(wrap, { opacity:0, scale:.94, pointerEvents:'auto' })
    .to(wrap, { opacity:1, scale:1, duration:ENTRY/1000, ease:'softOvershoot' });

  inningsTimers.push(setTimeout(() => {
    gsap.timeline()
      .to('#isBatWrap', { opacity:0, y:-10, duration:.35 })
      .add(() => { $('isBatWrap').style.display='none'; $('isBowlWrap').style.display=''; $('tabBat').classList.remove('active'); $('tabBowl').classList.add('active'); })
      .fromTo('#isBowlWrap', { opacity:0, y:10 }, { opacity:1, y:0, duration:.35 });
  }, ENTRY + BATTING_HOLD));

  inningsTimers.push(setTimeout(() => hideInningsSummary(), ENTRY + BATTING_HOLD + SWITCH + BOWLING_HOLD + EXIT));
}
function hideInningsSummary(){
  clearInningsTimers();
  hideGlass();
  gsap.to($('inningsSummary'), { opacity:0, scale:.94, duration:.4, ease:'premiumInOut', onComplete:() => { $('inningsSummary').style.pointerEvents='none'; } });
}

function showMatchSummary(data){
  showGlass();
  const wrap = $('matchSummary');
  $('msVenue').textContent = data.venue || '';
  $('msWinner').textContent = data.winnerText || '';

  const fillTeam = (prefix, team) => {
    $(prefix+'Name').textContent = (team.short || team.name || '').toUpperCase();
    $(prefix+'Name').parentElement.style.background = `linear-gradient(90deg, ${team.color}22, transparent)`;
    $(prefix+'Score').textContent = team.score || '—';
    const batEl = $(prefix+'Bat'); batEl.innerHTML = (team.batsmen||[]).map(b =>
      `<div class="row"><span>${b.name}</span><span>${b.runs} (${b.balls})</span></div>`).join('');
    const bowlEl = $(prefix+'Bowl'); bowlEl.innerHTML = (team.bowlers||[]).map(b =>
      `<div class="row"><span>${b.name}</span><span>${b.figures} (${b.overs})</span></div>`).join('');
  };
  fillTeam('msTeamA', data.teamA);
  fillTeam('msTeamB', data.teamB);

  gsap.timeline()
    .set(wrap, { opacity:0, scale:.94, pointerEvents:'auto' })
    .to(wrap, { opacity:1, scale:1, duration:1, ease:'softOvershoot' })
    .fromTo('.match-team', { opacity:0, y:16 }, { opacity:1, y:0, duration:.5, stagger:.1, ease:'premiumOut' }, '-=0.5');
}
function hideMatchSummary(){
  hideGlass();
  gsap.to($('matchSummary'), { opacity:0, scale:.94, duration:.4, ease:'premiumInOut', onComplete:() => { $('matchSummary').style.pointerEvents='none'; } });
}

/* ============================================================
   11. SOCKET.IO — joins the same room as the panel via ?room=
   Optional: if the file is opened directly (file://) or the
   socket.io client failed to load, we just skip live wiring —
   demo mode (below) still works standalone either way.
   ============================================================ */
const params = new URLSearchParams(location.search);
const DEMO_MODE = params.get('demo') === '1';
const roomId = params.get('room') || 'default';

function safeDefaults(state){
  return {
    format:'T20', customOvers:20, venue:'',
    teamA:{ name:'Team A', short:'A', color:'#17337a' },
    teamB:{ name:'Team B', short:'B', color:'#7a1620' },
    battingTeam:'A',
    score:{ runs:0, wickets:0, overs:0, balls:0 },
    target:null,
    striker:{ name:'Batsman 1', runs:0, balls:0 },
    nonStriker:{ name:'Batsman 2', runs:0, balls:0 },
    bowler:{ name:'', overs:0, balls:0, runs:0, wickets:0 },
    thisOver:[], visible:true, freeHit:false,
    ...state,
    teamA:{ name:'Team A', short:'A', color:'#17337a', ...(state.teamA||{}) },
    teamB:{ name:'Team B', short:'B', color:'#7a1620', ...(state.teamB||{}) },
    score:{ runs:0, wickets:0, overs:0, balls:0, ...(state.score||{}) },
    striker:{ name:'Batsman 1', runs:0, balls:0, ...(state.striker||{}) },
    nonStriker:{ name:'Batsman 2', runs:0, balls:0, ...(state.nonStriker||{}) },
    bowler:{ name:'', overs:0, balls:0, runs:0, wickets:0, ...(state.bowler||{}) }
  };
}

if(!DEMO_MODE && typeof io !== 'undefined'){
  try{
    const socket = io({ query: { uid: roomId } });
    socket.on('liveCricketScore', (state) => {
      if(!state || !Object.keys(state).length) return;
      renderState(safeDefaults(state));
    });
    socket.on('cricketEvent', (evt) => {
      if(!evt || !evt.kind) return;
      if(FX_PLAYERS[evt.kind]) playFx(evt.kind, evt.sub || evt.text || '');
      else showEventBanner(evt.kind, evt.sub || evt.text || '', evt.durationMs || 2200);
    });
    socket.on('cricketEventConfig', (cfg) => updateFxConfig(cfg || {}));
    socket.on('cricketInningsSummary', (data) => showInningsSummary(data || {}));
    socket.on('cricketHideInningsSummary', () => hideInningsSummary());
    socket.on('cricketMatchSummary', (data) => showMatchSummary(data || {}));
    socket.on('cricketHideMatchSummary', () => hideMatchSummary());
  }catch(e){ console.warn('Socket unavailable — open with ?demo=1 to preview without a server.', e); }
}

/* ============================================================
   11b. DEMO MODE (?demo=1) — no server/panel needed at all.
   Scripts a full live sequence: intro -> boundaries -> wicket ->
   bowler change -> innings summary -> match summary, on a loop.
   Great for previewing in plain Chrome (just open the file and
   add ?demo=1 to the address bar).
   ============================================================ */
function runDemo(){
  const teamA = { name:'India', short:'IND', color:'#1c3a8a' };
  const teamB = { name:'New Zealand', short:'NZ', color:'#0a0a0a' };
  let s = safeDefaults({
    teamA, teamB, battingTeam:'A', venue:'Eden Park, Auckland', format:'ODI',
    score:{ runs:210, wickets:6, overs:48, balls:2 },
    target: 231,
    striker:{ name:'MS Dhoni', runs:49, balls:71, fours:2, sixes:1 },
    nonStriker:{ name:'Bhuvneshwar Kumar', runs:0, balls:0, fours:0, sixes:0 },
    bowler:{ name:'Ferguson', overs:9, balls:2, runs:41, wickets:0 },
    thisOver:['6','0']
  });
  const push = (patch, delay) => setTimeout(() => { s = safeDefaults({ ...s, ...patch }); renderState(s); }, delay);

  renderState(s);

  push({ score:{ ...s.score, runs:214, balls:3 }, striker:{ ...s.striker, runs:53, balls:72, fours:3 }, thisOver:['6','0','4'] }, 3000);
  showAt(3000, () => showEventBanner('FOUR', 'MS Dhoni', 1800));

  push({ score:{ ...s.score, runs:220, balls:4 }, striker:{ ...s.striker, runs:59, balls:73, sixes:2 }, thisOver:['6','0','4','6'] }, 6500);
  showAt(6500, () => showEventBanner('SIX', 'MS Dhoni', 1800));

  push({
    score:{ runs:220, wickets:7, overs:48, balls:5 },
    striker:{ name:'R. Jadeja', runs:0, balls:0, fours:0, sixes:0 },
    nonStriker:{ name:'Bhuvneshwar Kumar', runs:0, balls:0, fours:0, sixes:0 },
    thisOver:['6','0','4','6','W']
  }, 10000);

  push({ bowler:{ name:'Boult', overs:0, balls:0, runs:0, wickets:0 } }, 13500);

  showAt(14500, () => playFx('NO_BALL',''));
  showAt(15200, () => { el.freehitChip.classList.add('show'); playFx('FREE_HIT',''); });
  showAt(16400, () => playFx('WIDE',''));

  showAt(17000, () => {
    showInningsSummary({
      battingTeamName:'India', battingTeamShort:'IND', battingTeamColor:'#1c3a8a',
      bowlingTeamName:'New Zealand', bowlingTeamShort:'NZ', bowlingTeamColor:'#0a0a0a',
      format:'ODI', venue:'Eden Park, Auckland',
      total:'220-7', overs:'48.5', extrasTotal:12,
      batsmen:[
        { name:'R. Sharma', runs:41, balls:38, fours:5, sixes:1, sr:'107.9', howOut:'c Southee b Ferguson' },
        { name:'V. Kohli', runs:67, balls:70, fours:6, sixes:0, sr:'95.7', howOut:'lbw b Boult' },
        { name:'MS Dhoni', runs:59, balls:73, fours:3, sixes:2, sr:'80.8', howOut:'not out' },
        { name:'R. Jadeja', runs:0, balls:1, fours:0, sixes:0, sr:'0.0', howOut:'not out' }
      ],
      bowlers:[
        { name:'Ferguson', overs:'9.2', maidens:0, runs:41, wickets:1, econ:'4.39' },
        { name:'Boult', overs:'10.0', maidens:1, runs:38, wickets:2, econ:'3.80' }
      ]
    });
  });

  // Demo total innings-summary run is ~34.6s (matches the panel's own
  // batting -> bowling -> hide timing), then show the match summary.
  showAt(17000 + 34600 + 1000, () => {
    showMatchSummary({
      venue:'Eden Park, Auckland',
      winnerText:'INDIA WON BY 3 WICKETS',
      teamA:{ name:'India', short:'IND', color:'#1c3a8a', score:'231-7 (49.4 ov)',
        batsmen:[{name:'V. Kohli', runs:67, balls:70},{name:'MS Dhoni', runs:59, balls:73}],
        bowlers:[{name:'R. Jadeja', figures:'2-34', overs:'10.0'}] },
      teamB:{ name:'New Zealand', short:'NZ', color:'#0a0a0a', score:'230-9 (50.0 ov)',
        batsmen:[{name:'K. Williamson', runs:71, balls:80},{name:'T. Latham', runs:44, balls:52}],
        bowlers:[{name:'Ferguson', figures:'2-52', overs:'10.0'}] }
    });
  });

  function showAt(delay, fn){ setTimeout(fn, delay); }
}

/* ============================================================
   12. INIT — start hidden until the first real state arrives
   ============================================================ */
el.bar.classList.add('hidden');
gsap.set(el.bar, { opacity:0 });
if(DEMO_MODE) runDemo();
</script>
