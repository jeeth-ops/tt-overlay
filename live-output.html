<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Output</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* ============================================================
     LIVE OUTPUT — "Camera + Cricket Overlay = Final Program Feed"
     This window renders the composited program picture: the camera
     <video> underneath, cricket-overlay.html on top in an iframe,
     exactly the same page OBS/vMix already use as a browser source.
     One overlay system, reused here, not duplicated.

     🔒 NATIVE CAPTURE, NOT A BROWSER VIDEO PIPELINE: the Stream Engine
     (stream-engine/server.js) captures THIS WINDOW's rendered pixels
     directly at the OS level (ffmpeg's gdigrab, matched by this
     window's document.title — see the script below) — there is no
     getDisplayMedia(), no MediaRecorder, no Blob/WebM chunking, no
     HTTP upload of video from this page. This page's only job is to
     render the picture; capturing it is the Stream Engine's job,
     natively, exactly like vMix capturing a Browser Input. Do not
     close or minimize this window while live — gdigrab needs it open
     and visible on screen to read its pixels.
     ============================================================ */
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; background:#000; overflow:hidden; }
  #stage{ position:relative; width:100vw; height:100vh; }
  #camera-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000;
  }
  #overlay-frame{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; background:transparent;
  }
  #lo-status{
    position:absolute; top:10px; left:10px; z-index:50;
    font:600 12px/1.4 system-ui, sans-serif; color:#fff;
    background:rgba(0,0,0,.55); padding:6px 10px; border-radius:6px;
  }
  #lo-status.hidden{ display:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="camera-video" autoplay playsinline muted></video>
  <iframe id="overlay-frame"></iframe>
  <div id="lo-status">Starting camera…</div>
</div>
<script>
  // ?room=<matchId>&video=<deviceId>&videoLabel=<name> — same query
  // convention the rest of the panel/overlay already use (see
  // cricket-overlay.html's own ?room= handling).
  const params = new URLSearchParams(location.search);
  const room = params.get('room') || 'default';
  const videoDeviceId = params.get('video') || '';
  const videoLabel = params.get('videoLabel') || '';
  const statusEl = document.getElementById('lo-status');

  // 🔗 Talks DIRECTLY to the local Stream Engine (127.0.0.1:5006, CORS
  // open — see server.js) instead of relying on window.opener.postMessage.
  // This window is now normally launched by the Stream Engine itself as
  // its OWN dedicated Chromium process (see launchCaptureWindow in
  // server.js) — a separate OS process has no window.opener at all, so
  // postMessage to it would silently do nothing. Reporting straight to
  // the engine works the same way whether this page ended up here via
  // that dedicated launch or the window.open() popup fallback.
  const STREAM_ENGINE_URL = 'http://127.0.0.1:5006';
  function reportToEngine(reason){
    try {
      fetch(`${STREAM_ENGINE_URL}/capture-window/camera-ended`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason, room })
      }).catch(() => {});
    } catch (e) { /* best effort — the engine's own health checks will still catch a dead feed */ }
    // Kept for the popup fallback path, where a window.opener DOES exist
    // (the Cricket Panel tab that called window.open) — harmless no-op
    // when there is no opener (dedicated capture window).
    try { window.opener && window.opener.postMessage({ type: 'allsportslive-camera-ended', room, reason }, location.origin); } catch (e) {}
  }

  // 🪟 Must match windowTitleFor(matchId) in stream-engine/server.js
  // EXACTLY — this is how ffmpeg's `-f gdigrab -i title=...` finds this
  // window to capture. Changing this format on either side breaks
  // native capture with a clear "window not found" error (see /status
  // and /capture-preview in the Stream Engine).
  document.title = `AllSportsLive-LiveOutput-${room.replace(/[^a-zA-Z0-9_-]/g, '')}`;

  document.getElementById('overlay-frame').src = `${location.origin}/cricket-overlay?room=${encodeURIComponent(room)}`;

  // 🩹 CONFIRMED IN THE FIELD: Chrome/Edge salts getUserMedia deviceIds
  // PER BROWSER PROFILE (a deliberate privacy measure). videoDeviceId
  // was chosen in the Cricket Panel's own regular browser profile; this
  // window normally runs in the Stream Engine's DEDICATED, isolated
  // capture profile (its own --user-data-dir — see launchCaptureWindow
  // in server.js), where that exact deviceId does not exist at all —
  // requesting it with {exact: ...} throws OverconstrainedError every
  // time ("Could not open camera:" with a blank error message). Device
  // LABELS are NOT profile-scoped (they come straight from the OS/
  // driver), so once this profile has SOME camera permission granted
  // (labels are hidden until then, same as anywhere else), we look up
  // the real device by label in THIS profile's own enumerateDevices()
  // and switch to it. videoDeviceId is still tried first because it
  // DOES work in the window.open() popup fallback, which shares the
  // panel's own profile — this only falls back to label-matching when
  // that fails, so nothing changes for that path.
  async function getCameraStream(){
    if(videoDeviceId){
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: videoDeviceId }, width: 1920, height: 1080 },
          audio: false
        });
      } catch(e){ /* likely a cross-profile deviceId — fall through to label matching below */ }
    }

    // No usable deviceId (or none given) — grab ANY camera first. In a
    // fresh profile this is also what actually triggers the permission
    // prompt and unlocks real device labels for the enumerateDevices()
    // call below.
    let stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1920, height: 1080 },
      audio: false
    });

    if(videoLabel){
      const devices = await navigator.mediaDevices.enumerateDevices();
      const match = devices.find(d => d.kind === 'videoinput' && d.label === videoLabel);
      const current = stream.getVideoTracks()[0];
      if(match && current.label !== videoLabel){
        // Default camera wasn't the one the operator actually picked —
        // now that labels are visible in this profile, re-request the
        // specific one by its LOCAL (profile-scoped) deviceId.
        stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: match.deviceId }, width: 1920, height: 1080 },
          audio: false
        });
      }
    }
    return stream;
  }

  async function startCamera(){
    try {
      const stream = await getCameraStream();
      const video = document.getElementById('camera-video');
      video.srcObject = stream;
      statusEl.classList.add('hidden');

      // If the camera is unplugged/disconnected mid-match, surface it
      // here immediately (visible on this window itself). The Stream
      // Engine's native gdigrab capture keeps reading whatever this
      // window renders regardless (it has no separate "camera ended"
      // signal of its own) — the operator sees the on-screen warning
      // here as the source of truth.
      stream.getVideoTracks()[0].addEventListener('ended', () => {
        statusEl.textContent = '⚠️ Camera disconnected';
        statusEl.classList.remove('hidden');
        // Tell the Stream Engine so it can stop the live push/recording
        // instead of silently continuing to capture a frozen/black frame
        // — this window has no other way to reach the Stream Engine's
        // control plane itself.
        reportToEngine('Camera disconnected (track ended)');
      });

      // 🩹 'mute'/'unmute' on a live track fire when the browser stops/
      // resumes actually RECEIVING frames from the device while it stays
      // otherwise open — exactly what a capture card reports when its
      // HDMI/video input has no signal (wrong input selected, cable
      // unplugged, source camera powered off) as opposed to a genuine
      // getUserMedia failure or an 'ended' disconnect. Without this, that
      // case looks identical to a normal black frame from the CSS
      // background and is easy to mistake for a stream-engine bug rather
      // than "no signal reaching the capture device".
      const videoTrack = stream.getVideoTracks()[0];
      if (videoTrack.muted) { statusEl.textContent = '⚠️ No video signal from camera/capture card'; statusEl.classList.remove('hidden'); }
      videoTrack.addEventListener('mute', () => {
        statusEl.textContent = '⚠️ No video signal from camera/capture card (input connected but not sending frames)';
        statusEl.classList.remove('hidden');
      });
      videoTrack.addEventListener('unmute', () => { statusEl.classList.add('hidden'); });
    } catch (e) {
      // 🩹 e.message is often EMPTY on OverconstrainedError (exactly the
      // error a stale/cross-profile deviceId throws) — e.name and
      // e.constraint carry the actually useful info in that case, and
      // this was showing as a blank, undiagnosable "Could not open
      // camera:" with nothing after it.
      const detail = [e.name, e.message, e.constraint ? `(constraint: ${e.constraint})` : ''].filter(Boolean).join(' — ') || 'unknown error';
      statusEl.textContent = '⚠️ Could not open camera: ' + detail;
      statusEl.classList.remove('hidden');
    }
  }
  startCamera();
</script>
</body>
</html>
