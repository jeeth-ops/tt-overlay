<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/socket.io/socket.io.js"></script>
<style>
  /* ============================================================
     CRICKET BROADCAST OVERLAY
     Transparent-background page intended as a Browser Source in
     OBS/vMix. Renders whatever state arrives over WebSocket from
     cricket-panel.html — this file has zero cricket logic, it
     only displays + animates.
     ============================================================ */

  :root{
    --team-a-color: #1c3a8a;      /* India-style blue, editable from panel */
    --team-b-color: #f2c200;      /* Australia-style gold, editable from panel */
    --accent: #ff7a00;            /* score orange */
    --panel-bg: rgba(8, 14, 28, 0.92);
    --panel-bg-2: rgba(14, 22, 40, 0.96);
    --glass-border: rgba(255,255,255,0.08);
    --text-primary: #ffffff;
    --text-dim: rgba(255,255,255,0.62);
    --radius: 10px;
    --font-display: 'Helvetica Neue', Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    background:transparent;
    font-family: var(--font-display);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    position:relative;
    width:100vw;
    height:100vh;
  }

  /* ---------------- Lower-third scorebug ---------------- */

  #scorebug{
    position:absolute;
    left:24px; bottom:28px;
    display:flex;
    align-items:stretch;
    height:64px;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow: 0 12px 34px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
    opacity:0;
    transform: translateY(18px);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #scorebug.show{ opacity:1; transform:translateY(0); }

  .team-block{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 16px;
    background: var(--panel-bg);
    position:relative;
  }
  .team-block .stripe{
    position:absolute; left:0; top:0; bottom:0; width:5px;
  }
  #teamA-block .stripe{ background: var(--team-a-color); }
  #teamB-block .stripe{ background: var(--team-b-color); }

  .team-flag{
    width:26px; height:26px; border-radius:50%;
    background:#333 center/cover no-repeat;
    flex:none;
    border:1px solid rgba(255,255,255,0.25);
  }

  .team-score-col{ display:flex; flex-direction:column; line-height:1; padding-left:2px; }
  .team-name{
    font-size:12px; font-weight:700; letter-spacing:.4px;
    color:var(--text-primary); text-transform:uppercase;
  }
  .team-runs{
    font-size:24px; font-weight:800; color:var(--accent);
    letter-spacing:.2px; margin-top:2px;
    font-variant-numeric: tabular-nums;
  }
  .team-overs{
    font-size:11px; color:var(--text-dim); font-weight:600; margin-top:1px;
  }

  .players-block{
    display:flex; flex-direction:column; justify-content:center;
    padding:6px 16px;
    background: var(--panel-bg-2);
    gap:3px;
    min-width:190px;
  }
  .player-row{
    display:flex; align-items:baseline; gap:8px;
    font-size:12.5px; color:var(--text-primary); font-weight:600;
  }
  .player-row .marker{
    width:6px; height:6px; border-radius:50%; background:var(--accent);
    flex:none; opacity:0; transition:opacity .3s;
  }
  .player-row.on-strike .marker{ opacity:1; }
  .player-row .pname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
  .player-row .pstat{
    font-variant-numeric: tabular-nums; color:var(--text-dim); font-weight:600; font-size:12px;
  }

  .vs-block{
    display:flex; align-items:center; justify-content:center;
    padding:0 14px;
    background: var(--panel-bg);
    color: var(--text-dim);
    font-size:12px; font-weight:700; letter-spacing:.5px;
  }

  .bowler-block{
    display:flex; flex-direction:column; justify-content:center;
    padding:6px 16px;
    background: var(--panel-bg-2);
    min-width:150px;
    gap:2px;
  }
  .bowler-name{ font-size:12.5px; font-weight:700; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .bowler-figs{ font-size:16px; font-weight:800; color:var(--accent); font-variant-numeric: tabular-nums; }

  .broadcaster-block{
    display:flex; align-items:center; justify-content:center;
    padding:0 14px;
    background: var(--panel-bg);
    color:#fff; font-size:11px; font-weight:800; letter-spacing:.6px;
  }

  /* This-over ticker */
  #this-over{
    position:absolute;
    display:flex; gap:4px;
    left:24px; bottom:12px;
  }
  .ball-pip{
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#fff;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.18);
    opacity:0; transform:scale(.4);
    transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .ball-pip.show{ opacity:1; transform:scale(1); }
  .ball-pip.four{ background:#1c8a4a; }
  .ball-pip.six{ background:#8a1cc4; }
  .ball-pip.wicket{ background:#c41c2e; }
  .ball-pip.wide, .ball-pip.noball{ background:rgba(255,255,255,0.14); border-color:var(--accent); color:var(--accent); }

  /* score pulse animation on update */
  @keyframes pulse{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .pulse{ animation: pulse .45s cubic-bezier(.34,1.56,.64,1); }

  /* ---------------- Milestone popup ---------------- */
  #milestone{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-40%) scale(.8);
    opacity:0;
    pointer-events:none;
    text-align:center;
    transition: opacity .35s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  #milestone.show{
    opacity:1;
    transform: translate(-50%,-50%) scale(1);
  }
  #milestone .m-label{
    font-size:64px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow: 0 8px 30px rgba(0,0,0,0.6);
    -webkit-text-stroke: 1px rgba(255,255,255,0.15);
  }
  #milestone .m-sub{
    margin-top:6px;
    font-size:18px;
    font-weight:700;
    color: var(--accent);
    letter-spacing:1px;
  }
  #milestone.four .m-label{ color:#22c55e; }
  #milestone.six .m-label{ color:#a855f7; }
  #milestone.wicket .m-label{ color:#ef4444; }
  #milestone.fifty .m-label, #milestone.hundred .m-label{ color:#facc15; }

  /* Connection status (small, only visible if disconnected — helps during setup) */
  #conn-status{
    position:absolute; top:14px; right:14px;
    font-size:11px; font-weight:700; color:#fff;
    background:rgba(0,0,0,0.55); padding:5px 10px; border-radius:6px;
    display:none; letter-spacing:.4px;
  }
  #conn-status.visible{ display:block; }
</style>
</head>
<body>

<div id="stage">

  <div id="scorebug">
    <div class="team-block" id="teamA-block">
      <div class="stripe"></div>
      <div class="team-flag" id="teamA-flag"></div>
      <div class="team-score-col">
        <div class="team-name" id="teamA-name">IND</div>
        <div class="team-runs" id="teamA-runs">0-0</div>
        <div class="team-overs" id="teamA-overs">0.0 ov</div>
      </div>
    </div>

    <div class="players-block">
      <div class="player-row on-strike" id="striker-row">
        <div class="marker"></div>
        <div class="pname" id="striker-name">Batsman 1</div>
        <div class="pstat" id="striker-stat">0 (0)</div>
      </div>
      <div class="player-row" id="nonstriker-row">
        <div class="marker"></div>
        <div class="pname" id="nonstriker-name">Batsman 2</div>
        <div class="pstat" id="nonstriker-stat">0 (0)</div>
      </div>
    </div>

    <div class="vs-block">v</div>

    <div class="bowler-block">
      <div class="bowler-name" id="bowler-name">Bowler</div>
      <div class="bowler-figs" id="bowler-figs">0-0</div>
      <div class="team-overs" id="bowler-overs">0.0 ov</div>
    </div>

    <div class="broadcaster-block" id="broadcaster-label">BCCI.TV</div>
  </div>

  <div id="this-over"></div>

  <div id="milestone">
    <div class="m-label" id="milestone-label">SIX</div>
    <div class="m-sub" id="milestone-sub"></div>
  </div>

  <div id="conn-status">Connecting…</div>

</div>

<script>
/* ============================================================
   SHARED STATE SCHEMA (must match cricket-panel.html exactly)
   ------------------------------------------------------------
   {
     format: 'T20'|'ODI'|'Test'|'Custom',
     teamA: { name, short, color, flagUrl },
     teamB: { name, short, color, flagUrl },
     battingTeam: 'A' | 'B',
     score: { runs, wickets, overs, balls },   // balls = legal balls in current over (0-5+)
     target: number|null,
     striker:    { name, runs, balls, fours, sixes },
     nonStriker: { name, runs, balls, fours, sixes },
     bowler:     { name, overs, balls, maidens, runs, wickets },
     thisOver: [ 'runs'|'W'|'Wd'|'Nb'|'.'... up to 6 legal balls, resets each over ],
     broadcaster: string,
     visible: boolean   // show/hide the whole scorebug
   }
   SOCKET.IO EVENTS (server relays these — see server.js):
     Server -> client: 'liveCricketScore' with the full state object above -> re-render
     Server -> client: 'cricketEvent' with { kind, text, sub, durationMs } -> one-off milestone animation

   CONNECTION
   Add this overlay in OBS/vMix as a Browser Source pointing at:
     https://<your-server>/cricket-overlay?room=<matchId>
   <matchId> must match the ID typed into the panel (cricket-panel.html) so
   both land in the same server-side room.
   ============================================================ */

  const params = new URLSearchParams(location.search);
  const matchId = params.get('room') || params.get('uid') || params.get('id') || 'default';
  const connStatus = document.getElementById('conn-status');

  connStatus.textContent = 'Connecting…';
  connStatus.classList.add('visible');

  // Same-origin connection: this file is served by the same Express+socket.io
  // server it talks to (see server.js -> app.get('/cricket-overlay', ...)).
  const socket = io({ query: { room: matchId } });

  socket.on('connect', () => { connStatus.classList.remove('visible'); });
  socket.on('disconnect', () => {
    connStatus.classList.add('visible');
    connStatus.textContent = 'Overlay disconnected — retrying…';
  });
  socket.on('connect_error', () => {
    connStatus.classList.add('visible');
    connStatus.textContent = 'Connection error — retrying…';
  });

  socket.on('liveCricketScore', (data) => renderState(data));
  socket.on('cricketEvent', (event) => playMilestone(event));

  // ---------------- Rendering ----------------
  let lastState = null;

  function pulseEl(el){
    el.classList.remove('pulse');
    void el.offsetWidth; // restart animation
    el.classList.add('pulse');
  }

  function renderState(s){
    const bug = document.getElementById('scorebug');
    if(s.visible === false){ bug.classList.remove('show'); return; }
    bug.classList.add('show');

    document.documentElement.style.setProperty('--team-a-color', s.teamA?.color || '#1c3a8a');
    document.documentElement.style.setProperty('--team-b-color', s.teamB?.color || '#f2c200');

    const battingA = s.battingTeam !== 'B';
    const battingTeam = battingA ? s.teamA : s.teamB;
    const bowlingTeam = battingA ? s.teamB : s.teamA;

    document.getElementById('teamA-name').textContent = battingTeam?.short || battingTeam?.name || '';
    if(battingTeam?.flagUrl) document.getElementById('teamA-flag').style.backgroundImage = `url(${battingTeam.flagUrl})`;

    const runsText = `${s.score?.runs ?? 0}-${s.score?.wickets ?? 0}`;
    const runsEl = document.getElementById('teamA-runs');
    if(lastState && runsEl.textContent !== runsText) pulseEl(runsEl);
    runsEl.textContent = runsText;

    const oversText = `${s.score?.overs ?? 0}.${s.score?.balls ?? 0} ov`;
    document.getElementById('teamA-overs').textContent = s.target
      ? `${oversText} · need ${Math.max(s.target - s.score.runs,0)}`
      : oversText;

    document.getElementById('striker-name').textContent = s.striker?.name || '—';
    document.getElementById('striker-stat').textContent = `${s.striker?.runs ?? 0} (${s.striker?.balls ?? 0})`;
    document.getElementById('nonstriker-name').textContent = s.nonStriker?.name || '—';
    document.getElementById('nonstriker-stat').textContent = `${s.nonStriker?.runs ?? 0} (${s.nonStriker?.balls ?? 0})`;

    document.getElementById('bowler-name').textContent = s.bowler?.name || '—';
    document.getElementById('bowler-figs').textContent = `${s.bowler?.wickets ?? 0}-${s.bowler?.runs ?? 0}`;
    document.getElementById('bowler-overs').textContent = `${s.bowler?.overs ?? 0}.${s.bowler?.balls ?? 0} ov`;

    if(s.broadcaster) document.getElementById('broadcaster-label').textContent = s.broadcaster;

    // this-over pips
    const container = document.getElementById('this-over');
    container.innerHTML = '';
    (s.thisOver || []).forEach((b, i) => {
      const pip = document.createElement('div');
      pip.className = 'ball-pip';
      let cls = '', label = b;
      if(b === '4'){ cls = 'four'; }
      else if(b === '6'){ cls = 'six'; }
      else if(b === 'W'){ cls = 'wicket'; }
      else if(b === 'Wd'){ cls = 'wide'; label = 'Wd'; }
      else if(b === 'Nb'){ cls = 'noball'; label = 'Nb'; }
      pip.classList.add(cls);
      pip.textContent = label;
      container.appendChild(pip);
      setTimeout(() => pip.classList.add('show'), 30 * i);
    });

    lastState = s;
  }

  // ---------------- Milestone animation ----------------
  let milestoneTimer = null;
  function playMilestone(evt){
    const el = document.getElementById('milestone');
    const label = document.getElementById('milestone-label');
    const sub = document.getElementById('milestone-sub');

    el.className = ''; // reset
    el.classList.add((evt.kind || '').toLowerCase());
    label.textContent = evt.text || evt.kind || '';
    sub.textContent = evt.sub || '';

    clearTimeout(milestoneTimer);
    // force reflow so re-triggering the same milestone still animates
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');

    const holdMs = evt.durationMs || 2600;
    milestoneTimer = setTimeout(() => { el.classList.remove('show'); }, holdMs);
  }
</script>
</body>
</html>
