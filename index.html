<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyScoreboard - Live Sports Graphics</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #00d2ff;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 50px;
        }
        .sport-btn {
            background: #1e1e1e;
            border: 2px solid #333;
            padding: 20px 40px;
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            display: inline-block;
            transition: all 0.3s ease; /* Yeh animation ke liye hai */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* Hover karne par button bada hoga aur glow karega */
        .sport-btn:hover {
            transform: scale(1.1);
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <h1>MyScoreboard Hub</h1>
    <p class="subtitle">Professional Live Overlays for Streamers</p>

    <!-- Table Tennis ka Button jo Templates page par le jayega -->
    <a href="/tt-templates" class="sport-btn">🏓 Table Tennis</a>

</body>
</html>
