<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Match Controller</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        .control-box { background: #333; padding: 20px; margin: 10px auto; width: 350px; border-radius: 8px; }
        button { padding: 10px 15px; font-size: 16px; margin: 5px; cursor: pointer; }
        select { padding: 8px; font-size: 16px; margin-bottom: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>Table Tennis Controller</h1>

    <div class="control-box">
        <h3>Match Format</h3>
        <select id="matchFormat" onchange="sendUpdate()">
            <option value="bestOf5">Best of 5 (First to 3 Sets)</option>
            <option value="bestOf7">Best of 7 (First to 4 Sets)</option>
        </select>
    </div>

    <div class="control-box">
        <h2 id="p1Display">Player 1</h2>
        <p>Score: <span id="p1Score">0</span> | Sets: <span id="p1Sets">0</span></p>
        <button onclick="changeScore('p1', 1)">+ Score</button>
        <button onclick="changeScore('p1', -1)">- Score</button>
        <br>
        <button onclick="changeSet('p1', 1)">+ Set</button>
        <button onclick="changeSet('p1', -1)">- Set</button>
    </div>

    <div class="control-box">
        <h2 id="p2Display">Player 2</h2>
        <p>Score: <span id="p2Score">0</span> | Sets: <span id="p2Sets">0</span></p>
        <button onclick="changeScore('p2', 1)">+ Score</button>
        <button onclick="changeScore('p2', -1)">- Score</button>
        <br>
        <button onclick="changeSet('p2', 1)">+ Set</button>
        <button onclick="changeSet('p2', -1)">- Set</button>
    </div>

    <button onclick="resetMatch()" style="background: red; color: white;">Reset Match</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentState = {
            p1Name: 'Player 1',
            p2Name: 'Player 2',
            p1Score: 0,
            p2Score: 0,
            p1Sets: 0,
            p2Sets: 0,
            matchFormat: 'bestOf5'
        };

        socket.on('updateState', (state) => {
            currentState = state;
            document.getElementById('p1Score').innerText = state.p1Score;
            document.getElementById('p2Score').innerText = state.p2Score;
            document.getElementById('p1Sets').innerText = state.p1Sets;
            document.getElementById('p2Sets').innerText = state.p2Sets;
            document.getElementById('matchFormat').value = state.matchFormat || 'bestOf5';
        });

        function changeScore(player, val) {
            if (player === 'p1') currentState.p1Score = Math.max(0, currentState.p1Score + val);
            if (player === 'p2') currentState.p2Score = Math.max(0, currentState.p2Score + val);
            sendUpdate();
        }

        function changeSet(player, val) {
            if (player === 'p1') currentState.p1Sets = Math.max(0, currentState.p1Sets + val);
            if (player === 'p2') currentState.p2Sets = Math.max(0, currentState.p2Sets + val);
            sendUpdate();
        }

        function sendUpdate() {
            currentState.matchFormat = document.getElementById('matchFormat').value;
            socket.emit('updateScore', currentState);
        }

        function resetMatch() {
            socket.emit('resetMatch');
        }
    </script>
</body>
</html>
