<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Professional Live Overlays</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7); /* Translucent for glass effect */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e; /* Scorvix Peaceful Modern Red */
            --accent-hover: #e11d48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* --- Page Transition Smooth Setup --- */
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.page-loaded {
            opacity: 1;
            transform: translateY(0);
        }
        body.page-leaving {
            opacity: 0;
            transform: translateY(-15px);
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(12px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }
        h2 { 
            border-bottom: 2px solid rgba(255, 255, 255, 0.1); 
            padding-bottom: 12px; 
            color: var(--accent); 
            margin-bottom: 20px; 
            font-size: 1.5rem; 
        }
        
        .section { 
            margin-bottom: 25px; 
            background: rgba(15, 23, 42, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: #fff; 
            border-radius: 8px; 
            font-size: 0.95rem; 
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 250px; }

        button { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 12px 20px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            width: 100%; 
            margin-top: 5px; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
            letter-spacing: 0.5px; 
        }
        button:hover { background: var(--accent-hover); transform: translateY(-2px); }
        
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        
        .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .color-picker-group { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
        .color-picker-item { display: flex; align-items: center; gap: 10px; }
        .color-picker-item input[type="color"] { width: 45px; height: 35px; padding: 0; border: none; cursor: pointer; background: none; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎮 Match Control Panel</h2>

        <!-- Tourney & Names -->
        <div class="section">
            <label>Tournament Title</label>
            <input type="text" id="tourneyTitle" value="TABLE TENNIS SUPER LEAGUE 2026">
            
            <div class="row">
                <div class="col">
                    <label>Player / Team 1 Name</label>
                    <input type="text" id="p1Name" value="PLAYER A">
                </div>
                <div class="col">
                    <label>Player / Team 2 Name</label>
                    <input type="text" id="p2Name" value="PLAYER B">
                </div>
            </div>
        </div>

        <!-- Scores & Server -->
        <div class="section">
            <div class="row">
                <div class="col">
                    <label>Player 1 Score: <span id="lbl-p1-score">0</span></label>
                    <div class="controls-grid">
                        <button onclick="updateScore('p1', 1)">+1</button>
                        <button onclick="updateScore('p1', -1)" class="btn-danger">-1</button>
                        <button onclick="updateScore('p1Set', 1)" class="btn-success">+Set</button>
                    </div>
                </div>
                <div class="col">
                    <label>Player 2 Score: <span id="lbl-p2-score">0</span></label>
                    <div class="controls-grid">
                        <button onclick="updateScore('p2', 1)">+1</button>
                        <button onclick="updateScore('p2', -1)" class="btn-danger">-1</button>
                        <button onclick="updateScore('p2Set', 1)" class="btn-success">+Set</button>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 15px;">
                <label>Current Server</label>
                <select id="server" onchange="sendData()">
                    <option value="1">Player 1</option>
                    <option value="2">Player 2</option>
                </select>
            </div>
        </div>

        <!-- Simple Announcement & Color Palette Section -->
        <div class="section">
            <label>💬 Announcement & Color Palette Controller</label>
            
            <div class="row">
                <div class="col">
                    <label>Title Text</label>
                    <input type="text" id="announceTitle" value="BREAKING NEWS">
                </div>
                <div class="col" style="flex: 2;">
                    <label>Announcement Text</label>
                    <input type="text" id="announceText" value="Next match will start shortly.">
                </div>
            </div>

            <div class="color-picker-group">
                <div class="color-picker-item">
                    <input type="color" id="titleColor" value="#f43f5e" onchange="sendData()">
                    <label style="margin-bottom: 0; cursor: pointer;" for="titleColor">Title Tab Color</label>
                </div>
                <div class="color-picker-item">
                    <input type="color" id="boxColor" value="#0f172a" onchange="sendData()">
                    <label style="margin-bottom: 0; cursor: pointer;" for="boxColor">Main Box Color</label>
                </div>
            </div>
        </div>

        <!-- Overlay States -->
        <div class="section">
            <label>📺 Active Overlay View on Stream</label>
            <div class="row" style="gap: 10px;">
                <button onclick="setState('score-in')" class="btn-success" style="flex: 1;">Show Scoreboard</button>
                <button onclick="setState('announcement-in')" class="btn-success" style="flex: 1; background: #f43f5e;">Show Announcement</button>
                <button onclick="setState('header-in')" style="flex: 1;">Header Banner</button>
                <button onclick="setState('intro-in')" style="flex: 1;">Match Intro</button>
                <button onclick="setState('table-in')" style="flex: 1;">Points Table</button>
                <button onclick="setState('winner-in')" class="btn-danger" style="flex: 1;">Winner</button>
                <button onclick="setState('hide')" class="btn-danger" style="flex: 1; background: #334155;">Hide All</button>
            </div>
            <div style="margin-top: 15px;">
                <label>Winner Announcement Text</label>
                <input type="text" id="winner" value="PLAYER A WON THE MATCH">
            </div>
        </div>
    </div>

    <script>
        // Page Load Transition Logic
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-loaded');
        });

        const socket = io();

        let stateData = {
            tourneyTitle: "TABLE TENNIS SUPER LEAGUE 2026",
            p1Name: "PLAYER A",
            p2Name: "PLAYER B",
            p1Score: 0,
            p2Score: 0,
            p1Sets: 0,
            p2Sets: 0,
            server: 1,
            state: "score-in",
            winner: "PLAYER A WON THE MATCH",
            announcementTitle: "BREAKING NEWS",
            announcementText: "Next match will start shortly.",
            titleColor: "#f43f5e",
            boxColor: "#0f172a",
            standings: []
        };

        function updateScore(type, val) {
            if (type === 'p1') stateData.p1Score = Math.max(0, stateData.p1Score + val);
            if (type === 'p2') stateData.p2Score = Math.max(0, stateData.p2Score + val);
            if (type === 'p1Set') stateData.p1Sets = Math.max(0, stateData.p1Sets + val);
            if (type === 'p2Set') stateData.p2Sets = Math.max(0, stateData.p2Sets + val);
            
            document.getElementById('lbl-p1-score').innerText = stateData.p1Score;
            document.getElementById('lbl-p2-score').innerText = stateData.p2Score;
            sendData();
        }

        function setState(st) {
            stateData.state = st;
            sendData();
        }

        function sendData() {
            stateData.tourneyTitle = document.getElementById('tourneyTitle').value;
            stateData.p1Name = document.getElementById('p1Name').value;
            stateData.p2Name = document.getElementById('p2Name').value;
            stateData.server = parseInt(document.getElementById('server').value);
            stateData.winner = document.getElementById('winner').value;
            stateData.announcementTitle = document.getElementById('announceTitle').value;
            stateData.announcementText = document.getElementById('announceText').value;
            stateData.titleColor = document.getElementById('titleColor').value;
            stateData.boxColor = document.getElementById('boxColor').value;

            socket.emit('updateScore', stateData);
        }

        document.querySelectorAll('input').forEach(input => {
            if(input.type !== 'color') {
                input.addEventListener('input', sendData);
            }
        });
    </script>
</body>
</html>
