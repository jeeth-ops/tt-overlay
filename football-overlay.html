<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorvix - Football Live Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        /* Transparent background for OBS / vMix */
        body {
            background: transparent;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        /* Scoreboard Main Wrapper (Top Center) */
        .scoreboard-wrapper {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(11, 15, 25, 0.9);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.12);
            transition: all 0.3s ease;
        }

        /* Hidden state via Master Toggle */
        .scoreboard-wrapper.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(-30px);
            pointer-events: none;
        }

        /* Team Box */
        .team-box {
            display: flex;
            align-items: center;
            padding: 10px 18px;
            gap: 12px;
            position: relative;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Score Box */
        .score-box {
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.4);
            min-width: 55px;
            text-align: center;
        }

        /* Center Clock Container */
        .clock-container {
            background: #090d16;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            min-width: 85px;
        }

        .match-time {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .match-half {
            font-size: 0.6rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Penalty shootout extra info row */
        .penalties-bar {
            position: absolute;
            bottom: -24px;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            font-size: 0.7rem;
            font-weight: 700;
            color: #fbbf24;
            text-align: center;
            padding: 3px 0;
            letter-spacing: 1px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            border-top: none;
        }

        /* Action Replay Badge (Top Right) */
        .replay-badge {
            position: absolute;
            top: 30px;
            right: 40px;
            background: #eab308;
            color: #000000;
            font-size: 1rem;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
            animation: pulseReplay 1.5s infinite;
        }
        .replay-badge.active { display: block; }

        @keyframes pulseReplay {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Fullscreen Status Modal (HT / FT / Penalties) */
        .status-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
        }
        .status-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-box {
            text-align: center;
            border: 3px solid #38bdf8;
            padding: 30px 70px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .modal-title-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .modal-sub-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Main Scoreboard Container -->
    <div class="scoreboard-wrapper" id="scoreboardWrapper">
        <!-- Team A -->
        <div class="team-box" id="boxA">
            <img id="logoA" class="team-logo" src="" style="display: none;" alt="">
            <span class="team-name" id="nameA">TEAM A</span>
            <div class="score-box" id="scoreA">0</div>
        </div>

        <!-- Center Match Timer -->
        <div class="clock-container" id="clockContainer">
            <div class="match-time" id="timerDisplay">00:00</div>
            <div class="match-half" id="halfDisplay">1ST HALF</div>
        </div>

        <!-- Team B -->
        <div class="team-box" id="boxB">
            <div class="score-box" id="scoreB">0</div>
            <span class="team-name" id="nameB">TEAM B</span>
            <img id="logoB" class="team-logo" src="" style="display: none;" alt="">
        </div>

        <!-- Penalty Shootout Tag -->
        <div class="penalties-bar" id="penaltiesBar" style="display: none;">
            PENALTIES: <span id="penScoreA">0</span> - <span id="penScoreB">0</span>
        </div>
    </div>

    <!-- Action Replay Badge -->
    <div class="replay-badge" id="replayBadge">⚡ ACTION REPLAY</div>

    <!-- Fullscreen Half Time / Full Time Modal -->
    <div class="status-modal" id="statusModal">
        <div class="modal-content-box" id="modalBoxTheme">
            <div class="modal-title-text" id="modalTitleText">HALF TIME</div>
            <div class="modal-sub-score" id="modalSubScoreText">REAL MADRID 2 - 1 BARCELONA</div>
        </div>
    </div>

    <script>
        function loadOverlayData() {
            const rawData = localStorage.getItem('scorvix_football');
            if (!rawData) return;
            const data = JSON.parse(rawData);

            // 1. Master Toggle
            const wrapper = document.getElementById('scoreboardWrapper');
            if (data.showScoreboard) {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }

            // 2. Team Names & Scores
            document.getElementById('nameA').innerText = data.nameA || "TEAM A";
            document.getElementById('nameB').innerText = data.nameB || "TEAM B";
            document.getElementById('scoreA').innerText = data.scoreA ?? 0;
            document.getElementById('scoreB').innerText = data.scoreB ?? 0;

            // 3. Team Logos
            const imgA = document.getElementById('logoA');
            if (data.showLogoA && data.logoA) {
                imgA.src = data.logoA;
                imgA.style.display = 'block';
            } else {
                imgA.style.display = 'none';
            }

            const imgB = document.getElementById('logoB');
            if (data.showLogoB && data.logoB) {
                imgB.src = data.logoB;
                imgB.style.display = 'block';
            } else {
                imgB.style.display = 'none';
            }

            // 4. Colors
            if(data.colorA) document.getElementById('boxA').style.borderBottom = `4px solid ${data.colorA}`;
            if(data.colorB) document.getElementById('boxB').style.borderBottom = `4px solid ${data.colorB}`;
            if(data.colorClock) document.getElementById('clockContainer').style.backgroundColor = data.colorClock;
            if(data.colorModal) {
                document.getElementById('modalBoxTheme').style.borderColor = data.colorModal;
            }

            // 5. Timer & Half Calculation
            document.getElementById('timerDisplay').innerText = data.timer || "00:00";
            let parts = (data.timer || "00:00").split(":");
            let currentMins = parseInt(parts[0]) || 0;
            let duration = data.matchDuration || 90;
            let halfDuration = Math.floor(duration / 2);

            let halfText = "1ST HALF";
            if (currentMins >= halfDuration) halfText = "2ND HALF";
            if (currentMins >= duration) halfText = "FT";
            document.getElementById('halfDisplay').innerText = halfText;

            // 6. Penalties Shootout
            const penBar = document.getElementById('penaltiesBar');
            if (data.penA !== "" || data.penB !== "") {
                penBar.style.display = 'block';
                document.getElementById('penScoreA').innerText = data.penA || "0";
                document.getElementById('penScoreB').innerText = data.penB || "0";
            } else {
                penBar.style.display = 'none';
            }

            // 7. Action Replay Badge
            const replay = document.getElementById('replayBadge');
            if (data.showActionReplay) {
                replay.classList.add('active');
            } else {
                replay.classList.remove('active');
            }

            // 8. Fullscreen Modals (HT/FT)
            const modal = document.getElementById('statusModal');
            if (data.activeModal && data.activeModal !== "") {
                modal.classList.add('active');
                document.getElementById('modalTitleText').innerText = data.activeModal;
                document.getElementById('modalSubScoreText').innerText = `${data.nameA || 'TEAM A'} ${data.scoreA ?? 0} - ${data.scoreB ?? 0} ${data.nameB || 'TEAM B'}`;
            } else {
                modal.classList.remove('active');
            }
        }

        // Real-time listener using storage event & interval sync
        window.addEventListener('storage', loadOverlayData);
        setInterval(loadOverlayData, 200);

        // Initial call
        loadOverlayData();
    </script>
</body>
</html>
