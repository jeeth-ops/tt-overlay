<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Overlay - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 40px;
        }

        .scoreboard-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main Scoreboard Row */
        .main-board {
            display: flex;
            align-items: center;
            background: #121212;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            transform-origin: center;
            animation: slideInScores 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInScores {
            0% { transform: scaleX(0); opacity: 0; }
            100% { transform: scaleX(1); opacity: 1; }
        }

        .team-logo-box {
            width: 45px;
            height: 40px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .team-logo-box img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-name {
            padding: 0 18px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .score-box {
            width: 45px;
            height: 40px;
            background: #1e1e1e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Timer Box - Appears from behind/below the center scores */
        .timer-box {
            position: absolute;
            top: 38px;
            background: #181818;
            color: #f8fafc;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 0 0 6px 6px;
            border: 1px solid rgba(255,255,255,0.1);
            border-top: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            z-index: -1;
            animation: slideUpTimer 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            transform: translateY(-20px);
            opacity: 0;
        }

        @keyframes slideUpTimer {
            0% { transform: translateY(-25px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Action Replay / Halftime Notification Banner */
        .status-badge {
            position: absolute;
            top: 75px;
            background: #ef4444;
            color: white;
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            display: none; /* Controlled dynamically */
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <div class="main-board">
            <div class="team-logo-box">
                <img id="logoA" src="" alt="Team A Logo">
            </div>
            <div class="team-name" id="nameA">TEAM A</div>
            <div class="score-box" id="scoreA">0</div>
            
            <div class="score-box" id="scoreB">0</div>
            <div class="team-name" id="nameB">TEAM B</div>
            <div class="team-logo-box">
                <img id="logoB" src="" alt="Team B Logo">
            </div>
        </div>

        <div class="timer-box" id="matchTimer">00:00</div>
        <div class="status-badge" id="statusBadge">HALF TIME</div>
    </div>

</body>
</html>
