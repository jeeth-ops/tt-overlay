<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Match Overlay - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: transparent; 
            width: 1920px; 
            height: 1080px; 
            overflow: hidden; 
            position: relative; 
        }

        /* Main Scoreboard Wrapper */
        .scoreboard-wrapper {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .scoreboard-wrapper.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Team Block */
        .team-block {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            gap: 16px;
            position: relative;
        }

        .team-block.team-a { border-right: 2px solid rgba(255,255,255,0.1); }
        .team-block.team-b { border-left: 2px solid rgba(255,255,255,0.1); }

        .team-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: none;
        }

        .team-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .team-score {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 14px;
            border-radius: 6px;
            min-width: 46px;
            text-align: center;
        }

        .penalties-badge {
            font-size: 0.75rem;
            background: #eab308;
            color: #000;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        /* Center Clock Block */
        .clock-block {
            padding: 14px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #090d16;
            min-width: 110px;
        }

        .match-time {
            font-size: 1.3rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* Action Replay Badge */
        .action-replay-badge {
            position: absolute;
            top: 40px;
            right: 50px;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            font-size: 1.1rem;
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: none;
            animation: pulseReplay 1.5s infinite;
        }

        @keyframes pulseReplay {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Fullscreen Modal (HT / FT / Penalties) */
        .fullscreen-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }

        .fullscreen-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-box {
            text-align: center;
            border: 4px solid #38bdf8;
            padding: 40px 80px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-score-sub {
            font-size: 1.8rem;
            font-weight: 700;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Scoreboard -->
    <div id="scoreboardWrapper" class="scoreboard-wrapper">
        <!-- Team A -->
        <div class="team-block team-a" id="blockA">
            <img id="imgLogoA" class="team-logo" src="" alt="Logo A">
            <span id="txtTeamA" class="team-name">TEAM A</span>
            <span id="txtScoreA" class="team-score">0</span>
            <span id="badgePenA" class="penalties-badge" style="display:none;">P: <span id="valPenA">0</span></span>
        </div>

        <!-- Center Match Clock -->
        <div class="clock-block" id="clockBg">
            <span id="txtTimer" class="match-time">00:00</span>
        </div>

        <!-- Team B -->
        <div class="team-block team-b" id="blockB">
            <span id="badgePenB" class="penalties-badge" style="display:none;">P: <span id="valPenB">0</span></span>
            <span id="txtScoreB" class="team-score">0</span>
            <span id="txtTeamB" class="team-name">TEAM B</span>
            <img id="imgLogoB" class="team-logo" src="" alt="Logo B">
        </div>
    </div>

    <!-- Action Replay Badge -->
    <div id="actionReplayBadge" class="action-replay-badge">🎬 ACTION REPLAY</div>

    <!-- Fullscreen Modal -->
    <div id="fullscreenModal" class="fullscreen-modal">
        <div class="modal-content-box" id="modalBox">
            <div id="modalTitleText" class="modal-title">HALF TIME</div>
            <div id="modalScoreText" class="modal-score-sub">REAL MADRID 0 - 0 BARCELONA</div>
        </div>
    </div>

    <!-- Socket.io client script with direct WebSocket transport -->
    <script src="https://tt-overlay-lph4.onrender.com/socket.io/socket.io.js"></script>
    <script>
        const socket = io("https://tt-overlay-lph4.onrender.com", {
            transports: ['websocket'],
            upgrade: false
        });

        socket.on('liveFootballScore', (data) => {
            // Master Toggle
            const wrapper = document.getElementById('scoreboardWrapper');
            if (data.showScoreboard) {
                wrapper.classList.add('visible');
            } else {
                wrapper.classList.remove('visible');
            }

            // Teams Name & Scores
            document.getElementById('txtTeamA').textContent = data.nameA || 'TEAM A';
            document.getElementById('txtTeamB').textContent = data.nameB || 'TEAM B';
            document.getElementById('txtScoreA').textContent = data.scoreA ?? 0;
            document.getElementById('txtScoreB').textContent = data.scoreB ?? 0;

            // Logos
            const imgA = document.getElementById('imgLogoA');
            if (data.logoA && data.showLogoA) {
                imgA.src = data.logoA;
                imgA.style.display = 'block';
            } else {
                imgA.style.display = 'none';
            }

            const imgB = document.getElementById('imgLogoB');
            if (data.logoB && data.showLogoB) {
                imgB.src = data.logoB;
                imgB.style.display = 'block';
            } else {
                imgB.style.display = 'none';
            }

            // Colors
            if (data.colorClock) {
                document.getElementById('clockBg').style.backgroundColor = data.colorClock;
            }
            if (data.colorModal) {
                document.getElementById('modalBox').style.borderColor = data.colorModal;
            }

            // Timer
            document.getElementById('txtTimer').textContent = data.timer || '00:00';

            // Penalties
            const penAEl = document.getElementById('badgePenA');
            const penBEl = document.getElementById('badgePenB');
            if (data.penA !== "" && data.penA !== undefined) {
                penAEl.style.display = 'inline-block';
                document.getElementById('valPenA').textContent = data.penA;
            } else {
                penAEl.style.display = 'none';
            }

            if (data.penB !== "" && data.penB !== undefined) {
                penBEl.style.display = 'inline-block';
                document.getElementById('valPenB').textContent = data.penB;
            } else {
                penBEl.style.display = 'none';
            }

            // Action Replay
            const arBadge = document.getElementById('actionReplayBadge');
            arBadge.style.display = data.showActionReplay ? 'block' : 'none';

            // Fullscreen Modal
            const modal = document.getElementById('fullscreenModal');
            if (data.activeModal && data.activeModal.trim() !== "") {
                modal.classList.add('active');
                document.getElementById('modalTitleText').textContent = data.activeModal;
                document.getElementById('modalScoreText').textContent = `${data.nameA || 'TEAM A'} ${data.scoreA ?? 0} - ${data.scoreB ?? 0} ${data.nameB || 'TEAM B'}`;
            } else {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
