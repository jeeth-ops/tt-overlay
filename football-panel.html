<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Control Panel - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        /* Auth Screen Overlay */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155;
            max-width: 400px;
            width: 100%;
        }
        .auth-box h2 { color: #38bdf8; margin-bottom: 10px; font-size: 1.6rem; }
        .auth-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .google-btn {
            background: #ffffff;
            color: #1e293b;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .google-btn:hover { background: #f1f5f9; }

        /* Main App Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; /* Hidden until authenticated */
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .logout-btn:hover { background: #dc2626; }

        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .score-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .score-controls button {
            flex: 1;
            padding: 8px;
            font-weight: bold;
            background: #334155;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .score-controls button:hover { background: #475569; }
        .score-controls button.inc { background: #16a34a; }
        .score-controls button.inc:hover { background: #15803d; }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover { background: #0369a1; }
        .btn-goal { background: #16a34a; }
        .btn-goal:hover { background: #15803d; }
        .flex-row { display: flex; gap: 10px; }
    </style>

    <!-- Firebase SDKs (Compat Version for seamless single-file usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="auth-box">
            <h2>Scorvix Football</h2>
            <p>Please sign in with Google to access your private match control panel.</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.25h2.94c1.72-1.58 2.78-3.9 2.78-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.25c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.83 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H.96C.35 6.16 0 7.53 0 9s.35 2.84.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.46 2.17.96 4.95l3.01 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Panel Container -->
    <div class="container" id="mainContainer">
        <div class="header-bar">
            <h1>⚽ Football Live Control Panel</h1>
            <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>

        <div class="section-grid">
            <!-- Team A Controls -->
            <div class="card">
                <h3>Team A (Home)</h3>
                <label>Team Name</label>
                <input type="text" id="nameA" value="REAL MADRID" oninput="saveAndSend()">
                
                <label>Score</label>
                <div class="score-controls">
                    <button onclick="updateScore('A', -1)">-</button>
                    <input type="number" id="scoreA" value="0" oninput="saveAndSend()" style="margin-bottom:0; text-align:center;">
                    <button class="inc" onclick="updateScore('A', 1)">+</button>
                </div>

                <label>Logo URL</label>
                <input type="text" id="logoA" placeholder="Image URL" oninput="saveAndSend()">
                <label><input type="checkbox" id="showLogoA" checked onchange="saveAndSend()"> Show Logo A</label>

                <label>Background Color</label>
                <input type="color" id="colorA" value="#0b0f19" onchange="saveAndSend()">
            </div>

            <!-- Team B Controls -->
            <div class="card">
                <h3>Team B (Away)</h3>
                <label>Team Name</label>
                <input type="text" id="nameB" value="BARCELONA" oninput="saveAndSend()">
                
                <label>Score</label>
                <div class="score-controls">
                    <button onclick="updateScore('B', -1)">-</button>
                    <input type="number" id="scoreB" value="0" oninput="saveAndSend()" style="margin-bottom:0; text-align:center;">
                    <button class="inc" onclick="updateScore('B', 1)">+</button>
                </div>

                <label>Logo URL</label>
                <input type="text" id="logoB" placeholder="Image URL" oninput="saveAndSend()">
                <label><input type="checkbox" id="showLogoB" checked onchange="saveAndSend()"> Show Logo B</label>

                <label>Background Color</label>
                <input type="color" id="colorB" value="#0b0f19" onchange="saveAndSend()">
            </div>
        </div>

        <div class="section-grid">
            <!-- Match Status & Timer -->
            <div class="card">
                <h3>Match Timing & Status</h3>
                <label>Timer (e.g., 45:00)</label>
                <input type="text" id="timer" value="00:00" oninput="saveAndSend()">

                <label>Fullscreen Modal Status</label>
                <select id="activeModal" onchange="saveAndSend()">
                    <option value="">None (Hidden)</option>
                    <option value="HALF TIME">Half Time</option>
                    <option value="FULL TIME">Full Time</option>
                    <option value="EXTRA TIME">Extra Time</option>
                    <option value="PENALTIES">Penalties Shootout</option>
                </select>

                <label><input type="checkbox" id="showScoreboard" checked onchange="saveAndSend()"> Show Scoreboard on Overlay</label>
            </div>

            <!-- Extras & Effects -->
            <div class="card">
                <h3>Effects & Penalties</h3>
                <label>Penalties Score (Team A - Team B)</label>
                <div class="flex-row">
                    <input type="text" id="penA" placeholder="Pen A" oninput="saveAndSend()">
                    <input type="text" id="penB" placeholder="Pen B" oninput="saveAndSend()">
                </div>

                <label><input type="checkbox" id="showActionReplay" onchange="saveAndSend()"> Show Action Replay Badge</label>

                <button class="btn-primary btn-goal" onclick="triggerManualGoal()">⚽ Trigger Goal Animation</button>
            </div>
        </div>
    </div>

    <!-- Socket.io Client Script -->
    <script src="https://tt-overlay-lph4.onrender.com/socket.io/socket.io.js"></script>
    <script>
        // TODO: Replace with your actual Firebase project credentials
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const socket = io("https://tt-overlay-lph4.onrender.com", {
            transports: ['polling', 'websocket'],
            upgrade: true
        });

        let currentUser = null;
        let isInitialLoad = true;

        // User-specific Firestore Reference function
        function getFirestoreRef() {
            if (!currentUser) return null;
            return db.collection('users').doc(currentUser.uid).collection('match_data').doc('football_current');
        }

        // Auth State Observer
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainContainer').style.display = 'none';
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                alert("Login Error: " + error.message);
            });
        }

        function logout() {
            auth.signOut();
        }

        // Load data from user-specific Firestore path
        function loadUserData() {
            const ref = getFirestoreRef();
            if (!ref) return;

            ref.get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    setFields(data);
                }
                isInitialLoad = false;
                sendData(); // Sync initial state to socket/overlay
            }).catch((error) => {
                console.error("Error loading data:", error);
                isInitialLoad = false;
            });
        }

        function setFields(data) {
            if (data.nameA !== undefined) document.getElementById('nameA').value = data.nameA;
            if (data.nameB !== undefined) document.getElementById('nameB').value = data.nameB;
            if (data.scoreA !== undefined) document.getElementById('scoreA').value = data.scoreA;
            if (data.scoreB !== undefined) document.getElementById('scoreB').value = data.scoreB;
            if (data.logoA !== undefined) document.getElementById('logoA').value = data.logoA;
            if (data.logoB !== undefined) document.getElementById('logoB').value = data.logoB;
            if (data.showLogoA !== undefined) document.getElementById('showLogoA').checked = data.showLogoA;
            if (data.showLogoB !== undefined) document.getElementById('showLogoB').checked = data.showLogoB;
            if (data.colorA !== undefined) document.getElementById('colorA').value = data.colorA;
            if (data.colorB !== undefined) document.getElementById('colorB').value = data.colorB;
            if (data.timer !== undefined) document.getElementById('timer').value = data.timer;
            if (data.activeModal !== undefined) document.getElementById('activeModal').value = data.activeModal;
            if (data.showScoreboard !== undefined) document.getElementById('showScoreboard').checked = data.showScoreboard;
            if (data.penA !== undefined) document.getElementById('penA').value = data.penA;
            if (data.penB !== undefined) document.getElementById('penB').value = data.penB;
            if (data.showActionReplay !== undefined) document.getElementById('showActionReplay').checked = data.showActionReplay;
        }

        function updateScore(team, val) {
            const input = document.getElementById('score' + team);
            let current = parseInt(input.value) || 0;
            current = Math.max(0, current + val);
            input.value = current;
            saveAndSend();
        }

        function triggerManualGoal() {
            let data = collectData();
            data.triggerGoalPopup = Date.now();
            socket.emit('liveFootballScore', data);
        }

        function collectData() {
            return {
                nameA: document.getElementById('nameA').value,
                nameB: document.getElementById('nameB').value,
                scoreA: parseInt(document.getElementById('scoreA').value) || 0,
                scoreB: parseInt(document.getElementById('scoreB').value) || 0,
                logoA: document.getElementById('logoA').value,
                logoB: document.getElementById('logoB').value,
                showLogoA: document.getElementById('showLogoA').checked,
                showLogoB: document.getElementById('showLogoB'].checked || true,
                colorA: document.getElementById('colorA').value,
                colorB: document.getElementById('colorB').value,
                timer: document.getElementById('timer').value,
                activeModal: document.getElementById('activeModal').value,
                showScoreboard: document.getElementById('showScoreboard').checked,
                penA: document.getElementById('penA').value,
                penB: document.getElementById('penB').value,
                showActionReplay: document.getElementById('showActionReplay').checked
            };
        }

        function saveAndSend() {
            if (isInitialLoad) return;
            const data = collectData();

            // 1. Save to Firestore under user-specific path (`getFirestoreRef()`)
            const ref = getFirestoreRef();
            if (ref) {
                ref.set(data, { merge: true }).catch(err => console.error("Firestore save error:", err));
            }

            // 2. Emit via Socket.io to overlay
            socket.emit('liveFootballScore', data);
        }

        function sendData() {
            const data = collectData();
            socket.emit('liveFootballScore', data);
        }
    </script>
</body>
</html>
