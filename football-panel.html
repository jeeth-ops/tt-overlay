<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Control Panel - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --accent: #22c55e;
            --accent-hover: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding: 30px; min-height: 100vh; }
        .panel-container { max-width: 800px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; color: #4ade80; }
        .control-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        input, select { background: #0b1329; border: 1px solid var(--border-color); color: white; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="panel-container">
        <h2>⚽ Football Match Control Center</h2>
        
        <div class="row">
            <div class="control-group">
                <label>Team A Name</label>
                <input type="text" id="inputNameA" value="MANCHESTER">
            </div>
            <div class="control-group">
                <label>Team B Name</label>
                <input type="text" id="inputNameB" value="CHELSEA">
            </div>
        </div>

        <div class="row">
            <div class="control-group">
                <label>Team A Logo URL / File</label>
                <input type="text" id="inputLogoA" value="https://crests.football-data.org/66.svg">
            </div>
            <div class="control-group">
                <label>Team B Logo URL / File</label>
                <input type="text" id="inputLogoB" value="https://crests.football-data.org/61.svg">
            </div>
        </div>

        <div class="row">
            <div class="control-group">
                <label>Match Half Duration</label>
                <select id="matchDuration">
                    <option value="15">30 Mins Match (15m per half)</option>
                    <option value="20" selected>40 Mins Match (20m per half)</option>
                    <option value="30">60 Mins Match (30m per half)</option>
                    <option value="45">90 Mins Match (45m per half)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Status Banner (Action Replay / Half Time)</label>
                <select id="statusSelect">
                    <option value="">Normal (None)</option>
                    <option value="HALF TIME">Half Time</option>
                    <option value="FULL TIME">Full Time</option>
                    <option value="ACTION REPLAY">Action Replay 🎥</option>
                </select>
            </div>
        </div>

        <div class="btn-row">
            <button onclick="updateOverlay()">Apply Changes</button>
            <button class="secondary" onclick="startTimer()">Start Timer ▶</button>
            <button class="secondary" onclick="pauseTimer()">Pause ⏸</button>
            <button class="danger" onclick="resetTimer()">Reset ↺</button>
        </div>
    </div>

</body>
</html>
