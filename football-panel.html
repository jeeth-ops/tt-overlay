<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Match Controller - Scorvix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 1.5rem; color: #38bdf8; letter-spacing: 1px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px; }
        .card h3 { font-size: 1.1rem; color: #cbd5e1; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; margin-bottom: 5px; display: block; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 0.95rem; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 38px; border-radius: 8px; cursor: pointer; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #334155; border-radius: 8px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #334155; }
        .toggle-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .score-ctrl { display: flex; align-items: center; gap: 10px; }
        .score-ctrl button { width: 40px; height: 40px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .timer-display { font-size: 2rem; font-weight: 700; color: #38bdf8; text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SCORVIX FOOTBALL CONTROLLER</h1>
            <div class="btn-group">
                <button class="btn-success" onclick="toggleScoreboard(true)">Show Overlay</button>
                <button class="btn-danger" onclick="toggleScoreboard(false)">Hide Overlay</button>
            </div>
        </header>

        <!-- Teams & Scores -->
        <div class="card">
            <h3>Teams & Scores</h3>
            <div class="grid-2">
                <div>
                    <label>Team A Name</label>
                    <input type="text" id="nameA" value="REAL MADRID" oninput="saveData()">
                </div>
                <div>
                    <label>Team B Name</label>
                    <input type="text" id="nameB" value="BARCELONA" oninput="saveData()">
                </div>
            </div>
            <div class="grid-2">
                <div class="score-ctrl">
                    <button class="btn-secondary" onclick="updateScore('A', -1)">-</button>
                    <div style="flex:1">
                        <label>Score A</label>
                        <input type="number" id="scoreA" value="0" oninput="saveData()">
                    </div>
                    <button class="btn-primary" onclick="updateScore('A', 1)">+</button>
                </div>
                <div class="score-ctrl">
                    <button class="btn-secondary" onclick="updateScore('B', -1)">-</button>
                    <div style="flex:1">
                        <label>Score B</label>
                        <input type="number" id="scoreB" value="0" oninput="saveData()">
                    </div>
                    <button class="btn-primary" onclick="updateScore('B', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- Logos & Colors -->
        <div class="card">
            <h3>Customization (Logos & Colors)</h3>
            <div class="grid-2">
                <div>
                    <label>Team A Logo URL</label>
                    <input type="text" id="logoA" placeholder="https://..." oninput="saveData()">
                    <div style="margin-top: 8px;">
                        <label class="toggle-box"><input type="checkbox" id="showLogoA" onchange="saveData()"> Show Team A Logo</label>
                    </div>
                </div>
                <div>
                    <label>Team B Logo URL</label>
                    <input type="text" id="logoB" placeholder="https://..." oninput="saveData()">
                    <div style="margin-top: 8px;">
                        <label class="toggle-box"><input type="checkbox" id="showLogoB" onchange="saveData()"> Show Team B Logo</label>
                    </div>
                </div>
            </div>
            <div class="grid-4">
                <div>
                    <label>Team A Color</label>
                    <input type="color" id="colorA" value="#0284c7" oninput="saveData()">
                </div>
                <div>
                    <label>Team B Color</label>
                    <input type="color" id="colorB" value="#dc2626" oninput="saveData()">
                </div>
                <div>
                    <label>Clock BG Color</label>
                    <input type="color" id="colorClock" value="#0f172a" oninput="saveData()">
                </div>
                <div>
                    <label>Modal Border Color</label>
                    <input type="color" id="colorModal" value="#38bdf8" oninput="saveData()">
                </div>
            </div>
        </div>

        <!-- Match Timer Control -->
        <div class="card">
            <h3>Match Timer & Control</h3>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="grid-2">
                <div>
                    <label>Set Minutes:Seconds</label>
                    <input type="text" id="timerInput" value="00:00" placeholder="MM:SS">
                </div>
                <div>
                    <label>Match Duration (Minutes)</label>
                    <input type="number" id="matchDuration" value="90" oninput="saveData()">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="setCustomTimer()">Set Timer</button>
                <button class="btn-success" onclick="startTimer()">Start Clock</button>
                <button class="btn-secondary" onclick="pauseTimer()">Pause Clock</button>
                <button class="btn-danger" onclick="resetTimer()">Reset Clock</button>
            </div>
        </div>

        <!-- Penalties & Extras -->
        <div class="card">
            <h3>Penalties & Special Badges</h3>
            <div class="grid-2">
                <div>
                    <label>Penalties A</label>
                    <input type="text" id="penA" placeholder="e.g. 4" oninput="saveData()">
                </div>
                <div>
                    <label>Penalties B</label>
                    <input type="text" id="penB" placeholder="e.g. 5" oninput="saveData()">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="clearPenalties()">Clear Penalties Bar</button>
                <button class="btn-primary" onclick="toggleReplay()">Toggle Action Replay Badge</button>
            </div>
        </div>

        <!-- Fullscreen Modals -->
        <div class="card">
            <h3>Fullscreen Modals (Half Time / Full Time / etc.)</h3>
            <div class="btn-group">
                <button class="btn-primary" onclick="triggerModal('HALF TIME')">Half Time</button>
                <button class="btn-primary" onclick="triggerModal('FULL TIME')">Full Time</button>
                <button class="btn-primary" onclick="triggerModal('EXTRA TIME')">Extra Time</button>
                <button class="btn-primary" onclick="triggerModal('PENALTIES SHOOTOUT')">Penalties Shootout</button>
                <button class="btn-danger" onclick="triggerModal('')">Hide Modal</button>
            </div>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let totalSeconds = 0;
        let isRunning = false;
        let showScoreboardState = true;
        let showActionReplayState = false;
        let activeModalState = "";

        function saveData() {
            const data = {
                showScoreboard: showScoreboardState,
                nameA: document.getElementById('nameA').value,
                nameB: document.getElementById('nameB').value,
                scoreA: document.getElementById('scoreA').value,
                scoreB: document.getElementById('scoreB').value,
                logoA: document.getElementById('logoA').value,
                showLogoA: document.getElementById('showLogoA').checked,
                logoB: document.getElementById('logoB').value,
                showLogoB: document.getElementById('showLogoB').checked,
                colorA: document.getElementById('colorA').value,
                colorB: document.getElementById('colorB').value,
                colorClock: document.getElementById('colorClock').value,
                colorModal: document.getElementById('colorModal').value,
                matchDuration: parseInt(document.getElementById('matchDuration').value) || 90,
                timer: document.getElementById('timerDisplay').innerText,
                penA: document.getElementById('penA').value,
                penB: document.getElementById('penB').value,
                activeModal: activeModalState,
                showActionReplay: showActionReplayState
            };
            localStorage.setItem('scorvix_football', JSON.stringify(data));
        }

        function toggleScoreboard(show) {
            showScoreboardState = show;
            saveData();
        }

        function updateScore(team, val) {
            const input = document.getElementById(team === 'A' ? 'scoreA' : 'scoreB');
            let current = parseInt(input.value) || 0;
            current = Math.max(0, current + val);
            input.value = current;
            saveData();
        }

        function updateTimerDisplay() {
            let mins = Math.floor(totalSeconds / 60);
            let secs = totalSeconds % 60;
            let formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timerDisplay').innerText = formatted;
            saveData();
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                totalSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = 0;
            updateTimerDisplay();
        }

        function setCustomTimer() {
            let val = document.getElementById('timerInput').value;
            let parts = val.split(":");
            if (parts.length === 2) {
                let m = parseInt(parts[0]) || 0;
                let s = parseInt(parts[1]) || 0;
                totalSeconds = (m * 60) + s;
                updateTimerDisplay();
            }
        }

        function clearPenalties() {
            document.getElementById('penA').value = "";
            document.getElementById('penB').value = "";
            saveData();
        }

        function toggleReplay() {
            showActionReplayState = !showActionReplayState;
            saveData();
        }

        function triggerModal(title) {
            activeModalState = title;
            saveData();
        }

        // Initial save sync
        saveData();
    </script>
</body>
</html>
